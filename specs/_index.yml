    brief: 五方组装（Multica fork + tools 方法论 + OpenClaw + Claude + 自研治理层）的企业内部自托管 AI 原生研发协同平台；0.10 交付 M0 地基（起服务、9 Agent 注册、派单闭环、一致性 CI），0.11 交付 P1 治理核心（CR 事件同步三层链路、Ed25519 签名审批、controlled-shell 下沉与 AI 行为审计），0.11.1 修补 P1 治理核心两处生产缺陷，0.12 交付 P2 D1（Team Agent 共享队列容量上限：守卫/插队/撤回/实时可见），0.12.1 治理工具链补丁（delivery/task 回写一致性门禁 + writeback-tasks 原子化 Skill），0.13 交付 P2 CR-A（三模式聊天窗口骨架 + Team Agent 消息流核心：隐藏容器 Issue + 薄发送端点 + 模型选择器），0.15 交付 P2 CR-C（D5 Private Ask：chat_session 项目维度 + WS 隐私 per-user 推送收敛（含既有全局 chat 同一泄漏面修复）+ Ask-only 双重强制），0.16 交付 P2 CR-D（D6 Discussion：discussion 容器 Issue + 纯人类多人聊天，FR-6 行内系统条裁剪留痕），0.14 补跑交付 P2 CR-B（D3 队列条完整形态：常驻计数/展开列表/逐项撤回/停止双权限/过滤开关/队列明细读侧 opt-in 扩展；排期先于 CR-C/CR-D 但因故延后完成，current 维持 0.16 不回退），0.17 交付 P2 CR-E（D4 presenter 控制权：单表状态机六转移 + claim 串行化键 agent_id→project_id 改造，12-agent 并发压测验证单一写者恰一 active），0.18 交付 P2 CR-F（D7 CR 门禁接合：门禁节点投影器 + review 事件兜底通道 + Ed25519 签名审批网页化 + CrStatusBadge/CrGateCard 消息流合并，review-code 阶段发现并修复跨 workspace evidence 泄露）。0.20.1 治理工具链：YAML 账本操作收敛为 crctl 子命令（task done / merge-metadata / archive-move + AC-9 merge-tree 演练入库）

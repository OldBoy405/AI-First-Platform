blockers:
  - "C-1（review-code/SKILL.md:75 新增维度行破坏 Markdown 表格结构）：新增的「前端质量」行为 `| **前端质量** | 仅 diff 触及 `*.tsx|*.vue|*.css|*.html` 时触发：… |`，行内含 6 个管道符，而同一张表其余每行均为 3 个。GFM 表格按管道符切分单元格，且**行内代码反引号不保护管道符**（规范要求在表格单元格内写字面管道符必须转义为 \| ，包括在 code span 内）——该行会被解析成 5 个单元格对上 2 列表头，渲染为结构错乱的一行。影响不是\"排版不好看\"：SKILL.md 正文即评审 agent 的 prompt，维度表是它读取判据的地方，错位行会让触发条件与判据文本被切散。改法：把触发条件里的管道符转义为 `\|`，或改用顿号列举（`*.tsx`、`*.vue`、`*.css`、`*.html`）；AC-8 的验收断言同步按转义后形态写。可机械验收：该行管道符数应与同表其它行一致（3 个）。"
  - "C-2（前端质量维度内容与 FR-11/US-3 不符，且 blocker 判据被放宽）：PRD FR-11 定义该维度含三项检查——① a11y 对比度达 WCAG AA（破 AA 升 blocker）② 组件 loading/empty/error 状态完整覆盖 ③ 构建体积在预算内，**其余 minor**；US-3 同口径（a11y 对比度/组件状态完整性/构建体积）。实现（review-code/SKILL.md:75）写的是「WCAG AA 对比度、键盘可达、ARIA 语义；破坏即判 blocker」——②③ 两项被删除，而「键盘可达」「ARIA 语义」两项在 PRD/SDD 中均无出处（凭空新增）。更关键的是 **「其余 minor」丢失**：实现的「破坏即判 blocker」在语法上覆盖列举的全部三项，等于把 blocker 判据从「仅破 WCAG AA 才升 blocker」扩大到「任一项破坏即 blocker」——本 CR 花了三轮技术评审收敛 blockers 语义（strict/lenient、三条升格判据、轮次闸），却在自己新增的维度上把它放宽了，方向相反。这与 SDD 评审 attempt-2 判定的 B-5~B-8 是同一种病（FR↔实现脱节），只是从文档层移到了实现层。改法：按 FR-11 恢复三项检查与「破 WCAG AA 升 blocker、其余 minor」的分级；若认为键盘可达/ARIA 更值得纳入、②③ 应当去掉，则须回改 PRD FR-11 与 US-3 后再实现，不得由实现单方面改写需求。"

  suggestion-policy: "strict"
suggestions:
  - "s-1（AC-9 机械验收不成立，措辞级）：AC-9 要求 review-code Step 1「无『缺失才补跑』表述」，而实现（SKILL.md:46）为「**无条件重新执行**（不是「缺失才补跑」）」——语义完全正确（是否定用法），但字面 grep「缺失才补跑」仍命中，按 AC-9 的机械判据会判否。建议把括号内的否定改写为不复用该字符串的表述（如「不以证据缺失为前提」），使 AC 可被 grep 机械验收；或回改 AC-9 的断言形态。语义无误，故不判 blocker。"
  - "s-2（README 触发参数表未同步，范围外）：README.md:437-441 的 code-implementation「输入」表仅列 cr_id / target_version / auto_push_after_task 三项，未含本 CR 新增的 suggestion_policy。需说明两点：① 这是既有欠账而非本 CR 新造——CR-2026-023 新增的 review_llm 同样缺席该表（只加进了 455 行的节点表）；② FR-21/AC-17 声明的文档同步范围只有 openwiki，README 不在本 CR 声明范围内。故仅记录，建议在后续 README 口径统一时与 review_llm、auto_push_after_task 默认值（fbd808f 已改手动而 README 仍写「默认 true」）一并订正。"
  - "s-3（CR 自身账本的写入者与时序，不影响交付物）：① TASK-01 的 status=done 未经 crctl task done 写入——tasks/_index.yml 中 TASK-01 无 done-at 字段（TASK-02/03 均有），且 .crctl/audit.log 的 task-done 记录只有 2 条（TASK-02、TASK-03），说明 TASK-01 由手工编辑索引落 done，绕过了 CAS 与审计。机制上不违规（tasks/_index.yml 不在 rules.json#protectedPaths.deny 面），但与「crctl 为账本唯一写者」的口径不符。② TASK-03（端到端验证）的 done-at 为 22:47:53，而其验收证据 test-report.md 生成于 22:50:24——完成标记早于证据产出约 2.5 分钟，属「先声明完成、后补证据」的时序，恰是本 CR 在代码层要修的「自报即采信」的同形状问题，只是发生在 TASK 账本层。两项均不影响 tools 仓两个 commit 的 diff 正确性，且已 done 的 TASK 无法回头补跑 crctl task done（会撞 TASK_ALREADY_DONE），故只留档不要求本 CR 处理；建议后续在 crctl task done 的守卫项（CR-2026-025 D-5 范围）一并考虑「done 前置证据存在性」这一维度。"

blockers:
  - "E3 周报链路未接通：BuildReportEnvelope 与 MaturityBaselinePercentiles 无生产调用；Autopilot 未明确绑定内置 Skill，完成路径未校验 envelope/通知 Owner，AC-18/19/21/22 不可达。"
  - "快照补偿错误使用 MAX(bucket_date)>=target 作为 no-op，较旧失败桶会在较新桶成功后永久跳过；必须改为精确目标桶存在检查。"
  - "指标/用户 scope 语义错误：AI penetration 从 task_usage 而非任务发起行统计；user 非适用指标未覆盖为 not_applicable，校准后可能生成 user scores。"
  - "读取合同错误：overall 默认返回升序 LIMIT 1 的最老桶；model token trend 按范围聚合成 from 日期单点而非日序列。"
  - "E2 看板不完整：缺日期区间、Owner mode、趋势/断点；观察期排名默认 total；8 项 known_gameability 未提供。"
  - "工程规范阻断：models.go 生成文件手工补丁、cost fallback provider 参数未使用、BuildScores/JSON 错误被吞、rollup.go 超 800 行无拆分理由、migrate 上游挂钩缺 AIFIRST 标记。"
  - "测试证据不足：真实 PostgreSQL 套件日志无 -v，无法排除 TestMain 整包 skip；daemon 周报与 28 天基线端到端被报告为残余风险而非验收证据。"

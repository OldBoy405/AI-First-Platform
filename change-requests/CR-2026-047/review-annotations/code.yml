  - "User snapshot scope enumeration omits users with current-day task_usage on older tasks."
  - "Rankings and Suggestions swallow JSON/database errors; corrupt projections can return partial/empty success."
  - "Rankings metric query accepts unknown metric strings instead of 400 invalid_query."
  - "Report latest/history order by completion time rather than ISO week, and cursor pagination repeats earlier rows."
  - "Maturity page does not satisfy the explicit shared dim-segmented/usage-trend-card/leaderboard reuse boundary."
  - "Suggestion empty state lacks Owner/Admin runtime selection and Org Admin initialization action."
  - "Weekly report dispatch does not preflight a bound local_directory or emit unavailable Owner guidance."

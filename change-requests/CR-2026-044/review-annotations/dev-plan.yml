blockers:
  - "B-01：PRD FR-11/AC-21~23 要求 code-reviewing 重跑 review、code-approved 本地 snapshot 一致时无需重审批且 checkpoint 后 merge；现有 checkUpgrade 却把 code-reviewing 归 safe、code-approved 归 requiresReapproval，而 PLAN/TASK 没有生产代码或 upgrade-check.test.mjs 落点。回修要求：TASK-05 增加 checkUpgrade 最小分类修订与 upgrade-check.test.mjs，code-reviewing→requiresReapproval（重评）、code-approved 零 publish→safe（提示先 checkpoint）、partial publish 仍 blocksUpgrade；不扩 CLI/返回 schema。"
  - "B-02：TASK-05 会更新四个 approve Skill 的 y|yes 合同，却未 depends-on TASK-02；PLAN 还声称 TASK-05 消费 TASK-03 的 inspect 契约，但 inspect 是 TASK-05 自己新增，跨 TASK 产出/消费不成立。回修要求：TASK-05 depends-on 增加 TASK-02，修正 PLAN 依赖图与接口说明为消费 TASK-02 的 TTY、TASK-03 的本地 verifier、TASK-04 的 publication lag。"
  - "B-03：TASK-06 把 docs/adr/0004、ARCHITECTURE.md、README.md 写成同一仓相对路径，但实际 ADR 位于 knowledge-base worktree，后两者位于 tools worktree，实施者会在 tools 仓找不到 ADR。回修要求：在 PLAN/TASK-06 明确 repo+worktree+路径，验收分别核对两仓 diff，并保留 multica 零修改。"

blockers:
  - "部分解决： B-CODE-03（Major）— cmdKbInit 的 extraFlags 已能拒绝单独的 --cmd/--cmdList，但参数组合仍绕过约定错误合同：crctl.mjs:3738 的 flags.cmdList.push 与 :3748 的通用 flags[key]=next 共用同一槽位；kb init --workspace <合法KB> --cmdList x --cmd ignored 先把 cmdList 改成字符串，再调用字符串不存在的 push，抛 TypeError，经 :3842 main().catch 变成 INTERNAL_ERROR，无法到达 :3330 的 BAD_ARGS。去掉 --workspace 的同一组合也在 :3782 requireExplicitWorkspace 之前抛错，丢失 WORKSPACE_REQUIRED 优先级。违反 SDD §3.1/§3.2、TASK-01 与 AC-02 的额外旗标 BAD_ARGS/缺根优先合同；当前 :6025–6027 只覆盖单旗标，不覆盖顺序组合。本结论来自只读源码调用链，未在评审阶段执行该命令或重跑测试。回修须使用户 --cmdList 无法破坏内部聚合器，保持非 kb 既有命令语义，并补两种旗标顺序、有根/缺根/空根向量，证明有根 BAD_ARGS、缺根或空根 WORKSPACE_REQUIRED，均先于文件/index/HEAD/remote/audit 副作用；随后由 write-test-report 重新生成规范证据。"

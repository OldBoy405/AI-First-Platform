blockers:
  - "本轮新增： B-CODE-06（Major）— 新 KB 初始化指南的顺序不能满足新增 kb init 的前置合同。tools docs/QODER-使用指南.md:49–95 明示创建全新 workspace、git init，随后写六种 docs 索引；后续安装 tools/、生成 AGENTS.md 与 dir-graph，:209–219 直接让读者运行 kb init 并宣称完成后即可开始首个 CR。该环境准备节没有配置 KB origin、使 symbolic-ref 与声明 trunk 一致、或先提交这些白名单外文件的步骤/前提（全文只读取证未见 git remote/add/commit 指引）。实际 cmdKbInit 在 crctl.mjs:3367 起逐仓要求 origin，:3386 要求 KB symbolic-ref 等于声明 trunk，:3395–3425 只允许 dir-graph.yaml 与两账本的工作树/index 变更；因此原样执行指南先因缺 origin 返回 KB_INIT_PRECONDITION/repo-invalid，即使补 origin/正确分支，已创建的 docs 索引及 AGENTS.md/tools 仍在白名单外而返回 dirty，不能到达两账本初始化。此项是 TASK-09/SDD §8 对当前新增初始化说明与实际接口一致性的交付缺口，不是要求放宽初始化白名单或代建账户/远端；未执行 kb init、未声称发生业务写入。回修仅在已批准说明范围内补齐/重排引导：明确由维护者准备已有 origin 的正确 trunk 主 checkout，在调用 init 前已提交非白名单配置/文档/tools 文件，或先 init 后生成其余文件；保证教程每一步前置可满足，同时保留六种 docs 模板、不恢复四种手工治理模板、不改生产前置/状态机/权限边界，随后由 write-test-report 重建与新源码绑定的规范证据。"

blockers:
  - "本轮新增： B-SDD-01 — FR-5/AC-05 的畸形既有索引拒绝分支未闭合。SDD §4.3（189–191 行）及 scope_in 将 buildIndex 变更限定为缺文件首部，其余继续沿用 dep-7 的原插入/累积代码；但 tools@41b112ed4d97baaaca3b82367a72f35520dc3d4b 的 skills/writeback/scripts/writeback-prd-sdd.mjs#buildIndex（85–134 行）仅在找不到目标 spec 时检查 features:，已有目标条目且含 cr-history 的无 features 索引会进入更新分支，末尾 selfCheck（210–214 行）也只检查目标条目数，不能得到 PRD 要求的 STRUCTURE_MISMATCH。这是目标契约而非需要照搬的基线描述。请在 SDD 明确所有既有索引的 features 前置校验及生成 candidate 前的错误边界，同步批准范围允许这项 FR-5 必需的最小校验，并在 AC-05 场景中明确覆盖‘缺 features 但已有目标 spec/cr-history’；保持缺文件首写、正常索引累积、缺 cr-history 拒绝及 durable-tx/apply 零改动。"
  - "本轮新增： B-SDD-02 — 正文现有实现事实未全部由 dep-N 承载。SDD §8（305 行）将 docs/QODER-使用指南.md 的‘旧初始化模板段’作为四模板删除/其他模板保留的依据，但 dep-1～dep-15 没有该路径/对象的五要素依赖项；§5.2/§6.2 对现有 makeCodeApprovedFixture 的复用也没有对应 dep-N。已只读核实 tools@41b112ed4d97baaaca3b82367a72f35520dc3d4b 的 docs/QODER-使用指南.md:63–102 确有这些模板，skills/shared/crctl/scripts/test/writeback-tx.test.mjs:14,20,30,47–53 从 merge-fixture.mjs 导入该 fixture 且另补 traceability 证据；存在不等于正文引用关系已闭合。按 review-tech-design Step 2.1，正文未通过 dep-N 承载的当前实现事实必须形成 blocker。请补齐这些实际依赖的 repo/relative path/stable symbol或对象/40位SHA/依赖结论，并在相应正文逐处引用；其余当前事实同轮复核，不能用 dep-1 的 CLI代码引用代替不同文档或 fixture 的事实来源。不要求新增生产模块、改签字源或提前冻结 PLAN/TASK 命令。"
dimensions:
  PRD↔SDD 对齐: "BLOCK：10/10 FR 有设计落点，12/12 AC 有映射；AC-05 的全部既有缺 features 索引拒绝与 §4.3 的仅缺文件变更矛盾，见 B-SDD-01。其余11项具备落点、可观测结果和可达性说明。"
  架构合理性: "BLOCK：单一 crctl 写者、零依赖、私有入口、generator/candidate/apply 分层及 ARCHITECTURE.md §8 维护纳入 scope_in；15项显式依赖的40位SHA与resources HEAD一致，已按文件/符号核验；仍有未由 dep-N 承载的正文当前事实，见 B-SDD-02。无未定义 dep-N，无伪造 ADR。"
  数据模型完整性: "BLOCK：两初始化账本、五输出字段、manifest before=null、source历史指纹矩阵完整；既有索引结构入口不覆盖所有缺 features 分支，见 B-SDD-01。"
  接口契约: "PASS：CLI输入、输出、固定错误优先级、残留与重入合同明确；无HTTP API变更，OpenAPI条件基线N/A。"
  多仓架构约束: "PASS：业务workspace与resources代码路径分离；tools改代码、KB存过程文档、multica零代码；init只接受主checkout且仅发布KB三文件，代码仓只读核验。"
  性能与安全: "PASS：显式根/realpath/role、固定argv、wx独占、普通非快进拒绝、既有CAS；前置失败/残留/无锁边界明确，O(PLAN行数+仓库数)，无审批旁路或常驻轮询。"
  可测试性: "BLOCK：AC-01～12均列出测试场景和观察结果，故障注入仅隔离测试；AC-05须补已有目标条目的缺features反例，显式复用fixture的事实引用须闭合，见B-SDD-01/B-SDD-02；未执行lint/build/test。"
  Prompt 采纳影响: "PASS：触及dispatch，§8列出crctl/requirement-register/controlled-shell说明及使用文档；新入口不被Skill自动代跑，protectedPaths/Agent/Pipeline/矩阵保持不变。"

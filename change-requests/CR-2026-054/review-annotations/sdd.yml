review-type: tech-design
reviewer: "OldBoy405"
reviewed-at: "2026-08-29T17:42:34+08:00"
verdict: block
blockers:
  - "受影响 FR/AC：FR-17、NFR-3、AC-6。当前证据：SDD §3.4、§7.1、§7.3 要求初次投递、complete→fail fallback、重放和冲突日志只暴露 task_id、terminal_kind、error_class；同时规定 terminalReportFailure.LogValue() 负责脱敏，不修改 server/internal/logger，也不逐个改造现有 caller。上一轮指出的 daemon.go 现有路径仍附带 task、status、failure_reason、事件专用文本和 error。LogValue() 只能控制包装 error 的结构化表示，不能删除既有日志上下文属性、task 属性或事件文本，也不能保证既有日志包含 terminal_kind。当前方案无法同时满足严格日志白名单、FR-18 的最小挂钩限制以及不改共享 logger/不逐个改造 caller。必须在技术设计阶段解决契约冲突：要么明确放宽 FR-17/NFR-3 的适用日志范围并定义允许保留的既有属性；要么保留严格白名单，设计统一且安全的终态日志出口，明确所有相关 caller 的修改范围，并同步调整 FR-18；同时补充覆盖全部终态 caller 的精确属性白名单、日志顺序、原始 cause 不可见和 payload 不可见测试。"
dimensions:
  prd-sdd-alignment: "BLOCK：FR-1 至 FR-16、FR-18 至 FR-20 均有对应设计映射；但 FR-17 的严格日志要求仍无法由当前方案实现和验证，AC-6 不成立。"
  architecture: "PASS：archive 校验位于共用 buildEntries() 的 write-set/hash 前；daemon 复用既有终态接口、内存集合和单 worker；未新增状态机、账本、持久化 outbox、API、Pipeline 或共享服务管理能力。日志出口与 FR-18 的最小 daemon.go 修改边界存在未解决冲突。"
  data-model: "PASS：terminalTaskReport 按值保存，pending 按 task ID 去重并采用 first-wins；快照删除时重新比较当前值；对未来引用字段提出深复制约束。"
  interface-contract: "PASS：deliverTerminalTaskReport 只发送指定终态；complete 瞬时错误入队且不 fallback；complete 永久错误才构造保留完整 payload 的 fail 请求；fallback fail 的成功、瞬时失败和永久失败语义均已定义。"
  cross-repo: "PASS：tools 继续由 crctl 和 Git 作为状态/账本权威；multica 继续使用既有服务端终态接口；SDD 明确 workspace authority、CUSTOM.md 登记及 multica 修改范围。"
  security-performance: "BLOCK：30 秒单 worker、首个瞬时错误停止、永久错误删除及安全错误包装设计合理；但现有终态 caller 的 task/status/failure_reason/事件文本等日志属性未被收敛，违反严格脱敏白名单。"
  testability: "BLOCK：SDD 规定了捕获 slog、验证 LogValue、Unwrap 和 fallback payload 的测试，但没有可执行方案证明既有 caller 日志属性被消除或符合白名单，也没有覆盖全部相关终态 caller 的精确日志断言。"
  prompt-adoption: "PASS：本 CR 不修改 crctl.mjs dispatch 或 controlled-shell/rules.json#protectedPaths.deny，条件性 Prompt 采纳影响不触发。"
suggestions:
  - "修复日志契约后，增加 FR-18 diff 范围检查，验证 daemon.go 仅包含约定的队列字段和两个 AIFIRST 挂钩。"
  - "实现阶段继续使用既有三域证据矩阵，将 archive、Agent 环境失败语义和 daemon 补投分别绑定到 AC-1 至 AC-7。"

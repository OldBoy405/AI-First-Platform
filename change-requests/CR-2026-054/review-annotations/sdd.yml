verdict: block
blockers:
  - "P1 安全/日志契约：SDD §3.4、§7.1 与 FR-17/NFR-3 要求初次、fallback、重放、冲突日志严格只暴露 task_id、terminal_kind、error_class；但方案依赖 terminalReportFailure.LogValue() 自动脱敏，未处理既有 caller 日志。multica/server/internal/daemon/daemon.go:5048-5049 的 taskLog 已附加 task，reportTaskResult 在 5528、5550-5569、5604-5621 等路径还记录 status、failure_reason、事件专用文本并以 error 字段输出错误。LogValue() 只能隐藏包装 error 的 cause，不能删除或重命名这些既有属性，也不能保证每条日志都有 terminal_kind。该设计同时要求 daemon.go 只保留两个小挂钩且不逐个改造 caller，形成无法同时满足的契约矛盾。必须在技术设计阶段明确统一安全日志出口及其允许修改面，或明确调整 FR-17/NFR-3 的日志范围，并补充覆盖所有现有终态 caller 的精确属性白名单测试。"
dimensions:
  prd-sdd-alignment: "部分通过但需修复：上轮 complete/fail fallback blocker 已在 SDD §3.4 与 §4.2 明确；但日志白名单仍未落实到现有 caller，FR-17、NFR-3、AC-6 无法由当前设计完整保证。"
  architecture: "通过：archive 校验位于 buildEntries 的 write-set/hash 前共用路径；daemon 仍复用既有终态接口、内存集合和单 worker；未新增状态机、账本、持久化 outbox、API 或共享服务管理能力。"
  data-model: "通过：terminalTaskReport 按值保存，pending 按 task ID 去重并 first-wins；当前字段为值类型，未来引用字段需要深复制。"
  interface-contract: "通过：deliverTerminalTaskReport 只发送指定 kind；CompleteTask 瞬时错误入队且不调用 FailTask；永久错误才执行 fallback，并保留完整结果 payload；fallback 的发送、入队和日志顺序已明确。"
  cross-repo: "通过：tools 继续由 crctl/Git 作为 authority，multica daemon 只消费既有服务端契约；workspace authority、CUSTOM.md 登记和 daemon.go 挂钩边界总体一致。"
  security-performance: "阻断：30 秒单 worker、瞬时错误遇首个即停止、永久错误删除和错误包装分类设计合理；但实际 caller 的 task/status/failure_reason 等日志属性违反严格脱敏白名单。"
  testability: "部分通过但需修复：SDD 要求捕获 slog 并断言白名单、顺序、Unwrap 和 fallback payload，但未定义如何覆盖或消除现有 caller 日志，无法证明完整日志合同。"
  prompt-adoption: "跳过：本 CR 不修改 crctl dispatch 或 controlled-shell/rules.json protectedPaths.deny。"

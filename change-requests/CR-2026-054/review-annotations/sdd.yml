dimensions:
  prd-sdd-alignment: "PASS：FR-1 至 FR-20 均有对应技术方案和验证路径。FR-17/NFR-3/AC-6 已明确将严格脱敏约束限定在本 CR 新增或修改的终态回调错误值；既有 caller 的 task、status、failure_reason、固定事件名等非敏感上下文及既有日志格式可以保留。"
  architecture: "PASS：archive 校验位于共用 buildEntries() 的 write-set/hash 前，首次构建和 rebuild 共用同一入口；daemon 使用进程内 map、单 worker 和固定周期，不新增状态机、账本、持久化 outbox、API、Pipeline 或共享服务管理能力。"
  data-model: "PASS：严格 YAML 诊断字段、archive 候选不变量以及按 task ID 去重的 terminalTaskReport 集合均已定义。终态报告按值保存，first-wins 和快照删除时的值比较边界明确。"
  interface-contract: "PASS：deliverTerminalTaskReport 只负责指定终态的一次交付并复用既有有限重试；complete 瞬时失败入队且不 fallback，complete 永久失败后才以原始 cause 构造 FailTask 的 errorMessage，并保留完整终态 payload。fallback FailTask 的成功、瞬时失败和永久失败行为均已定义。"
  cross-repo: "PASS：tools 继续由 crctl 和 Git 作为状态/账本权威，multica 继续复用既有终态接口和服务端幂等语义。SDD 保持 daemon.go 最小改动、独立重试文件/测试文件以及 CUSTOM.md 登记要求，未扩大跨仓职责。"
  security-performance: "PASS：terminalReportFailure.LogValue() 只暴露 task_id、terminal_kind、error_class；原始 cause、errorMessage、output、session、workdir 和完整 report 不进入本 CR 新增终态错误值。设计未要求共享 logger、terminalReportLogHandler 或逐个改造 caller。30 秒单 worker、首个瞬时错误停止和 root context 关闭语义符合需求。"
  testability: "PASS：tools 侧覆盖严格解析、archive 根结构、不变量、首次构建/rebuild 和 Git 副作用；multica 侧覆盖 complete/fail、fallback、去重、first-wins、重放、关闭、payload 保真和 slog 脱敏。测试方案包含实际成功任务 caller 的 complete→fail 行为及 Unwrap/瞬时错误分类回归。"
  prompt-adoption: "PASS：按 SDD 声明，本 CR 不触及 crctl.mjs dispatch 或 controlled-shell/rules.json#protectedPaths.deny，条件性 Prompt 采纳检查不适用。"
suggestions:
  - "实现时应通过真实终态 caller 加捕获 slog.Handler 验证错误值确实以 LogValuer 形式记录，确保原始 cause 不会因改用 err.Error() 或格式化路径而泄露。"
  - "为 history 条目缺失 id、缺失 final-status 以及冲突 payload 的结构化错误类别补充明确断言，避免实现阶段对缺失字段和 conflict 的诊断字段产生分歧。"
  - "保留并明确断言 archive 校验发生在 write-set hash、stage、commit 和 push 之前，且首次构建与远端变化后的 rebuild 均经过同一验证函数。"

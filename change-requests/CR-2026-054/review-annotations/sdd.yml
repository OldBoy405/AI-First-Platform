review-type: tech-design
reviewer: "OldBoy405"
reviewed-at: "2026-08-29T13:53:35+08:00"
verdict: block
blockers:
  - "P1 接口契约：SDD §3.4 与 §4.2 的 reportTerminalTask 伪代码描述 CompleteTask 失败后直接包装并返回，只说明 deliverTerminalTaskReport 按终态调用 CompleteTask/FailTask，没有明确既有 complete→fail fallback。terminalReportFailure 的 Error/Unwrap/LogValue 只能包装、分类和安全展示错误，不能代替对独立 FailTask 端点的调用。请在 SDD 中明确永久性 CompleteTask 失败后的 FailTask 调用时机、fallback 使用的原始错误文本与完整 payload 保真、最终错误包装及日志顺序，并补充该路径的测试契约；同时保持瞬时 CompleteTask 失败入队且不降级为 FailTask 的既有语义。"
dimensions:
  prd-sdd-alignment: "部分通过但需修复：FR-1~FR-20 均有映射，archive、Agent 边界和 daemon 补投范围总体一致；但 SDD 尚未完整保证既有 complete→fail fallback。"
  architecture: "通过：tools 仍位于现有 YAML 解析器和 archive buildEntries hash 前边界；multica 仍位于 server/internal/daemon，使用内存 map、单 worker 和既有终态接口；未新增状态机、账本、持久化 outbox、API 或服务管理能力。"
  data-model: "通过：pending map 按 task ID 去重、first-wins、比较完整 report；当前字段为值类型，未来引用字段要求深复制或不可变值表示。"
  interface-contract: "阻断：terminalReportFailure 的 error、Unwrap 和 LogValue 契约基本自洽，但 CompleteTask 永久失败后的 FailTask fallback 调用时机、输入错误、payload 保真和最终返回语义未定义完整。"
  cross-repo: "通过：tools 与 multica 的职责边界、worktree authority、CUSTOM.md 登记和 daemon.go 最小挂钩范围一致，未发现跨仓反向依赖或第二权威。"
  security-performance: "通过但依赖补全契约：初次 caller、重放和冲突日志已统一限制为 task_id、terminal_kind、error_class；30 秒单 worker和瞬时错误停止本轮策略合理。"
  testability: "部分通过：已要求覆盖初次投递、重放、冲突日志和 Unwrap/isTransientError，但 fallback 的算法流程未定义，无法据此形成完整可执行断言。"
  prompt-adoption: "跳过：本 CR 不触及 crctl.mjs dispatch 或 controlled-shell/rules.json protectedPaths.deny。"
suggestions: []

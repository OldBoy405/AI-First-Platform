  Prompt采纳影响: "pass — §8 已列出 write-dev-plan、write-dev-tasks、approve-dev-start、crctl SKILL、README/ARCHITECTURE 等需同步文档/Skill。"
suggestions:
  - "建议把 dev-plan 的 repair-target 设计为顶层可选字段：缺省 write-dev-plan；verdict=block 且 repair-target=write-tech-design 时走 upstream；blockers 继续保持字符串列表，不在字符串中解析结构化路由。"
  - "建议将 upstream-design 作为 review-dev-plan 节点的特殊 block 结果：先解析 payload 决定 route，再决定是否 bump attempt 与写 review-loop，避免写后补救。"
  - "建议在 pipeline 模板中显式描述 onBlock 分支：normal 使用 replayNodes，upstream 执行状态转换后 abort 当前 code-implementation pipeline，等待技术设计链路。"

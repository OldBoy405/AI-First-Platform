verdict: block
blockers:
  - "TD-BL-1（FR-6a/FR-6b/FR-14/AC-8b）：SDD 要求 dev-plan annotation 显式 repair-target=write-tech-design 覆盖默认值，但 §2.1 payload 示例没有顶层 repair-target 字段，§3.2 又写 blockers 字符串内携带 repair-target 标记；现有 cmdReviewRecord 只用 REVIEW_REPAIR_TARGETS[stage] 写 repairTarget，既不校验也不落盘 payload repair-target。实现者无法据此稳定触发 upstream-design 路由。需明确 dev-plan payload/annotation 的 repair-target 字段位置、枚举、schema 校验、落盘和 traceability 投影规则。"
  - "TD-BL-2（FR-6b/FR-7/AC-8b）：UPSTREAM 不递增普通 dev-plan attempt 的语义与 §3.5 prompt 的 review-record --stage dev-plan --bump-attempt、§3.2 的 cmdReviewRecord 成功落盘后再路由矛盾。现有 crctl 在 review-record 内先按 --bump-attempt 读取/校验/递增 review-loop，再写 annotation/traceability/review-loop；若先落盘再判路由，UPSTREAM 已经消耗 attempt。需明确路由判定发生在 bump 前，或定义 upstream 调用不带 --bump-attempt，并说明三账本/audit 如何保持一致。"
  - "TD-BL-3（FR-1/FR-6a/FR-6b）：pipeline reviewLoop 片段仍是单一 repairRef=write-dev-plan 与 onBlock=route-to-repair-node，未说明 runtime 如何在同一个 reviewLoop 节点中绕过普通 replayNodes、执行 review-dev-plan:upstream-design-blocker 转换并进入 tech-design-review-pending。需补清 pipeline 层的分流契约，否则 SDD 的双轨状态机无法由 pipeline 自动执行。"
dimensions:

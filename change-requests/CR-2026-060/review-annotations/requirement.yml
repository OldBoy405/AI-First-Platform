blockers:
  - "部分解决： [B-VERSION-GATE] 已补齐 new mode 的 unassigned 仅可停留 drafting、version-set 唯一固化入口、gate/advance 错误码及零副作用 AC，但评审前置顺序仍不可唯一实现：CLI 矩阵规定 gate --for requirement-reviewing 同时检查 PRD 与 requirement review passCondition；若在 review-record 前调用，真实版本也会因尚无 PASS 评审而整体 GATE_BLOCKED；若在 review-record 后调用，unassigned 已产生 annotation/review-loop/traceability，与 AC-03 的评审零副作用冲突。请明确一个可机械执行的前置点（例如由 review-record 在三账本事务前校验 mode/version，或为 gate 冻结不依赖评审证据的 pre-review 语义），并在 review-requirement Skill 顺序和正反 AC 中断言 unassigned 零 canonical 写入、真实版本可继续 review-record→advance。"
  - "部分解决： [B-CLI-CONTRACT] 受影响命令矩阵已覆盖大多数 flags、输入、输出、错误、调用者、幂等和副作用，但 register 的精确输出合同仍自相矛盾：FR-01.5/AC-03 要求返回真实 operational_workspace，CLI 成功 JSON 行却未列该字段；Skill 行又声明原样返回 register JSON，而后续 execution context 只能消费 cr_id + operational_workspace，导致该路径无唯一生产者。此外 register 的“缺 flag=BAD_ARGS”与“target spec 缺失=REGISTER_TARGET_SPEC_ID_REQUIRED”、version-set 的同值幂等与“非 unassigned=VERSION_SET_NOT_UNASSIGNED”存在重叠。请在矩阵中冻结唯一字段名/生产者与错误优先级，使每个输入只命中一个可断言信封。"
  - "部分解决： [B-SKILL-CONTRACT] 生命周期主链的 requirement/design/plan-task/code-test-review/merge/writeback/archive 已形成合同矩阵，但 PRD 明确修改而矩阵未覆盖的公开 Skill 仍有缺口：FR-05.4 的四个 approve-*（含 approver 输入与结构化结果）、FR-05.5~05.8 的 planning/market/competitive/resume 消费 Skill，以及 FR-04.7 的 review-alignment 只读诊断合同。请为这些受影响 Skill 增补等价分组，闭合 required/optional、结构化输出或落盘、合法状态/失败路由和 crctl 写入边界；若某项仅改 Pipeline 映射而不改 Skill，须显式 N/A 并指向既有 Skill 参数，避免 AC-14/AC-15 无共同断言源。"

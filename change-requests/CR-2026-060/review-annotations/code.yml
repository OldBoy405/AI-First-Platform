blockers:
  - "本轮新增：TASK-04 的 cmd-04/cmd-05 未覆盖 AC-11/AC-12/AC-13 新向量。tools diff 相对 merge-base `860288ce` 不含 `skills/shared/crctl/scripts/test/writeback-tx.test.mjs` 与 `archive-tx.test.mjs`（零 diff）；cmd-04/cmd-05 机器区 pass 只证明基线套件未红（cmd-04 ≈27、cmd-05 ≈20 点），不能验收 new 省略 spec/version、WRITEBACK_SPEC_REQUIRED、WRITEBACK_TASKS_PENDING 三类 reason、new traceability 确定性生成、archive journal 重放 / ARCHIVE_SPEC_REQUIRED。这些 AC 的唯一 cmd-NN 证据缺口，回到 implement-code 补向量并重发 test-report。"
  - "本轮新增：G4 Skill 合同未落地。`skills/writeback/writeback-prd-sdd/SKILL.md`、`writeback-tasks/SKILL.md`、`writeback-traceability/SKILL.md`、`skills/cr/cr-archive/SKILL.md` 相对 `860288ce` 零 diff。现合同仍把 spec_id/target_version/milestone_file 标为必填并固定传 `--spec-id/--target-version/--milestone-file`，未声明 new 可省略、milestone=N/A、tasks pending preflight（WRITEBACK_TASKS_PENDING）、archive 清理后 journal 重放。SDD §3.2 与 TASK-04/AC-11/AC-13/AC-18 要求这些 SKILL 修订。"
  - "本轮新增：cmdWritebackApply 未按 SDD §4.4 用 strict authority 重裁 mode/spec。实现先以 CR worktree 调用 `resolveTargetSpecMode`，new 分支 `specId` 取自该结果；虽调用 `resolveWritebackAuthorityStrict`，但从未 `resolveTargetSpecMode({authority: strictAuth})`。AC-02/AC-11 要求 new 分支权威=strict txws，禁止消费 cr-worktree 回退值。落点 `crctl.mjs` cmdWritebackApply。"
  - "本轮新增：archive 清理后重放未按 SDD §2.2.4 只读 journal payload。`cmdArchive` 每次从 CR worktree 判 mode（cleanup 后 worktree 删除会误判 legacy）；`archiveCr` 的 inputDigest=`sha256(cr+'|'+(specId||''))`，省略 `--spec-id` 重放会与首跑 digest 不一致。未实现「禁止重新解析已删除路径；payload 缺 specId 且无 flag → ARCHIVE_SPEC_REQUIRED」。AC-13。落点 `crctl.mjs` cmdArchive + `workspace-transactions.mjs` archiveCr。"
  - "本轮新增：preflightTasksAllDone 未知 status 未归 index-invalid。SDD §4.6：未知 status → `WRITEBACK_TASKS_PENDING` reason=`index-invalid`（硬失败禁止静默降级）；实现把任何 `status !== 'done'`（含未知值）列入 reason=`pending`。AC-12 三类 reason 合同被折叠。落点 `workspace-transactions.mjs` preflightTasksAllDone。"

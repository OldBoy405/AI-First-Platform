findings:
  - id: CODE-FIND-001
    axis: security
    severity: real-gap
    location: "server/internal/governance/approval.go:169 (latestEvidence)"
    issue: >-
      latestEvidence 只按 cr_id 查 cr_sync_event，该表无 workspace_id 列，而 cr_id 仅
      workspace 内唯一（cr 表 UNIQUE(workspace_id, cr_id)）。另一 workspace 同名 CR 的
      evidence（文件路径 + sha256 摘要）可经本 workspace 的审批卡片泄露；本 CR 新增的
      /api/projects/{id}/gates 端点（project_gates.go）复用同一逻辑，把暴露面从"需知道
      workspaceID+crID 直调 API"扩大到"任意项目成员"。违反 CLAUDE.md "All queries filter
      by workspace_id" 硬规则。
    outcome: fixed
    fix-commit: 9e0dccd9b
    fix-summary: >-
      latestEvidence 改为 JOIN cr ON cr.cr_id = cse.cr_id 并按 cr.workspace_id 过滤；
      新增 TestApprovalCardDoesNotLeakEvidenceAcrossWorkspaces，临时回退验证过该测试确实
      在旧查询下失败（真实捕获跨 workspace 泄露），新查询下通过。
  - id: CODE-FIND-002
    axis: spec
    severity: smell
    location: "sdd.md DD-5 vs server/internal/governance/project_gates.go:44 (canApprove)"
    issue: >-
      SDD DD-5 定义 canApprove = workspace owner/admin ∨ cr.owners 对应角色，但实现只做了
      前半（owner/admin），cr.owners 角色匹配因缺少 crctl 自由文本 --caller 到 Multica
      user id 的身份桥接而被有意收窄（ponytail 注释 + test-report.md §3.1 已说明理由，判断
      合理——强行实现会是假安全感）。但 SDD 文档本身（仍是 status: draft, 0.1.0）未同步
      记录这一收窄，单看 SDD 会误以为 cr.owners 分支已实现。writeback-prd-sdd 是对
      change-requests/{cr}/sdd.md 全量覆盖 specs/{spec}/SDD.md，不会自动核对代码事实——
      不在 CR 自己的 sdd.md 里改，这条收窄永远不会进基线。
    outcome: fixed
    fix-summary: >-
      在 sdd.md 新增 §6.4，记录实际收窄范围、理由（无身份桥接）、影响面（仅边缘的
      "非 owner/admin 但列于 cr.owners"角色）与升级路径（canApprove 是唯一改动点，
      调用方无需改）。writeback 时随 sdd.md 全量覆盖自动带入 specs/ai-first-platform/SDD.md。

suggestions:
  - "部分解决：S-A（上轮 suggestion，非 blocker，归属 write-dev-plan）plan §2.1 第 4 项口径差仍未闭合。plan.md 本轮零改动，§2.1（「TASK-04 的完成边界」）第 4 项仍写「4 张 TASK 的 `crctl task done` 全部登记」，与 TASK-04 §5 第 3 项的本 TASK 口径不同。本 turn 实测 _index.yml 已 TASK-01／02／03 done、仅 TASK-04 pending ⇒ 原先担心的「中间态完成标志不可满足」风险已消除（TASK-04 登记 done 时四张卡即为全 done），残留只是行文口径差。建议本次回修顺手把它对齐为「本 TASK 的 done 登记即四张卡的最后一张」。"
  - "部分解决：S-B（上轮 suggestion，非 blocker，归属 write-dev-plan／write-dev-tasks）TASK-01 §3.4 的 provider 覆盖计数仍未闭合。TASK-01.md 本轮零改动，其 §3.4 要求覆盖 pi，而 plan §5.1 第 5 项、§6.3 cmd-02 行与 TASK-01 §4 第 2 条记的「7 个 provider 子用例」取的是既有 TestBriefSkillsListIsNamesOnly 的 7 项（不含 pi）⇒ 实施后这三处计数会与实跑输出对不上。不改变验收结论（cmd-02 判据是 exit 0 且含新断言，不按子用例数判门禁；存在性另由 cmd-03 的源码级断言守卫）。建议三处写成「≥7（既有 7 项 + 本 CR 新增用例）」或注明 pi 用例的落点。"
  - "范围外：（本轮新增，非 blocker，归属 write-dev-plan）TASK-04 §3.1 采集口径与节点边界④的三处事实表述建议收窄，均不影响结论。① 括号句「实测：pi-sessions/*.jsonl 只剩 0 B 的 .jsonl.lock」不是普遍规律：本 turn 实测同一目录另有 588 个非零 .jsonl（含 2026-09-18 当天 4 个），且 InvalidatePiSession（multica worktree HEAD dffcdc35 的 server/pkg/agent/pi.go:878，调用点 server/internal/daemon/daemon.go:8275）在 sessionID 不是 pi-sessions 直接子项时直接 return nil 不删文件 ⇒ 建议限定为「本次事故 run 的会话文件事后不可读（实测 20260918T070647.742524200.jsonl 只剩同名 0 B .lock）」，结论（改为 run 期自采集）不受影响。② ④ 的论据「内容取自何处已由平台 tool_calls 的 read(target) 独立锚定」在本次 run 成立（AC-2 重跑 seq 58／74 为 read，target 逐字 `.pi/skills/review-requirement/SKILL.md`），但平台只对 read／write 给 target，节点若以 bash 读取得内容，该从句就降为文本面自证 ⇒ 建议写成条件句（以 read 取得时由平台锚定），并保留 ④ 内既有的「如实回报实际取得内容的调用与位置」强制句——AC-2 第二从句按此仍可判。③ ④ 的因果句「即由旧节点指令里这类取证要求诱导」是单次观测上的归因，建议改为可核对表述（如「与旧节点指令的溯源取证要求一致；该次 search=1 命中见 issue AIFI-33 评论 01a0b361」）。修复方向：三处按上述收窄表述，其余判据与节点边界逐字不动。"

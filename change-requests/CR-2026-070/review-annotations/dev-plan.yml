blockers:
  - "本轮新增：TASK-04 §3.1「对账规则（采集 run 执行）」把对账的执行主体写成采集 run 自身，而采集 run 在运行中取不到自己这一 run 的平台 tool_calls —— 该规则按字面不可执行。事实（本 turn 实测，非转述）：① 规则要求把节点发出的数组与 `multica agent tasks <agentId> --output json` 里「该 run 的 `tool_calls.calls[].tool` 序列」比同序前缀；② 平台的 `tool_calls` 只在 run 结束时随 `result` 落盘才可见——本 turn 正在 running 的 run `01a0b387-0a7f-70a5-871d-5edfd5d78fd1` 的 `result` 为 null（该字段下无 `tool_calls`），agent `2ed1a9de-4c8e-4b78-bfb1-055af99c6681` 全量 365 条 run 中只有 `status=completed` 的 308 条带 `result.tool_calls`，`running`／`failed`／`cancelled` 一律 ABSENT；③ 节点边界①已把取数调用钉成结束前的最后一次调用、其后只允许发布三段 ⇒ 采集 run 内不存在观测自身尾部的窗口；④ AC-2 首次重跑的实际做法也与该字面不符：采集 run（`01a0b354-e674-774a-b4a9-202d404fe71e`）只发出数组、未做对账，对账是其后的一个 run（dev-agent 的 T2 节点，issue AIFI-33 评论 `01a0b35e`）在平台数据可见后完成的。影响：TASK-04 §3.1 第 4 项要求把逐条对账结果（前缀相等 + 尾部差集枚举）记入实施说明与 test-report 语境，但卡内指定的执行主体拿不到对账数据 ⇒ 实现要么按字面在采集 run 内空跑该规则、要么自行改派主体，两条路都偏离卡面，而「被执行的必须是被评审的」正是本轮要修的东西。修复方向：把括号内的主体与窗口改为「对账在平台数据可见后进行，由采集 run 之后的实施 run 执行并登记（与该卡第 4 项的登记要求对齐）；采集 run 的义务是让尾部可判，即节点边界①」，或等价写法；判据本身不得改动（尾部 ≤3、取数调用未被数组自身覆盖时上限 4、逐条落在允许集合、出现任何其他调用即硬失败）。本条不要求撤回本卡已由人工裁决保留的修订：尾口径三段与节点边界④溯源中立应逐字保留。"

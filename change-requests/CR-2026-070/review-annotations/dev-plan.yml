blockers:
  - "本轮新增：B-5（归 write-dev-plan，落点 plan.md §6.2 证据命令表 cmd-05 行的 args cell；连带 §6.2.1 的转录纪律自述与该行在 §6.3 的基线行）位置：plan.md §6.2 证据命令表 cmd-05 行 —— 回修轮新增的 AC-4 断言 `if (!Array.isArray(ac4.reviewAnnotationsNewFiles) || ac4.reviewAnnotationsNewFiles.length !== 0)`（HEAD=2b9353cf）。事实：该 cell 内含**未转义的两个裸竖线**（`||`）。本轮复评实测：该行全文有 9 个竖线（表头与其馀 5 行 cmd 行均为 7 个）⇒ 行被切成 10 个 cell，而该表的列定义是 证据ID／repo／cwd／executable／args／timeout 共 6 列；args cell 在 `...!Array.isArray(ac4.reviewAnnotationsNewFiles)` 处被截断，按 §6.2.1「表内 cell 即字面值、无第二生成步骤」机械取该 cell 做 JSON.parse 得 `Unterminated string in JSON at position 2823`（本轮实测；其馀三条 -e 行与全表其馀行均正常解析）。回修前该行是 7 个竖线且不含 `||`（`crctl git diff --unified=0 12ed6859` 的对应删除行实测 7 pipes、无 `||`）——即本项由回修轮引入。影响：① §6.2.1 自述「本表四条 -e 命令逐字满足：单行、无裸双引号、无反引号、无反斜杠、无竖线（需竖线语义时以 String.fromCharCode 构造）」对该行不再成立；且「cell 即字面值，无第二生成步骤、不得在实现期改写或补写命令算法」的转录前提被破坏 —— `write-test-report` Step 3 明文要求以该表为唯一来源逐条转录、且 test-plan 不得含 pipe，而 cmd-05 是 AC-2／AC-3／AC-4 的唯一证据命令：其 args 已不能从表内字面取出（取到的是未闭合的 JSON 片段），实施期只能靠人／模型重建命令，命令算法因此落回证据命令表行之外；② 稳定表结构契约（CR-2026-060 AC-07，与 §6.1 表注① 的「三者全等」）在该行被打破——该行 8 个 cell。补充说明（避免误判范围）：判据本身本轮经复评**独立重建命令后实测成立**（缺 change-requests/CR-2026-070/review-annotations/ 前缀键与缺 reviewAnnotationsNewFiles 字段 → 恰 2 条定向 FAIL；两者补齐并含真实平台查询 → exit 0；reviewAnnotationsNewFiles=[新文件] → 定向 FAIL），缺陷仅在「表行不可字面转录」这一形态面。修复方向（择一，均只动 plan.md）：① 去掉该 `||`，把条件写成等价形态 `if (!(Array.isArray(ac4.reviewAnnotationsNewFiles) && ac4.reviewAnnotationsNewFiles.length === 0))`（单条 FAIL、语义不变、无竖线）；② 或拆成两个相邻的 if／else if（缺字段与数组非空各 push 一条 FAIL）。改后须按 §6.2 表内字面 args（spawnSync 同语义）重跑一次 cmd-05 干跑并刷新 §6.3 的 cmd-05 行基线（该行现写「按 §6.2 表内字面 args」，改前不可复现），同时校正 §6.2.1 的相关自述。"

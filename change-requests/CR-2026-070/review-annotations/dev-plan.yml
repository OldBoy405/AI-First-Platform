blockers:
  - "本轮新增：B-1（归 write-dev-plan，落点 TASK-02 §3 实现要点第 6 条、§5 完成标志第 1 条、§6 的 pi-source.json#branch 字段）位置：TASK-02 §3.6 要求「在检出内建分支（例如 `git switch -c cr-2026-070-bash-default-timeout`）并以 `[cr] ` 前缀提交」，§5 完成标志第 1 条要求「检出内分支存在」，§6 把 pi-source.json 的 branch 定义为「检出内分支名」。事实：受控 git 入口不提供任何可创建分支的形态 —— tools@c3e7c934 的 skills/shared/controlled-shell/rules.json git 白名单中 branch 只有 ^(-d|-D) \S+$ 与 ^--show-current$、checkout 形态 ^[^-]\S*$（禁一切 flag，-b 不可用）、worktree add -b 只建新 worktree 路径、且 -c／-C 在 forbiddenFlags 内；本轮实测 crctl git switch no-such-branch-zzz --cwd <pi checkout> 返回 FORBIDDEN_SUBCOMMAND（git switch 不在 controlled-shell 白名单中）。同时 AGENTS.md 与该阶段 Agent 合同禁止原生 git，Pi 检出又不属 CR worktree 集合（DEC-3），没有任何受控路径能补上这一步。影响：按 TASK 字面执行时该步硬失败（FORBIDDEN_SUBCOMMAND）；即便退到 detached HEAD 上提交，「检出内分支存在」与 branch（检出内分支名）仍无合法取值 ⇒ TASK-02 的完成标志与接口契约在本 CR 的工具合同下不可满足，实施期会把已知不可执行的动作绑定成基线。修复方向（择一，均只动 dev-plan/TASK）：① 去掉建分支要求，写明在检出既有 detached HEAD（tag v0.85.1 = d981de12）上以 crctl git add ＋ crctl git commit -m 的 [cr] 形态提交，并把 pi-source.json#branch 改成记录实际形态（例如 detached@v0.85.1）且同步 §2／§5／§6 与 TASK-04 §3.5 的取值口径（cmd-06 现只校验该字段存在）；② 若确需分支，把建分支显式归为 owner（非 Agent）动作、写明由人执行的命令与记录位置，Agent 侧只消费该分支并同步上述四处。"
  - "本轮新增：B-2（归 write-dev-plan，落点 TASK-01 §4 验收条件第 3 条、§5 完成标志第 2 条；plan §6.2 cmd-03 行与 §6.3 的 cmd-03 基线行）位置：TASK-01 要求在自身完成边界内跑 cmd-03 并得 exit 0。事实：cmd-03 的字面脚本（plan §6.2 表内 args）在 FR-1 落点面／零复制面／测试面之外，还断言 CUSTOM.md 含 CR-2026-070 与 runtime_config_sections.go，而该行是 TASK-03 的交付物、TASK-03 的 depends-on 为 [TASK-01, TASK-02]（tasks/_index.yml）。本轮按表内字面 args 复跑 cmd-03 得 exit 1／8 failures，其中恰含 FAIL CUSTOM.md 缺 CR-2026-070 台账行（另 7 项为 FR-1 面在本 TASK 落地后转绿），与 plan §6.3 登记的同一项一致。影响：TASK-01 §4 第 3 条的判据（exit 0）在它自己的完成时点不可满足 —— 要么把 TASK-03 的交付物提前落地（与声明的依赖序及 §2「中间态不红」相冲突），要么在标 done 时留一条已知红判据，使该 TASK 的完成判据缺少一个可判定的时点、并把跨 TASK 的验收耦合留到实施期才暴露。修复方向（择一）：① 把 TASK-01 §4 第 3 条改写成「cmd-03 的 failures 恰为 1，且唯一失败项为 CUSTOM.md 台账行（TASK-03 交付面）」，并在 §5 完成标志写明该残留项由 TASK-03 收口；② 把 CUSTOM.md 的两条断言从 cmd-03 移到其它证据命令（例如 cmd-04 的 multica 白名单面），重跑 §6.3 干跑并同步 §5.1 第 4／9 项的归属。"
  - "本轮新增：B-3（归 write-dev-plan，落点 TASK-04 §3 实现要点第 2 条、§6 产出 1 的 controlledFiles schema；plan §6.2 cmd-05 行的 ks.length < 4 下限）位置：AC-4 的受控文件集与其证据命令。事实：SDD §4.4 的 AC-4 判据 ② 要求 run 前后核对五类受控文件（cr.md、_backlog.yml、review-annotations/*.yml、review-loop.yml、traceability.yml）；TASK-04 §3.2 枚举同类五项后附「≥4 条即可」，§6 的 schema 示例恰给 4 条（不含 review-annotations/*.yml），cmd-05 只断言 Object.keys(cf).length >= 4。影响：AC-4 的机械半边（run 前后 sha256 全等）可合法地不覆盖 review-annotations/*.yml —— 而该目录正是业务 verdict 的落盘位置（含运行期新创建 <stage>.yml 的情形，新文件不会出现在 before 集内），于是「零账本写入／无业务 verdict 落盘」只剩 businessVerdictWritten=false 这一自报字段兜底，观测面窄于判据声称面（CR-2026-055 的既有判据：观测面窄于声称面即 blocker）。修复方向：把受控文件集设为强制（§3.2 写明必须含 ≥1 条 change-requests/CR-2026-070/review-annotations/*.yml，建议全量），同步 §6 的 schema 示例；并把 cmd-05 由「≥4 条」改为「≥4 条且至少 1 条键以 change-requests/CR-2026-070/review-annotations/ 开头」，随后按 §6.2 表内字面 args 重跑 dry-run 刷新 §6.3 基线。"
  - "本轮新增：B-4（归 write-dev-plan，落点 TASK-02 §3 实现要点第 5 条与 plan §4.1 风险表）位置：长任务夹具的形态与其清理安排。事实：TASK-02 §3.5 指定夹具为 process.execPath -e 的 setInterval 空转进程（故意永不退出），但全文未给夹具的兜底清理，清理完全依赖被测 killProcessTree() 在超时分支上生效。本 CR 已有一次同类残留的实测记录：dev-agent 在本 Issue（AIFI-33，即本 CR 来源 Issue）的 run 01a0b26f-185a-704b-8e08-77137a9aab33（created 2026-09-18T02:53:40Z → completed 2026-09-18T03:31:08Z，37.5 min，其中尾段约 8 min 无输出且未结算）留下两个该形态的进程，靠外部 kill 后才结算，其后的诊断记录见 multica agent tasks 2ed1a9de-4c8e-4b78-bfb1-055af99c6681 --output json 的 run 01a0b28f-5230-77aa-9ca9-aafa13cf8209 正文（含 11:12:36／11:13:20 两个孤儿与 11:31:07 才落的 task_phase=turn_completed）。影响：实施期在红灯迭代、断言失败或异常路径上只要把该夹具的后代留在原地，run 的进程树／管道不闭合 ⇒ 该 run 不结算、后续委派排队（plan 节点已发生过一次），而 TASK-02 §5 的完成标志依赖作者 run 正常跑完并登记 crctl task done —— 即本 TASK 的验收路径自身会被这条缺失安排拖住，plan §4.1 的 R-1～R-9 也没有覆盖它。修复方向：在 TASK-02 §3.5 增加一句「夹具必须自带兜底清理」（finally／afterEach 内对父与后代 PID 做有界 kill，独立于被测 killProcessTree() 是否生效），并在 plan §4.1 增加一条风险行（夹具残留 → run 不结算，出口 = 兜底 kill ＋ 有界轮询断言）。"

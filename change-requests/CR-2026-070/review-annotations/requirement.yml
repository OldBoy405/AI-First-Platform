verdict: block
blockers:
  - "本轮新增：B-1（归 write-requirement-prd，落点 prd.md §1.3.2 第三段、§1.4 事实 5 与 FR-2 交付边界、§5 AC-12）事实：§1.3.2 写「开发计划阶段按实际 Pi 源码仓位置与既有依赖发布路径完成最小拆分」，预设 Pi 包已存在一条既有依赖发布路径；本轮实测该预设不成立或至少未被核实——（1）@earendil-works/pi-coding-agent 0.85.1 的 package.json 为 repository = git+https://github.com/earendil-works/pi.git（directory = packages/coding-agent、author = Mario Zechner、license = MIT），是第三方上游包，本团队对该 npm scope 无发布权；（2）Multica 侧既不 pin 也不 vendor 该包，apps/docs/content/docs/install-agent-runtime.mdx:34 把 Pi 列为操作者自行安装的 agent CLI（install 链接指向上游仓库），故「按既有依赖升级流程让 Multica Runtime 使用新版本」在 Pi 上没有对应的既有机制；（3）本 workspace 的 dir-graph.yaml repositories 段仅三仓、docs/references 只有 multica／openwiki／tools 三个指针、Downloads/AI 下无任何 pi 源码检出、全仓未见 pi 相关 fork 登记（CUSTOM.md 亦无）。影响：AC-12 的判据（Pi 变更通过版本化源码修改、测试、构建与正常依赖升级交付）在三条含义不同、证据口径各异的路线下不唯一——自建 fork 并以自有 scope 发布、向上游提 PR 后等待上游发版、本地源码构建后以 npm i -g 指向本地目录；「不得直接 patch 本机已安装包 dist」与「本地源码构建后覆盖本机安装」的边界亦未界定，人工审批会把这条当前不可判定的 AC-12 绑成需求基线。修复方向：在 §1.4 补一条已核实事实（第三方上游归属＋Multica 不 pin＋无本团队 fork 与发布路径，附上述三处证据位置），把 §1.3.2 第三段的「既有依赖发布路径」改为显式待定项并列出候选路线及各自所需权限与证据，把 AC-12 收敛为可判定口径（例如 CR 交付 diff 中 Pi 侧改动只出现在版本化源码与测试，已安装 dist 不出现在任何交付 diff 中），并写明被升级的 Pi 版本由谁产出、升级动作发生在 CR 内还是合并后。本条只改事实与验收口径，不动 FR-1／FR-2 行为合同与 scope_in，也不要求本 CR 预先改 dir-graph.yaml。"
dimensions:
  结构完整性: "通过——七章齐备（§1 概述／§2 用户故事／§3 功能需求／§4 非功能需求／§5 验收标准／§6 成功指标／§7 范围排除），frontmatter 与 cr.md 一致（id CR-2026-070-prd、cr-ref CR-2026-070、title 逐字同、target-version 0.43、owner Ray、owner-role requirement、status draft）；本轮实读计数：US 6 条（US-1～US-6）、FR 3 条（FR-1～FR-3）、NFR 7 条（NFR-1～NFR-7）、AC 12 条（AC-1～AC-12，编号与来源 §7 连续对应）、§1.6 有修订记录，全文无 TODO／待填占位。"
  FR可测试性: "通过——FR-1→AC-1～AC-4、FR-2→AC-5～AC-8＋AC-12、FR-3→AC-9～AC-11，12 条 AC 全有 FR 落点且判据可机械核对（会话内 SKILL.md 搜索调用数为 0、默认值生效的秒数、显式 timeout:1200 不被覆盖、非法值与上限错误文本沿用、零 diff 面、已安装 dist 不出现在交付 diff）；§5 补充判定口径另给出取证要求（AC-2／AC-3 用真实 smoke run、AC-5～AC-8 缩短等待但走同一解析与 cleanup 路径、禁止真实等 300 秒或执行 find /），无空泛表述。AC-12 的判据可达性受 B-1 影响；隐式 timeout 调用面的判据缺口见 S-3。"
  范围合理性: "通过——§1.3／§1.3.1／§1.3.2／§7 四处口径互相一致；§7 以 12 条排除项逐条封边（新 Skill Locator／manifest、Shell lexer 或 parser、新错误码与状态框架、第二套计时器、默认值配置化、直接 patch dist、需求期预拆 TASK、为本 CR 改 dir-graph.yaml 的状态机或 gates、搬 docs/product 与 docs/analysis 文档）；本 CR 只动 Multica 共享 brief 与 Pi 内置 bash 两处，未顺手实施任何排除项。"
  与规划对齐: "通过——来源 §5 FR-1（行为合同、唯一写入点、约束、失败语义）与 §6 FR-2（唯一解析规则、判定顺序 5 档、超时结果、实现与交付边界）逐节落到 FR-1／FR-2；§3.1～§3.4 四项复用能力（Skill 注入、OutputGuard、timeout 与进程树原语、CR 状态账本）由 FR-3 承接并配 AC-9～AC-11；§7 的 12 条 AC 编号逐条承接且补了取证口径；§8.1～§8.3 验证方案与 §9 发布顺序／回滚在 §5 补充判定口径与 §6 有落点；§2.4 的 dev-agent suite-gate 正常长测试被 §7 第 7 条明确排除而非顺手改造。§10 风险控制项的落点缺口见 S-3。"
  依赖识别: "不通过——FR-2 的交付落点仓与发布路径未闭合（见 B-1）：§1.3.2 预设「既有依赖发布路径」并整体交给开发计划阶段，而本轮实测 Pi 包是第三方上游包（repository = git+https://github.com/earendil-works/pi.git）、Multica 侧不 pin 不 vendor（install-agent-runtime.mdx:34 列为操作者自装 CLI）、三仓与 docs/references 均无 pi 指针、无本团队 fork，故 AC-12 当前无对应机制与 owner。其余依赖已识别且本轮逐条实测一致：对已归档 CR-2026-069 产物只复用不改（output-guard 下 core.mjs／policy.json／capabilities.json／conformance.json／adapters 与 adapters/pi/index.ts 齐全）、Multica 侧 Skill 注入与唯一 brief 生成点（context.go:939 writeSkillFiles、runtime_config_sections.go:833 writeSkills 与 :1058 调用）、Pi 侧复用原语（bash.js 的 resolveTimeoutMs、setTimeout、killProcessTree、signal 处理、timeoutHandle 清理）、版本延续（specs/_index.yml current 0.42、cr-ref CR-2026-069，本 CR 0.43）。"
  契约域闭包: "通过——§1.3.3 显式声明本 CR 不新增 HTTP API、不新增 crctl CLI 命令与 flag、不新增 Skill 契约（三项 N/A 及理由已写明），确需闭合的是 FR-2 的工具行为合同，首轮按闭包清单逐项核对：参数与输入约束（判定顺序 5 档，0／负数／NaN／Infinity 归第 1 档且零启动进程）、错误闭包（沿用既有非法值、超上限与 Command timed out after N seconds 三类文本，禁止新增平行错误结构）、幂等（同一输入必得同一解析结果，未传与传 300 等价，其余显式值不等价）、权限判定顺序（非法值→超上限→合法显式值→未传取默认，无并列分支）、副作用与事务边界（只清理本次调用进程树、无 CR 侧副作用、无新增持久资源）、调用者约束（默认值唯一 owner 为 Pi 内置 bash，其余模块不得设第二套计时器）、验收观察点（AC-5～AC-8 与 AC-12）；确定性算法细节（默认值接线、错误文本报告实际生效秒数）已按 §1.5 归开发期 SDD，符合引用先例＋说明差异的层级要求。schema 文案的判据缺口见 S-4。"
suggestions:
  - "本轮新增：S-1（归 write-requirement-prd，落点 prd.md §1.4 事实 3）事实 3 写「grep -rn native skill discovery 在 server/internal/daemon/execenv/ 非测试代码中只命中 runtime_config.go:161-178 的 per-runtime 文件位置注释」，本轮按该字面命令实测不可复现：非测试代码只命中 openclaw_config.go:669 一处（注释原文 the user loses native skill discovery on that one agent），runtime_config.go 不含该字面短语（其第 158～180 行是 discovers its environment through its native mechanism 与逐 provider 的 skills discovered natively from ... 位置注释），其余命中均在 execenv_test.go。影响：不改变结论——两处命中同为说明性注释而非规则正文，事实 3 的「规则正文不存在、FR-1 的单一写入点是新约束」仍成立，AC-1／AC-4 可达性不受影响；但按字面复核会得到不同命中集，属既有教训（计数与逐字节口径）的同类。修复方向：改写为可复现口径，例如「非测试代码仅命中 openclaw_config.go:669 一处注释；逐 provider 的位置注释集中在 runtime_config.go:158-180，措辞为 skills discovered natively from ...」，并按工程纪律注明结论是否受影响（不受影响）。"
  - "本轮新增：S-2（归 write-requirement-prd，落点 prd.md §1.4 事实 5）事实 5 标注非法值错误文本在第 19 行，本轮按行核对该文本实际在第 18 行（第 19 行为右花括号）；同段第 14～24 行函数体、第 28 行 schema 描述、第 257 行超时错误文本、第 22 行超上限错误本轮实测均与事实 5 一致。影响：仅行号偏差，不影响 FR-2 解析点与 AC-8 判据。修复方向：改为第 18 行，或改写为「按 resolveTimeoutMs 内的非法值分支」以免 dist 行号漂移。"
  - "本轮新增：S-3（归 write-requirement-prd，落点 prd.md §4 NFR-1、§3 FR-2 行为合同或 §7 范围排除）来源 §10 风险表把「300 秒误伤长任务」的控制写成「现有显式 timeout 覆盖；长测试、build、migration 必须显式声明」，本 PRD 只落了前半句（NFR-1 与 AC-7 都只约束显式传值的路径），未落后半句，也未识别现存的隐式 timeout 长命令调用面——例如 Multica 共享 brief 自身要求 agent 以单个前台阻塞调用收集 CI 结果（gh pr checks --watch 类）以及 dev-agent 的 suite／build 路径。影响：AC-5～AC-8 与 §6 的观察点仍可机械核对（§6 已把显式长任务观察锚到 suite-gate 冒烟），但默认值生效后「哪些既有路径必须补显式 timeout」在 AC 集内无判据、无归属。修复方向：在 NFR-1 或 FR-2 补一句对隐式长调用的处置口径（必须显式声明 timeout，或由同一处 brief 指引声明），或明确写进 §7 范围排除。"
  - "本轮新增：S-4（归 write-requirement-prd，落点 prd.md §3 FR-2 实现边界与 §5 AC-5）FR-2 实现边界包含「只修改 Pi 内置 bash 的现有 timeout 解析点及对应 schema／说明」，而现有 schema 描述文案为 Timeout in seconds (optional, no default timeout)（bash.js 第 28 行），默认值落地后该文案失实；AC-5～AC-8 无一条把它列为核对点。影响：不影响默认值／显式值／校验顺序的行为判据，但会留下一条与实现相反的模型可见说明。修复方向：在 AC-5 或 AC-8 的核对点补「schema 描述与默认值一致，不再声明无默认超时」。"
  - "本轮新增：S-5（归 write-requirement-prd，落点 prd.md §1.3.1 第 1～2 条）§1.3.1 标注为「原文前缀，评审核对用」，本轮实测第 3 条与 cr.md summary 逐字一致、第 4 条与来源 §1 末段逐字一致、第 5 条与 Issue 正文一致；但第 1（FR-1 Agent 直接使用 Runtime 原生发现的 Skill…）与第 2 条（FR-2 Pi 内置 bash 未显式传 timeout 时默认 300 秒）在 cr.md summary 中无逐字对应（对应句为「在 Multica 单一共享 Skills brief 中要求 Agent 直接使用 Runtime 原生发现的 Skill、缺失时技术中止」「在 Pi 内置 bash 的现有 timeout 解析点增加 300 秒默认值」），其逐字来源是派发评论与来源 §1 的首项。影响：语义与来源 §5.1／§6.1 一致，scope 判定不受影响，但把 §1.3.1 当逐字锚点机械核对时会得到假失败。修复方向：把第 1～2 条的出处改为实际来源，或改写为与 cr.md summary 逐字一致的措辞。"

verdict: block
blockers:
  - "BLK-1 §3.2/§6（FR-02.2/FR-03.1/FR-04.2）：product-snapshot / updates-block / context 的产出方未定义。已核实 write-competitive-report 必填 updates-block+product-snapshot+confirmed、planning-draft 必填 context（gather-product-context 输出），但 product-planning 无 fetch/gather 节点、competitive-radar 与 market-to-plan 无 gather 节点，且 FR-12.4 要求节点数不变。修复：按 DD-2 的单节点顺序调用模式逐节点写明来源链（product-planning node-3：fetch-competitor-updates→gather-product-context→write-competitive-report 并定 confirmed 取值；competitive-radar node-2：gather-product-context→write-competitive-report(confirmed=false)；market-to-plan node-3：gather-product-context→planning-draft），或改由 Skill 自调上下文能力并列入 §1.1 变更对象。"
  - "BLK-2 §5 DD-4/§6 FR-12：与既有 pipeline-structure.test.mjs 断言正面冲突且未声明处置，AC-13 不可达。冲突已核实：:149 断言 architecture push 节点 prompt 必须含 `crctl checkpoint {{inputs.cr_id}} --message`（与 FR-07.3 删除命令互斥）；:178-179 断言 architecture 后续每节点必须含 crctl workspace inspect 且不得含 node-1.md；:116 断言 code 审批节点 approvalPrompt 含评审后 checkpoint phase=complete；:176-183 断言 code 后续节点含 execution_context.operational_workspace。修复：在 DD-4 增设既有断言处置清单，逐条标注需修订（:149）与必须逐字保留（:116、:176-183、:178-179），并在 §3.2 声明 architecture 各节点保留 workspace inspect 入口属五要素之外的机器契约保留项。"
  - "BLK-3 §1.1/§6（FR-07.1/FR-07.2）：漂移位置指错文件。已核实 architecture-design.pipeline.json node-1 已用 workspace inspect、不含自拼接路径与 ARCHITECTURE.md 表述；真正漂移在 skills/develop/write-tech-design/SKILL.md Step 1（.rayai-worktrees/{repo.id}/requirement/{cr_id} 路径约定）与「与 sdd.md 同一 commit 提交」。修复：把 FR-07.1/FR-07.2 的改动对象从 pipeline 改为该 SKILL.md，并在 §1.1 写明删除路径约定改消费 operational_workspace/resources[].worktreePath、同一 commit 改为各仓分别提交并纳入同批 checkpoint。"
  - "BLK-4 §6 FR-02 行节点编号错误且自相矛盾：product-planning 实际 human_approval=node-7、write-roadmap=node-8，SDD 两处都写 node-7。修复：更正编号，并按建议点名 code-implementation 的代码审批节点为 …0010（区别于 …0004 开工确认）。"
dimensions:
  prd_sdd_alignment: "阻断：FR-01～FR-13 均有条目且两阶段与 AC-14 一致，但 FR-02.2/FR-03.1/FR-04.2 只有结论无机制（BLK-1）、FR-07.1/FR-07.2 指错文件（BLK-3）、FR-02 节点编号错误（BLK-4）。"
  architecture_soundness: "通过：符合 tools ARCHITECTURE.md 分层与硬不变量 1/2/3/4/7，未触碰 Negative Space；multica registry 再生链断言经核实属实（gate_nodes_gen.go 内嵌全部 prompt + digest fail-closed，runner.go 仅 StartArchitecture，competitive-radar 无 server runner）。"
  data_model: "阻断：reportDraft 五字段与优先级完整；mode/raw_insight_path 方向正确但缺默认值与 mode=brief 缺参失败码；product-snapshot/updates-block 结构与产出方未定义（BLK-1）。"
  interface_contract: "阻断：五要素模板与反模式清单可实施，逐 pipeline 表与实际节点序基本对应；但 approve-* 的 approver 取值路径未定（architecture 现状 cr.md owners.development.id 且不得依赖 node-1.md）、competitive-radar slug→competitor-id 解析归属未定、report-to-planning-suggestion 的前置条件/错误处理/读写清单未列入改动面。"
  performance_security: "通过：deny 面与白名单零改动判断准确，FR-01 为真实安全修复；digest fail-closed 与 CRLF 纪律属实；建议补两条运行面风险（在跑 run 命中 TEMPLATE_DIGEST_MISMATCH；emit-registry token 白名单仅 cr_id/tech_context）。"
  testability: "阻断：DD-4 扩展既有测试可行、lint 链成立，但既有断言冲突未处置（BLK-2）；AC-08/AC-14 的证据形态与 DD-7 的承载断言缺失。"
  prompt_adoption: "通过：本 CR 不触及 crctl.mjs dispatch 与 rules.json#protectedPaths.deny，§8 条件性判断正确且保留了判断依据与 registry 再生依赖说明；DD-6/DD-7 的前缀事实断言经核实属实（rules.json commit 仅 wip:/[cr] /merge(）。"
suggestions:
  - "补 approve-* 的 approver 取值：Pipeline 只传 cr_id，owners 由 Skill 经 crctl 读取，消解与 architecture 不依赖 node-1.md 的矛盾。"
  - "§1.1 增补 report-to-planning-suggestion SKILL.md 的完整改动面（前置条件/错误处理表/读写清单），并保留前端按 reportPath 触发的入口契约。"
  - "§4.2 增列 emit-registry prompt token 白名单硬约束；§9 增列部署新 digest 时在跑 run 的 TEMPLATE_DIGEST_MISMATCH 处置。"
  - "DD-7 同类漂移还有 write-dev-plan（feat(）与 write-roadmap（[planning]），建议一并纳入或写明排除理由，并补扫描断言。"
  - "competitive-radar slug→competitor-id 解析建议落到 fetch-competitor-updates，Pipeline 不读竞品索引。"

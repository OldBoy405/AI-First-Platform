blockers:
  - "BLK-C1 [tools/pipeline-templates/{architecture-design,requirement-authoring,code-implementation}.pipeline.json] FR-06/FR-07/AC-06/AC-07/AC-12 职责收敛不完整：write-tech-design 仍含 crctl advance/status/具体路径/逐条回修且未显式传 resources；write-requirement-prd 仍含具体落盘路径与逐条回修；write-dev-plan 仍含 status/input-file；write-dev-tasks 仍含 crctl task init；implement-code 仍含 TASK 顺序/回修/fallback；write-test-report 仍含 crctl test/机器区 marker/status-block 回修算法；review-code 仍含 runner/维度/blocker-suggestion/replay 重建算法。修复：各节点只保留 Skill、业务输入、前序结构化输出、消费结果与最小 route，并为每类禁项补负向断言。"
  - "BLK-C2 [tools/pipeline-templates/{product-planning,competitive-radar}.pipeline.json + skills/competitive/fetch-competitor-updates/SKILL.md] FR-02/FR-04 输入闭环不稳定：product node-3 未声明 fetch 的竞品范围/lookback，node-6 未传 reviewer；competitive node-1 把 slug 当 ID 但 Skill 无 slug 契约，node-2 未结构化传出 node-5 依赖的 product-snapshot。修复：产品规划显式使用全量竞品+默认窗口并传 reviewer；为 fetch Skill 增 competitor-slug 解析或等价真实契约；node-2 输出 reportDraft+product-snapshot，增加确定性断言。"
  - "BLK-C3 [tools/skills/cr/cr-show/SKILL.md + pipeline-templates/feature-writeback.pipeline.json] FR-10/FR-11 事实源错误：cr-show Step 3.5 引用仓内不存在的 checkpoints.yml/_backlog.yml#checkpoints（实际只有 latest-checkpoint，历史在 checkpoint metadata commit/audit）；feature node-1 仍保留 code-approved 前提文本。修复：cr-show 改用可持久复现的 checkpoint metadata git 历史并以 latest-checkpoint 补详情；feature node-1 仅调用 Skill、消费事务结果、失败中止。"
  - "BLK-C4 [tools/skills/shared/crctl/scripts/test/pipeline-structure.test.mjs] 现有 23 项测试对上述原文仍全绿，属于假阴性；AC-02/03/04、四个 approve Skill grant+TTY --approver/角色 owner、职责收敛禁项与 cr-show 事实源缺少确定性断言。修复：补结构化正负断言，故意原文必须失败。"
  - "BLK-C5 [change-requests/CR-2026-050/test-report.md/test-evidence] 报告声称 generator --check/Source SHA 与 AC-02~04 grep 核对，但机器区四命令无对应日志。修复：回修后通过 crctl test 重建计划，纳入 generator --check 与 Source SHA 校验，并让报告只陈述机器日志可证明的结果。"

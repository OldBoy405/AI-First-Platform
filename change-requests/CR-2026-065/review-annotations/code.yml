suggestions:
  - "已解决：本轮新增：AC-12 / FR-14 的例外判定面在交付证据集内零观测、在测试面零覆盖 —— 「到期未清即红」（FR-14.3）与「例外标识与实际失败集合不匹配即红」（FR-14.4）两条语义没有任何用例承载。位置：change-requests/CR-2026-065/test-report.md §G-1 / §H-2（报告自报本轮不可执行、只给可复跑配方）、plan.md §7 AC-12 行（证据只写 cmd-01 与 cmd-04）、test-evidence/cmd-01.log 的 checks[EXCEPTION_EXPIRED].ok=true（只说明当前无到期例外，不等于到期即红成立）。事实（我本轮只读复核）：交付套件 576 用例全绿、21 个文件全 state=ok，但全仓（tools worktree）EXCEPTION_EXPIRED / EXCEPTION_NOT_OBSERVED / 未覆盖失败判定只出现在 skills/shared/crctl/scripts/test/suite-gate.mjs 的判定代码（validateExceptions 与 judge），没有任何 test 构造过期例外或标识不匹配例外；contract-scan.test.mjs 已有 probe-root（mkdtempSync + gate-registry.json 副本）与 suite-gate --report <ndjson> 自测机制，具备承载能力却未使用。影响：PRD §5 AC-12 明文「构造一条到期例外 → 门禁红」与 SDD §6.2 AC-12 可观测结果「构造到期条目 → EXCEPTION_EXPIRED 非零」均无证据，FR-14.4 的「不匹配即红」同样无证据 —— 本 CR 的核心治理承诺成为未验证前提，与本次事故同源（前提为假/未验证却一路绿到实现阶段）。修复方向：在 skills/shared/crctl/scripts/test/contract-scan.test.mjs 用既有 probe-root + suite-gate --report <ndjson> 机制补用例（用例名以 CR-2026-065 起始）：① 登记面含一条字段齐备（id/kind/reason/owner/expires）、expires 为过去时点且带时区偏移的例外 → 断言 verdict=block、进程退出非零、checks[EXCEPTION_EXPIRED].ok=false、registry.exceptions_count=1；② 登记面含一条在本次运行中未出现的失败名（或未覆盖的观测失败）→ 断言 checks[EXCEPTION_NOT_OBSERVED].ok=false 或 checks[SUITE_FAILURES_UNREGISTERED].ok=false；随后按 TASK-01 §3.2 / TASK-04 §3.3 刷新 gate-registry.json#manifest.cases.contract-scan.test.mjs 的终值（只升不降），并重跑一次 crctl test 刷新 test-report.md 机器区与 cmd-NN 证据（若证据命令集不变则 command-digest 不变，无需改 plan §6.2）。 —— 本轮 attempt 复核（quality-reviewer-agent 新建独立 run，只读证据面，未转发任何自报值）：① 修复落点逐字核对：返修提交 d33271a3 仅 2 文件（+58 −4）—— contract-scan.test.mjs 增 makeProbeRoot 第三参 exceptions（默认显式空数组，不改既有调用面）+ 2 条以 CR-2026-065 起始的例外治理用例；gate-registry.json#manifest.cases.contract-scan.test.mjs 15 → 17（只升不降，Σ manifest.cases = 578）。② 用例①（FR-14.3）语义我按判定实现逐行复核：登记面含一条字段齐备、expires=2020-01-01T00:00:00+08:00（带偏移、已过）的例外 ⇒ validateExceptions 过期分支 trigger(EXCEPTION_EXPIRED) 后 continue（不进入 live 集合、不静默续期）；断言 checks[EXCEPTION_EXPIRED].ok=false / verdict=block / 进程退出非零（main 结尾 process.exit(verdict === pass ? 0 : 1)）/ registry.exceptions_count=1（登记条数）与断言面一一对应。③ 用例②（FR-14.4）同法复核：未到期例外 kind=suite-failure、其 match 为本次运行未出现的失败名 ⇒ stale 集合非空 trigger(EXCEPTION_NOT_OBSERVED)；同时本次运行无失败 ⇒ SUITE_FAILURES_UNREGISTERED 保持 ok（其 trigger 只取 uncovered=失败集合差集），两个判定面互不串台，与用例断言一致。④ 交付执行面自证：cmd-01 全量 21 文件 / 578 用例全绿，contract-scan 17/17 ok；用例数口径我按 TAP 核对（14 个非循环用例 + 3 元素循环展开 3 条 = 17 ≡ manifest 终值）。旧 blocker 完全关闭，无残留。"
  - "范围外：报告 files[] 的每文件跳过计数字段名为 skipped_cases，与批准文本（SDD §2.4 报告模型 / TASK-03 §3.3 逐字字段表 / plan §2.1）固定的 skipped 不一致 —— 本轮复核确认保留理由成立：crctl 冻结 skip 模式表（lib/workspace-transactions.mjs:3992-3998）第 4 条为 SKIPPED 独立词（i 旗标），会把 JSON 键名 \"skipped\" 判成 skip 态；我实测新 cmd-01.log 对 5 条冻结模式零命中，而含 \"skipped\": 0 的等价 JSON 命中该条 —— 本 CR 内改名会把 cmd-01 判成 skip 态并作废证据面。建议后续文档/计划修订把字段表改为 skipped_cases 并登记改名理由。"
  - "范围外：例外匹配语义与批准文本不一致（① SUITE_NONCONVERGENCE 的抑制条件批准文本要求「未到期 + kind=suite-nonconvergence + 稳定标识与本项匹配」，见 SDD §3.2 check code 表、§6.5 SDD-CLOSE-09、plan J-7，实测实现只按 kind + 未到期即抑制，nonconvergenceExceptions 不做任何标识匹配；② SUITE_FAILURES_UNREGISTERED 的覆盖键 match 不在 SDD/PRD 例外必填字段集 id/kind/reason/owner/expires 内、不参与 schema 校验）。本轮复核实测仍如此，属 fail-closed（缺 match 时不覆盖任何失败并同时落 EXCEPTION_NOT_OBSERVED，不形成静默自证绿通道）；交付态 exceptions=[] 无当前验收影响。修法是先由设计/计划明文定义例外的匹配键落在哪个字段，再改判定代码，留后续 CR。"
  - "范围外：suite-gate --report 形态报告的 duration_ms 取各记录 duration_ms 之和（我按 suite-gate.mjs judge 入口的 context 构造复核：durationMs = records.reduce(...)），与 SDD §2.4「= 池式执行的整体墙钟，不是各文件耗时之和」不符；--run 形态正确，本 CR 证据（cmd-01 与负控/并发）全为 --run 输出，不影响本 CR 判定，留后续修订。"
  - "范围外：CI 平台（ubuntu + Node 20）上的池大小收敛性未验证 —— SDD §6.4 已登记为待核实依赖（本机不可得；证据按 S-2 口径以「本机复现 + 可得时的 CI 运行」交付），本机实测 pool=2 / pool=1 四次整跑均在 1200 s 被终止、默认 pool=15 两次收敛。建议 merge 前在 CI 上留一次 suite-gate --run 记录（非本 CR 验收面，不阻塞 code 阶段）。"

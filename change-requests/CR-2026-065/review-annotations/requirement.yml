suggestions:
  - "建议（不阻塞，归 write-requirement-prd）：S-1（本轮新增）[prd.md §3 FR-11.2 与 §5 AC-01／AC-14]：FR-11 第 2 条禁止「靠删测试／改测试名／放宽或删除断言达成绿」，但现有 AC 只验「执行到的测试总数 > 0、文件级 skip 数为 0、21 个文件全部被真实执行」（AC-01）与「无新增红、无新增 skip」（AC-14）——用例集合或用例总数下降不会留痕，该禁令没有可机械复核的落点；而 AC-01 正文里的 21 又正是 FR-1 要求「从事实源推导」的测试文件数，两者合起来恰落进 FR-3 的「必须钉死的目标值」一档。建议补一条判据：把交付的测试清单（文件集合＋每文件用例数或用例名集合）登记为受控清单并断言不得低于基线，或断言 CI 实际执行的清单与登记清单相等，使「删测试换绿」在门禁上可见。"
  - "建议（不阻塞，归 write-requirement-prd，落点可在 SDD 细化）：S-2（本轮新增）[prd.md §3 FR-12.1 与 §5 AC-10]：FR-12 第 1 条（保留 --test-concurrency=2 时须给出「它在 CI 环境下可收敛、可复现的证据」）与 AC-10（「命令、耗时、是否停滞」的可复现证据）证据口径不一致——CI 环境证据在本地交付链上通常不可得，而观察到不收敛的一方恰恰是本机；实现方若选择保留该参数，按 FR-12.1 字面可能无证据可交。建议统一为「本机复现证据＋（若可得的）CI 运行证据」，并把交付物固定字段写死（命令、耗时、停滞观察、结论），避免验收时口径之争。"
  - "建议（不阻塞，归 SDD，必要时由 write-requirement-prd 在 FR-6 补一句）：S-3（本轮新增）[prd.md §3 FR-6 与 §1.3 计数口径]：FR-6.2 钉死的是具名状态集合与每条声明转换的稳定标识，但 wildcard 展开面还有一份独立事实——any-active 目标集合（本轮实测：from: any-active 2 条、any-active 目标 12 个，故当前展开数 = 31 − 2 + 12×2 = 53）。若只登记声明条目、不把 any-active 目标集合并入受控清单，向该集合增删一个目标不会使断言变红，而它恰会改变展开口径。建议在 FR-6 的「必须钉死的目标值」里显式纳入 any-active 目标集合，或由 AC-06 的负控补一条该注入。"
  - "建议（不阻塞，归 SDD）：S-4（本轮新增）[prd.md §3 FR-17 四查的「权限与写入边界」「错误闭包」]：例外登记面写「只能经受控写入变更」，但 FR-17 同时声明本 CR 不新增 crctl 子命令或 flag——受控写入的具体入口（人改 git 跟踪文件并以 git 历史审计，还是走某既有命令路径）未定义，SDD 需给出唯一答案，否则「谁可以写、怎么写」在实现期存在两种读法。另建议把「明确错误消息」收紧为可机械核对的固定标识（固定 check code 或固定消息前缀，与既有 crctl gate check code 风格一致），使 AC-12 的「构造一条到期例外 → 门禁红」除退出码外还有可断言的具体信号。"
  - "建议（不阻塞，归 SDD）：S-5（本轮新增）[prd.md §3 FR-14.2]：到期的定义写成「日期或可判定的条件」，其中「可判定的条件」缺确定性（判定时钟源、比较口径、由谁判定），实现期易被读成任意条件，从而削弱「到期未清即红」。建议限定为日期（含时区与比较基准，例如 CI 运行日 UTC）或给出条件的具体判定式。"

suggestions:
  - "已解决：本轮新增：BR-2 的机械断言与仓库现况冲突（sdd.md:328 §4.4 表第 3 行 → FR-5 / AC-05 / AC-01）。位置：sdd.md:328 要求 `skills/review/review-alignment/SKILL.md` 对 `mtime` / `merge-commit` / `fingerprint` 三词零命中。事实（本机只读核对 tools worktree @dddd0ad63fb79bd7608314b4553f30e8ce7b7289）：该文件现共 2 处命中这三词——:33「读 `change-requests/_backlog.yml` — 取条目基本信息（不读 mtime/merge-commit/fingerprint）」、:51「> 不读 mtime/merge-commit/fingerprint：同步判定只基于可观测字段（status/评审 verdict/reviewed-at）与内容一致」；而 §9 zero_diff 明示「所有 `SKILL.md` 零 diff」，FR-5 亦明确禁止为转绿回写该 SKILL.md（AC-05 括号内同款禁令）。影响：按 §4.4 字面实现该断言，BR-2 在交付态仍为红 → AC-05 不可达、AC-01 的「exit 0 / 失败集合为空」不可达，与 §6.2 对 AC-05 的可达性说明矛盾。修复方向：把零命中面收缩为本机核对为真的两项（`latest-checkpoint` 与 `checkpoints[]` 当前均为 0 命中），或把这三词改为可机械核对的「不得作为事实源被读出」形态（例如只允许出现在含「不读」的否定句中），并在 §4.4 写出与实现一致的判据。 —— attempt 2 复核（本机只读，tools worktree @dddd0ad6）：§4.4 BR-2 行（:342）已把零命中面收缩为 latest-checkpoint 与 checkpoints[]，并新增「否定辖域」判据（:346）。实测 skills/review/review-alignment/SKILL.md：latest-checkpoint 0 命中、checkpoints[] 0 命中；mtime / merge-commit / fingerprint 共 2 处命中（:33 读取契约括号、:51 说明引用），按 。/；/换行切句后两处命中句均含否定锚点「不读」，零命中同样满足 ⇒ 把三词写成读取依据的非否定句仍会红；正向断言（change-requests/_backlog.yml 与 cr.md）在 :33 成立。被断言侧零 diff（tools worktree clean），§6.2 AC-05 与 §6.6 D6 已同步为同一判据。旧 blocker 完全关闭，无残留。"
  - "已解决：本轮新增：既有实现依赖清单第 5 项的稳定符号与事实源不符（sdd.md:495-496 §6.3）。位置：§6.3 第 5 项写 `relative path: skills/shared/crctl/scripts/test/merge-fixture.mjs`，stable symbol 列为 `runCrctl / git / makeWritebackFixture / makeCodeApprovedFixture / originMasterCount / archiveOutboxFiles`。事实（tools worktree @dddd0ad6 只读核对）：`merge-fixture.mjs` 只有 6 个导出——`sha256`、`git`、`runCrctl`、`makeFixture`、`makeCodeApprovedFixture`、`originMasterCount`；`makeWritebackFixture` 与 `archiveOutboxFiles` 是 `archive-tx.test.mjs` 文件内的局部函数（:14 与 :231），不在 `merge-fixture.mjs` 中。影响：该清单是本 CR「按 repo/path/symbol 核验既有实现事实」的契约面，本项按字面核验为假 → 其「沿用既有 fixture、不新增 fixture 框架」的依赖结论缺少可核验依据；实现期若照该清单 import 会直接失败（本 CR 的 archive 用例正是要改 RED-7）。修复方向：拆成两条登记——`merge-fixture.mjs` 登记其真实导出（补 `sha256` / `makeFixture`），另一条指向 `archive-tx.test.mjs`（:14 / :231）承载 `makeWritebackFixture` / `archiveOutboxFiles`；结论本身不变。 —— attempt 2 复核：§6.3 第 5 项（:509）现只登记 merge-fixture.mjs 的真实导出，本机实测该文件恰 6 个 export 且行号逐一对上（sha256:11 / git:14 / runCrctl:20 / makeFixture:27 / makeCodeApprovedFixture:95 / originMasterCount:197，无其他导出形式）；新增第 6 项（:517）指向 archive-tx.test.mjs，本机实测 makeWritebackFixture:14 与 archiveOutboxFiles:231 确为该文件局部函数（未 export），且 :374 / :393 的用例体确实使用它们，与登记的「构造面」描述一致。清单重编号 1…14 连续、无缺项无重复；「沿用既有 fixture、不新增 fixture 框架」的依赖结论现有可核验依据。旧 blocker 完全关闭，无残留。"
  - "已解决：本轮新增：去重比较字段契约的常量初值与投影代码不一致（sdd.md:174 §3.1 与 sdd.md:313 §4.3 → FR-8.3 / AC-08 / AC-09）。位置：§3.1 声明 `OUTBOX_VOLATILE_PAYLOAD_PATHS = Object.freeze(['detected_at'])`（注释写着「payload 路径级排除」），§4.3 的投影写成 `delete payload[p.split('.').slice(1).join('.')]`，并以注释 `'payload.detected_at' → 'detected_at'` 说明取值形态。事实：按 §3.1 的初值 `'detected_at'`，`split('.').slice(1).join('.')` 得到空串，实际执行 `delete payload['']`（空操作），`payload.detected_at` 不会被排除；只有常量值为 `payload.detected_at` 时该切片才成立——两处只能有一处是对的，§2.2 的字段表又写成 `payload.detected_at`。影响：若按 §3.1 初值实现，CR-2026-052 TASK-08 的 drift-audit 语义被破坏（`crctl.test.mjs:798`「同一漂移二次观测 → 文件 1、无 EMIT_FAILED」转红），FR-8.3 与 AC-08「既有语义不回归」不成立；§3.1 不变性 3 的「枚举排除、不得自动排除」也失去可断言落点。修复方向：常量与投影写成同一读法（二选一：值为 `['payload.detected_at']` 保留切片，或值为 `['detected_at']` 改为 `delete payload[p]`），并在 §3.1 补一条不变量：投影结果不得再含任何登记在 VOLATILE 路径中的 payload 字段。 —— attempt 2 复核：§3.1（:176）改为 OUTBOX_VOLATILE_PAYLOAD_KEYS = Object.freeze([以 detected_at 为唯一元素])（注释明示 payload 根下相对键），§4.3（:327）改为 for (k of OUTBOX_VOLATILE_PAYLOAD_KEYS) delete payload[k]，§2.2（:109）写明键名读法为 payload 根下相对键；三处同一键空间，原 split/slice 一层已不再保留，与产品现状 crctl.mjs:336 的 delete p.detected_at 同读法 ⇒ 语义零变化可核。新增不变性 4（:186）「投影闭合」（Object.keys(buildOutboxComparable(ev).payload) ∩ OUTBOX_VOLATILE_PAYLOAD_KEYS = 空集）非恒真：若常量写成 payload.detected_at 而投影仍 delete payload[k]，交集非空即红，B-3 那类不一致会被直接抓住；键缺失 / 空 payload / 嵌套对象三类边界已写明。§6.1 FR-10 与 §6.2 AC-09 已同步。旧 blocker 完全关闭，无残留。"
  - "建议（不阻塞，归 SDD / 实现期注意）：E-1（本轮新增）[§4.4 BR-4 行「crctl validate 与手工 commit 配方零命中」] 该判据未给出机械匹配面，而 write-requirement-prd/SKILL.md:89 现有一处含该子串的否定表述（「Skill 不输出手工 commit 指令」）。实现期若把它落成对子串「手工 commit」的零命中断言，会自造一条与仓库现况冲突的判据 → AC-07 / AC-01 卡住，并诱使改被断言文件（该文件在 §9 zero_diff 内、不可改，正是 FR-5 明令禁止的方向）。建议在 §4.4 写明该判据的机械面 = 既有测试同款模式（禁止出现 crctl validate 与命令形态的 commit 配方，如 Commit： / crctl git commit），保留「不得输出手工 commit 配方」的语义而不误伤否定句。"
  - "建议（不阻塞，归 SDD / 后续首次登记非收敛例外时）：E-2（本轮新增）[§3.2 非收敛分支「只判定 SUITE_NONCONVERGENCE 与登记面自身错误（EXCEPTION_*）」] EXCEPTION_NOT_OBSERVED 也在 EXCEPTION_* 之列，而该分支不做失败集合核对（failures 无观测值）；若不写明「已匹配的 kind: suite-nonconvergence 例外在本分支视为已观测」，实现期可能用空观测集合判 EXCEPTION_NOT_OBSERVED → 与同表「可抑制（可绿）」自相矛盾。本 CR 交付态 exceptions=[] 不受影响，属未来 CR 首次登记非收敛例外时的读法。建议在该分支补一句观测口径。"

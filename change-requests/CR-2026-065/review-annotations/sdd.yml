suggestions:
  - "已解决：本轮新增：已批准 SDD §3.4/§4.2 的 TAP「文件名块 + file 级 plan」per-file 归属前提在目标运行时为假 —— 验收面断裂、不可达（位置：sdd.md §3.4 解析规则 / §4.2 主干 manifestCheck / §2.3 manifest.files+manifest.cases 语义 / TDEC-1；阻断事实与出口已在 plan.md §0.0、§6.1 表注⑤、§7 阻断标注、§9.1 与 tasks/TASK-03.md §0+§3.4、tasks/TASK-04.md §0 登记，本节不经任何自报转述）。事实（本轮 reviewer 第一手复核）：(a) 自建两文件探针（a.test.mjs 两用例 + b.test.mjs 一用例）执行 node --test --test-reporter=tap，在 Node v24.15.0（本机，SDD §6.3 登记环境）与 v20.20.2（CI：.github/workflows/crctl-ci.yml:46-48 node-version 20）上均得扁平 TAP：# Subtest: 三行全为用例名、以 .test.mjs 结尾的 # Subtest: = 0、全文唯一 plan = 全局 1..3、passing 用例块内无任何文件归属信息；(b) 显式文件列表、目录发现（node --test）、--test-isolation=none 三种形态结论一致；(c) 文件名块唯一出现的形态是整文件加载失败（# Subtest: c.test.mjs + not ok 1 - c.test.mjs），即 SDD §3.2 表 SUITE_FILE_LOAD_FAILURE 的错误形态，不是正常文件的正常分组。影响：files_executed、manifest.files 集合核对、manifest.cases per-file 基线三项在真实输入下不可判（按 §3.4 字面实现则 files_executed 恒为 ∅、以 SUITE_REPORT_UNPARSEABLE 硬失败收场），cmd-01 永红 ⇒ AC-01/AC-10/AC-11/AC-12/AC-13/AC-14 在本计划下不可达、FR-11…FR-17 的验收证据面断裂；根因是 SDD 自身的机制设计在目标运行时不存在，不是 plan/TASK 把批准范围译错（plan/TASK 的覆盖表、矩阵、接口契约、依赖拓扑、组映射、zero_diff 面、粒度本轮未发现独立缺陷）。修复方向：repair-target=write-tech-design（route=upstream）—— 由人工走「修订 SDD §3.4/§4.2 的 per-file 归属机制（例如改用携带文件归属的报告形态、逐文件执行后聚合、或把 manifest 语义改为目标运行时下可实现的等价口径）→ 重新技术评审 → 重新人工审批 → replay 本计划」链；plan/TASK 不得就地放宽（加第二 reporter 目的地 / 逐文件 spawn / 降全局口径），也不得修改 sdd.md 一个字（本计划已按此办理，正确）。 —— 本轮 attempt 复核（quality-reviewer-agent 独立 run 的第一手复核，未转发任何自报值）：① 机制已换且三处自洽：§3.2 归属不变量 I1…I3 与「机制与替代」、§4.2 逐文件 spawn 主干 + 单文件解析规则、§2.3 归属与基线事实源分工段同一口径，归因链上不再读任何报告的块结构；② 不变量未松：真实执行 / 每文件用例数 ≥ 基线 / 解析失败硬失败三条全部保留，无降为全局口径、无删用例换绿、无「不可判」静默放过（§3.2 反向要求明确禁止）；③ 旧前提已证伪、新前提我本机独立复现：v24.15.0 与 v20.20.2 上多文件 TAP 均为扁平（# Subtest: 全为用例名、以 .test.mjs 结尾的 # Subtest: = 0、唯一 plan 为全局），单文件 TAP 顶层 plan ≡ 顶层结果行数（真实文件 17 / 7 / 两文件 24，pipeline-structure 35、trace-outbox 12，双运行时逐字一致），junit file 属性 v24 有 / v20 无，`node --test .` 与 glob 位置参数与 `--test-isolation=none` 均跨版本不一致 —— 与 §7.4 P3/P5/P6/P7 逐条吻合；④ per-file 基线语义在目标运行时成立：该文件在独立子进程中的 TAP 顶层结果数即 mani
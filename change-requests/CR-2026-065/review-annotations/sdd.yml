blockers:
  - "本轮新增：BR-2 的机械断言与仓库现况冲突（sdd.md:328 §4.4 表第 3 行 → FR-5 / AC-05 / AC-01）。位置：sdd.md:328 要求 `skills/review/review-alignment/SKILL.md` 对 `mtime` / `merge-commit` / `fingerprint` 三词零命中。事实（本机只读核对 tools worktree @dddd0ad63fb79bd7608314b4553f30e8ce7b7289）：该文件现共 2 处命中这三词——:33「读 `change-requests/_backlog.yml` — 取条目基本信息（不读 mtime/merge-commit/fingerprint）」、:51「> 不读 mtime/merge-commit/fingerprint：同步判定只基于可观测字段（status/评审 verdict/reviewed-at）与内容一致」；而 §9 zero_diff 明示「所有 `SKILL.md` 零 diff」，FR-5 亦明确禁止为转绿回写该 SKILL.md（AC-05 括号内同款禁令）。影响：按 §4.4 字面实现该断言，BR-2 在交付态仍为红 → AC-05 不可达、AC-01 的「exit 0 / 失败集合为空」不可达，与 §6.2 对 AC-05 的可达性说明矛盾。修复方向：把零命中面收缩为本机核对为真的两项（`latest-checkpoint` 与 `checkpoints[]` 当前均为 0 命中），或把这三词改为可机械核对的「不得作为事实源被读出」形态（例如只允许出现在含「不读」的否定句中），并在 §4.4 写出与实现一致的判据。"
  - "本轮新增：既有实现依赖清单第 5 项的稳定符号与事实源不符（sdd.md:495-496 §6.3）。位置：§6.3 第 5 项写 `relative path: skills/shared/crctl/scripts/test/merge-fixture.mjs`，stable symbol 列为 `runCrctl / git / makeWritebackFixture / makeCodeApprovedFixture / originMasterCount / archiveOutboxFiles`。事实（tools worktree @dddd0ad6 只读核对）：`merge-fixture.mjs` 只有 6 个导出——`sha256`、`git`、`runCrctl`、`makeFixture`、`makeCodeApprovedFixture`、`originMasterCount`；`makeWritebackFixture` 与 `archiveOutboxFiles` 是 `archive-tx.test.mjs` 文件内的局部函数（:14 与 :231），不在 `merge-fixture.mjs` 中。影响：该清单是本 CR「按 repo/path/symbol 核验既有实现事实」的契约面，本项按字面核验为假 → 其「沿用既有 fixture、不新增 fixture 框架」的依赖结论缺少可核验依据；实现期若照该清单 import 会直接失败（本 CR 的 archive 用例正是要改 RED-7）。修复方向：拆成两条登记——`merge-fixture.mjs` 登记其真实导出（补 `sha256` / `makeFixture`），另一条指向 `archive-tx.test.mjs`（:14 / :231）承载 `makeWritebackFixture` / `archiveOutboxFiles`；结论本身不变。"
  - "本轮新增：去重比较字段契约的常量初值与投影代码不一致（sdd.md:174 §3.1 与 sdd.md:313 §4.3 → FR-8.3 / AC-08 / AC-09）。位置：§3.1 声明 `OUTBOX_VOLATILE_PAYLOAD_PATHS = Object.freeze(['detected_at'])`（注释写着「payload 路径级排除」），§4.3 的投影写成 `delete payload[p.split('.').slice(1).join('.')]`，并以注释 `'payload.detected_at' → 'detected_at'` 说明取值形态。事实：按 §3.1 的初值 `'detected_at'`，`split('.').slice(1).join('.')` 得到空串，实际执行 `delete payload['']`（空操作），`payload.detected_at` 不会被排除；只有常量值为 `payload.detected_at` 时该切片才成立——两处只能有一处是对的，§2.2 的字段表又写成 `payload.detected_at`。影响：若按 §3.1 初值实现，CR-2026-052 TASK-08 的 drift-audit 语义被破坏（`crctl.test.mjs:798`「同一漂移二次观测 → 文件 1、无 EMIT_FAILED」转红），FR-8.3 与 AC-08「既有语义不回归」不成立；§3.1 不变性 3 的「枚举排除、不得自动排除」也失去可断言落点。修复方向：常量与投影写成同一读法（二选一：值为 `['payload.detected_at']` 保留切片，或值为 `['detected_at']` 改为 `delete payload[p]`），并在 §3.1 补一条不变量：投影结果不得再含任何登记在 VOLATILE 路径中的 payload 字段。"
dimensions:
  批准范围: "通过。§9「批准范围」四字段齐备且非空：scope_in（FR-1…FR-17 逐项落点）、scope_out（包 B、CR-2026-064 迁移面、5 条红的根因对象本身、CI 之外的交付发布流程、multica 测试面、新依赖、历史证据）、zero_diff（crctl 顶层 dispatch 与既有子命令签名/参数/错误码、lib/ 三件、rules.json、dir-graph.yaml、pipeline-templates/*、所有 SKILL.md、受治理账本写路径）、follow_up（ARCHITECTURE.md §5.5 滞后口径、其余 pipeline 节点数硬编码、例外流程运行实例），与 PRD §7 排除项逐条对齐，无空字段、无以「无」搪塞。"
  PRD↔SDD 对齐: "17/17 FR 均有技术方案落点（§6.1 映射表，逐条指向 §2/§3/§4/§6.6/§9），15/15 AC 均有设计落点、可观测结果与可达性说明（§6.2）；SDD-CLOSE-01…08（§6.5）逐项关闭 PRD/上一轮评审延后到 SDD 的设计项（S-1…S-5 与 FR-10/FR-14.4/FR-17），结论与 PRD 契约一致。存在一条对齐缺口：BR-2 的机械断言与仓库现况冲突（见 blocker 1），FR-5 的『对齐当前事实源』结论本身正确（`cr.md` + `_backlog.yml` 命中、`checkpoints[]` 0 命中），错在多了三个已被证伪的零命中项。"
  架构合理性: "通过。本机核对：`crctl.mjs` 已在 import 本地 `./lib/*.mjs`（:23-34），§3.1 新增 `lib/outbox-contract.mjs` 与不变量 3「零第三方依赖」的既有形态一致（无第三方 import 引入）；不改 dispatch、不新增子命令，§8 的 N/A 判定与核查命令成立。§6.4 登记 `tools/ARCHITECTURE.md` §5 不变量 5 的「28 条声明 / 展开 50」已滞后于 `dir-graph.yaml` 现况（本机以 `lib/yaml-subset.parseYaml` 复算：31 声明、2 条 `from: any-active`、12 目标、展开 53、具名 15），SDD 明确不把它作为方案前提、目标值一律从 `dir-graph.yaml` 推导后登记，并把修正列入 follow_up，与该文档 §8 维护规则（需独立触发）一致。决策记录 4 条（TDEC-1…4）均满足「难以逆转 + 无上下文会疑惑 + 有真实权衡替代」三判据，替代方案未被伪造（否决理由与原话一致）。"
  数据模型完整性: "通过。`gate-registry.json`（schema `crctl-suite-gate/v1`：manifest.files / manifest.cases / stateMachine.namedStates / wildcards / transitions / exceptions）字段与语义、变更后果齐全；门禁报告模型（§2.4：command / duration_ms / converged / exit_code / files_executed / cases_executed / skipped_file_level / failures / checks / registry / platform / verdict）字段写死；§2.2 的 outbox 事件字段归类与本机实现逐字对盘一致（顶层 `occurred_at` 排除、`payload.detected_at` 路径排除、其余 10 个顶层字段参与比较），§2.1 术语硬化区分了「清单」与「受治理账本」。唯一模型面缺陷是 VOLATILE 常量的取值形态（见 blocker 3）。"
  接口契约: "部分通过。清晰部分：`suite-gate.mjs` 的两种调用形态（`--run` / `--report --rc`）、13 个固定 check code 与触发条件、例外登记面四查结论（幂等 / 权限与写入边界 / 错误闭包 / 副作用）、§3.3「不新增用户可调用契约」与 §3.4（HTTP N/A）。存在两处两种读法：outbox 契约常量的值语义（blocker 3，会反向破坏既有 drift-audit 语义）与 §3.2 退出码句和 `SUITE_NONCONVERGENCE` 容忍行（S-1）。头号风险点 TAP 解析面缺显式 reporter 钉死（S-3）。"
  多仓架构约束: "通过。改动面只在 tools 仓（§1.2 文件表的 11 个路径，含 4 个新增文件），knowledge-base 仓只新增 CR 产物，multica 仓零改动；依赖方向单向向下（CI YAML → suite-gate → `*.test.mjs` → assertion-sources → lib/yaml-subset，产品侧 crctl.mjs → lib/outbox-contract.mjs），无反向 import、无跨仓写路径；取证一律按 `resources[].worktreePath`（§6.3 每项均标 repo/relative path），无 `.rayai-worktrees/` 拼接式路径。"
  性能与安全: "通过。推导与静态断言只读本地文件并带缓存，不引入网络/子进程风暴；`--max-runtime-ms`（默认 30 min）把「停滞」变为可观测事件（`converged=false` + `SUITE_NONCONVERGENCE`），进程树终止只针对自身 spawn 的 PID 树（POSIX 进程组 / Windows taskkill /T）；例外面写入口唯一（人类编辑 + git commit，审计 = `git log -- gate-registry.json`）、代码侧零写路径由静态断言覆盖、登记不替代执行且失败集合始终上报；断言只读，不新增 `_backlog.yml` / `cr.md` / `approval.yml` / `tasks/_index.yml` 写路径。"
  可测试性: "通过。三类负控的注入点经本机核对落在可见面且不被 guard 面挡住（N-1 `dir-graph.yaml`、N-2 `write-requirement-prd/SKILL.md`、N-3 `lib/outbox-contract.mjs`，均不在 `rules.json#protectedPaths.deny` 内）；`--report/--rc` 形态使「注入 → 判定 → 还原」可重放且不必每次都跑全量；BR-5 的构造 A 可行性经代码核对成立（`emitArchiveEvent` 不带 payload → 事件 `payload` 为 `{}`，重放时 comparable 逐字段相等 → 命中且 `warnings=[]`；journal 读写走 `<kb>/.crctl/transactions/archive/<cr>/<txId>/journal.json`，与既有测试同款），构造 B 的两条可见信号（`warnings` 含 EMIT_FAILED 与 `.crctl/audit.log` 含 `OUTBOX_DEDUP_CONFLICT`）与 `crctl.mjs:346` 的 auditLog 落盘一致。"
  Prompt 采纳影响: "N/A（不适用）。本机核对：`crctl.mjs` 的改点只在 `emitOutboxEvent`（:293 起的普通函数，非 dispatch 分支），`rules.json#protectedPaths.deny` 六条正则不含本 CR 任何改动路径，本 CR 不新增/不修改子命令与 flag，故 §8 的「不存在待采纳清单」成立；§8 给的三条核查命令（diff 只看 emitOutboxEvent/outbox-contract、rules.json 零 diff、dispatch 表未变）与实现面一致。"
  既有实现依赖核验: "12 项逐项可核，1 项错（见 blocker 2）。本机按 repo/path/symbol 核对（tools worktree HEAD = dddd0ad63fb79bd7608314b4553f30e8ce7b7289，`crctl git rev-parse HEAD` 与 `status --short` 均干净）：(1) `dir-graph.yaml` 状态机段实测 31 / 2 / 12 / 53 / 15 与登记值一致；(2) `lib/yaml-subset.mjs` 的 `parseYaml(text, {strict:true})` 存在且本机用其成功解析状态机（严格模式为 CR-2026-054 能力）；(3) `emitOutboxEvent` :293、内联比较块 :320-340（含 `payload.detected_at` 特例注释与 :346 的 EMIT_FAILED 审计）；(4) `archiveCr` :3449 / `emitArchiveIfNeeded` :3511 / 事件发送 :3520 / cleanup-pending :3683 与 :3705，语义（失败只追加 warning、不改 phase、不置 outboxEmitted；complete 重放重试且不新增 commit）与实现一致；(5) 符号名不符（blocker 2）；(6) `.github/workflows/crctl-ci.yml:109-111` 现文 = `node --test --test-concurrency=2 skills/shared/crctl/scripts/test/*.test.mjs`；(7) `write-dev-tasks/SKILL.md:106` 含 `crctl task init`、:115 含受控账本禁手写约束；(8) `code-implementation.pipeline.json` 节点 16、对 `crctl task init` / `_index.yml` / 手写索引零命中，`pipeline-templates/_index.yml:57` `nodes: 16`；(9) `review-alignment/SKILL.md` 读取契约 :33 命中 `cr.md` 与 `_backlog.yml`、`checkpoint` 0 命中、AL-01…AL-06 齐备；(10) `write-requirement-prd/SKILL.md:89` 现文「frontmatter 必填字段、七个章节、未替换占位符」且该文件在本机为 CRLF 检出（行尾规范化要求成立）；(11) 测试文件集合 21 个；(12) `archive-tx.test.mjs:373` RED-7 确以 `placeholder 占位内容` 预写同名不同内容文件并断言 `warnings: []`（构造失真属实）。第 13 项基线红登记：6 个引入 commit 经 `crctl git rev-parse --verify` 全部存在且主题与登记一致（14b4458 CR-2026-050 / fc2b142 CR-2026-060 TASK-04 / bef1f4d+2e4442d CR-2026-061 / 49c46dd AIFI-17 / fc797ed AIFI-22），本机与既有实测的口径区分（22 用例子集 vs 全量 894.8 s）在 §6.3 内写清。"
  AC闭环核验: "15/15 AC 均有设计落点、可观察结果与可达性说明，未发现「缺落点 / 结论与 PRD 冲突 / 结果不可观察 / 关键前置使 AC 不可达」。逐项抽核成立：AC-01（`exceptions=[]` 时退出码 0 当且仅当失败集合为空，与 PRD 逐字一致，未放宽）、AC-03（登记值与推导值两条独立来源，反恒真设计成立）、AC-06（N-1 注入会改变转换标识集合 → 集合比较红）、AC-08（构造 A/B 与 drift-audit 回归保护）、AC-09（字段分类集合相等 + `payload.observed_at` 反例）、AC-12（`exceptions: []` 显式空 + 到期判定用运行时 UTC 瞬时 `now >= expires`）、AC-15（四查结论齐全且不新增对外入口）。唯一使 AC 不可达的是 blocker 1（BR-2 断言面）与 blocker 3（若按 §3.1 初值实现则 AC-08 反向回归）；blocker 2 属依赖事实面。"
suggestions:
  - "建议（不阻塞，归 SDD）：S-1（本轮新增）[sdd.md:280-296 §3.2 退出码句与 check code 表 `SUITE_NONCONVERGENCE` 行] 两处口径不一致：表内该行的「可否被例外容忍」列写「允许 `kind: suite-nonconvergence` 登记」，而紧随其后的「退出码：0 当且仅当上表无任一触发（例外的『容忍』只作用于 `SUITE_FAILURES_UNREGISTERED` 一项的集合差）」把容忍面收窄到失败集合差。交付态 `exceptions=[]` 不受影响，但未来 CR 首次登记非收敛例外时「绿还是红」会有两种读法。建议明确写出登记 `suite-nonconvergence` 时该 check 是「抑制（可绿）」还是「仅标注（仍红）」，并把结论并入 §3.2 的退出码句。"
  - "建议（不阻塞，归 SDD）：S-2（本轮新增）[sdd.md:236-243 §4.1 步 9 与紧随的断言块] 「结构不变量」在推导侧恒真：`namedStates` 由同一批 declarations 的 from/to ∪ wildcard 目标推出，因此「每条声明的 from/to ∈ namedStates ∪ {'(new)'} ∪ wildcard 名」对任何输入都成立（本机按 §4.1 算法复算得 31/2/12/53/15，恒真式的成立与该结果无因果），它不构成检查。承重的反恒真设计（登记集合 ≡ 推导集合、两条独立来源）本身没问题，建议把这些不变量改为对 `gate-registry` 登记集合断言，或删去以免被读成覆盖项。"
  - "建议（不阻塞，归 SDD）：S-3（本轮新增）[sdd.md:250-270 §4.2 命令构造 + §4.2 解析规则] TAP 被本文档自陈为唯一预期外耦合点，但包装器命令未显式钉 `--test-reporter=tap`，而解析器硬依赖 TAP 结构（文件级 plan、`# Subtest:` 块、`not ok` 行）。reporter 默认值随 Node 版本与输出是否 TTY 变化，一旦不同即落 `SUITE_REPORT_UNPARSEABLE`（红而非静默降级，但交付面会依赖一个未登记的外部默认值）。建议在包装器的唯一命令来源里显式指定 reporter，并用一份入库的 TAP 片段跑 `--report/--rc` 形态的解析自测（该形态已具备），把 Node 20/24 的差异收在自测面。"
  - "范围外：S-4（本轮新增，归后续 CR，不阻塞）[sdd.md:646-649 §9 follow_up 第 2 条] 本机核对确认还有两处 pipeline 节点数硬编码断言：`crctl.test.mjs:4961`（`nodes === 16`）与 `pipeline-structure.test.mjs:41`（`ids.length === 16`），其中 `pipeline-structure.test.mjs:94-96` 已有同口径的跨文件投影断言（`_index.yml nodes` ≡ 实际 JSON 节点数）。SDD 已把它们登记为 follow_up 而非静默丢弃，且 AC-02 只锚定 BR-1…BR-4 所在的断言类别，故不影响本轮验收；后续 CR 触及 `_index.yml#nodes` 时按 follow_up 一并改投影即可。"

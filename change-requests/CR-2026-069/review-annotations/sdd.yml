  可测试性: "通过（上轮两处口径已补）。AC-9 与 AC-14 的证据落点已定义为 change-requests/CR-2026-069/evidence/ac9-sampling.md 与 evidence/ac14-smoke.md，并同步到 §1.2 KB 变更面与 scope_in 第 7 项；AC-14 的可达性写明逐 provider 挂载面可区分（claude 由 daemon 写入；codebuddy/qoder 项目级或用户级配置文件已安装且不被 daemon 触碰；pi/codex 宿主级）与「check-install 读数 + 四类行为观测」的替代判据；A10 补齐扫描面之外真实调用方的判定口径（逐条字段消费检查、结论登记同一张表、按仓标注）。本轮复读复核 dep-13 关系仍为真（readTestFileSet 只扫 skills/shared/crctl/scripts/test 下的 *.test.mjs，manifest.files 21 项、exceptions 为空数组），故 §6.4 的新增测试登记与独立 CI 步骤判断成立。"
  Prompt采纳影响: "通过（条件仍触发且第 8 节已填）。§8 的采纳面本身未变，本轮把「在同一 CR 内定点补 --detail」的义务与 §9 scope_in 第 4 项、§1.2 的改动落点对齐（review-requirement、四个 approve-*、skills/sync/**、pipeline prompt 文本、agents/*.md），两侧不再一宽一窄；dep-20 的实读结论（lint-prompts 的 R7 至 R13 不含未知 flag 校验，故该类漂移须由 caller-contract.test.mjs 兜住）本轮复核仍成立。"
suggestions:
  - "已解决：本轮新增：Managed scope 的挂载契约对 codebuddy/qoder 没有落点，§4.9 A9 第 3 步的前提只对 claude 成立。位置：§1.4.2 三级 scope 表的 Managed 行、§4.9 A9（第 3、4 步）、§1.2 的 multica 变更面、§9 scope_in 第 6 项。（a）事实侧：multica@947386318d52ecdb026a017f76220cde2ef7b94e 实读 server/internal/daemon/execenv/crguard_config.go —— prepareCRGuard(envRoot, workDir, provider, agentCaller, logger) 内只有 if provider == 「claude」 分支会写 {workDir}/.claude/settings.json（execenv.go 的调用点与注释同为 git PATH shim + Claude hooks），即「每任务 env 内的 Runtime hooks 配置写入点」只有 claude 一个；daemon 对 codebuddy 只写 {workDir}/CODEBUDDY.md、对 qoder 只写 {workDir}/AGENTS.md（runtime_config.go 的 provider 分支注释与 runtimeConfigPath 表，属 dep-15 的记忆文件与 skills 发现面），全仓 grep 无 .codebuddy/settings.json 与 .lingma 的任何写入点。因此 §1.4.2 Managed 行「Multica 每任务 env 内由 daemon 写入的 Runtime 配置（claude / codebuddy / qoder）」对后两者不成立，且该前提事实未由任何 dep-N 的五要素承载（dep-4 只覆盖 claude 的写入点）。（b）设计侧：§4.9 A9 第 3 步要求「与该 provider 既有的 crctl 守卫 hooks 在同一个配置对象内合成」（单写入者、单次写），第 4 步只豁免 Pi 与 Codex —— 但 codebuddy/qoder 既不存在既有的 hooks 配置对象、也不存在写入点；§9 scope_in 第 6 项把 TASK-09 限定为「新增 outputguard_config.go 与 crguard_config.go 的单写入点合成入参」，§1.2 的 multica 变更面同样只列这两处，都没有覆盖这两个 Runtime 的挂载。（c）影响：TASK-09 对启用顺序中 5 个 Runtime 里的 2 个行为不可唯一决定（新建写点 / 只做 claude / 直接跳过三种读法都能与现有文字自洽），且 D-7 用来否决「纯手工安装」的理由（AC-14 要求在真实 Multica 任务里冒烟、手工装是否真的生效不可判定）恰好同样适用于 codebuddy/qoder，其 Managed 冒烟面因此悬空。（d）修复方向：在 A9 写全 provider 分支 —— 明确 codebuddy/qoder 的 Managed 目标配置文件（项目级 scope 的绝对路径）与写入形态；若为新增写点，须同步 §1.2 变更面、§9 scope_in 第 6 项、dep-15 或新增 dep-N（含五要素）与 ../multica/CUSTOM.md 登记，并写出与既有用户级配置不 clobber 的判据；若决定把二者排除出 Managed scope，则须写出其安装面与 AC-14 冒烟的替代判据。两种取向下都要把 §1.4.2 Managed 行的措辞改为区分「记忆文件（CODEBUDDY.md / AGENTS.md）」与「hooks 配置文件」。 ——本轮复核：回修采用「把 codebuddy/qoder 排除出 daemon 写点」取向并补齐了缺的落点。§1.4.2 Managed 行已区分「记忆文件（dep-15）」与「hooks 配置文件」，并写明 daemon 侧 hooks 写点只有 claude 的 {workDir}/.claude/settings.json（dep-4）；§4.9 A9 由单点合成改为第 3 步逐 provider 分支表 + 第 4 步安装面（codebuddy 项目级或用户级 .codebuddy/settings.json、qoder .lingma/settings.json、pi 宿主级 settings.json#extensions、codex .codex/hooks.json 加 /hooks 信任）+ 第 5 步 claude 不 clobber 判据（已存在即不写不合并不覆盖，挂载记为未完成、由安装期检查报告）；AC-14 的替代判据已写进 §6.2 AC-14 行（挂载面逐 provider 可区分 + 冒烟前每个 Runtime 一行 check-install 读数落 evidence/ac14-smoke.md + 四类行为观测，不由部署过程自证）；dep-4 与 dep-15 的依赖结论补上「该函数内唯一的 hooks 写入分支是 provider=claude」与「该写入面不含任何 hooks 配置文件」；同步面 §1.2、§3.4 第 3 项、§1.5 第 8 条、§1.4.5、SDD-CLOSE-01/-09、scope_in 第 6 项、D-7、§7.4 R-6 全部到位，§9 zero_diff 另增 dep-15 行。本轮按 multica@947386318d52ecdb026a017f76220cde2ef7b94e 独立实读复核为真：crguard_config.go 中唯一的 hooks 写入分支是 if provider == claude，且目标文件已存在时仅告警返回不覆盖；context.go 的 skillsDirPath 与 runtime_config.go 的 runtimeConfigPath 只产出记忆文件与 .codebuddy/.qoder/.pi 等 skills 发现目录，全仓非测试代码无 .codebuddy/settings.json 与 .lingma 写入点。TASK-09 的行为对五个 Runtime 均可唯一决定。"
  - "已解决：本轮新增：变更面清单与 §9 scope_in 自相矛盾（§6.4 把必须改动的对象列入零改动核对清单）。位置：§6.4「零改动核对清单（提交前逐条 git diff --name-only 核对）」与 §1.2 的「既有文件改动（落点逐个列明）」。（a）§6.4 把 dep-18（即 ../multica/CUSTOM.md，§6.3 定义）列为零 diff 对象，而同文件 §1.2 的 multica 变更面写「CUSTOM.md ← 按其现状登记本次定制（AGENTS.md 纪律 10）」、dep-18 的依赖结论写「TASK-09 的改动必须新增台账条目」、§9 scope_in 第 5 项写「治理登记与 CI 面：dep-18（../multica/CUSTOM.md 按其现状登记本次定制）」——同一对象同时被要求「必须修改」与「核对为零改动」。（b）影响：AC-1 一行的可达性把「§9 zero_diff 清单 与 §6.4 零改动核对清单」并列作为核对依据，implement-code 与 code review 期若按 §6.4 机械核对，会拒绝 CUSTOM.md 的台账登记，而这正是 AGENTS.md 纪律 10 与 multica CUSTOM 台账要防的漏记场景；反之则与 §6.4 冲突产生假失败，二者不能同时满足。（c）同根因的次生缺口：§1.2「既有文件改动（落点逐个列明）」只列了 skills/develop/review-{tech-design,code,dev-plan}/SKILL.md，漏列 §8 与 §9 scope_in 第 4 项点名的 skills/requirement/review-requirement/SKILL.md、四个 approve-* Skill（requirement/tech-design/dev-start/code）与 skills/sync/** 的落点，使「逐个列明」的变更面与 scope_in 不一致。（d）修复方向：以 §9 scope_in 为准重算两处清单 —— 把 dep-18 从 §6.4 的零改动清单移出（或在该行注明「按 §9 scope_in 第 5 项登记，不适用零 diff」），并在 §1.2 的既有文件改动里补齐 Prompt 采纳面的 5 个 Skill 落点。 ——本轮复核：§6.4 的零改动核对清单已把 dep-18（../multica/CUSTOM.md）移出，并在正文新增一段明写「按 §9 scope_in 第 5 项必须新增台账条目，不适用零 diff」，与 §1.2 的 multica 变更面标注、dep-18 的依赖结论、scope_in 第 5 项三处一致；同根因的次生缺口一并重算——§1.2 的「既有文件改动（落点逐个列明）」补齐 skills/requirement/review-requirement/SKILL.md、四个 approve-*、skills/sync/**（A10 表命中项），并把 pipeline-templates/*.pipeline.json 的 prompt 文本与 agents/*.md 纳入同一个「A10 判定命中即在本 CR 内补 --detail」的义务；§9 zero_diff 把 dep-9 行收窄为「结构」（节点数 5/4/12、reviewLoop / replayNodes / maxAttempts，prompt 文本见 scope_in 第 4 项），§6.2 AC-1 行的改动面清单与四字段自洽判据①同步。本轮逐条重核四字段：dep-6（三处落点）与 dep-9（结构）按落点 carve-out 切分、dep-13 仅 manifest.files / manifest.cases 增项、dep-18、dep-19、README/ARCHITECTURE 与 KB evidence 全部只在 scope_in 侧，未留在 zero_diff；scope_out 中原误标为 dep-15 的 governance runner.go 行已改为「../multica 的 server/internal/governance/runner.go 与 Provider 事件归一化行为：零 diff（AC-12）」；follow_up 各项均非当前 AC 的必要条件。"
  - "本轮新增：§6.3「依赖引用规则自查」②的「1～21 的首现序严格单调」在本次回修后已不成立，建议改写该条的规则表述（属可核性与表述面，不影响任何 AC 判据或设计唯一性）。本轮独立复算（LF 归一全文，按行号取每个 dep-N 的首现位置）：首现序为 1,2,3,4,5,6,7,15,8,9,10,11,12,13,14,16,17,18,19,20,21 —— 回修在 §1.4.2 的 Managed 行新增了对 dep-15 的引用（第 159 行），早于 dep-8（第 324 行），而编号规则原意是「按正文首次依赖出现顺序分配」。实质面仍全部成立且本轮独立复核为真（21 条全部有定义、无空洞、无未定义引用、五要素齐备、SHA 全部 40 位、SHAs 与三仓事实相符），故不构成阻塞；但按「严格单调」字面复核会得到 fail，属该 SDD 自记过同类教训（需求评审 S-1 的漂移行号、S-4 的计数口径）的假失败。建议改为稳定语义，例如「编号在首次分配时按当时的首现序分配，一经分配不再改号；后续回修可在更早位置新增对既有编号的引用，首现行号因此可能前移」。"
  - "本轮新增：§1.4.2 Managed 行括注里的写入面清单对 qoder 不精确，且 codebuddy/qoder 的「Managed（企业统一部署）」落点建议写明，使 AC-19④「三级 scope 可区分」可逐 Runtime 核对。本轮实读 multica@947386318d52ecdb026a017f76220cde2ef7b94e：记忆文件按 provider 分别是 {workDir}/CODEBUDDY.md 与 {workDir}/AGENTS.md；原生 skills 发现目录分别是 {workDir}/.codebuddy/skills 与 {workDir}/.qoder/skills（context.go 的 skillsDirPath 分支），均无 hooks 配置文件写入点。§1.4.2 现写「dep-15 对二者只写记忆文件与 .codebuddy/skills/」，把 qoder 的目录也记成了 codebuddy 的目录，建议改写为「记忆文件（CODEBUDDY.md / AGENTS.md）与各自的原生 skills 目录（.codebuddy/skills、.qoder/skills）」。同时建议在该行或 §4.9 第 4 步点明这两个 Runtime 的 Managed 级实现方式（项目级配置随仓库提交、团队共享，daemon 不参与），否则 AC-19④ 的「三级 scope 可区分」在 codebuddy/qoder 上按配置面路径只数得出 Project 与 User 两级。"

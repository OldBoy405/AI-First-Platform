verdict: block
blockers:
  - "本轮新增：Managed scope 的挂载契约对 codebuddy/qoder 没有落点，§4.9 A9 第 3 步的前提只对 claude 成立。位置：§1.4.2 三级 scope 表的 Managed 行、§4.9 A9（第 3、4 步）、§1.2 的 multica 变更面、§9 scope_in 第 6 项。（a）事实侧：multica@947386318d52ecdb026a017f76220cde2ef7b94e 实读 server/internal/daemon/execenv/crguard_config.go —— prepareCRGuard(envRoot, workDir, provider, agentCaller, logger) 内只有 if provider == 「claude」 分支会写 {workDir}/.claude/settings.json（execenv.go 的调用点与注释同为 git PATH shim + Claude hooks），即「每任务 env 内的 Runtime hooks 配置写入点」只有 claude 一个；daemon 对 codebuddy 只写 {workDir}/CODEBUDDY.md、对 qoder 只写 {workDir}/AGENTS.md（runtime_config.go 的 provider 分支注释与 runtimeConfigPath 表，属 dep-15 的记忆文件与 skills 发现面），全仓 grep 无 .codebuddy/settings.json 与 .lingma 的任何写入点。因此 §1.4.2 Managed 行「Multica 每任务 env 内由 daemon 写入的 Runtime 配置（claude / codebuddy / qoder）」对后两者不成立，且该前提事实未由任何 dep-N 的五要素承载（dep-4 只覆盖 claude 的写入点）。（b）设计侧：§4.9 A9 第 3 步要求「与该 provider 既有的 crctl 守卫 hooks 在同一个配置对象内合成」（单写入者、单次写），第 4 步只豁免 Pi 与 Codex —— 但 codebuddy/qoder 既不存在既有的 hooks 配置对象、也不存在写入点；§9 scope_in 第 6 项把 TASK-09 限定为「新增 outputguard_config.go 与 crguard_config.go 的单写入点合成入参」，§1.2 的 multica 变更面同样只列这两处，都没有覆盖这两个 Runtime 的挂载。（c）影响：TASK-09 对启用顺序中 5 个 Runtime 里的 2 个行为不可唯一决定（新建写点 / 只做 claude / 直接跳过三种读法都能与现有文字自洽），且 D-7 用来否决「纯手工安装」的理由（AC-14 要求在真实 Multica 任务里冒烟、手工装是否真的生效不可判定）恰好同样适用于 codebuddy/qoder，其 Managed 冒烟面因此悬空。（d）修复方向：在 A9 写全 provider 分支 —— 明确 codebuddy/qoder 的 Managed 目标配置文件（项目级 scope 的绝对路径）与写入形态；若为新增写点，须同步 §1.2 变更面、§9 scope_in 第 6 项、dep-15 或新增 dep-N（含五要素）与 ../multica/CUSTOM.md 登记，并写出与既有用户级配置不 clobber 的判据；若决定把二者排除出 Managed scope，则须写出其安装面与 AC-14 冒烟的替代判据。两种取向下都要把 §1.4.2 Managed 行的措辞改为区分「记忆文件（CODEBUDDY.md / AGENTS.md）」与「hooks 配置文件」。"
  - "本轮新增：变更面清单与 §9 scope_in 自相矛盾（§6.4 把必须改动的对象列入零改动核对清单）。位置：§6.4「零改动核对清单（提交前逐条 git diff --name-only 核对）」与 §1.2 的「既有文件改动（落点逐个列明）」。（a）§6.4 把 dep-18（即 ../multica/CUSTOM.md，§6.3 定义）列为零 diff 对象，而同文件 §1.2 的 multica 变更面写「CUSTOM.md ← 按其现状登记本次定制（AGENTS.md 纪律 10）」、dep-18 的依赖结论写「TASK-09 的改动必须新增台账条目」、§9 scope_in 第 5 项写「治理登记与 CI 面：dep-18（../multica/CUSTOM.md 按其现状登记本次定制）」——同一对象同时被要求「必须修改」与「核对为零改动」。（b）影响：AC-1 一行的可达性把「§9 zero_diff 清单 与 §6.4 零改动核对清单」并列作为核对依据，implement-code 与 code review 期若按 §6.4 机械核对，会拒绝 CUSTOM.md 的台账登记，而这正是 AGENTS.md 纪律 10 与 multica CUSTOM 台账要防的漏记场景；反之则与 §6.4 冲突产生假失败，二者不能同时满足。（c）同根因的次生缺口：§1.2「既有文件改动（落点逐个列明）」只列了 skills/develop/review-{tech-design,code,dev-plan}/SKILL.md，漏列 §8 与 §9 scope_in 第 4 项点名的 skills/requirement/review-requirement/SKILL.md、四个 approve-* Skill（requirement/tech-design/dev-start/code）与 skills/sync/** 的落点，使「逐个列明」的变更面与 scope_in 不一致。（d）修复方向：以 §9 scope_in 为准重算两处清单 —— 把 dep-18 从 §6.4 的零改动清单移出（或在该行注明「按 §9 scope_in 第 5 项登记，不适用零 diff」），并在 §1.2 的既有文件改动里补齐 Prompt 采纳面的 5 个 Skill 落点。"
dimensions:
  PRD↔SDD对齐: "通过。实读 prd.md（LF 归一 56626 B，sha256 与 requirement 评审批注的 subject-sha256 相等，未漂移）：FR-8 六项、FR-1 十二项、FR-2 七项在 §6.1 逐条有技术落点；§6.2 的 AC-1 至 AC-21 二十一行逐项给出设计落点、可观测结果与可达性；§6.5 的 SDD-CLOSE-01 至 10 十项全部关闭且与 PRD 契约一致（含 §1.5 第 8 条目录归属与安装入口、第 9 条 plugin 形态两项显式交 SDD 的裁决）。FR 编号空洞按 §1.5 第 2 条保持，未顺手实施 FR-3 至 FR-7 与 FR-9（§9 scope_out 逐条排除）。D-5 与 D-6 两条紧读边界裁决的受理意见见 suggestions。"
  架构合理性: "通过。D-1 至 D-9 九条决策逐条满足三判据（难以逆转、无上下文会疑惑、有真实权衡替代），替代方案非伪造：seam 位置对 daemon preview 层、缩进 JSON 对 minified、模板物化对 plugin 打包、首行注释对全文扫描、unavailable 出 trailer 对完全静默、exitCode 结构存在性对字面必存在、daemon 合成对纯手工安装、自研 estimator 对 BPE 依赖、main() 单点投影对改 45 处调用点。与 ARCHITECTURE.md §4 依赖只朝下、§5 硬不变量 1 至 8（零第三方依赖、行尾与硬失败纪律、状态机口径唯一、审批无旁路、Skill 通用约束归仓）、§6 刻意不做（第二套 WAL 事务框架、独立账本脚本库）逐条无冲突。ARCHITECTURE.md 自身的更新范围见 suggestions。"
  数据模型完整性: "通过。§2 的四份新增形状（policy.json、capabilities.json、conformance.json、trailer 与启动记录）字段与 PRD FR-1 第 1 项、FR-8 第 3 项逐条对应；§2.6 记 DB schema 与写路径鉴权 N/A 的理由成立（三仓交付面无 DB 面，multica 改动只写每任务 env 内的 Runtime 配置文件）。阈值唯一源、能力唯一源、合同唯一源三分离与 NFR-2 一致；trailer 字段闭包固定七字段、不新增输出面；capabilities 的 preserve 取值闭包 {present, absent-by-runtime} 与 §4.2 可保持性检查（含 exitCode 三分支）一一对应，无遗漏字段。"
  接口契约: "不通过，见 blockers 第 1 条。§3.1 crctl CLI 契约（--detail 布尔分支不吞位置参数、未投影命令加 --detail 等价现状、退出码与错误面零改动）、§3.2 Core 纯函数签名与三条实现约束、§3.3 五个 Adapter 的 Pre/Post 映射与 fail-open 契约、§3.6 FR-8 四个子命令与输出纪律、§3.7 HTTP 与 IPC 事件 N/A、§3.8 唯一降级码四值闭包均自洽，且与 dep-6（parseArgs 通用取值、未知 flag 零校验，本轮实读）、dep-8（gates.json 零 diff）相符。但 §3.4 第 3 项声明的「唯一联合点」与 §4.9 A9 的 Managed 挂载契约只对 claude 有落点，对 codebuddy/qoder 无法唯一决定，详见 blockers 第 1 条。"
  多仓架构约束: "不通过，见 blockers 第 1、2 条。合规面：全文仓内路径只以 crctl workspace inspect 的 resources 为根，无目录名拼接（.rayai-worktrees 仅在规则句中出现）；三仓本轮实读 classification 均 healthy、dirty=false，tools HEAD 与 multica HEAD 与 §6.3 全部 dep-19 至 dep-21 条目的 commit SHA 全等；KB 两条（dep-1 926ef539、dep-2 a4e33ff5）均存在，且对应 prd.md 与来源在各自锚点到 HEAD 的 diff 中零命中、LF 字节数与依赖结论一致（56626 与 26406）；21 条 dep 五要素齐备且顺序固定、SHA 全部 40 位、首现序 1 至 21 严格单调无空洞、正文无未定义 dep 引用；V-1 至 V-7 单列且正文只以 V-N 引用（V-1 的 Pi 0.85.1 扩展 API 与 V-2 的 585 个 session 文件本轮复核实测一致）。跨仓依赖方向（tools 供 Adapter 与 Policy、multica 只做挂载与配置写出、KB 只承载过程产物）与 AC-12、AC-1 的零 diff 面一致。缺口即 blockers 两条：Managed 行的 daemon 写入面断言与多仓实际不符；§6.4 零改动清单与 §9 scope_in 冲突。"
  性能与安全: "通过。§7.1 行尾与硬失败纪律覆盖三处高风险面（金样本比对、session 遍历、multica 合成），与 I9 及 NFR-8 一致，且失败路径要求抛错或非零退出、禁止静默降级；§7.2 把 OutputGuard 的 fail-open 与 crctl Git 审批账本的 fail-closed 明确正交，四条不可跨越边界（逃逸阀不触安全层、无授权面与非授权文件、启动检查只读、被丢弃正文不落盘不进日志）与 FR-1 第 7、8、12 项与 NFR-4 一致；§7.3 给出单 Adapter、Release、policy 三粒度回滚且不建远程开关，与 FR-1 第 12 项一致。§7.4 的 R-1 至 R-5 如实登记残余风险（AC-16 无机器硬拦截、两条边界裁决、Runtime 能力待核实、Pi 自身截断混淆、扩展加载面与 argv 白名单），未假设掉。"
  可测试性: "基本通过，两处口径待补，见 suggestions 第 6、7 条。§4.6 的三层等价性合同（字段集合、稳定值、易变字段形态，禁止字节比对）与金样本先采后改的顺序可机械执行；§4.8 verify-selection 与 A8 贪心算法的最小基数论证成立；§4.10 的 caller-contract 显式表与 §2.2.3 的 declaredVectorCount 自棘轮形成回归面；§6.4 对 dep-13 棘轮的关系本轮实读复核为真（readTestFileSet 只扫 skills/shared/crctl/scripts/test 下的 .test.mjs，manifest.files 当前 21 项、exceptions 为空数组，故 crctl-summary 与 caller-contract 两个新测试必须登记、output-guard/test 与 metrics/test 必须另加 CI 步骤），AC-21 三项判据均有落点。待补：AC-9 抽样清单与判定、AC-14 冒烟记录的证据落点未定义；A10 扫描面之外的真实调用方判定口径未写。"
  Prompt采纳影响: "通过（条件已触发且第 8 节已填）。本 CR 的 diff 触及 crctl.mjs 的 dispatch 与成功输出投影层（§9 scope_in 第 3 项），§8 逐条列出应采纳面：crctl SKILL.md、四个 review Skill、四个 approve Skill、skills/sync/**、pipeline prompt、agents/*.md 与 README，并明确本 CR 不新增子命令、采纳义务是补 --detail 与 complete=false 取证完整性规则，与 AC-21 第 1 项及 AC-16 对应；同时说明 lint-prompts 的 R7 至 R13 不含未知 flag 校验（本轮实读确认），故该类漂移由 caller-contract.test.mjs 兜住的口径成立，未留应采纳而未采纳的清单缺口。"
suggestions:
  - "本轮新增：§6.3「依赖引用规则自查」自报的首现行号已漂移，建议重算或直接删去行号。本轮独立复算（按 LF 归一全文匹配首次出现）：dep-1 与 dep-2 均在 16 行、dep-3 在 30、dep-4 在 78、dep-5 在 106、dep-6 在 107、dep-7 在 116、dep-8 在 317、dep-9 在 330、dep-10 至 dep-12 均在 408、dep-13 与 dep-14 均在 560、dep-15 至 dep-17 均在 615、dep-18 在 687、dep-19 在 894、dep-20 在 901、dep-21 在 908；文中自报的后三条为 773、846、853，与实测相差约 121 行。结论侧不受影响（编号 1 至 21 首现序严格单调、无空洞、无未定义引用、五要素齐备、SHA 全部 40 位，本轮均已独立复核为真），但按字面复核会得到不同数字，建议与需求评审 S-4 的同类教训一并处理。"
  - "本轮新增：dep-19 的依赖结论对 skills/shared/metrics/** 的表述不精确，建议改写以免实现期据此做无效或错误判断。实读 .github/workflows/crctl-ci.yml：on.push 与 on.pull_request 的 paths 已包含 skills/**，因此新增的 skills/shared/metrics/** 本就在触发面内；真正缺的是 steps（现有 7 个步骤中没有 metrics 与 output-guard 的测试步骤）。dep-19 现写「现有触发路径不含 output-guard/** 与 skills/shared/metrics/**；不扩展触发面则新目录的测试永不进入 CI」——对 output-guard/** 成立，对 metrics 只成立「步骤缺失」这一半。动作结论（paths 增两项、steps 增两条）不变，仅是把前提写准。"
  - "本轮新增：§2.2.1 把首期命令族写成「dep-1 FR-1 第 2 项钉定的五族」，与同文件 §6.1 的「policy.json 的 families 三族五命令」及本节 families 数组（搜索、列举、读取三条）不一致；PRD FR-1 第 2 项列的是 5 个命令名（grep 与 rg、find、Get-ChildItem、cat、Get-Content）。建议改为「三族五命令」，与 §6.1 及 JSONC 示例对齐，避免第 3 轮评审按「五族」去数 families。"
  - "本轮新增：D-5 与 D-6 两条紧读边界裁决本身可接受，但建议把确认动作写进批准与验收链条。D-6 是唯一能让 FR-1 第 11 项「Pi 首个启用」与 AC-4、AC-18 同时成立的读法（字面读法会把 Pi 首期主力路径形式上判死）；D-5 与 NFR-6「降级必须显式」及 FR-8 排除降级会话的要求一致；两者已由 §7.4 R-2 与 §9 follow_up F-3 显式登记并随本 SDD 进入人工审批。由于 prd.md 已按 evidence-digest 钉住、其字面判据仍在，建议在人工审批时取得对这两条的显式确认，并让该口径进入 plan/TASK 的 AC-15 取证判据，避免 code review 期按字面重开。"
  - "本轮新增：ARCHITECTURE.md 的更新范围建议补一句判定依据。本 CR 新增的 output-guard/ 是 tools 包根下的新执行面，而 ARCHITECTURE.md §1 鸟瞰写「本包自身不含业务代码，只含提示词合约（Skill）、流程编排（Pipeline）与一个可执行治理工具（crctl）」、§4 的分层链也只有 Pipeline 到 Skill 到 crctl；SDD §1.2 只写「§3 代码地图增 output-guard 与 metrics 两条（只增不改 §4 与 §5 与 §6）」，未说明 §1 与 §4 是否需要同步。建议写明按 §8 维护规则对该改动的判定（若判定为普通 CR 改动，请写出依据），避免合并后代码地图与首读鸟瞰互相矛盾。"
  - "本轮新增：AC-9 的「抽样清单与判定入证据」与 AC-14 的「冒烟记录作为交付证据」的落点未定义。§9 scope_in 第 7 项已把它们列为交付证据，但 §1.2 的 KB 变更面只写 sdd.md 与 evidence/fr8-baseline.json，SDD-CLOSE-07 也只钉了 FR-8 机器 JSON 的落点。建议一并写清这些证据文件的落点（KB 的 change-requests/CR-2026-069/evidence/ 或 Issue 附件），否则 AC-9 与 AC-14 的「入证据」在验收时没有可核对的位置。"
  - "本轮新增：A10 的扫描面边界建议补判据。A10 声明扫描面为 skills 下的 SKILL.md、pipeline-templates 的 pipeline.json、agents 下的 md、skills 下的 mjs 与 README；AC-21 第 1 项要求「全部真实既有 crctl 调用方」在同一 CR 内更新。实测存在扫描面外的真实调用方，例如 KB 仓 .github/workflows/cr-guard.yml（调用 crctl validate 与 gate，只用退出码、不解析输出字段，故无需补 --detail）。建议在 A10 写明扫描面外调用方的判定口径（已完成字段消费检查、结论是不需要 --detail），使 AC-21 第 1 项的覆盖范围可核。"

suggestions:
  - "已解决：本轮新增：逃生阀在 Post（结果）面不生效，逃生阀拿不到完整结果，违反其唯一正向语义。位置：`output-guard/core.mjs` 的 `evaluateResult`（无逃生阀入参）＋五个 Adapter 的 Post 映射（`output-guard/adapters/claude|codebuddy|qoder|codex/posttooluse-guard.mjs` 的 `handle()`、`output-guard/adapters/pi/index.ts` 的 `handleToolResult()`）——Post 面全程不取本调用命令的首行。事实（本轮第一手复现，只读直跑 Adapter 入口）：把同一个 `tool_input.command` = 首行 `# output-guard: full reason=need raw tail once` 后接 `cat src/big.mjs` 的调用分两面驱动——Pre 面 `pretooluse-guard.mjs` exit 0 且 stdout 为空（无决策，逃生阀在 Pre 面按设计放行）；Post 面 `posttooluse-guard.mjs` 在同一 payload（`tool_response.content[0].text` 为 400 行、约 3373 tokens，超 `resultTokensCap=2011`）下 exit 0 并输出 `hookSpecificOutput.updatedToolOutput`，其中含 `action=truncate` 与 `complete=false`、**不含原始完整正文**。即逃生阀只让 Pre 面放行，结果仍被裁剪。判据面同样缺位：`conformance.json` 的 13 个向量与 `core.test.mjs`／`adapters-contract.test.mjs` 均无「逃生阀 ⇒ Post 面不裁剪」的向量（`neg-01..04` 只驱动 `parseCall`）。影响：`tasks/TASK-03.md` §4 条件 4「逃生阀：首行 … 的调用**得到完整结果**」未达成（该卡已标 done，`test-report.md` §3 仍记 pass）；`prd.md` §1.5 第 9 条「使用逃生阀时完整输出按正常工具结果进入会话」、SDD §1.4.1「逃生阀合法 → action=passthrough，**跳过全部封顶**」与 §4.2 步骤②「命中即终态」均未实现；`policy.json#hints.narrow`（收窄范围后重试 … 或把首行写成 `# output-guard: full reason=<一句话>` 一次性取全文）与四个 Adapter README §4 向模型与人承诺的行为在实现中不成立——产品面在给一条假指令，US-2 的取证通道实际不可用（AC-6 只验证了逃生阀不产生 deny，未覆盖其正向语义）。修复方向：在 Adapter 的 Post 映射层用 Core 已导出的 `parseEscapeHatch` 判定本调用命令首行（Claude／CodeBuddy／Qoder 的 PostToolUse payload 已带 `tool_input.command`，Pi 的 `tool_result` 事件带本调用的 input），valid ⇒ 不进入 `evaluateResult`、不写回填；若判定必须落在 Core 内，则同步把逃生阀态写进 SDD §3.2 的 `ResultInput` 并在同一 CR 内改该节。任一取向都必须补一条 Post 面向量（逃生阀 ⇒ 无 `updatedToolOutput`、无 trailer、正文逐字）入 `conformance.json` 并由断言执行，使该义务可机械核对；不得用跨调用状态实现（AC-6）。另请同步 `evidence/ac14-smoke.md` 各 Runtime 段落里「逃生阀合法 ⇒ 跳过 OutputGuard 封顶」的措辞——该措辞当前只被 Pre 面的无决策证据支撑。 ——本轮复核（第一手，只读直跑两个入口）：同一 payload（首行 `# output-guard: full reason=need raw tail once` 后接 `cat src/big.mjs`，正文 400 行 ≈ 6973 token > resultTokensCap=2011）分两面驱动 claude 的 `pre`/`post` 入口：两侧 exit=0 且 **stdout 均为空**（无 deny、无 updatedToolOutput）；对照组去掉逃生阀后 Post 侧回填并带 `complete=false` trailer（证明该判定是活的、不是空断言）。Core 侧 `core.test.mjs` 的「Post 面逃生阀回放」用例覆盖合法/不合法标记、非 shell 工具无逃生阀面、跨调用零状态三条边界；向量 `dec-05`（expect.trailer='' + 正文逐字 + adapterExpect.patch=false）经 conf-05（Core）与 ac-03（五个 Adapter）双侧断言；`ac-03` 的「无回填」分支同时断言 stdout 不含 `complete=`。`callCommand` 只从同一 payload 的 `tool_input.command`（四 Adapter）/`event.input.command`（Pi）取，Pi 的事件面字段有厂商文档支撑（docs/extensions.md 的 tool_result 事件列表含 `event.input`）；Claude 侧 PostToolUse 的 `tool_input` 亦有厂商文档支撑（hooks 参考「PostToolUse 的 input 同时含 tool_input 与 tool_response」+ SDK 的 `PostToolUseHookInput` 类型）。SDD §1.4.1 / §4.2 步骤②在 Post 面成立。"
  - "已解决：本轮新增：读取面的「原始行号」与「下一次 offset/limit 的具体值」不是本次调用实际窗口的锚点，起点非 1 的窗口会被重编号并给出错误续读值。位置：`output-guard/core.mjs` 的 `truncateRead`（行号取 `String(i + 1)`、续读取 `shown.length + 1`）。事实（本轮第一手复现，纯函数直调）：把「文件第 500 行起、共 900 行」的正文（即一次 `offset=500` 读取的结果）交给 `evaluateResult({runtime: 'pi', toolName: 'read', structure: 'content-parts'})`，返回的首行是 `1<TAB>file-line-500 CONTENT-…`、次行 `2<TAB>file-line-501 CONTENT-…`，续读提示为 `继续读取：offset=139 limit=138`。行号由切片下标重新生成、续读值由保留行数推出；SDD §3.2 已批准的 `ResultInput` 类型与五个 Adapter 都不传本调用的 `offset`，`core.test.mjs` 只断言了窗口起于第 1 行的 `startsWith('1<TAB>')`，`conformance.json` 无「窗口起点非 1」的向量。影响：SDD §4.3 的两条不变量——「行号必须是原始文件行号（**不得重编号**）」与「下一次 `offset/limit` 的具体值」——对任何起点非 1 的读取都不成立（Pi 的 `read` 工具带 `offset`、Claude 的 `Read` 带 `offset` 均为常规调用，且 Pi 是启用顺序第一位、`capabilities.claude.paths` 亦声明 `Read` 与 `Grep`）；模型按假行号与假续读值继续取证会读到错误区段，而 AC-15／AC-16 的「继续按 offset/limit 切片取证」正是靠这条提示承载。CR 证据 `evidence/ac9-sampling.md` 第 13 行又把「保留前 lineWindow 行 + 原始行号 + `offset/limit` 具体值」记为已观测的合法裁剪，与本事实相反（该行未被任何命令断言）。修复方向：让 Post 决策拿到本调用的窗口起点——Adapter 从同一 payload／事件里取 `offset` 后传入（与上一条同一处映射改动），行号物化为 `offset + i`、续读取 `offset + kept - 1`；若必须保持 SDD §3.2 的 `ResultInput` 冻结，则由 Adapter 层负责行号与续读值的物化并同步该节。修完补一条「窗口起点非 1」的向量／单测，断言首行行号与 `next` 值。 ——本轮复核（第一手，纯函数直调 + 独立复算）：`evaluateResult({runtime:pi, toolName:read, body:150 行 file-line-500…649, offset:500}, policy(结果阈值 300))` ⇒ `action=truncate kind=read`、首行 `500	file-line-500`、正文内 `继续读取：offset=638 limit=138`（旧症状 `1	file-line-500` 与 `offset=139 limit=138` 零命中）；缺省与非法 offset（0 / 1.5）回落第 1 行、逐字与改造前相同。向量 `dec-06`（`bodyFirstLinePrefix=500	`、`bodyIncludes=[offset=638 limit=138]`、两条 `bodyExcludes` 钉住旧行为负向）与 core 用例齐备。**公式更正（我方上一轮的指令有误）**：续读锚点应为 `offset + kept`（展示窗口是 [offset, offset+kept-1]，下一条未读行即 offset+kept）——实现取 `+kept` 正确，我上一轮 fix-direction 中的 `offset + kept - 1` 会重复展示已读的最后一行，作废。"
  - "已解决：本轮新增：`cat`／`Get-Content` 的结果没有走读取面算法，退化成「普通 shell」的头尾保留。位置：`output-guard/core.mjs` 的 `inferKind(body, toolName)` 与 `evaluateResult` 的 kind 选择（Post 面只拿得到 `toolName` 与正文形状，拿不到 Pre 面已判定的命令族）。事实（本轮第一手复现）：对 `cat output-guard/core.mjs` 的真实结果正文（该命令词在 `policy.json#families` 的 read 族内，Pre 面判定为 `family=read` / `action=rewrite`），`inferKind(catBody, 'Bash')` 返回 `generic`，`evaluateResult` 因此给出 `action=truncate kind=generic` 与「头 21 行 + 尾 6 行 + 已省略 N 行」的正文，而不是读取面的「连续行窗口 + 原始行号 + 下一次 offset/limit」。影响：SDD §4.3 的结果类型到算法映射把「读取」定义为「`cat`／`Get-Content` 与 Pi 的 read 工具」，该映射在 shell 路径上不生效；又因 Pre 面对 `cat` 施加的 `offset/limit` 是加在 Bash 工具入参上（Bash 不识别该字段，读取族的预封顶在这一路径上是 no-op），读取族在 Bash 上的唯一封顶就是 Post 面——它现在不给可续读的窗口。`tasks/TASK-04.md` §4 条件 3 登记的 claude 冒烟场景正是「裁剪（`cat` 全文）」，按现实现象与 SDD §4.3 的读取语义不符（该条件因 AC-14 环境中止未执行，故未被任何证据命令捕捉；本条按 SDD §4.3 判定，不以冒烟未跑为由升级）。修复方向：把 Pre 面已判定的族／kind 传给同一调用的 Post 决策（与前两条同一处映射改动），使 `cat`／`Get-Content` 走 `truncateRead`；或在 `inferKind` 无法判定时按 `policy.families` 的命令词补判定。修完补一条「Bash + `cat`」向量断言 `kind === 'read'`。 ——本轮复核（第一手，纯函数直调）：同一条 150 行代码正文，无 `callCommand` ⇒ `kind=generic`（正文含 `已省略`）；带 `cat output-guard/core.mjs` ⇒ `kind=read`（首行 `1	const alpha1 = 1;`、无 `已省略`）；带管道（`cat … | head -5`）⇒ 回落 `generic`（不确定性不夺取判定）；显式 `kind` 优先（`kind=list` ⇒ list）。`resultKind` 复用 Pre 面的同一个 `classifyFamily` 与同一 `determinate` 门，未出现第二套命令族判定；不传 `callCommand` 时行为逐字等同改造前（对历史回放抽检 samples 的计数因此不受影响，与 evidence/ac9-sampling.md 的补记一致）。向量 `dec-07` + core 四类对照用例齐备。"
  - "已解决：本轮新增：`capabilities.json#paths` 声明为 `coverage: full` 的非 shell 路径在安装面上不可达，CR 自研的两处产物对同一事实表述不一致。位置：`output-guard/capabilities.json`（`claude.paths` = `Bash`／`Read`／`Grep` 均 full；`codebuddy.paths` 含 `Read`；`qoder.paths` 含 `read_file`）对四个 Adapter 模板（`output-guard/adapters/{claude,codebuddy,qoder}/settings.template.json`、`codex/hooks.json.template`）的 `matcher` 与 `../multica` 侧 `server/internal/daemon/execenv/outputguard_config.go` 的 `composeOutputGuardHooks` 写入的 `matcher`——两侧一致为 `Bash|Shell|run_in_terminal`。事实：该 matcher 按 Runtime 工具名枚举（既有 crctl 守卫同一风格 `Bash|Write|Edit|NotebookEdit` 即此语义），`Read`／`Grep`／`read_file` 三个名字都不在其中，因此这些路径上 hook 不会被触发；`inferKind` 为 `Read`／`read` 保留的读取分支在这些路径上不可达（Pi 走扩展入口，不受 matcher 约束）。AC-4 的验证面 `conformance.json` 是直接驱动 Adapter 入口，绕过 matcher，故这一不一致不会被任何现有证据命令捕捉；`cmd-04` 只断言 `paths` 为非空数组，`cmd-09` 只读安装期文件面。影响：`capabilities.json` 是 CR 自定的「Runtime 能力唯一事实源」，其取值被 SDD §2.4 声明为由 conformance 向量验证；当前 claude／codebuddy／qoder 的非 shell 读取路径在安装面上不受治理，声明与可观测行为不一致，正落在 I4「覆盖度诚实」的反面，且 `review-tech-design`／`review-dev-plan` 已关闭的「降级即 AC-4 未达成」一项因此没有机械兜底。修复方向（二选一，均为一处内改动）：① 两侧 matcher 扩到 `capabilities.paths` 声明的工具名（claude 侧为 `Bash|Read|Grep` 等），保持声明不变；② 按 SDD §2.4 第 3 条把这些路径改为非 full（或逐条列 `uncovered: true`），使声明与安装面一致。无论取哪条，请补一条断言使「`capabilities.paths` 的 full 路径集合 ⊆ 安装面 matcher 覆盖的工具名集合」可机械核对（当前无任何判据）。 ——本轮复核（独立复算，不走测试；读 capabilities.json + 四份模板现算）：claude `Bash|Read|Grep`、codebuddy `Bash|Read`、qoder `run_in_terminal|read_file`、codex `Bash|apply_patch`，四个 Runtime **全部** `full⊆matcher=true`、`declared⊆matcher=true`、`matcher⊆declared=true`（pi 走扩展入口，ac-09 显式排除并单独钉住入口存在与 full 非空）；multica 侧 `composeOutputGuardHooks` 改为按 `outputGuardClaudeMatcherToolNames` 常量合成，不可达的 per-provider 表与 `known` 分支已删，provider == 仍恰 1 处且为 claude。判据双侧：ac-09（tools，锚在 capabilities.json 的声明集）与同包 `TestOutputGuardClaudeMatcherCoversDeclaredFullPaths`（multica，合成 matcher 必须覆盖 Bash/Read/Grep 且不得退回 shell-only 枚举），`cmd-06` 七条 --- PASS:。**边界提示**：matcher 可达 ≠ 结果可封顶——这两条新接上的非 shell 路径的「结果形态」层仍是未验证面，见下方范围 1/2。"
  - "范围外：claude 的 `Read` / `Grep` 结果形态与 Adapter 的 `bodyOf` 不匹配，`capabilities.claude.paths` 声明为 full 的这两条路径在真实会话里仍无可观测的封顶行为（本轮 B-4 只把「hook 不可达」修成「hook 可达」，未触及形态层）。事实（第一手，只读）：按厂商文档给出的 PostToolUse 结构化 Output 形态驱动 `output-guard/adapters/claude/posttooluse-guard.mjs` 的 `handle()`——`Read` = `{type:'text', file:{filePath, content, numLines, startLine, totalLines}}`、`Grep` = `{mode, numFiles, filenames, content, numLines}`（5000 行正文，远超 resultTokensCap=2011）——返回 `{ok:true, out:null}`：无 updatedToolOutput、无 trailer、stderr 也为空；同一入口换成 `{stdout,stderr}`（Bash）或 `content[]` 则正常产出 `updatedToolOutput` + trailer。文档依据：Claude Code hooks 参考「PostToolUse 的 input 含 tool_input 与 tool_response，且 PostToolUse 传的是工具的结构化 Output 对象」（该页同时说明 PostToolBatch 才传序列化文本），SDK 类型参考给出 Read/Grep 的 Output 形状；两者都不在 `bodyOf` 支持的四种形态（string / content[] / {stdout,stderr} / {output}）内，故 `inferKind` 为 `Read` 保留的读取分支在这些路径上不可达。为什么不计入本轮 blocker：AC-4 的批准验证面是 conformance 向量（逐 Adapter 全绿），能观测真实形态的 AC-14 真实会话冒烟已按 ENVIRONMENT_MISMATCH 登记为未覆盖风险；补齐形态支持要先决定「结构化结果的编号与 trailer 承载方式」（§3.3/§4.3 的设计取舍），而把声明降级又触发 §2.4 的 scope amendment —— 两者都超出本轮 code 面。建议：owner 部署窗口把 claude `Read`/`Grep`（以及 codebuddy `Read`、qoder `read_file`、codex `apply_patch`）的实测载荷形态与「hook 是否触发 / 是否封顶」一并记账，据实决定「补形态支持」或「收窄声明」，作为后续 CR / scope amendment 的输入。"
  - "范围外：「结果结构不可安全保持 / 无法提取正文」在 Adapter 里是静默无决策（五个 Adapter 同形：`bodyOf(...) === null ⇒ return { ok: true, out: null }`），既无 trailer 也无 `OUTPUT_GUARD_UNAVAILABLE` 降级行；而 SDD §3.3 的四场景枚举要求该情形「无决策 + stderr 一行 reason=<枚举>」。同根因下 §4.2 的可保持性门（reason=structure-not-preserved）也走 `if (result.reason !== 'structure-not-preserved') reportUnavailable(...)` 的显式豁免，结构面在任何情况下都不产生降级行。判为非阻塞：§3.8 的 reason 四值闭包（ADAPTER_MISSING/DISABLED/BUNDLE_INVALID/POLICY_INVALID）无法命名该情形——冲突住在已审批的设计文本里，而 code 阶段没有回到设计节点的合法转换（Skill Step 2.5）；AC-8 / AC-19③ 的验证面均不含此路径。影响面因本轮 B-4 而变大：matcher 现覆盖 Read/Grep/read_file/apply_patch，这些路径的形态若同样不被 bodyOf 支持，症状就是「hook 触发了、什么也没发生、也没有降级行」（与上一条同源）。建议后续 CR 二选一：把该情形映射到 BUNDLE_INVALID（并加断言），或按「结构面只以 coverage 标记承载」收窄 §3.3 的措辞，使实现唯一。"
  - "范围外（复核成立、无需本轮处理）：跨仓 matcher 字面量双写——tools 的四份模板 matcher 与 multica 的 outputGuardClaudeMatcherToolNames 是两处独立字面量，两侧断言各自只覆盖一个方向（tools 侧 matcher⊆declared 锚在 capabilities.json，Go 侧 declared-literal⊆matcher + 禁退回 shell-only），故单侧多写一个未声明的工具名不会被任何测试捕捉。test-report.md §6.2 已自登记该风险；建议后续 CR 增一条跨仓一致性检查，或把两侧收敛到同一生成源。"
  - "已解决：上一轮 suggestion「trailer 的 original≈ / kept≈ 数值口径未钉」——因 sdd.md 本轮零字节改动（已审批约束），口径只能落在实现与断言：core.test.mjs 新增 `original≈\d+k kept≈\d+k reason=output-cap` 形态断言（并拒绝 `≈<n>k)` 的旧形态），接管了该义务；我复核 cr-cost 侧不解析该字段的前提未变，故此口径不影响跨产物数值。"
  - "已解决：上一轮 suggestion 3（outputguard_config.go 的「the other four」失实注释与不可达 known 分支）、suggestion 4（claude README 补 MULTICA_OUTPUT_GUARD_TOOLS_ROOT 与「未配置 ⇒ 挂载整体跳过、既有行为逐字不变」）、以及四份 README 的 matcher↔声明口径——逐条复核为真：表已删改注释、README §1 的 Managed 行已写明变量名与未配置语义、claude/codebuddy/qoder/codex 四份 README 均新增「matcher 覆盖本 Runtime 已声明路径 + ac-09 机械核对」一句。"
  - "范围外：上一轮 suggestion 2（reason=DISABLED 无产生路径）、suggestion 5（Qoder 安装面差异）、suggestion 6（replaceBody 把 content[] 折叠为单个 text part 的 part 级口径）——本轮状态复核：前两条与第三条均未处理，test-report.md §6.3/§6.4/§6.5 已按「不影响本轮验收」登记为风险，我复核该判断成立（AC-19③ 只要求只读打印缺失/损坏与修复命令；§4.2 的「结构键集不变」字面判据未被违反；Qoder 差异仍按已审批设计保留、留痕在 adapters/qoder/README.md §1 与 evidence/ac14-smoke.md §4）。"

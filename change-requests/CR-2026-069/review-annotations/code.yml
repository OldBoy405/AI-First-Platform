blockers:
  - "本轮新增：逃生阀在 Post（结果）面不生效，逃生阀拿不到完整结果，违反其唯一正向语义。位置：`output-guard/core.mjs` 的 `evaluateResult`（无逃生阀入参）＋五个 Adapter 的 Post 映射（`output-guard/adapters/claude|codebuddy|qoder|codex/posttooluse-guard.mjs` 的 `handle()`、`output-guard/adapters/pi/index.ts` 的 `handleToolResult()`）——Post 面全程不取本调用命令的首行。事实（本轮第一手复现，只读直跑 Adapter 入口）：把同一个 `tool_input.command` = 首行 `# output-guard: full reason=need raw tail once` 后接 `cat src/big.mjs` 的调用分两面驱动——Pre 面 `pretooluse-guard.mjs` exit 0 且 stdout 为空（无决策，逃生阀在 Pre 面按设计放行）；Post 面 `posttooluse-guard.mjs` 在同一 payload（`tool_response.content[0].text` 为 400 行、约 3373 tokens，超 `resultTokensCap=2011`）下 exit 0 并输出 `hookSpecificOutput.updatedToolOutput`，其中含 `action=truncate` 与 `complete=false`、**不含原始完整正文**。即逃生阀只让 Pre 面放行，结果仍被裁剪。判据面同样缺位：`conformance.json` 的 13 个向量与 `core.test.mjs`／`adapters-contract.test.mjs` 均无「逃生阀 ⇒ Post 面不裁剪」的向量（`neg-01..04` 只驱动 `parseCall`）。影响：`tasks/TASK-03.md` §4 条件 4「逃生阀：首行 … 的调用**得到完整结果**」未达成（该卡已标 done，`test-report.md` §3 仍记 pass）；`prd.md` §1.5 第 9 条「使用逃生阀时完整输出按正常工具结果进入会话」、SDD §1.4.1「逃生阀合法 → action=passthrough，**跳过全部封顶**」与 §4.2 步骤②「命中即终态」均未实现；`policy.json#hints.narrow`（收窄范围后重试 … 或把首行写成 `# output-guard: full reason=<一句话>` 一次性取全文）与四个 Adapter README §4 向模型与人承诺的行为在实现中不成立——产品面在给一条假指令，US-2 的取证通道实际不可用（AC-6 只验证了逃生阀不产生 deny，未覆盖其正向语义）。修复方向：在 Adapter 的 Post 映射层用 Core 已导出的 `parseEscapeHatch` 判定本调用命令首行（Claude／CodeBuddy／Qoder 的 PostToolUse payload 已带 `tool_input.command`，Pi 的 `tool_result` 事件带本调用的 input），valid ⇒ 不进入 `evaluateResult`、不写回填；若判定必须落在 Core 内，则同步把逃生阀态写进 SDD §3.2 的 `ResultInput` 并在同一 CR 内改该节。任一取向都必须补一条 Post 面向量（逃生阀 ⇒ 无 `updatedToolOutput`、无 trailer、正文逐字）入 `conformance.json` 并由断言执行，使该义务可机械核对；不得用跨调用状态实现（AC-6）。另请同步 `evidence/ac14-smoke.md` 各 Runtime 段落里「逃生阀合法 ⇒ 跳过 OutputGuard 封顶」的措辞——该措辞当前只被 Pre 面的无决策证据支撑。"
  - "本轮新增：读取面的「原始行号」与「下一次 offset/limit 的具体值」不是本次调用实际窗口的锚点，起点非 1 的窗口会被重编号并给出错误续读值。位置：`output-guard/core.mjs` 的 `truncateRead`（行号取 `String(i + 1)`、续读取 `shown.length + 1`）。事实（本轮第一手复现，纯函数直调）：把「文件第 500 行起、共 900 行」的正文（即一次 `offset=500` 读取的结果）交给 `evaluateResult({runtime: 'pi', toolName: 'read', structure: 'content-parts'})`，返回的首行是 `1<TAB>file-line-500 CONTENT-…`、次行 `2<TAB>file-line-501 CONTENT-…`，续读提示为 `继续读取：offset=139 limit=138`。行号由切片下标重新生成、续读值由保留行数推出；SDD §3.2 已批准的 `ResultInput` 类型与五个 Adapter 都不传本调用的 `offset`，`core.test.mjs` 只断言了窗口起于第 1 行的 `startsWith('1<TAB>')`，`conformance.json` 无「窗口起点非 1」的向量。影响：SDD §4.3 的两条不变量——「行号必须是原始文件行号（**不得重编号**）」与「下一次 `offset/limit` 的具体值」——对任何起点非 1 的读取都不成立（Pi 的 `read` 工具带 `offset`、Claude 的 `Read` 带 `offset` 均为常规调用，且 Pi 是启用顺序第一位、`capabilities.claude.paths` 亦声明 `Read` 与 `Grep`）；模型按假行号与假续读值继续取证会读到错误区段，而 AC-15／AC-16 的「继续按 offset/limit 切片取证」正是靠这条提示承载。CR 证据 `evidence/ac9-sampling.md` 第 13 行又把「保留前 lineWindow 行 + 原始行号 + `offset/limit` 具体值」记为已观测的合法裁剪，与本事实相反（该行未被任何命令断言）。修复方向：让 Post 决策拿到本调用的窗口起点——Adapter 从同一 payload／事件里取 `offset` 后传入（与上一条同一处映射改动），行号物化为 `offset + i`、续读取 `offset + kept - 1`；若必须保持 SDD §3.2 的 `ResultInput` 冻结，则由 Adapter 层负责行号与续读值的物化并同步该节。修完补一条「窗口起点非 1」的向量／单测，断言首行行号与 `next` 值。"
  - "本轮新增：`cat`／`Get-Content` 的结果没有走读取面算法，退化成「普通 shell」的头尾保留。位置：`output-guard/core.mjs` 的 `inferKind(body, toolName)` 与 `evaluateResult` 的 kind 选择（Post 面只拿得到 `toolName` 与正文形状，拿不到 Pre 面已判定的命令族）。事实（本轮第一手复现）：对 `cat output-guard/core.mjs` 的真实结果正文（该命令词在 `policy.json#families` 的 read 族内，Pre 面判定为 `family=read` / `action=rewrite`），`inferKind(catBody, 'Bash')` 返回 `generic`，`evaluateResult` 因此给出 `action=truncate kind=generic` 与「头 21 行 + 尾 6 行 + 已省略 N 行」的正文，而不是读取面的「连续行窗口 + 原始行号 + 下一次 offset/limit」。影响：SDD §4.3 的结果类型到算法映射把「读取」定义为「`cat`／`Get-Content` 与 Pi 的 read 工具」，该映射在 shell 路径上不生效；又因 Pre 面对 `cat` 施加的 `offset/limit` 是加在 Bash 工具入参上（Bash 不识别该字段，读取族的预封顶在这一路径上是 no-op），读取族在 Bash 上的唯一封顶就是 Post 面——它现在不给可续读的窗口。`tasks/TASK-04.md` §4 条件 3 登记的 claude 冒烟场景正是「裁剪（`cat` 全文）」，按现实现象与 SDD §4.3 的读取语义不符（该条件因 AC-14 环境中止未执行，故未被任何证据命令捕捉；本条按 SDD §4.3 判定，不以冒烟未跑为由升级）。修复方向：把 Pre 面已判定的族／kind 传给同一调用的 Post 决策（与前两条同一处映射改动），使 `cat`／`Get-Content` 走 `truncateRead`；或在 `inferKind` 无法判定时按 `policy.families` 的命令词补判定。修完补一条「Bash + `cat`」向量断言 `kind === 'read'`。"
  - "本轮新增：`capabilities.json#paths` 声明为 `coverage: full` 的非 shell 路径在安装面上不可达，CR 自研的两处产物对同一事实表述不一致。位置：`output-guard/capabilities.json`（`claude.paths` = `Bash`／`Read`／`Grep` 均 full；`codebuddy.paths` 含 `Read`；`qoder.paths` 含 `read_file`）对四个 Adapter 模板（`output-guard/adapters/{claude,codebuddy,qoder}/settings.template.json`、`codex/hooks.json.template`）的 `matcher` 与 `../multica` 侧 `server/internal/daemon/execenv/outputguard_config.go` 的 `composeOutputGuardHooks` 写入的 `matcher`——两侧一致为 `Bash|Shell|run_in_terminal`。事实：该 matcher 按 Runtime 工具名枚举（既有 crctl 守卫同一风格 `Bash|Write|Edit|NotebookEdit` 即此语义），`Read`／`Grep`／`read_file` 三个名字都不在其中，因此这些路径上 hook 不会被触发；`inferKind` 为 `Read`／`read` 保留的读取分支在这些路径上不可达（Pi 走扩展入口，不受 matcher 约束）。AC-4 的验证面 `conformance.json` 是直接驱动 Adapter 入口，绕过 matcher，故这一不一致不会被任何现有证据命令捕捉；`cmd-04` 只断言 `paths` 为非空数组，`cmd-09` 只读安装期文件面。影响：`capabilities.json` 是 CR 自定的「Runtime 能力唯一事实源」，其取值被 SDD §2.4 声明为由 conformance 向量验证；当前 claude／codebuddy／qoder 的非 shell 读取路径在安装面上不受治理，声明与可观测行为不一致，正落在 I4「覆盖度诚实」的反面，且 `review-tech-design`／`review-dev-plan` 已关闭的「降级即 AC-4 未达成」一项因此没有机械兜底。修复方向（二选一，均为一处内改动）：① 两侧 matcher 扩到 `capabilities.paths` 声明的工具名（claude 侧为 `Bash|Read|Grep` 等），保持声明不变；② 按 SDD §2.4 第 3 条把这些路径改为非 full（或逐条列 `uncovered: true`），使声明与安装面一致。无论取哪条，请补一条断言使「`capabilities.paths` 的 full 路径集合 ⊆ 安装面 matcher 覆盖的工具名集合」可机械核对（当前无任何判据）。"

suggestions:
  - "本轮新增：trailer 的 `original≈` / `kept≈` 数值口径未钉，实际渲染的是原始 token 数后跟一个字面 `k`（本轮实测 9775 tokens 的正文渲染为 `original≈9775k kept≈1621k`，而 ResultDecision 的 `keptTokens` = 1621）。位置：`output-guard/core.mjs` 的 `evaluateResult` trailer 拼接，对照 SDD §2.2.4 的示例 `original≈12k kept≈4k`——该示例允许「12 千」与「12 加字面 k」两种读法，故属口径未定而非实现违约。影响：模型与 reviewer 会据该字段判断被丢弃量，千倍读法下会高估 1000 倍；本轮已复核 cr-cost 的 lib 不解析该字段，故不构成跨产物数值不一致。建议把口径写进 §2.2.4（例如 `original≈<tokens>` 或真正的千分位 `≈10k`）并在 `core.test.mjs` 加一条形态断言。"
  - "本轮新增：`reason=DISABLED` 在代码中不可达。位置：SDD §1.4.2 安装期一句「只读检查：Adapter 是否被 Runtime 的配置面引用」与 §4.5 把 DISABLED 的触发面记为安装期检查，对照 `output-guard/scripts/check-install.mjs`（只做 Release 内文件存在性与 policy/capabilities 可解析性判定，从不读任何 Runtime 的安装配置）。影响：四值闭包中的 DISABLED 无产生路径，AC-19 的验证句只要求「只打印缺失/损坏与修复命令」，故本轮验收可达性不受影响；但「安装配置被移除即禁用」这一事实在机器面上不可观测。建议把 §1.4.2 的措辞收窄为 Release 内文件面，或作为后续 CR 的候选（本 CR scope_out 已排除新增安装框架）。"
  - "本轮新增：`server/internal/daemon/execenv/outputguard_config.go` 的 `outputGuardAdapterEntries` 注释与内容不一致。注释称该表让「the other four」Runtime 的「不写」决策显式化，实际表内只有 4 个条目（claude／codebuddy／qoder／codex），pi 不在表内（pi 的适配器入口是扩展 `index.ts`，无 pre/post hook 文件，因此确实不该入表）。影响：仅表述；且因 `outputGuardMountable` 只放行 claude，表内 `known` 分支在当前调用路径上不可达（`prepareOutputGuard` 先判 mountable 再看表）。建议把注释改成与 pi 的事实一致的措辞，或删表改为在 `outputGuardMountable` 处集中说明。"
  - "本轮新增：Managed 挂载的开关名未进入按 README 安装的人可见的面。位置：`MULTICA_OUTPUT_GUARD_TOOLS_ROOT` 目前只出现在 `../multica` 的 Go 常量 `EnvOutputGuardRoot` 与 `evidence/ac14-smoke.md` §0 的部署窗口动作项里；`output-guard/adapters/claude/README.md` §1 的 Managed 行只写「daemon 单写入点合成，不由本目录安装」。影响：不阻塞任何 AC（Managed 面由 daemon 侧测试覆盖，AC-14 冒烟已按环境中止登记），但部署窗口按下述链路启用 Managed 面时缺少一处权威指引。建议在 claude README 的 Managed 行写明该环境变量名与「未配置 ⇒ 挂载整体跳过、既有行为逐字不变」的语义（一句，不含阈值与能力矩阵，不违反 AC-13）。"
  - "本轮新增：Qoder 安装面差异（已审批设计钉 `~/.lingma/settings.json` + `startRecord=none`，厂商现行文档给 `.qoder/settings.json`）按「已审批设计结案 + 差异留痕 + 由部署窗口四类行为冒烟判定」复核，本轮不重开为 blocker，与 `test-report.md` §6.3、`output-guard/adapters/qoder/README.md` §1、`evidence/ac14-smoke.md` §4 的口径一致。本 Agent 独立复核的范围：留痕两处在位；`capabilities.qoder.level` 仍为 full、`startRecord=none` 未改；差异不影响 hook 协议族与 `coverage=full` 的判定依据。建议部署窗口把「hooks 是否真的触发」作为该 Runtime 计入已启用的前置读数（该步骤会让此差异立即显形），并注意本轮的 paths 与 matcher 问题（blocker 第 4 条）也会在该窗口一并显形。"
  - "本轮新增：`replaceBody` 把 `content[]` 折叠为单个 text part（`{...response, content: [{type: 'text', text}]}`）。位置：五个 Adapter 各自的结果回填实现。事实：正文只由文本 part 拼成（`bodyOf` 只取 `c.text`），回填时整段 `content` 被替换为单元素数组，原结果里的非文本 part（图片等）随之丢失；顶层键集不变，故不违反 SDD §4.2 的「结构键集不变」字面判据，该判据也未对 part 数量与类型作要求。影响：仅影响含非文本 part 的结果这一类输入，不在本 CR 声明的五条路径（Bash／Read／Grep／run_in_terminal／read_file）内，故不构成阻塞。建议在 §4.2 的可保持性检查里补一句 part 级口径（保留非文本 part 或声明丢弃），使实现唯一。"

  - "已解决：本轮新增：TASK-09 的接口契约与它自己声明的改动面互斥——新增的第 6 个固定入参要求在唯一调用点 execenv.go 改一行，而 TASK-09 §1/§4.3 与 plan §6.2 cmd-05 的 M_ZERO 都把 execenv.go 声明为零 diff。位置：tasks/TASK-09.md §1 范围边界 / §4 验收条件 3 / §5 完成标志 / §6 接口契约；plan.md §6.2 cmd-05 的 M_EXACT 与 M_ZERO、§9 G9 行、§4.0 RU9。事实（按 resources[].worktreePath 实读 multica@94738631）：crguard_config.go 的真实签名是 func prepareCRGuard(envRoot, workDir, provider, agentCaller string, logger *slog.Logger) (CRGuardResult, error)，全仓唯一调用点是 server/internal/daemon/execenv/execenv.go:731 的 prepareCRGuard(envRoot, workDir, params.Provider, params.AgentName, logger)；Go 没有默认参数，TASK-09 §6 声明的第 6 个参数 og *outputGuardMount 一旦落地，该调用点必须同步修改，于是 cmd-05 会同时报 FAIL multica diff 越界路径 .../execenv.go 与 FAIL multica diff zero_diff 面被改动 .../execenv.go，且 TASK-09 §4.3 的『multica 路径集 ⊆ {CUSTOM.md, crguard_config.go, outputguard_config.go, outputguard_config_test.go}』不可满足；反过来若照 §1 不动 execenv.go，§6 的签名声明无法编译。影响：TASK-09 的验收条件 3 与接口契约不能同时成立，implement-code 必然二选一破约；正确实现反而会在 cmd-05（本 CR 的发布前 checklist 第 3 项）上硬失败，属当前验收可达性受阻。修复方向（无需改已审批的 SDD：SDD §4.9 的输入只有 envRoot/workDir/provider 与既有锻造流程，§1.2 的 multica 变更面只列 crguard_config.go 与新文件与同包测试，均未把调用点列为落点）：二选一并同步写进 §6 与 §1 —— (i) prepareCRGuard 保持现有签名，把 Tools Release 根的解析与 prepareOutputGuard(...) 调用放在 crguard_config.go 内部（此时『nil 入参不变量』改写为『Tools Release 根未配置 ⇒ 既有输出逐字不变』，对应 §3.7 的第 4 个测试点）；(ii) 保留入参但声明为可变参 og ...*outputGuardMount（既有调用点原样可编译，nil 语义 = 空切片），并把 §6 的签名行同步为该字面形态。若作者判断必须显式改 execenv.go 的调用点，那是改 SDD 的批准范围（§1.2/§6.4 的 multica 落点清单），须走 write-tech-design 与人工确认，不在本轨内消化。 ——本轮复核（已解决）：取向 (i) 已落地并自洽。TASK-09 §6 的签名行现在是 func prepareCRGuard(envRoot, workDir, provider, agentCaller string, logger *slog.Logger) (CRGuardResult, error)（逐字等于 multica@94738631 的既有形态），挂载输入在函数内以 og, ok := prepareOutputGuard(toolsRootFromEnv(), provider) 取得、ok=false ⇒ 既有行为逐字不变；§1 范围边界、§4.3、§5 完成标志、§6 接口契约四处的口径与 plan §6.2 cmd-05 的 M_ZERO（含 execenv.go）不再互斥，§0.5 crguard_config.go 行、§4.0 RU9、§9 G9 行、§6.1 表注④/⑥ 同步。本轮独立复跑 cmd-05 = 58 failures、逐条 FAIL 明细里没有任何 execenv.go 相关条目（multica diff 为空是「尚未实现」的预期基线），即可达性口径成立；§3.3 另行写明了对 SDD §1.2「新增可空入参」的读法（可空的是挂载输入而非形参）与其依据（Go 无默认参数、SDD §1.2 的 multica 落点清单不含 execenv.go、§4.9 第 1 步输入为 envRoot/workDir/provider），与 SDD §4.9 第 1 步一致，无需改已审批 SDD。"
  - "已解决：本轮新增：cmd-04 对 crctl.mjs 的全部断言是死代码，R-5 / §6.1 FR-2 行 / §7 AC-11 行声称的机械判据没有观测面。位置：plan.md §6.2 cmd-04 的 if (T('skills/shared/crctl/scripts/crctl.mjs')) {…} 块（含 ok( 计数 45、fail( 计数 247、--detail 必须落在 parseArgs 内、summary-projectors 与 ACTIVE_PROJECTION 两个 token）、§4.1 R-5 的 cmd-04 半边、§6.1 FR-2 行的〔crctl.mjs 计数不变量〕、§7 AC-11 行的〔cmd-05：fail( 计数 247 与删改扫描〕。事实：T(p) 只在 TXT[p] 有值时返回内容，而 TXT 仅由 REQ 数组填充；按表内字面 args 实读该脚本，REQ.length = 36 且 crctl.mjs 不在 REQ（output-guard/ 全部、metrics/ 6 个、summary-projectors.mjs、两个新测试文件都在），因此该块恒被跳过；本轮按表内字面命令实跑 cmd-04：exit 1、audit-delivery failures = 57，57 条失败中无一条来自该块，而 tools@82e43dc5 的 crctl.mjs 实测 --detail 出现 0 次、无 summary-projectors 与 ACTIVE_PROJECTION——若该块生效必产出 3 条 FAIL（parseArgs 缺 --detail 1 条 + 两个 token 2 条，计数两条因基线本来就是 45/247 会通过），实际为 0，机械证明它从未执行。影响：AC-1/AC-11 的三条判据（改动只落三处落点、ok(/fail( 计数不变量、--detail 在 parseArgs 内）在证据命令集中零观测面——cmd-05 只做 --unified=0 的删改扫描与 +/- 行数上界，不计数 ok( 与 fail(；§7 AC-11 把 fail( 计数 247 记在 cmd-05 名下属误标。于是即便 --detail 落在 parseArgs 之外、或 ok() 调用点被改动，九条命令仍可全绿。修复方向：把 'skills/shared/crctl/scripts/crctl.mjs' 加进 cmd-04 的 REQ（或把该块的 guard 由 T(...) 改成 exists(...) 加 read(...)），使计数与 token 断言真正执行；同时把 §7 AC-11 行改写为 cmd-04 承担 ok(/fail( 计数、cmd-05 承担删改扫描与行数上界。 ——本轮复核（已解决）：REQ 现为 37 项且含 skills/shared/crctl/scripts/crctl.mjs，该块 guard 改为 exists(...) + read(...)（§6.1 表注⑦ 同步为「37 个必需交付文件」= 36 新增交付件 + 该既有文件）。本轮按表内字面 args 实跑 cmd-04：exit 1 / audit-delivery failures = 61，其中恰好 3 条来自该块（FAIL parseArgs missing --detail / FAIL crctl.mjs missing summary-projectors / FAIL crctl.mjs missing ACTIVE_PROJECTION），机械证明死代码已复活（ok(/fail( 计数两条因基线本就是 45/247 而通过，与预期一致）。§7 AC-11 行已改写为「cmd-04 承担 ok( = 45 / fail( = 247 计数不变量 + --detail 必须落在 parseArgs 内；cmd-05 承担 --unified=0 删改扫描与 +/- 行数上界 ≤ 10」，与 §6.1 FR-2 行、§4.1 R-5 口径一致。"

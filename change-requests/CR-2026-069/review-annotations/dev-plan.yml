  - "已解决：本轮新增：cmd-08 对 AC-14『逐 Runtime 四类行为』的校验在出现 ENVIRONMENT_MISMATCH 时被整文件豁免，观测面窄于 §6.1 FR-1 行与 §7 AC-14 行声称的面。位置：plan.md §6.2 cmd-08 的 for (const k of ['拒绝','裁剪','逃生','降级']) { if (seg.indexOf(k) < 0 && t.indexOf('ENVIRONMENT_MISMATCH') < 0) {…} }；§6.1 FR-1 行的〔cmd-08（冒烟与启用顺序证据）〕、§7 AC-14 行的〔cmd-08（ac14-smoke.md 逐 Runtime 四类行为）〕。事实：判据的第二项取的是整份文件的 t 而不是该 Runtime 段 seg，因此只要 ac14-smoke.md 任意位置出现一次 ENVIRONMENT_MISMATCH，五个 Runtime 的四类行为关键词要求全部失效（只剩每个 Runtime 一行 runtime=<rt> 读数的要求）；而 TASK-10 §4 条件 1 的口径是『前提缺失者以 ENVIRONMENT_MISMATCH 加所需建立动作显式登记』（按 Runtime），该豁免因此比卡片口径宽。影响：AC-14 是 AC-20 启用前置链的第一手证据，在部分 Runtime 环境缺失时，其余已启用 Runtime 的冒烟记录可缺四类观测而仍判 pass，属假绿通道。修复方向：把豁免收窄到该 Runtime 自己的段（seg.indexOf('ENVIRONMENT_MISMATCH') < 0），或在全局中止时要求五段各自带 ENVIRONMENT_MISMATCH 标记；两种写法都不改变 §5.0 的 ENVIRONMENT_MISMATCH 出口语义。 ——本轮复核（已解决）：判据第二项已由整份文件 t 收窄为该 Runtime 段 seg（seg.indexOf(ENVIRONMENT_MISMATCH) < 0），§7 AC-14 行同步写明「ENVIRONMENT_MISMATCH 豁免收窄到该 Runtime 自己的段」，§5.0 的出口语义未变；本轮实跑 cmd-08 = 4 failures，与基线构成一致。"

  - "本轮新增：§0.4 的『manifest.cases 合计 597』与 §6.3 的 cmd-05『59 failures』两处实测值与复跑不一致（不影响任何门禁与 AC 判据）。本轮按 resources[].worktreePath 复读：tools@82e43dc5 的 gate-registry.json#manifest.cases 逐项合计 = 579（crctl.test.mjs 224 / pipeline-structure.test.mjs 36 / contract-scan.test.mjs 17 三项与文内一致），597 应是本次 run 的 cases_executed（执行面）口径；cmd-05 按表内字面 args 实跑 = audit-diff failures = 57（tools 缺应改 46 + multica 缺应改 4 + KB 缺应写 4 + 3 组空集与落地硬失败），并非 59——KB『缺少应写文件』清单有 6 项，但 plan.md 与 tasks/_index.yml 已在本地 diff 内，实际只 4 项失败。其余四条（cmd-03=0、cmd-04=57、cmd-07=8、cmd-08=4、cmd-09=1）本轮独立复跑逐条相等，建议按复跑值改写这两处。"
  - "本轮新增：TASK-03~TASK-07 的完成标志把验收条件 3（真实冒烟）记为『需在 owner 部署窗口的宿主级安装后执行』，与 plan §2.1/§5.0 的『部署前』口径（该窗口在 developing 内，冒烟记录也是 TASK-10 完成边界前 5 项之一）表述不一致，并与 TASK-10 的 AC-14 证据职责重叠。建议在五张卡内写明该窗口即 plan §5.0 的预部署窗口（或直接以 TASK-10 的 evidence/ac14-smoke.md 为落点、卡内只登记入口与预期观测），使 crctl task done 在 developing 内的可达性像 §9 那样显式可核（CR-2026-057 FR-10 的风险面）；本项本身不构成流程控制 TASK，故不阻塞。"

suggestions:
  - "已解决：本轮新增：cmd-05 的证据命令表行不符合本表自己的单元格纪律（args 列不是字面 JSON token 数组），该行无法按 cell 逐字转录、cmd-05 在 M4 不可按表执行——而这正是本轮为 AC-10 补的活体核对所在行。位置：plan.md §6.2 证据命令表 cmd-05 行（唯一越界点 = 本轮新增的活体核对段内 if (ms === null || ms.length < 1)）与 §6.2.1 转录纪律（同段明文：args 列是字面 JSON token 数组、表内 cell 即字面值、无反竖线——竖线会破坏 Markdown 表格，需用时以 String.fromCharCode(124) 构造）。事实（本轮机械复核，可复跑）：按 Markdown 单元格语义切分，9 行证据命令里 8 行恰 7 个竖线（6 列），cmd-05 行 9 个竖线（8 列），多出的两个竖线即该 || 的两半；于是 args cell 在竖线处被截成两半（前半至 …if (ms === null，后半自 ms.length < 1) {…），对该 cell 做 JSON.parse 失败，其余 8 行全部成功。对照本轮对 6 条 -e 脚本的逐字符扫描：cmd-03/04/07/08/09 的反引号 / 反斜杠 / 裸双引号 / 竖线 / 换行违规数均为 0，只有 cmd-05 报 PIPE。同 6 条命令本轮已按括号配对取字面 args 复跑，与作者申报逐条一致（cmd-03=0 / cmd-04=61 / cmd-05=58 / cmd-07=8 / cmd-08=4 / cmd-09=1），故缺陷只在「表行形态」而不在命令语义（该 || 换成无竖线等价写法后语义不变）。影响：write-test-report Step 3 的唯一输入就是这两张稳定表（args 列逐字转录进 .crctl/tmp/test-plan.json#commands[].args，无第二生成步骤），cell 被截断后 cmd-05 要么以残脚本执行（node -e 语法错误 ⇒ 该行全红，连带 AC-10 活体核对、crctl.mjs 的 --unified=0 删改扫描与三仓 zero_diff 面一起失去观测面），要么由执行者在实现期手工补齐命令算法——后者正是 §6.2.1 明文禁止的「在实现期改写或补写命令算法」。属当前验收可达性受阻，且落在本轮刚修好的 AC-10 观测面上。修复方向（一处改动，二选一，均不改判据与失败数）：① 拆成两支：if (ms === null) { bad.push(...) } else if (ms.length < 1) { bad.push(同一句) }；② 用同脚本已定义的 any2 收敛（与 cmd-04/cmd-08 同族写法）：if (any2([ms === null, ms.length < 1])) { bad.push(...) }。修好后按 §6.2 表内字面命令复跑并把 §6.3 cmd-05 行的失败数按实测改写（本次为 58；若形态改动使失败构成变化须逐项重写），同时确认该行的竖线数回到 7。 ——本轮复评（attempt 3/3，独立复跑）：取向①（拆两支）已按上文修复方向落地，形态为 if (ms === null) { bad.push(同一 FAIL 句); } else if (ms.length < 1) { bad.push(同一 FAIL 句); } else if (JSON.stringify(reg) !== JSON.stringify(ms)) {…} else { console.log(字面量 ac10 活体核对：…) } ⇒ 短路语义与六态（注册表缺失 / require 失败 / 未导出 / evidence 缺失 / minimalSet 缺失或空 / 不等）逐态保留、FAIL 句与失败构成逐字不变（首选取向，未取 any2([ms === null, ms.length < 1]) —— 数组字面量先于调用全量求值，ms === null 时会抛 TypeError 而非受控 FAIL，作者对该二次取向的否决理由本轮复核成立）。本轮机械复核（可复跑）：① §6.2 证据命令表 9 行竖线数全为 7（6 列），9 个 args cell 全部 JSON.parse 通过，6 条 -e 脚本的反引号 / 反斜杠 / 裸双引号 / 竖线（含 String.fromCharCode 之外的裸换行）违规数全为 0；② 全文 182 个表格行的未转义竖线数逐块相等（0 处失配）；③ 6 条只读审计命令按表内字面 args（spawnSync(executable, args, {shell:false}) 同语义）在权威 worktree 独立复跑 = cmd-03 exit 0 / cmd-04 61 failures / cmd-05 58 failures / cmd-07 8 / cmd-08 4 / cmd-09 1，与 §6.3 申报逐条相等，cmd-05 的 58 项构成复按 FAIL 行归类亦相等（tools 46+1、multica 4+1、KB 4、crctl.mjs diff 空 1、AC-10 活体不可判 1），其中 execenv.go 相关 0 项、zero_diff 面 0 项；④ §6.3 cmd-05/cmd-08 两行与 §7 AC-14 行的同步文字与本轮实跑一致。上轮 blocker 已闭合，§6.2 的 args 列现可按 cell 逐字转录进 .crctl/tmp/test-plan.json#commands[].args（write-test-report Step 3 的唯一输入）。"
  - "本轮新增：cmd-05 的 multica 侧白名单允许任意新增的 server/internal/daemon/execenv/*_test.go（路径数上界 10），而 tasks/TASK-09.md §4.3 声明的是更严格的四点集（CUSTOM.md / crguard_config.go / outputguard_config.go / outputguard_config_test.go）。位置：plan.md §6.2 cmd-05 的 okAllow = any2([M_EXACT.indexOf(f) >= 0, (f.indexOf('server/internal/daemon/execenv/') === 0 && f.endsWith('_test.go'))]) 与 §5.1 检查项 3 的「恰 2 个 Go 文件 + 同包新增测试 + CUSTOM.md」，对照 tasks/TASK-09.md §4.3。事实：plan 侧与 cmd-05 侧口径一致（都允许同包新增测试），只有卡片更严；三者不构成假绿通道（多出的 *_test.go 不触碰任何 zero_diff 面，且 TASK-09 完成标志要求路径集 ⊆ 四点集）。影响：若实现期在 execenv 包内另加测试文件，cmd-05 与 §5.1 会全绿而 TASK-09 §4.3 的卡片级判据不被自动核对，需人工复读。建议：实现期以卡片口径为准（只落一个测试文件），或由 write-test-report 在报告里显式记录实际路径集后再由 review-code 复核；无需改判据。"
  - "范围外：crctl git diff 的 stdout 在 crctl.mjs 的 git 包装层被静默截断到 20000 字符（skills/shared/crctl/scripts/crctl.mjs:417 的 (r.stdout || '').slice(0, 20000)），无截断标记。位置：本轮复评取证时实测 —— 对含 §6.2 的 cmd-05 行（新旧各约 11.7 KB）的提交区间取 --unified=0 diff，输出在 20000 字符处截断于该行中部，其后 §6.3/§7/§10 的 hunk 全部丢失且无任何提示，行为上与「diff 到此为止」不可区分（工程纪律 #1 的同类风险：解析失败/截断必须硬失败出声）。影响：评审者若按该输出判断改动面，会漏读提交后半段的全部改动；本轮因此改用 git diff --stat 的行数预算（9 删 / 18 增）+ 逐处实读交叉核对取证。建议：作为 tools 包的下一个维护 CR 的候选项（截断时打印显式标记而非静默截断），不在本 CR 范围内消化。"

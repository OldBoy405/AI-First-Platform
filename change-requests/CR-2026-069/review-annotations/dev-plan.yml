blockers:
  - "本轮新增：TASK-09 的接口契约与它自己声明的改动面互斥——新增的第 6 个固定入参要求在唯一调用点 execenv.go 改一行，而 TASK-09 §1/§4.3 与 plan §6.2 cmd-05 的 M_ZERO 都把 execenv.go 声明为零 diff。位置：tasks/TASK-09.md §1 范围边界 / §4 验收条件 3 / §5 完成标志 / §6 接口契约；plan.md §6.2 cmd-05 的 M_EXACT 与 M_ZERO、§9 G9 行、§4.0 RU9。事实（按 resources[].worktreePath 实读 multica@94738631）：crguard_config.go 的真实签名是 func prepareCRGuard(envRoot, workDir, provider, agentCaller string, logger *slog.Logger) (CRGuardResult, error)，全仓唯一调用点是 server/internal/daemon/execenv/execenv.go:731 的 prepareCRGuard(envRoot, workDir, params.Provider, params.AgentName, logger)；Go 没有默认参数，TASK-09 §6 声明的第 6 个参数 og *outputGuardMount 一旦落地，该调用点必须同步修改，于是 cmd-05 会同时报 FAIL multica diff 越界路径 .../execenv.go 与 FAIL multica diff zero_diff 面被改动 .../execenv.go，且 TASK-09 §4.3 的『multica 路径集 ⊆ {CUSTOM.md, crguard_config.go, outputguard_config.go, outputguard_config_test.go}』不可满足；反过来若照 §1 不动 execenv.go，§6 的签名声明无法编译。影响：TASK-09 的验收条件 3 与接口契约不能同时成立，implement-code 必然二选一破约；正确实现反而会在 cmd-05（本 CR 的发布前 checklist 第 3 项）上硬失败，属当前验收可达性受阻。修复方向（无需改已审批的 SDD：SDD §4.9 的输入只有 envRoot/workDir/provider 与既有锻造流程，§1.2 的 multica 变更面只列 crguard_config.go 与新文件与同包测试，均未把调用点列为落点）：二选一并同步写进 §6 与 §1 —— (i) prepareCRGuard 保持现有签名，把 Tools Release 根的解析与 prepareOutputGuard(...) 调用放在 crguard_config.go 内部（此时『nil 入参不变量』改写为『Tools Release 根未配置 ⇒ 既有输出逐字不变』，对应 §3.7 的第 4 个测试点）；(ii) 保留入参但声明为可变参 og ...*outputGuardMount（既有调用点原样可编译，nil 语义 = 空切片），并把 §6 的签名行同步为该字面形态。若作者判断必须显式改 execenv.go 的调用点，那是改 SDD 的批准范围（§1.2/§6.4 的 multica 落点清单），须走 write-tech-design 与人工确认，不在本轨内消化。"
  - "本轮新增：cmd-04 对 crctl.mjs 的全部断言是死代码，R-5 / §6.1 FR-2 行 / §7 AC-11 行声称的机械判据没有观测面。位置：plan.md §6.2 cmd-04 的 if (T('skills/shared/crctl/scripts/crctl.mjs')) {…} 块（含 ok( 计数 45、fail( 计数 247、--detail 必须落在 parseArgs 内、summary-projectors 与 ACTIVE_PROJECTION 两个 token）、§4.1 R-5 的 cmd-04 半边、§6.1 FR-2 行的〔crctl.mjs 计数不变量〕、§7 AC-11 行的〔cmd-05：fail( 计数 247 与删改扫描〕。事实：T(p) 只在 TXT[p] 有值时返回内容，而 TXT 仅由 REQ 数组填充；按表内字面 args 实读该脚本，REQ.length = 36 且 crctl.mjs 不在 REQ（output-guard/ 全部、metrics/ 6 个、summary-projectors.mjs、两个新测试文件都在），因此该块恒被跳过；本轮按表内字面命令实跑 cmd-04：exit 1、audit-delivery failures = 57，57 条失败中无一条来自该块，而 tools@82e43dc5 的 crctl.mjs 实测 --detail 出现 0 次、无 summary-projectors 与 ACTIVE_PROJECTION——若该块生效必产出 3 条 FAIL（parseArgs 缺 --detail 1 条 + 两个 token 2 条，计数两条因基线本来就是 45/247 会通过），实际为 0，机械证明它从未执行。影响：AC-1/AC-11 的三条判据（改动只落三处落点、ok(/fail( 计数不变量、--detail 在 parseArgs 内）在证据命令集中零观测面——cmd-05 只做 --unified=0 的删改扫描与 +/- 行数上界，不计数 ok( 与 fail(；§7 AC-11 把 fail( 计数 247 记在 cmd-05 名下属误标。于是即便 --detail 落在 parseArgs 之外、或 ok() 调用点被改动，九条命令仍可全绿。修复方向：把 'skills/shared/crctl/scripts/crctl.mjs' 加进 cmd-04 的 REQ（或把该块的 guard 由 T(...) 改成 exists(...) 加 read(...)），使计数与 token 断言真正执行；同时把 §7 AC-11 行改写为 cmd-04 承担 ok(/fail( 计数、cmd-05 承担删改扫描与行数上界。"
  - "本轮新增：AC-10 的两项判据在证据命令集中没有观测面——cmd-08 只校验 evidence/ac10-selection.json 的内部自洽与基线绑定，从不读取活的注册表；cmd-05 对 golden 目录只有白名单放行、没有存在性断言；唯一活体核对只以省略式与跨仓不可执行路径的形式留在 TASK 卡里。位置：plan.md §7 AC-10 行的〔cmd-08（最小集合算术与绑定）〕与〔cmd-05（golden 金样本随 CR 提交）〕、§6.1 FR-2 行同名引用；tasks/TASK-08.md §4 验收条件 6 的 node -e '...'（省略形态）、tasks/TASK-01.md §4 验收条件 3 的 node skills/shared/metrics/scripts/cr-cost.mjs verify-selection --baseline change-requests/CR-2026-069/evidence/fr8-baseline.json。事实：cmd-08（cwd = KB worktree）只读四份 evidence 文件，脚本内无 summary-projectors 或注册表引用（本轮逐字符实读其 args 确认），它比对的是 registryKeys（产物自报）≡ minimalSet ≡ 由 crctlCommands[] 重算的前缀集合，因此『活的 SUMMARY_PROJECTORS 键集 ≡ 基线最小集合』没有任何证据命令可观测；cmd-05 的 A_PREFIX 只把 skills/shared/crctl/scripts/test/golden/ 列入允许路径、全文对 golden 文件零存在性断言（golden 仅 1 次出现，且在 A_PREFIX 内），MIN 46 项中无 golden 项；TASK-01 §4 条件 3 在一条命令里同时用了 tools 仓的脚本相对路径与 KB 仓的 evidence 相对路径（两者不同仓，按任一 cwd 都不可执行），TASK-08 §4 条件 6 则是 node -e '...' 的省略形态。影响：AC-10 的『被投影命令集恰为基线选出的最小集合』属关键 AC，若注册表与 minimalSet 实际不一致，九条命令仍可全绿（产物自报自洽），review-code 期没有可复跑的机械核对入口。修复方向：在已用 crctl workspace inspect 解析出 KB worktree 路径的 cmd-05 内加一条活体比对（以 require() 或动态 import 读取 tools 仓 skills/shared/crctl/scripts/lib/summary-projectors.mjs 的 SUMMARY_PROJECTORS 键集，与 <KB>/change-requests/CR-2026-069/evidence/ac10-selection.json#minimalSet 双向全等，不等即非零退出），并把 golden 金样本的存在性写进 cmd-04 的 REQ 或 cmd-05 的 MIN；同时把 TASK-01 条件 3 与 TASK-08 条件 6 的命令写成可执行形态（KB 路径经 crctl workspace inspect 解析或写绝对路径，与 §6.1 表注⑤『证据命令表不含跨仓绝对路径』的口径一致）。"
  - "本轮新增：cmd-08 对 AC-14『逐 Runtime 四类行为』的校验在出现 ENVIRONMENT_MISMATCH 时被整文件豁免，观测面窄于 §6.1 FR-1 行与 §7 AC-14 行声称的面。位置：plan.md §6.2 cmd-08 的 for (const k of ['拒绝','裁剪','逃生','降级']) { if (seg.indexOf(k) < 0 && t.indexOf('ENVIRONMENT_MISMATCH') < 0) {…} }；§6.1 FR-1 行的〔cmd-08（冒烟与启用顺序证据）〕、§7 AC-14 行的〔cmd-08（ac14-smoke.md 逐 Runtime 四类行为）〕。事实：判据的第二项取的是整份文件的 t 而不是该 Runtime 段 seg，因此只要 ac14-smoke.md 任意位置出现一次 ENVIRONMENT_MISMATCH，五个 Runtime 的四类行为关键词要求全部失效（只剩每个 Runtime 一行 runtime=<rt> 读数的要求）；而 TASK-10 §4 条件 1 的口径是『前提缺失者以 ENVIRONMENT_MISMATCH 加所需建立动作显式登记』（按 Runtime），该豁免因此比卡片口径宽。影响：AC-14 是 AC-20 启用前置链的第一手证据，在部分 Runtime 环境缺失时，其余已启用 Runtime 的冒烟记录可缺四类观测而仍判 pass，属假绿通道。修复方向：把豁免收窄到该 Runtime 自己的段（seg.indexOf('ENVIRONMENT_MISMATCH') < 0），或在全局中止时要求五段各自带 ENVIRONMENT_MISMATCH 标记；两种写法都不改变 §5.0 的 ENVIRONMENT_MISMATCH 出口语义。"

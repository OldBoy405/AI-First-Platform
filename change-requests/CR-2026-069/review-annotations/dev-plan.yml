  - "本轮新增：plan §5.1 检查项 9 与 §7 的 AC-20 行把「reviewLoop 6 个 maxAttempts=3 + active skills 56」列为 cmd-03 的判据，但 cmd-03 只对 maxAttempts 做断言，reviewLoops 与 active skills 两个数只 console.log 打印、无 FAIL 分支。位置：plan §6.2 cmd-03 行的 console.log('pipeline templates checked = ' + pf.length + ' reviewLoops = ' + reviewLoops + ' active skills = ' + active.size) 及其上方断言块。事实（本轮实跑）：cmd-03 exit 0 且打印 reviewLoops = 6 / active skills = 56，与申报值一致；两个值本身由别的硬判据兜住（skills/_index.yml 在 cmd-05 的 zero_diff 面、pipeline-templates/_index.yml 同、各模板节点数逐表断言），故属读数而非硬判据。影响：不影响本轮验收可达性；仅在有人改模板时把「机器核对」退化为人工读日志。建议：各加一行断言（reviewLoops !== 6 与 active.size !== 56 时 bad.push），或把这两项从「判据」表述改为「日志读数」。"

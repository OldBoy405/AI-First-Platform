  - "本轮新增：cmd-09 的「输出出现安装/写动作语义即红」扫描与 tasks/TASK-02.md §3.7 的「只报告缺失/损坏与修复命令」存在潜在互斥（降级态的假红通道；当前实现不触发，故不影响本轮验收可达性）。位置：plan §6.2 cmd-09 行的 for (const l of lines) { … any2(['install', 'writing', 'created', 'fixed'].map((x) => low.indexOf(x) >= 0)) … } 与 §4.1 R-9 末句「输出出现安装语义即红」，对照 TASK-02 §3.7 与 §6 的 OUTPUT_GUARD_UNAVAILABLE 行。事实：该扫描对 stdout 每一行做 case-insensitive 子串命中，而「修复命令」的自然写法会带上脚本路径 output-guard/scripts/check-install.mjs（含 ASCII 子串 install）⇒ 一个符合 SDD/TASK 契约、在缺失或损坏时打印修复命令的实现，会在恰恰需要报告的那个降级态被判红（条件性假红，不是「任何实现必然红」）。本轮实跑证据：当前 check-install 的 stdout 只有 5 行 canonical 行，repair 行写法为「repair: output-guard/adapters/<rt> 缺 … 按该目录 README 的模板把 hook 条目并入该 Runtime 的原生配置」，不含四个禁用子串，故 cmd-09 exit 0。影响：契约未规定 repair 行措辞，实现唯一性不受影响；但 M4 之后若改写该行文案（例如写成脚本全路径），会再次出现「判据与契约冲突」类事故。修复方向（一处改动，二选一）：① 把语义扫描收窄为「非 repair: 前缀且非 canonical 行」的行；② 在 TASK-02 §3.7 与 plan §5.1 检查项 7 写明 repair 行的措辞约束（四个子串不得出现；需引脚本时用 README 相对路径表述），使两侧口径一致。"

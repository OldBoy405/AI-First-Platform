blockers:
  - "本轮新增：cmd-05 的证据命令表行不符合本表自己的单元格纪律（args 列不是字面 JSON token 数组），该行无法按 cell 逐字转录、cmd-05 在 M4 不可按表执行——而这正是本轮为 AC-10 补的活体核对所在行。位置：plan.md §6.2 证据命令表 cmd-05 行（唯一越界点 = 本轮新增的活体核对段内 if (ms === null || ms.length < 1)）与 §6.2.1 转录纪律（同段明文：args 列是字面 JSON token 数组、表内 cell 即字面值、无反竖线——竖线会破坏 Markdown 表格，需用时以 String.fromCharCode(124) 构造）。事实（本轮机械复核，可复跑）：按 Markdown 单元格语义切分，9 行证据命令里 8 行恰 7 个竖线（6 列），cmd-05 行 9 个竖线（8 列），多出的两个竖线即该 || 的两半；于是 args cell 在竖线处被截成两半（前半至 …if (ms === null，后半自 ms.length < 1) {…），对该 cell 做 JSON.parse 失败，其余 8 行全部成功。对照本轮对 6 条 -e 脚本的逐字符扫描：cmd-03/04/07/08/09 的反引号 / 反斜杠 / 裸双引号 / 竖线 / 换行违规数均为 0，只有 cmd-05 报 PIPE。同 6 条命令本轮已按括号配对取字面 args 复跑，与作者申报逐条一致（cmd-03=0 / cmd-04=61 / cmd-05=58 / cmd-07=8 / cmd-08=4 / cmd-09=1），故缺陷只在「表行形态」而不在命令语义（该 || 换成无竖线等价写法后语义不变）。影响：write-test-report Step 3 的唯一输入就是这两张稳定表（args 列逐字转录进 .crctl/tmp/test-plan.json#commands[].args，无第二生成步骤），cell 被截断后 cmd-05 要么以残脚本执行（node -e 语法错误 ⇒ 该行全红，连带 AC-10 活体核对、crctl.mjs 的 --unified=0 删改扫描与三仓 zero_diff 面一起失去观测面），要么由执行者在实现期手工补齐命令算法——后者正是 §6.2.1 明文禁止的「在实现期改写或补写命令算法」。属当前验收可达性受阻，且落在本轮刚修好的 AC-10 观测面上。修复方向（一处改动，二选一，均不改判据与失败数）：① 拆成两支：if (ms === null) { bad.push(...) } else if (ms.length < 1) { bad.push(同一句) }；② 用同脚本已定义的 any2 收敛（与 cmd-04/cmd-08 同族写法）：if (any2([ms === null, ms.length < 1])) { bad.push(...) }。修好后按 §6.2 表内字面命令复跑并把 §6.3 cmd-05 行的失败数按实测改写（本次为 58；若形态改动使失败构成变化须逐项重写），同时确认该行的竖线数回到 7。"

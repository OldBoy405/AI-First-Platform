  接口契约: "block - writeback 空值错误码与规范化值传递未闭合"
  多仓架构约束: "pass - 目标仓与资源 worktree 方向正确；仅 tools 实施，已核实依赖基线 SHA"
  性能与安全: "block - NFR-4 与 version-set 全量派生产物扫描矛盾，且禁止状态可能先恢复 ledger"
  可测试性: "block - AC-14/AC-16 的关键负向向量无法按当前算法稳定得到规定结果"

blockers:
  - "部分解决：B-SDD-005 [FR-15/AC-15] §4.4 已将 recoverLedgerCommand 放到禁止状态检查之后，merging 等状态不会先恢复；但它仍在 tracked-clean 与派生产物漂移检查之后。durable ledger 的 beginLedgerTransaction 会先把多文件 write-set 落盘，若在提交前中断，重试时这些文件必然表现为 tracked dirty 或部分投影漂移，步骤 4/5 会先返回 VERSION_SET_WORKTREE_DIRTY/VERSION_SET_DERIVED_DRIFT，永远到不了 recover，无法满足 AC-15 的重试与无半成品闭环。设计必须在已核验允许状态后定义可恢复的 version ledger 优先路径（并区分本事务残留与外部 dirty），同时保持禁止状态零恢复。"
dimensions:
  PRD↔SDD 对齐: "block - FR-15/AC-15 的 durable ledger 重试路径在修订后的前置顺序下不可达"
  架构合理性: "block - version-set 的恢复时序与其复用的 ledger write-set 语义冲突；崩溃后残留无法先被恢复"
  数据模型完整性: "pass - 版本值域、批准范围、机器区 skipped 与 version-set 写入集均有明确建模"
  接口契约: "pass - B-SDD-002/003 已明确规范化值回灌以及缺 flag 与显式空串的错误码区分"
  多仓架构约束: "pass - 目标仓、依赖方向与 requirement worktree 路径约束已明确，未发现新的跨仓缺口"
  性能与安全: "block - B-SDD-005 残留导致可恢复 ledger 不能重试收敛，且失败路径与零写契约不闭合"
  可测试性: "block - AC-15 的中断后重试向量按当前顺序会在 recover 前失败，无法验证无半成品"
  Prompt 采纳影响: "pass - §8 已列出 dispatch 变化对应的 Skill 同步清单"
suggestions:
  - "已解决：B-SDD-001 [FR-14/AC-14] 已改为经 crWorktreePath + readCrMdTargetVersion 读取 requirement worktree 的 cr.md，不再在版本守卫内调用 resolveOperationalWorkspace；归属节点：review-tech-design。"
  - "已解决：B-SDD-002 [FR-12/FR-14/AC-14] 已明确用 guard.value 回灌 input，再由 canonicalWritebackBusinessInput、manifest 校验和 generator --version 消费规范化值；归属节点：review-tech-design。"
  - "已解决：B-SDD-003 [FR-14/AC-14.3] 已明确按 flag 存在性区分缺 target-version（BAD_ARGS）与显式空串（WRITEBACK_VERSION_INVALID），并列入回归向量；归属节点：review-tech-design。"
  - "已解决：B-SDD-004 [FR-16/AC-16] 已将匹配域限定为 stdout/stderr 两段，并规定 marker 缺失或重复时 TEST_LOG_MARKER_INVALID 硬失败；归属节点：review-tech-design。"
  - "已解决：B-SDD-006 [NFR-4/FR-15] 已承认 version-set 全链同步的实际复杂度为固定写入面上已存在文件数的 O(n)，并将常数时间口径限定为版本规范化守卫；归属节点：review-tech-design。建议实施时在代码注释或测试命名中保持该口径，避免把命令整体再次宣称为 O(1)。"

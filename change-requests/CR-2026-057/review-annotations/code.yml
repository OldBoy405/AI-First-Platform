blockers:
  - "本轮新增：B-CODE-001 [FR-15/AC-15] `skills/shared/crctl/scripts/crctl.mjs:2597` 的 `_backlog.yml` 条目替换未保留目标块与后继条目之间的换行：`matchEntryBlock().end` 指向下一条目的首字符，而 `block.text`/`lines.join('\n')` 不含块尾换行，当前拼接会把目标块最后一行与下一条 `- id:` 连在一起，导致对非末尾 CR 执行 `version-set` 时破坏 backlog YAML。现有 `version-set.test.mjs` 每个 fixture 只注册一个 CR，未覆盖该真实场景。请保留块边界换行，并增加“目标 CR 后仍有至少一个 backlog 条目”的集成回归，断言两条投影均可解析且后继条目字节/字段不被破坏；repair-target=implement-code。"
  - "本轮新增：B-CODE-002 [测试证据可重放性] `change-requests/CR-2026-057/test-report.md:79,81` 出现两条 `<!-- crctl:analysis-below -->`，违反机器区/分析区唯一 marker 契约；同实现的 `parseAnalysisMarker` 明确要求恰好 1 条，因此后续 reviewLoop 重新生成测试证据会直接 `TEST_MARKER_INVALID`，当前回修路径不可执行。请收敛为唯一 marker，并通过 `write-test-report`/`crctl test` 合法路径重新生成可重放证据，保持六条命令与 plan §5.3 冻结口径不变；repair-target=implement-code。"

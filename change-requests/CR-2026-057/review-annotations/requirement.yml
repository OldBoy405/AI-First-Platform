suggestions:
  - "S-001 [归属节点: write-test-report + review-code] 建议明确关键 AC 唯一证据命令与 cmd-NN 的稳定关联方式，以及识别 skip 的证据来源；当前机器区只按 exit code 给 status，明确关联可减少不同测试框架输出导致的 reviewer 裁量差异。"
  - "S-002 [归属节点: review-requirement/review-tech-design/review-dev-plan/review-code] 建议在 FR-3 直接给出禁止字段替代句式的固定前缀示例（已解决/部分解决/未解决/本轮新增/范围外），避免四个 Skill 各自发明不可机械比较的文本。"

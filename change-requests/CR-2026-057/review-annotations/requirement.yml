verdict: block
blockers:
  - "B-001 [P0-2/批准范围回退] prd.md:149-151 要求 review-code 发现 scope_out/follow_up/zero_diff 冲突时沿‘现有双轨’把 repair-target 指向 write-tech-design 或 write-dev-plan，但当前双轨只存在于 review-dev-plan；review-code 的 schema、状态转换与 code-implementation reviewLoop 均固定为 developing -> implement-code，且本 CR 又排除新增状态/转换。该要求无法按现有状态机实现。修复：明确 code 阶段各类范围冲突的可执行路由；若仅实际 diff 越界则回 implement-code，若允许上游设计回修则补齐与既有状态机兼容的状态转换、review-record repair-target 枚举、Pipeline replay/重新审批路径及对应 AC。"
  - "B-002 [P1-1/版本更正闭环] prd.md:49、208-228 同时要求 PRD/SDD/PLAN/TASK 永远继承 cr.md 的同一版本，又允许在 writeback 前仅通过 crctl 同步改 cr.md 与 backlog；当 unassigned 在已有 PRD（本 CR 即如此）或更晚阶段被更正时，既有产物仍为 unassigned，立即违反 FR-13，并可能让 writeback 用真实版本发布仍含旧版本的正文。修复：规定更正允许的状态/时机、对既有派生产物的原子同步或重生成策略、失败/重试语义，并让 AC-15 验证 cr.md、backlog、PRD/SDD/PLAN/TASK 全链一致，而非只验证 cr.md。"
  - "B-003 [P1-1/crctl CLI 契约闭包] prd.md:198-228 尚未形成 FR-1 自己要求的 CLI 完整契约：‘真实版本号=非空且不是 tbd’会放行 n/a/pending 等文本，却又声明不得发明这些同义值；REGISTER/WRITEBACK 错误码仅为建议；人工更正的 command/flag 未确定；三条命令的 trim/大小写规则、允许状态与调用者约束、JSON/stdout 输出、幂等/重复调用及零写入观察点未闭合。AC-12/14/15 也未覆盖上述边界。修复：统一定义 version 值域与规范化规则，固定 register/writeback/correction 的命令、错误码、输出、状态副作用、幂等和负向验收向量。"
  - "B-004 [P0-4/流程 TASK 可完成性] prd.md:170-182 允许保留完成边界直到 merge 的‘发布准备’交付 TASK，但当前 crctl task done 只允许 developing；merge 发生在 code-approved 之后，因此此类 TASK 仍无法合法标 done，archive 的 deliveryIndexComplete 会再次形成循环。AC-10 只排除依赖 writeback/archive，漏掉该反例。修复：要么明确此类审计记录不得进入 tasks/TASK-*.md 与 _index.yml，要么把完成边界收敛到 developing 内可登记的事件；若选择扩展 task done 状态则必须纳入范围、守卫和回归 AC。"
  - "B-005 [P0-1/四类 review 验收覆盖] FR-1～FR-4 明确作用于 review-requirement、review-tech-design、review-dev-plan、review-code，但 AC-1 只验证 requirement，AC-3/AC-4 未明确四个节点均需验证旧 blocker 逐条状态、新 blocker 与范围外 suggestion。现状允许只改一个 Skill 仍满足文面 AC，不能证明附件 §9.5/§9.6 的跨 review 改造完成。修复：给四个 review 节点列出参数化验收矩阵，至少覆盖首次全量闭合、blocker/suggestion 分级、回修逐条状态和禁止 canonical 字段零命中。"
  - "B-006 [P1-1/writeback 零副作用观察点] FR-14 要求版本阻断时 canonical 零写入且 candidate/journal 不留下可被误用的半成品，但 AC-14 只比较 specs/delivery/traceability 目标文件哈希；残留 candidate、未完成 journal/transaction、错误 recoverCommand 仍可通过 AC。修复：为 baseline/tasks/traceability 三 stage 明确失败后允许与禁止的事务痕迹，并在 AC-14 同时断言 authority、candidate/journal/transaction phase 与后续同参重试行为。"

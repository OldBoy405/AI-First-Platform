verdict: block
blockers:
  - "TD-BL-1（PRD↔SDD 对齐）：PRD FR-10/AC-14 明确要求新增位于 ../tools/skills/shared/scripts/ 的一次性版本化迁移脚本，SDD §3.6/§5/§6 却改为扩展既有 crctl migrate-backlog 且不新增脚本。ARCHITECTURE.md §6 的事实核实支持 SDD 的架构判断，但这仍是对已审批功能需求的实质变更，不能仅靠 SDD 注脚覆盖。须先将 PRD FR-10/AC-14 修订为 crctl migrate-backlog 扩展并记录需求变更影响，或给出满足 PRD 且不违反账本单写者约束的方案。"
  - "TD-BL-2（接口路由语义）：SDD §3.5 将“block 且 repairTarget=write-tech-design”统一映射为 route=upstream，会把 review-tech-design 自身的正常 blocker 错分为上游轨；architecture-design.pipeline 的技术评审 block 应正常回放 write-tech-design。upstream 只应适用于 dev-plan 顶层 repair-target=write-tech-design 的显式上游设计疑点；其余 stage 的 block 均应 route=repair。须给出按 stage 判定的真值表，并明确 pass 时 repairTarget=null。"
  - "TD-BL-3（终态写入契约矛盾）：SDD §7.3 要求 archive-move“重复归档幂等”，但 §3.4 与 PRD FR-12/D-6 又规定写命令继续使用 active resolver、不得对 history 终态 fallback。首次 archive-move 后 CR 已移出 backlog，第二次调用必然 CR_STATUS_NOT_FOUND，无法满足幂等。须拍板重复调用是受控硬失败，还是为 archive-move 单独设计只读 history 检测；后者不得扩大为终态可写，并需补接口与测试期望。"
  - "TD-BL-4（approve 候选门禁缺少实现接口）：SDD §3.1 要求 approval.yml 与 cr.md 尚在内存时“按候选 approval 复核目标 gate”，但现有 runGateChecks/readEvidenceDoc 只从磁盘读取 approval.yml。设计未说明如何让 gate 消费候选文本，实施者只能先写文件、临时落盘或绕过 approval checker，都会破坏零写入/原子性目标。须明确纯函数 seam（例如 approval 文档 override/候选 evidence provider）及其签名、调用顺序和回归测试。"
  - "TD-BL-5（Prompt 采纳路径错误）：SDD §8 写 `skills/architecture/review-tech-design/SKILL.md`，实测真实路径为 `skills/develop/review-tech-design/SKILL.md`。错误路径会导致实际 Skill 保留过时的 traceability 二次读取步骤，AC-18 无法闭环。"

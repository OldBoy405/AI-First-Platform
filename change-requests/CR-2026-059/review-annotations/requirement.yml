verdict: block
blockers:
  - "本轮新增： [B-COORD-2] FR-7/FR-26/AC-30/AC-31 要求 Coordinator Agent 被删除后 shared session 仍可读、GET 仍返回 settings 中的原 UUID，且 session.agent_id 投影为 NULL；但同步后的基线 033_chat.up.sql:7 仍是 agent_id UUID NOT NULL REFERENCES agent(id) ON DELETE CASCADE。当前 FR-21 只要求允许 agent_id 可空且不新增 FK，没有规定移除或改变该既有 CASCADE；若按现有约束实施，删除 Agent 会先级联删除 chat_session 及其 chat_message，AC-31 的回放与历史保留不可能成立，造成数据完整性/验收不可达阻断。修复方向：在 FR-21/FR-26 中明确 481+ 迁移的既有 FK 生命周期方案（推荐将 agent_id 改为可空并把现有 FK 改为 ON DELETE SET NULL，或删除该 CASCADE FK 并明确应用层 workspace/Agent 校验），同时明确 hard-delete 后保留 session/message、设置 UUID 保留、投影置 NULL 的事务与回放验收；补充对应 migration/down 与 AC。"
dimensions:
  结构完整性: "通过：frontmatter、概述、用户故事、FR、NFR、AC、成功指标与范围排除齐全。"
  FR可测试性: "阻断：Coordinator hard-delete 生命周期与现有 chat_session ON DELETE CASCADE 冲突，AC-31 当前不可达；其余 FR/AC 具备可执行条件。"
  范围合理性: "通过：需求仍限定于 CR-B shared Discussion、单 Coordinator、附件、历史只读与 Private Ask 隔离，未扩入已排除的升级、多参与者或 Team Agent 内核。"
  与规划对齐: "通过：覆盖来源 CR-B 的 shared session、无 Issue、单 Coordinator、附件、只读历史与 Private Ask 隔离；新增阻断来自同步后基线事实。"
  依赖识别: "通过：已明确依赖 CR-2026-056 配置解析、任务快照与附件契约，以及 CR-2026-012 转投/merge-forward 兼容边界。"
  HTTP_API契约闭包: "通过：Discussion 主 endpoint 与 merge-forward 的 endpoint、request、response、精确状态/error-code、权限、幂等、状态副作用及 AC-23～AC-29 观察点均已闭合。"
  crctl_CLI契约闭包: "N/A：本 CR 不新增或修改 crctl/CLI。"

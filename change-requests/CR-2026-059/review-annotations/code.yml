suggestions:
  - "范围外：归属节点 review-code（后续 CR）。shared 会话的 pin/archive/title 变更事件仍以 kind=\"private\" 发布（chat.go 三个 owner/admin 端点 hardcode），事件只送达操作者本人、不广播 workspace。FR-20 的强制广播集合仅含新消息与协办 task 事件，本行为属 fail-closed 收窄方向、无泄漏面；如需其他成员即时感知归档/置顶，可留后续 CR 补 kind 感知。"
  - "范围外：归属节点 review-code（后续 CR）。merge-forward message_ids 幂等指纹在服务端先按 created_at 排序再计算（生产侧同一消息集合的不同客户端顺序收敛为同一指纹 → 重放而非 409），与 PRD「去重后顺序保留」的字面描述存在方向性偏差（实现更宽容）；且 sort.Slice 非稳定，理论上同 created_at 并列消息的重放指纹可能不稳定（普通发送路径每事务仅写一条 user 消息，实际概率极低）。不影响 AC-27 重放语义与当前验收可达性。"
  - "范围外：归属节点 review-code（后续 CR）。message_ids 的 50 条上限在去重前校验（60 条含 20 重复 → 400），与 PRD「去重后仍须 ≤50」的字面读法偏严；但与 legacy comment_ids 臂的既有形状完全一致（PRD 要求「与现有 comment 去重一致」），无回归风险。"

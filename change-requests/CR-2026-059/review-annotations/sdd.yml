blockers:
  - "本轮新增：[B-MIG-3] 位置：sdd.md §2.2 M482、§2.4 M485、§2.5 M486、§4.9、§6.2 AC-19。事实：§1.2 宣称 481–490 十个迁移各有 down，且 AC-19 要求 up/down 往返；但正文没有定义 482.down（kind 列）、485.down（project_shared 唯一索引）、486.down（作者列）的 SQL、部分状态/数据依赖或回滚顺序，§4.9 的 down 登记清单也只列 484.down。影响：实现者无法按当前 SDD 生成完整回滚集，AC-19 的 down 往返不可验收，且 485 的 CONCURRENTLY 索引删除与 482/486 的数据损失边界不唯一。修复方向：补齐 482.down、485.down、486.down 的单语句/顺序与部分状态处理；明确 485.down 的 DROP INDEX CONCURRENTLY 无构建钩子、482/486 的数据依赖与失败语义，并同步 §4.9、§6.2 的回滚与测试向量。"
  - "本轮新增：[B-AUTH-2] 位置：sdd.md §3.2、§3.4、§4.2、§4.8、§7.1、AC-28/AC-29。事实：shared session 的成员资格目前只写成事务外的 pre-tx 门禁；§4.2 进入事务后仅锁 session，没有在任何写入前重新读取/锁定 member 行。现有 revokeAndRemoveMember 通过另一把 LockSubscriberWrites 锁删除 member，设计没有说明二者的锁序或共享同步点。因此请求可在 pre-tx 通过后与移出并发，并在 member 删除提交后继续提交 chat_message、task 或附件绑定。影响：违反 FR-25 的请求时成员授权以及移出后的 FR-10/FR-11/FR-15/AC-28/AC-29，造成已移出成员仍能写入 shared 会话。修复方向：在 shared POST/PATCH 及其 task/附件写路径中，于事务内、首次写入前执行带行锁的成员资格复核，或与 revoke 使用同一同步锁并明确无死锁锁序；补充移出先提交/发送先锁竞态测试，确保失败事务不留下幂等、消息、task 或附件写入。"

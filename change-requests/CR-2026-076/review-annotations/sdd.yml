blockers:
  - "本轮新增：`dep-26` 的「依赖结论」把当前状态机规模登记为「转移 28 条声明、wildcard 展开 50 条」，与本 run 受控只读取证结果不符；`SDD-CLOSE-07`／§3.3 又据该数推出「实现后声明数应为 29 条」，三处数字整体偏离实测值。取证：以 `dep-26` 自身登记的 commit SHA `0f5690f845dcf1e0dd9fdc37797b7e4294335266`（经 `crctl git rev-parse HEAD --cwd <tools worktree>` 复核等于 tools worktree HEAD）读取 `dir-graph.yaml#change-request-track.state_machine`——`transitions` 实为 31 条，其中 `from: any-active` 2 条，`wildcards.any-active` 12 个目标，展开后 31 − 2 + 12×2 = 53 条；同仓 `skills/shared/crctl/scripts/test/gate-registry.json#stateMachine` 独立登记同名三项（`transitions` 31、`namedStates` 15、`wildcards.any-active` 12），且 `skills/shared/crctl/scripts/test/crctl.test.mjs` 已用「推导 ≡ 登记」断言把该规模固定为仓库不变量，即本 CR 要改的这份文件在 tools 包内有机器可验的规模事实。根因：SDD 转抄了 `ARCHITECTURE.md:62`／`:112`（硬不变量 5）与 workspace `AGENTS.md` 的旧口径「28 条声明／展开 50 条」，该口径成形于 CR-2026-031（`d4fff14` 为 28），其后 AIFI-17（`49c46dd` → 29）与 CR-2026-061 两次状态机修订（`bef1f4d` → 30、`2e4442d` → 31）各新增一条合法转换而未同步文档；而 workspace `AGENTS.md` 工程纪律 2／4 明确「正式断言以 `../tools/dir-graph.yaml#change-request-track.state_machine` 当前内容为准」，不得把文档旧数字写成「当前」事实。后果：依赖清单五要素中的「依赖结论」与取证不符（与上一轮 B2 同一缺陷形态），`SDD-CLOSE-07` 的「实现后声明数应为 29 条」在本 CR 新增 1 条转移后应为 32 条，§3.3「转移统计口径按 `dep-26` 并在实现期据实更新」把实现期回填锚在一个错误的数上——本维度合同要求「事实缺失或行为不符形成业务 blocker」。修复：① 把 `dep-26` 的依赖结论改为实测值（31 条声明／展开 53 条，附取证命令与文件内位置）；② `SDD-CLOSE-07` 的现状与实现后数字随之改为 31／53 与 32（wildcard 展开数可按实现期实际内容据实更新）；③ 显式登记「文档口径滞后」这一事实并给出处置（把 `ARCHITECTURE.md` 硬不变量 5 的口径同步纳入 §1.5／`scope_in`，或写入 §9 `follow_up`／`scope_out` 并说明本 CR 不改它的理由，二者择一），不得两处都不写而让 §3.3／`SDD-CLOSE-07` 的数值与硬不变量 5 继续并存。"

suggestions:
  - "已解决：B-02 [major] TASK-08／FR-07／AC-16：来源指令身份改取平台既有事实。daemon 侧 injectTaskCRWorkspaceEnv 随绑定发布 CRCTL_TRIGGER_COMMENT_ID（取自 task.TriggerCommentID；on-assign 运行不发布占位值、未绑定任务照旧清除该键），crctl 侧 assertAuthenticatedContinue 要求其为 UUID 形状并把它作为继续指令身份，dedup_key 由 cr｜loop｜triggerCommentId 构成。由此改 --continue-reason 说明文本换不到新的授权格，新评论即使复述同一段说明也是新指令。正反例已落 cmd-04——缺或非 UUID 形状 → NOT_TTY 且零写入零授权审计；来源 X 授权 cycle 1 到 2；同来源仅改说明 → TX_INPUT_CONFLICT、零提交、cycle 未推进；新来源复述同说明 → 授权 cycle 2 到 3；同来源重投 → 幂等不增 cycle；授权审计的 dedup_key 逐条按评论 ID 断言（不再把评论 ID 拼进自由文本）。未新增第二账本、未重置本 CR 次数。"
  - "已解决：B-06 [major] TASK-06／FR-05／AC-10：合法 TASK 集合增删已在 gate／approve／merge 三处同判。逐文件重核阶段被删除的 TASK 不再先返回 missing，改由集合判定分流；集合判定要求差异全部落在 tasks/TASK-NN.md 且每个新增 TASK 均已在 tasks/_index.yml 登记（索引缺失或形状非法即不降级），合法即降级为 warning，缺必需件、非法索引与 server-approve 严格路径仍硬阻断；KB 源绑定的允许面同时纳入当前受控集合，不再只收旧快照集合，因此同一合法增量不再出现「gate 为 warning、approve 或 merge 又 post-review-path-drift」。cmd-04 覆盖新增已登记（含 TTY approve 面承载同一 warning 且不阻断）、删除旧 TASK、删 prd.md 仍硬阻断、未登记 TASK 硬阻断且拒绝路径零写入；cmd-07 覆盖 merge 面同款三条（合法增与删继续合入、未登记不得合入且零远端副作用）。"
  - "已解决：B-08 [major] TASK-04／FR-03／AC-07：重投识别不再只看对象与 payload 五字段，改核原操作范围。新增 recordedOperationScope 逐项核对 loop 范围（traceability 该 stage 的 review-loop 投影与 review-loop.yml 当前 cycle／attempt 相等）与 bump 意图（annotationCommitWroteLoop 取原操作 write-set 的既有 Git 事实——写出该 annotation 的那次提交是否同时写了 review-loop.yml），任一不可判定即落回正常新记录路径，不静默当原操作成功；--bump-attempt 的期望值按 dev-plan upstream 轨自身 repair-target 判定，不依赖本次 payload 是否在场。原「以秒级 reviewed-at 与 entry.at 相等推断 bump」的时间推断已删除。cmd-04 三条反例：无 bump 成功后带 --bump-attempt → 真实新增 attempt 并产生新提交、不被吞成 idempotent；人类继续进新 cycle 后同 payload → 按新 cycle 落盘而非返回旧 attempt；同秒 non-bump 刷新后带 --bump-attempt → 真实新增 attempt，其后的真重投仍幂等。未要求作者为消费 attempt 改写 verdict／dimensions。"
  - "已解决：B-10 [major] 测试证据可信度／TASK-02／04／05／06／08／09／10：本轮机器区逐命令 source-revision 与当前已提交主体全等——multica 三条均为 d0b8fef9da5364719d4a8c04bb89175c6c291b9f（等于当前 multica HEAD），tools 九条均为 2c5585eab86102828ca8abe7eac3e2b3645d2e6a（等于当前 tools HEAD），本轮新增的三条回修回归用例正是在该源上实跑通过（cmd-04 与 cmd-07 日志逐条可见）；docs 两条记录的 48ae3f92 是当前 KB HEAD ec3514f2 的祖先，其间两个提交只改本 CR 记账路径（review-loop／traceability／test-report／test-evidence／_backlog），不涉被评审源码，符合 KB 的祖先语义。原「报告源与当前已提交内容不同」的事实已不存在；未改填历史 source，未由本次评审重跑测试。"
  - "范围外：受控 Git stdout 20000 字符输出合同的系统性修复继续按人类裁定暂缓；本轮用既有出口直接落盘，不扩白名单、不改截断、不把输出限制登记为业务 BLOCK，合并后承接既有 AIFI-60 范围。"

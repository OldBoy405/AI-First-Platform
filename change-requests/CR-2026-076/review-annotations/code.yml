blockers:
  - "部分解决：B-02 [major] TASK-08／FR-07／AC-16：提交后崩溃恢复已补 intent／authorized 审计，但 crctl.mjs:2305-2306 的 continueKey 仍只取 cr、loop 与调用方自由文本 continueReason 的 hash，不绑定平台已有的 TriggerCommentID／原来源指令。静态可达反例：同一已认证触发 run 在下一次耗尽时仅换 --continue-reason 即得新 key，原评论又可开 cycle；反向地，新人类评论若仍只说同一段继续文本则与旧 key 冲突。现有测试把 comment ID 人工拼进自由文本，不能证明来源指令身份。必须消费既有平台来源事实固定原指令，补同来源改说明不再授权及新来源同说明可授权的正反例，不建第二账本、不重置本 CR 次数。"
  - "部分解决：B-06 [major] TASK-06／FR-05／AC-10：合法本地正文漂移与严格 server-approve 分流已接通，但 workspace-transactions.mjs:1629-1633 对新增 TASK 给 warning 后，:1664 只把 snapshot.artifacts.files 加入 KB 允许面；合法新增且已登记的新 TASK 不在旧 snapshot 集合，随后 :1667-1669 仍返回 post-review-path-drift。因此同一合法 TASK 集合增量在 gate 为 warning，在 approve／merge 又硬阻断。删除旧 TASK 也在 :1615-1620 先返回 missing，未进入 TASK 集合分流。需区分仍必需产物与合法 TASK 集合变化，并贯通当前集合与 KB 源核验；保持缺必需件、非法索引及 server-approve 严格拒绝，补新增／删除各消费者反例。"
  - "部分解决：B-08 [major] TASK-04／FR-03／AC-07：正常成功后原 payload 的重投已幂等，但 crctl.mjs:2802-2810 的 payloadMatchesAnnotation 不核对 bump 意图，:2827-2837 的早退也不核对当前 loop／cycle／attempt 与原操作。相同对象／五字段不代表相同操作：先无 bump 成功、再带 --bump-attempt，或经合法人类继续进入新 cycle 后提交相同评审结论，均可被旧 annotation 吞成 idempotent 并返回旧 attempt。原事务意图被替换不应静默当原操作成功。需复用既有 Git／事务意图事实核对 bump 及 loop 范围，补不同 bump 与新 cycle 同 payload 的反例；不要求作者为消费 attempt 人工改写 verdict／dimensions。"
  - "本轮新增：B-10 [major] 测试证据可信度／TASK-02／04／05／06／08／09／10：test-report.md 的机器区虽为 crctl-test/pass，15/15 exit-code=0、started=true、skipped=false、timed-out=false，plan／traceability command-digest 也全等，但 cmd-01～03 的 source-revision=e5f0fc089ee93517482f57f4b6332ff70dd25218，与当前 multica HEAD=1d91d21004163e61298f5f1277677ac6f887a456 的内容不同（5 个 changed-files，含 daemon.go、pipeline_task.go）；tools 命令的 source-revision=a95941eef8d71dcfed62b2d330de1c2ef17a543a，与当前 tools HEAD=3c1ccfc2b80232ef83f6c5f515009899d191918a 的内容不同（7 个 changed-files，含 crctl.mjs、durable-tx.mjs、workspace-transactions.mjs）。已由安装态受控 Git 取得源到当前 HEAD 的完整差异，不是等价空提交；本轮回修未有可归因当前已提交主体的测试源证据。按 review-code 固定源码漂移合同 BLOCK；由作者按既有测试入口在正确已提交源上重建证据，禁止改填历史 source 或 reviewer 重跑测试。"

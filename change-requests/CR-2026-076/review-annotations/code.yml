  - "已解决：B-01：非 TTY 自由文本不再单独授权；assertAuthenticatedContinue 核对平台 task 绑定、人类触发类型与责任角色 owner，daemon 在可信绑定发布缝注入并清除残留触发事实。原来源／权限缺口关闭；来源指令身份与重复消费残留归入本轮 B-02，不重复计数。"

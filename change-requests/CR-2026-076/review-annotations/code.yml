  - "已解决：B-04：originalGlobalGitConfigPaths 与 renderTaskGitConfig 保留 XDG／HOME 的全部原配置并依 Git 顺序 include；两文件并存、拆分身份及覆盖优先级有定向断言，原选首文件导致身份链丢失缺口关闭。"
  - "已解决：B-05：legalLocalApprovalTrust 共用 CR／阶段责任角色事实，核对 owner 归属并排除 signature／key-id／grant-approved-at 残留，gate 与 lib 消费者复用该缝，原任意 UUID 即合法信任的缺口关闭。"
  - "已解决：B-07：code stage 的 subjectMatchesAnnotation 在恢复成功回执之前严格重核原 release-subjects 的代码源与受控 artifacts；对象漂移返回 TX_RECOVERY_CONFLICT，原 code 恢复恒跳过对象核验的缺口关闭。"
  - "已解决：B-09：developing 的 code BLOCK 分支已补耗尽优先与 nextCodeBlockRoute，代码 tree 已变且 healthy 后建议独立复评；未变／不可判仍回修，真实测试失败保留原路径。候选修正只作为被评审代码，不用于本轮正式路由授权。"
  - "范围外：受控 Git stdout 20000 字符输出合同的系统性修复继续按人类裁定暂缓；本轮用既有 E 直接落盘，不扩白名单、不改截断、不把输出限制登记为业务 BLOCK，合并后承接既有 AIFI-60 范围。"

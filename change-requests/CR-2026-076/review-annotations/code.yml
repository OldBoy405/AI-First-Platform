verdict: block
blockers:
  - "本轮新增：B-01 [critical] TASK-08／FR-07／AC-15：crctl.mjs:2219-2231 只把非空 --continue-reason 当作非 TTY 授权，不校验平台已认证的人类触发事实、来源 actor 或既有角色权限；传任意文字就能越过 NOT_TTY，随后被审计成 authenticated-continue。现有 crctl.test.mjs 的正例也只是传入自由文本，没有认证事实。必须先核实真实来源与权限，伪造或 Agent 自报来源须零写入拒绝，再执行既有 cycle 转换；补相应正反例，不新增权限系统。"
  - "本轮新增：B-02 [major] TASK-08／AC-16：crctl.mjs:2309-2323 在提交后 ledger-after-commit 故障点及 finishLedgerTransaction 之后才写继续指令的 dedup_key；恢复入口两次 recoverLedgerCommand 均丢弃 committed 回执。若提交后、审计前中断，新 cycle 已提交但授权消费事实缺失，同指令重投得到 LOOP_NOT_EXHAUSTED 而非恢复成功；该 cycle 再耗尽后，同旧指令还可再开 cycle。需让授权消费事实与原事务恢复闭合，并补提交后／审计前崩溃及后续再耗尽重投断言。"
  - "本轮新增：B-03 [major] TASK-09／TASK-10／AC-18／AC-19：workspace-transactions.mjs:1167-1184 的 G06 消费 test-report.commands[].source-revision，但 runTestPlan 的 sourceRevision 仅进入 resultMetadata，renderTestMachineReport:4484-4506 没有持久化该字段。本 CR 15 条真实 crctl-test 命令均无 source-revision，workspace inspect 已实测两代码仓 unknown:refA-not-recorded；即使测试成功且 tree 未变，review-start 也恒走 replay，重跑测试不能补齐。需贯通既有真实测试源事实与 G06，拒绝同仓矛盾源／无效报告，并用真实 testCr 产物验证接续路径，不再只手写带 source-revision 的报告夹具。"
  - "本轮新增：B-04 [major] TASK-02／FR-02／AC-04：pipeline_task.go:486-510 的 originalGlobalGitConfigPath 取第一个存在的 XDG／HOME/.config/git/config／HOME/.gitconfig，随后 GIT_CONFIG_GLOBAL overlay 只 include 这一个文件。Git 原本会依序读取 XDG 配置和 HOME/.gitconfig；两文件并存时后者的身份或覆盖配置被丢失，XDG 无身份会错误中止，XDG 有旧身份则可能用错作者。需保留原有效全局配置加载链及优先级，并在现有 Git environment 名集内补两文件并存的正反例；不得修改用户配置或用机器人身份兜底。"
  - "本轮新增：B-05 [major] TASK-06／FR-05／AC-12／AC-13：crctl.mjs:2502-2523 的 legalLocalTrust 只验证 via、时间、approver 的 UUID 形状与可选 target-status；不接收 workspace／CR，不能证明责任角色匹配，也不排除 section 残留 server-approve 签名事实。任意 UUID 或不属该责任角色的批准人可被作为合法本地信任并把漂移降为 warning，违反 SDD §4.5 的先判归属再降级。需共用既有 CR／阶段／责任归属事实校验，未知或非法来源维持硬失败，补角色不匹配与签名事实残留反例。"
  - "本轮新增：B-06 [major] TASK-06／TASK-09／AC-10／AC-13／AC-17：verifyReleaseSubjects:1528-1606 未消费批准来源／本地信任模式。合法本地 PRD／SDD／TASK 正文漂移仍被 artifact hash-drift 无条件拒绝，使 gate 的 warning 在 approve／merge 又变硬阻断；反向地，新增 HEAD 不同但 tree 相等放行也同时用于 approveAndAdvance 的 TTY 与 grant 路径，以及 merge 的 server-approve 路径，放宽了签名路径的源绑定。需把同一合法信任判据贯通消费者，分别证明本地允许的正文漂移只警告、server-approve 的摘要／源绑定仍严格拒绝，不修改签名算法或白名单。"
  - "本轮新增：B-07 [major] TASK-04／FR-03／AC-08：crctl.mjs:2635-2643 的恢复对象校验只看 subject-sha256，而 code annotation 只有机器注入的 release-subjects，故 code 恢复恒跳过对象校验。代码评审提交后中断，再替换代码仓源或受控 artifact，2679-2685 仍可 emitReviewRecordRecovered 成功确认旧 verdict。需在 code 恢复分支重核原 release-subjects 与实际对象，漂移零改写技术中止，补 code stage 的故障恢复反例；不能推迟到 approve-code 才发现。"
  - "本轮新增：B-08 [major] TASK-04／FR-03／AC-07：正常成功后 finishLedgerTransaction 删除 journal，review-record 又删除 payload；同操作成功重投没有可消费的完成意图，原命令返回 PAYLOAD_NOT_FOUND。若调用方按 Skill 补回相同 payload，recordedAt 被重新生成，changedRels 不为空，有 --bump-attempt 时再次提交并再增 attempt；所谓 changedRels=0 分支不能识别这种重投。需用既有事务／Git 完成事实识别原操作，返回幂等成功而非重新评审，补正常成功后原命令重投及同 payload 补回重投断言，不建第二账本。"
  - "本轮新增：B-09 [major] TASK-05／FR-04／AC-09：crctl.mjs:3867-3875 的 developing 分支对 code.yml=block 无条件建议 implement-code，既不检查 review-code 耗尽，也不消费回修后对象变化与作者已收尾事实。即使对象已变、已提交且新测试 pass，仍回实现；已耗尽也不给 humanApproval=true 的合法人类继续出口。新增优先级与对象变化路由只覆盖 dev-plan，未覆盖 SDD §4.4 明列的 review-code 接续。需补代码 BLOCK 的对应分流及未变／已变／耗尽正反例，保留真实测试失败回实现。"

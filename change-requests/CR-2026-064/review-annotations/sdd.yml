blockers:
  - "部分解决：TD-BL-1 位置：sdd.md §4.4-2/3/4、D-5、§6.3 AC-06、SDD-CLOSE-05。上一轮遗漏的 11 个活跃 MJS 与 16 个 TS 源码现已通过整树枚举进入扫描面；但设计仍把 skills/shared/crctl/scripts/test/fixtures/** 整个目录作为排除项。当前该目录除获准保留旧名的历史 traceability-191k.yml 外，还包含 digest-vectors/expected.json、review-annotations-code.yml、test-report.md 三个活跃 canonical digest 一致性测试向量，crctl.test.mjs:548-556 直接消费它们，crctl.mjs:87 也把该目录定义为固定共享向量；它们不是 PRD FR-11 允许排除的历史 CR、历史 traceability、归档 delivery、changelog/migration 文档或扫描器禁止名单。影响：现有 digest-vectors 或今后新增的活跃 fixture 可重新引入退役字段而 contract-scan 仍通过，活跃测试扫描范围仍有可扩张盲区，FR-11/AC-06 当前门禁不可达。修复方向：把目录级排除收窄为扫描器自身与确属历史 traceability 的 traceability-191k.yml 精确路径（或仅对获准历史内容做同等窄化处理），让 digest-vectors 及未来 fixture 默认进入扫描面；冻结精确排除并同步更新枚举规模、正反用例与断言。"

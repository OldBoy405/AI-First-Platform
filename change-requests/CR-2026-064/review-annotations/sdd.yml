  - "部分解决：TD-BL-1 位置：sdd.md §4.4-2、D-5、§6.3 AC-06 与 SDD-CLOSE-05。上一轮要求从索引或明确活跃根派生 Skill、Agent、源码与测试范围；本轮已补齐 56 个 active Skill、9 个 active Agent、8 个 Pipeline JSON 及 crctl 主源码和测试，但仍把活跃源码限定为 skills/shared/crctl/scripts/*.mjs + scripts/lib/*.mjs 共 7 个、活跃测试限定为该目录 scripts/test/** 共 21 个。事实：tools@dddd0ad63fb79bd7608314b4553f30e8ce7b7289 上 rg --files -g '*.mjs' 共 40 个，除这 7 个源码与 22 个 crctl 测试外还有 11 个活跃 MJS，包括 pipeline-templates/emit-registry.mjs、requirement-register 的 production/test、3 个 crctl adapter hook、4 个 writeback production 脚本及 writeback.test.mjs；它们均未进入派生面。影响：这些活跃源码或测试重新引入待退役字段时扫描仍会通过，FR-11/AC-06 的活跃源码与活跃测试门禁仍不完整，当前验收不可达。修复方向：将源码/测试集合从完整且可审计的活跃代码根派生，例如递归纳入 skills/**/*.mjs 与 pipeline-templates/*.mjs 后只保留已批准的精确排除，并更新规模断言及源码/测试代表性命中用例；不得把未列目录默认为非活跃。"

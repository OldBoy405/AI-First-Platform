blockers:
  - "本轮新增：AC-07 的验收命令与「CI 同一命令」这条可达性依据在合并后的 trunk 上已不成立，而该 AC 正是 approve-tech-design 绑定（approval.yml#tech-design，evidence-digest 824cf303…）并将在 plan/TASK/test-report 证据链中落地的验收口径。位置：sdd.md §6.3 AC-07（可观测结果 + 可达性说明）、§11 依赖项 16。事实（本节点在 resources[].worktreePath 的 tools worktree 上独立取证；HEAD 81d31b8b9d4c36cfef24cd076bf9fe635b67b2b6，clean）：① .github/workflows/crctl-ci.yml:109-111 的全量步骤已是 run: node skills/shared/crctl/scripts/test/suite-gate.mjs --run（步骤名 crctl full test suite），且 rg -n test-concurrency .github/workflows/ 零命中；② suite-gate 的登记面 skills/shared/crctl/scripts/test/gate-registry.json#manifest = 21 文件 / 578 用例 / exceptions: []，其判定含 per-file 顶层用例数不得低于 manifest.cases（SUITE_MANIFEST_CASE_DROP，suite-gate.mjs:452-453）与磁盘集合 ≡ manifest.files（SUITE_MANIFEST_FILE_DRIFT，suite-gate.mjs:437-447）；③ KB 仓 change-requests/CR-2026-065/test-evidence/concurrency/{default,conc2,conc1}-run{1,2}.json 实测：池=默认两次 converged=true / exit 0（783.4 s / 781.4 s），池=2 与池=1 四次均 converged=false / exit_code null（--max-runtime-ms 1200 s 到期），按 CR-2026-065 SDD TDEC-4 与 §7.4 P8，池大小与 node --test-concurrency=N 同为文件级并发语义。影响：AC-07 点名的命令既不在 CI 中执行，也没有在新基线上的收敛与全绿证据（同语义配置的实测是不收敛），可达性依据「CI 同一命令（crctl-ci.yml）」为假；按 SDD 字面执行等于把验收证据押在一条非 CI、且有不收敛观测的命令上，按 CI 现状执行则重复 review-dev-plan 判 BLOCK 的同一模式（plan 单方面替换 AC-07 证据口径而 SDD 层无记录）。修复方向（上游轨，由 write-tech-design 在 SDD 内闭合）：① §6.3 AC-07 的可观测结果改为当前 CI 入口 node skills/shared/crctl/scripts/test/suite-gate.mjs --run（manifest 21 文件全部被真实 spawn、failures 空、exceptions 空、退出码 0）＋ writeback 单测 node --test skills/writeback/scripts/test/*.test.mjs（与 crctl-ci.yml:115 逐字一致）；若坚持保留 --test-concurrency=2 字面命令，须附该命令在 tools@81d31b8 上的收敛与全绿实测证据并写明保留理由；② §11 依赖项 16 的 stable symbol 与依赖结论同步为合并后事实（CI 全量步骤 = suite-gate；Pipeline 索引动态枚举与 writeback 单测两步不变），并顺带把 §4.4-2 与 §11 的规模口径标注为合并后基线重跑值（本节点按同一枚举规则实测工作树 219 文件，SDD 写的 214 为 dddd0ad6 值；测试侧保持结构性断言、不写死数字），同时消除 §4.3 与 §4.4-1 把既有退役名单常量写成 RETIRED_LEGACY、而 §11-5 与实际代码为 RETIRED 的不一致；③ §4.5 与 §9 明确新门禁对测试迁移的硬约束：7 个迁移文件与 contract-scan.test.mjs 的 per-file 顶层用例数不得低于 manifest.cases，而该登记面的唯一写入口是人类编辑 + git commit、不在本 CR scope_in 内，故须写明迁移不减少任何文件用例数（或在 scope_in 显式纳入登记面更新与 owner 授权）；④ 记录事实变更：旧基线 5 条红已由 CR-2026-065 修复，AC-07 回到全绿口径，无需任何例外授权。"

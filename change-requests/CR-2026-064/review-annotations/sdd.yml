dimensions:
  批准范围: "pass：§9 的 scope_in / scope_out / zero_diff / follow_up 四字段齐全且均有实质内容（follow_up 两项：release-drift 的方向修正留待后续 CR、tools/agents 与 multica 平台副本的收敛留待后续 CR）。本轮修复未扩大批准范围，反而在 scope_out 显式新增「不新增 skills/shared/crctl/scripts/test/*.test.mjs 测试文件、不改 gate-registry.json 登记面」并注明需 owner 授权，与 §4.5-7 的硬约束自洽；登记面唯一写入口＝人类编辑 + git commit 的引证（CR-2026-065 SDD TDEC-2）本节点已在 KB 仓原文核对成立。"
  PRD↔SDD 对齐: "pass：按 PRD 逐条比对，FR-1…FR-17 在 §6.1 映射表 17 行全有技术落点，AC-01…AC-14 在 §6.3 全有设计落点 + 可观测结果 + 可达性说明；本节点机械核对 PRD 声明的 17 FR / 14 AC 在 SDD 内零缺失。本轮修订只改验收证据面、规模口径与常量名，未新增或丢失任何 FR/AC 落点，也未出现「设计结论与 PRD 契约冲突」（PRD 的现有基线描述与目标契约在本稿中未混用）。"
  架构合理性: "pass：消费方提示词 → crctl 投影层 → lib 生产者 的分层不变；buildRecovery 落在 lib/workspace-transactions.mjs，与 ARCHITECTURE.md:43 的 lib 模块显式枚举（yaml-subset / workspace-transactions / durable-tx）一致，未新增 lib 模块（D-3）。D-1…D-7 七条决策均含 Context / Decision / Alternatives / Consequences 四段，替代方案是被真实否决的候选而非伪造。未新增命令、状态、转换、账本写通道；.crctl/transactions/** journal schema 不变。"
  数据模型完整性: "pass：recovery 五键（executable / args / cwd / requiresTTY / promptFor）、cwd 可选性与省略时不出现该键、键序固定、FR-17 指纹字段集（不含时间戳 / 随机数 / 进程 id / process.execPath）与「不落盘」边界（journal、账本、Git 产物零字段变更）完整；本轮未触数据模型面，亦无因基线变更产生的遗漏。"
  接口契约: "pass：顶层 recovery 与 error.recovery 双投影位置（§3.3 命令面表 11 行）、argv 边界规则、promptFor 三处值名→既有 CLI 入口映射与「忽略即撞 BAD_ARGS、零副作用」的安全失败性质、固定 5 步判定顺序与四类错误闭包，均清晰且可逐条核对。本 CR 不新增或修改 HTTP API，未触发 FR-08.2 的条件基线。"
  多仓架构约束: "pass：workspace 与 resources[].worktreePath 的 authority 分离成立——过程文档读 operationalWorkspace，代码事实只读 resources[].worktreePath；本节点未使用 .rayai-worktrees 目录名拼接、未回退主工作区（主工作区视图只用于 crctl status，且已按其 STATUS_DIVERGED 告警改以 worktree 为准）。三仓 worktree 实测 healthy / dirty:false：ai-first-platform-docs 17eb8db2641935418f1631f801cb0b61a3c8bb52、tools 81d31b8b9d4c36cfef24cd076bf9fe635b67b2b6、multica dead9fe0d5a24118547a5be56d59241fdcc443a8。§4.4 末尾的跨仓边界声明诚实（tools 整树扫描覆盖不到 multica 与 KB 侧，改由 §4.3 清单 + FR-14 盘点 + 评审覆盖）。"
  性能与安全: "pass：recovery 为纯数据构造（对象字面量 + 一次数组拼接），求值零副作用、无 I/O 与子进程；不新增常驻进程、扫描调度或 CI 步骤。执行面本节点实测：crctl.mjs 与 lib/*.mjs 中 shell: true 与 Invoke-Expression 均零命中，shell: false 在 crctl.mjs 3 处、lib/workspace-transactions.mjs 10 处，与 §4.5-6 的守卫断言事实一致；requiresTTY 与 promptFor 只结构化声明既有在环要求，不削弱人工门禁、不新增绕过路径。"
  可测试性: "pass：上一轮唯一 blocker 的证据面已闭合。AC-07 的两条可观测命令与本节点实测的 CI 步骤逐字对应（crctl-ci.yml:109-111 = node skills/shared/crctl/scripts/test/suite-gate.mjs --run；:113-115 = node --test skills/writeback/scripts/test/*.test.mjs），test-concurrency 在 .github/workflows/ 实测零命中；新门禁的 per-file 用例数下限（SUITE_MANIFEST_CASE_DROP，suite-gate.mjs:452-453）与文件集合等式（SUITE_MANIFEST_FILE_DRIFT，:437-447，含「被真实 spawn 的集合也须一致」）已作为 §4.5-7 + §9 的硬约束写入。登记面实测 21 文件 / 578 用例（逐文件 cases 求和）/ exceptions 空，磁盘 *.test.mjs 集合与 manifest.files 相等；7 个迁移文件与 contract-scan.test.mjs 全部落在该登记面内，writeback 单测不在其中（readTestFileSet 只枚举 skills/shared/crctl/scripts/test），故「只增不减」这条约束对迁移对象构成真实下限。§4.5 的结构断言模板、6 类 reason 向量、反脆弱快照规则与 §6.3 的逐 AC 可观测结果设计仍成立。"
  Prompt 采纳影响: "pass：本 CR 触及 crctl.mjs 的结果合同，故 §8 必需且已存在——列出 5 处活跃提示词及其改法（skills/shared/crctl/SKILL.md、cr-archive、push-progress、merge-feature-branch、multica/cr-prompts-revised/delivery-agent.md），并声明采纳完整性与平台部署边界；本 CR 不触及 skills/shared/controlled-shell/rules.json 的 protectedPaths.deny（§9 zero_diff 与本节点实测一致）。§8 的另一半（新增 recovery 消费合同小节）与 D-6 的单一事实源定位一致。"
  AC 闭环与既有实现依赖: "pass：§11「既有实现依赖与事实」清单 21 项逐项核验成立。上一轮 blocker 指向的第 16 项已同步为合并后事实（stable symbol = crctl full test suite 全量步骤 :109-111 + Pipeline JSON 结构步骤 :68-70 + writeback unit tests :113-115，SHA 换 81d31b8），本节点实测三处行号内容逐字相符。旧字段盘点在合并后 HEAD 上重跑同值：tools 16 文件 / 72 行 / 87 次，且逐文件分布表 18 行逐项相符；multica 3 文件 / 6 行 / 6 次（delivery-agent.md 2 次 + 两个历史黄金数据 2 次）。其他关键事实核验：checkpointRecoverCommand 实测在 workspace-transactions.mjs 的 1557 / 1570 / 1573 行（与 §11-1 的 ~L1557 / ~L1570 / ~L1573 一致，并在 1570、1573 两处作为 extra.recoverCommand 的取值来源）；fixtures/digest-vectors 三文件对两个退役名零命中且在扫描面内，traceability-191k.yml 含 2 次旧名并被精确排除；三个 active 索引 56 / 9 / 8（条目全部存在于磁盘，Pipeline 索引集合与目录枚举相等）；§4.4-1 的「三个既有退役名在本 HEAD 共 8 个文件」实测为 8 且文件名集合与叙述一致。本轮新增的 §4.5-7 所依赖的三处事实（suite-gate 判定面、gate-registry 登记面、readTestFileSet 枚举域）本节点亦实测成立，但其未单列为 §11 条目——见 suggestions 中的非阻塞项。"
  SDD-CLOSE: "pass：SDD-CLOSE-01…06 均有关闭结论且与 PRD 契约一致（接口闭包 / argv 与 executable 规范化 / promptFor 解析 / 错误闭包与判定顺序 / 契约扫描实现方式 / 逐文件改法与文案口径），§6.4 末「无未关闭项；无遗留待办」与正文一致；本轮修订未引入新的未关闭项，也未把已关闭项重新打开。"
suggestions:
  - "已解决：AC-07 的验收命令与「CI 同一命令」这条可达性依据在合并后的 trunk 上已不成立（上一轮唯一 blocker，位置原指 sdd.md §6.3 AC-07 与 §11 依赖项 16）。四项修复方向逐条闭合，本节点在 resources[].worktreePath 的 tools worktree（HEAD 81d31b8b9d4c36cfef24cd076bf9fe635b67b2b6，clean）上独立复核：① 可观测结果已改为 CI 的两条现有步骤——§6.3 AC-07 第 1、2 条分别与 crctl-ci.yml:109-111（crctl full test suite = node skills/shared/crctl/scripts/test/suite-gate.mjs --run）和 :113-115（writeback unit tests = node --test skills/writeback/scripts/test/*.test.mjs）逐字相符，test-concurrency 在 .github/workflows/ 实测零命中，旧的字面命令只出现在「不采用」的三条理由段与第 16 项的历史说明里，已不再作为验收口径；② §11 依赖项 16 的 stable symbol 与依赖结论已同步为合并后事实（SHA 81d31b8），本节点实测三处行号内容相符；③ §4.5-7 与 §9 已写入新门禁的硬约束（逐用例原位替换、只增不减、per-file 用例数不得低于 manifest.cases、不新增该目录测试文件、登记面不在 scope_in 且 exceptions 为空故无例外通道），本节点实测 suite-gate.mjs:448-453 与 :437-447 的两条判定存在、gate-registry.json 为 21 文件 / 578 用例 / exceptions 空、readTestFileSet 只枚举 skills/shared/crctl/scripts/test（writeback 单测确不在登记面），且 7 个迁移文件与 contract-scan.test.mjs 全在该登记面内；④ 事实变更记录已落 §6.3 AC-07 基线事实段与修订头（旧基线 5 条红由 CR-2026-065 修复、AC-07 回到全绿、无需任何例外授权），并明示计划层例外口径的收敛归 write-dev-plan。同批的规模口径与常量名更正亦成立：扫描面 218 − 1 − 1 = 216（本节点按同一 readdirSync 递归枚举 + 路径段排除规则实测，非目录条目 219 个其中 1 个是 worktree 的 .git 文件，排除后 218 = git ls-files 218 且工作树 clean）、skills/** + pipeline-templates/** 递归 .mjs 43（活跃源码 17 / 活跃测试 26，入面 25）、索引 56 / 9 / 8、fixtures/ 4 文件中 3 个在面内 1 个被排除、RETIRED 与 contract-scan.test.mjs:105 的实际常量名一致。可重验位置：§6.3 AC-07、§11-16、§4.4-2、§4.5-7、§9、§11 规模段六处，均为可机械核对的行号与数字。"
  - "范围外：（本轮新增，SDD 记录精度，非 blocker，归属 write-tech-design）sdd.md 两处把 skills/shared/engineering-docs/scripts/src/** 记作 16 个活跃 .ts 源码；本节点按同一前缀实测该目录下为 15 个（cli.ts / mcp.ts / registry.ts / generators/base.ts / utils 下 3 个 / validators 下 4 个 / __tests__ 下 4 个）。16 是整棵 skills/shared/engineering-docs/** 的值，多出的第 16 个是 scripts/vitest.config.ts，位于 src/ 之外（git 跟踪口径同为 16）。位置：§4.4-2「为什么是整树而不是活跃目录白名单」段、D-5 Alternatives ②。影响：这只是「按 .mjs 白名单声明活跃必然漏项」这条论证的举例数字，本 CR 的扫描面由整树派生 + 两项精确路径排除定义，不依赖任何扩展名计数，故取 15 或 16 都不改变方案唯一性、门禁判定或验收可达性。修复方向（可选）：写作「engineering-docs/** 下 16 个 .ts（scripts/src/** 内 15 个）」，或把前缀改为 skills/shared/engineering-docs/**。"
  - "范围外：（本轮新增，依赖清单完整性，非 blocker，归属 write-tech-design）本轮新增的 §4.5-7 与 §6.3 AC-07 把设计建立在三处既有实现事实上——suite-gate.mjs（--run 按登记面逐文件 spawn、SUITE_MANIFEST_CASE_DROP / SUITE_MANIFEST_FILE_DRIFT 判定、CONCURRENCY 常量与 poolSize = max(1, availableParallelism() - 1)，:42 / :55 / :437-453 / :529）、gate-registry.json（manifest.files / manifest.cases / exceptions 的语义与「人类编辑 + git commit」唯一写入口）、assertion-sources.mjs#readTestFileSet（只枚举 skills/shared/crctl/scripts/test，:90-98）——但 §11 的 21 项清单没有为这三者单列条目（第 16 项以 crctl-ci.yml 承载其命令行、第 5/6 项只间接提到 skills/_index.yml 索引与 digest-vectors）。§11 开头自述该节是「按正文首次出现顺序的依赖清单」，按同一口径本轮新引入的这三条正文事实未登记。影响：三条事实本节点已逐项实测成立（判定存在、行号 437-453 相符、登记面 21 / 578 / exceptions 空、枚举域确为该目录），故不构成事实缺失，不影响设计唯一性、门禁完整性或验收可达性；缺口只是「正文事实未与清单对齐」，会让后续节点按清单取事实时漏读。附注同类未登记项在更早轮次即存在（§4.4-2 的 check-skill-matrix.mjs 硬失败先例、§6.3 AC-02 的 .githooks/pre-commit、AC-03 的 runCrctlInTty、§4.4-1 的 lint-prompts.mjs 与 CUSTOM.md），故本项不按 blocker 判。修复方向（可选，非阻塞）：在 §11 追加 suite-gate.mjs / gate-registry.json / assertion-sources.mjs 三项（repo / relative path / stable symbol / 依赖结论 / commit SHA 81d31b8），或把 §11 自述范围收窄为「迁移对象与代表性事实源清单」。"
  - "范围外：（本轮新增，措辞精度，非 blocker，归属 write-tech-design）sdd.md 两处称 openwiki/operations/crctl-transactions.md 的 frontmatter openwiki.source_paths「恰好指向本 CR 迁移的四个源码文件」；本节点实测该字段确为四项（skills/shared/crctl/scripts/crctl.mjs、skills/shared/crctl/scripts/lib/durable-tx.mjs、skills/shared/crctl/scripts/lib/workspace-transactions.mjs、skills/shared/crctl/scripts/lib/yaml-subset.mjs），其中只有 crctl.mjs 与 workspace-transactions.mjs 是本 CR 的迁移对象，durable-tx.mjs 与 yaml-subset.mjs 不在 §1.1 / §4.3 的迁移清单内（前者在 §11-3 是只读依赖、后者未被引用）。位置：D-7 Context、§11-12。影响：D-7 的结论（不手工编辑生成页、源码迁移后由既有生成步骤重新生成并核对）不依赖该计数——source_paths 已含两个迁移对象，生成回路成立；故不影响方案唯一性与验收可达性。修复方向（可选）：改为「source_paths 的四个 crctl 源码中含本 CR 的两个迁移对象」，或直接引用四项原文。"

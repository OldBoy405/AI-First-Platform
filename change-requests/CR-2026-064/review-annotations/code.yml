dimensions:
  批准范围: "pass（Step 2.5 前置核对，本节点独立复核，非转述作者结论）。三仓 diff 相对各 trunk merge-base：tools 81d31b8b…→HEAD 8dadb9ce… 恰 28 路径；multica dead9fe0…→HEAD 759fcec7… 恰 1 路径（cr-prompts-revised/delivery-agent.md）；KB 9f993348…→HEAD 3675a7f9… 23 路径全部落在 change-requests/CR-2026-064/** 与 change-requests/_backlog.yml 内（零 specs/、零 delivery/）。逐条比对 SDD §9：scope_out 面零触碰（无第二删除 CR、无 alias/shim/双写兼容层、未新增 skills/shared/crctl/scripts/test/*.test.mjs 测试文件——8 个测试文件全为既有文件修改、gate-registry.json 未改、未动 multica API/importer、未新增观测统计、未与 CR-P1/CR-P2 合并）；zero_diff 面实测零 diff（ARCHITECTURE.md、dir-graph.yaml、gates.json、controlled-shell/rules.json、.github/workflows/**、pipeline-templates/**、lib/durable-tx.mjs、lib/yaml-subset.mjs、tools/agents/*.md 全部不在 28 路径名单内，与 cmd-05 的白名单结论一致）；follow_up 两项（release-drift 方向修正、tools/agents 与 multica 副本收敛）均未被做成当前交付。plan.md 的就地谓词修正不属 scope_out，理由见 suggestions。"
  代码↔TASK↔SDD对齐: "pass。① 唯一构造器与 SDD §3.2 逐字一致：CRCTL_SCRIPT_PATH 由模块位置解析、四条入参守卫抛 RECOVERY_CONTRACT_INVALID、键序 executable→args→cwd（存在时）→requiresTTY→promptFor、cwd 省略时不出现该键。② 11 个站点逐条对照 SDD §4.1/§4.2 表成立：站点 1 register（4 个条件参数保持、--target-spec-id 在 --workspace 之前、cwd=registerWorkspace）、2 workspace sync、3 mergeCr 三条 return、4 publication lag 两个 TxError 指向 checkpoint（局部名同步为 checkpointRecovery）、5 checkpointCr 三条 return（--message 条件保持）、6 writeback traceability replay 两条 return 共用同一构造、7 writeback 主路径（milestone-name/brief/milestone-file 三个 == null 条件保持）、8 archiveCr（--spec-id 条件保持）、9 testCr（--plan 从 args 移除并进 promptFor）、10 gate 错配、11 review-loop reset 失败（requiresTTY=true）。③ §4.2 的 register 双投影删除到位：cmdRegister 结果只余 recovery，recover_command 镜像消失（register-tx 以键集断言 /^recover/i 恒为 ['recovery'] 证明，不写字面旧名）。④ TASK-01 §4 五条实测：本文件旧名与 checkpointRecoverCommand 零命中（grep 复核）、node --check 退出 0、buildRecovery( 计数 10 = 定义 1 + 站点 1–9 调用 9、args 无 <cr>/{TOOLS_ROOT}/<plan> 一类占位符。⑤ TASK-02 §4 五条：crctl.mjs 旧名与 crIdForRecover 零命中、node --check 0、gate/reset 结构化、register 单投影、错误码与 exit code 字面未变。⑥ 四个 TASK 的 _index.yml 均 done（依赖链 01→02→03→04 满足）。"
  工程质量: "pass。改动为等价迁移：零新增依赖、零新增命令/状态/账本写通道、journal 字段集未动（recovery 只出现在返回值与 TxError.extra，不落盘）；唯一非等价处是字符串插值→argv 元素（去掉 JSON.stringify 包裹的引号），正是本 CR 目的，而取值来源与「有才拼」条件逐条保持（含 String() 与 == null 判定的原语义）。错误消息文本同步改写（先执行 recovery 指向的 checkpoint 再重跑 merge），错误码/exit code/txId/rollback/files 语义零变（既有断言全绿即证）。测试改写为逐用例原位替换：contract-scan.test.mjs 的 diff 删除行仅文件头 1 行（纯增量，CR-2026-041 的 RETIRED/ACTIVE_PATHS 断言逐字未动）；其余 7 个文件只替换断言行，顶层用例只增不减。行尾纪律：plan.md 54194 B / CRLF 0，全部源码与证据为 LF。"
  关键路径可读性: "pass。构造器带意图注释（键序固定、executable 恒为 node、args 每元素一个完整 argv、占位符不进 args）；每个站点保留与目标 CLI 一致的参数顺序，条件参数以 ...(cond ? [a, b] : []) 显式展开，可逐条对照 SDD §4.1 表；错误面统一走 extra.recovery（同一形状），消费判定收敛为 SKILL.md「recovery 消费合同」单一小节（5 步判定顺序 + 四类错误闭包 + promptFor 三值映射表），其它 Skill 只引用不复述；recoveryCrId 的占位符删除（改省略元素 + promptFor）在注释中写明理由。"
  安全性: "pass。① 执行面一律 argv 边界：args 每元素一个完整 argv、executable 恒为 node、消费方 spawn 时 shell:false；本节点独立复测 crctl.mjs + lib/*.mjs 对 shell: true / Invoke-Expression 零命中（guard 面 5 文件、shell:false 13 处，与 cmd-05 日志一致）。② 用户可控输入（reason、--plan、workspace 路径、branch-ref、CR-ID）不进 args：reset 的 6 类向量（双引号/分号/换行/$( )/反引号）断言 args 与 JSON.stringify(recovery) 均不含该值；非规范 CR-ID 不再回退 <CR-ID> 占位符而是省略元素 + promptFor，占位符不进任何 shell string。③ 无回退旧字段路径、无 alias/shim（结构上已删除，register 双投影与 cmdRegister 的 snake_case 镜像一并消失，仅保留其它既有 snake_case 镜像）。④ controlled-shell/rules.json 零 diff，未扩大权限面或写面；requiresTTY 只结构化声明既有 TTY 在环要求，不新增绕过路径。"
  测试覆盖: "pass（覆盖缺口见 suggestions，非阻塞）。11 个站点中 8 处有结构断言：register（register-tx 2 例）、workspace sync（workspace-freshness）、checkpoint（checkpoint-tx）、writeback 主路径（writeback-tx AC-6.1）、archive（archive-tx 2 例）、gate/reset（crctl.test.mjs 双向量 + reset 失败分支）、merge publication lag（merge-tx 双向量）；构造器契约另有参数边界向量（独立 argv 元素/含空格路径免引号/固定键序/四条守卫抛码）与键集断言。cmd-01 交付套件 588 用例全绿（21 文件 state=ok），contract-scan.test.mjs 由 17 升至 25 用例（3 条结构断言 + 零命中 + 命中即失败 + 不误报 + 硬失败 + shell 逃逸守卫），≥ manifest 下限 17，逐文件用例数均不低于 manifest.cases（本节点独立复核 21 文件集合 ≡ 磁盘集合、Σ manifest.cases=578）。"
  测试证据可信度: "pass（本节点只读取证，未重跑任何测试）。机器区 generated-by=crctl-test / status=pass / command-digest=3b878c7a1e3e2851aa1f1feb68fcf4db3fb69af97c3bc602a343fc1fc33cdf76 与 traceability.yml#tests 的 status/generated-at/digest 逐字一致（无 TEST_EVIDENCE_DRIFT）；6 份 test-evidence/cmd-NN.log 齐备，全部 exit-code 0 / started true / skipped false / timed-out false（关键 AC 无 skip）。独立复核：① 把 plan.md §6.2 的 6 条命令解析后与 .crctl/tmp/test-plan.json 及 test-report.md 机器区逐字比对，三条一致（repo/cwd/executable/args 全等）；② gate-registry.json（LF 规范化）sha256 独立重算 = f8d983a04656d1fae05588af9daa14b128872bc124e5bcddfd155088b53bd5bf，与报告 registry.sha256 相等；manifest.files 恰 21 且 ≡ 磁盘 .test.mjs 集合、Σ manifest.cases=578、exceptions=[]；③ cmd-01 报告 13/13 check ok、exceptions_count 0、files_executed 21、cases_executed 588（逐文件 cases 与 Σ 自洽，contract-scan 25 ≥ 17、crctl 226 ≥ 224）；④ 整树零命中独立复现：tools worktree 内仅两项精确排除路径命中旧名（扫描器自身退役名单、历史夹具），枚举数 218 与报告一致；⑤ 三仓 worktree classify=healthy / dirty=false / 本地与远端分支俱在（release snapshot 前置成立）。注：本节点另有一次原生 git 只读调用（git ls-files | wc -l）用于独立复核枚举数 218，未做任何写操作；其余只读证据一律经 crctl git。"

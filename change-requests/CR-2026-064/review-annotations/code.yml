suggestions:
  - "范围外：（本轮新增，非 blocker，归属 Pipeline 收尾与协调者）review-code PASS 之后**不得**再向 KB 分支新增任何非白名单路径，否则人工 approve-code 会被 RELEASE_SUBJECT_DRIFT 硬拒。事实依据（本节点读实现得出，非推测）：review-record --stage code 机器注入的 release-subjects 记录三仓当时 HEAD，approve --stage code 会经 verifyReleaseSubjects 重核——对非 KB 仓要求 head 严格等于记录值，对 KB 仓允许 reviewed-sha 是 HEAD 祖先且其后变更路径白名单仅含 approval.yml / cr.md / traceability.yml / review-loop.yml / _backlog.yml 与 change-requests/{cr}/review-annotations/**。dev-agent 在回报里写明把 change-requests/CR-2026-064/_context.md 留到 node 15 的 checkpoint 一并提交——该路径不在白名单内，一旦提交，后续 approve-code 必以 post-review-path-drift 拒绝（代价=重跑 review-code）。修复方向（择一）：① node 15 的 checkpoint 不提交 _context.md（本 CR 当前没有该文件，最省）；② 若确需该文件，先提它再重跑 review-code 取得新的 review-subjects；③ 由协调者确认该文件在本 CR 是否必需。另注：本轮之后的 checkpoint 对 tools/multica 应为 changed=false（两仓现已 clean 且已 checkpoint 推送），任何新 source commit 同样会触发头漂移。"
  - "范围外：（本轮新增，非 blocker，归属 write-dev-plan）三处生产者站点无结构断言：① test 生产者（buildTestResponse 的 recovery，含 promptFor ['plan'] 与 cwd=authority workspace）；② mergeCr 成功 return 与 phase=release-drift return；③ writeback traceability replay 两条 return。它们在本轮之前也没有字符串断言（本节点核对基线分布：merge-tx 的旧名 3 行/5 次全部落在 publication lag 用例，writeback-tx 的 2/4 落在主路径 AC-6.1），故属既有覆盖形态、非本轮回归；cmd-01 全绿已证明这些路径可运行不抛错。影响：这三处若日后形状漂移，只有手工读码可见（contract-scan 只查名字、不查结构），而 AC-02 声称八类恢复路径的恢复结果均为结构化 recovery。修复方向（可选，非阻塞）：后续 CR 或该文件下次改动时，按 SDD §4.5-1 模板补 4 条断言（test 的 promptFor/cwd、merge 成功、merge release-drift、traceability replay 的 --target-version 空串边界）。"
  - "范围外：（本轮新增，非 blocker，归属 merge/回写说明与后续 CR）tools 侧 openwiki 整树重生成带入 trunk 既有内容：13 个 openwiki 路径进入本 CR diff，其中 architecture/overview.md、operations/ci-guards.md、operations/drift-governance.md、quickstart.md、pipelines/overview.md 等页面的新增文字描述的是 CR-2026-065（lib/outbox-contract.mjs 去重合同）与 CR-2026-063（review-loop reset 走 ledger transaction）的既有事实，另有 .last-update.json 的 gitHead/updatedAt/status 变化。这是 D-7「不手工编辑生成页 + 生成范围含 openwiki/**」的必然结果，SDD §1.1/§11-20 已声明，且恰好证明「源码→生成器」回路回到单一事实源（无手工维护漂移）；本节点的机械核对确认这些页面不含旧字段名且含结构化合同字段名、Recovery Contract 小节明确把判定顺序让渡给 SKILL.md。影响：不影响本 CR 实现唯一性与验收可达性，但合并说明应保留该口径（13 个 openwiki 路径不是本 CR 的实现交付物），避免回写期把它当作本 CR 新增事实。"
  - "范围外：（本轮新增，非 blocker，归属 docs 收敛或后续 CR）KB 侧活跃分析文档仍含退役名且不在 FR-14 六类盘点范围内：docs/analysis/CR全生命周期合同对齐-需CR实施方案.md（示例 YAML 内 recover_command: <command>）等 KB 文档仍出现旧字段名。事实为本节点在整个 KB worktree 上全文检索所得；SDD §1.1/§9 与 FR-14 的盘点范围只覆盖 tools 与 multica 两仓（KB 侧只交付本 CR 产物），SDD §4.4 也已诚实声明跨仓边界，故不构成 blocker。影响：契约类权威源（tools SKILL/README/生成页 + multica 平台副本）已全部迁移，KB 分析文档是提案/评审材料而非消费方；若日后要求「活跃文档零命中」扩到 KB，需另行登记收敛项（含 docs/analysis/done/** 的历史归档口径）。"
  - "范围外：（本轮新增，非 blocker，归属 write-dev-plan）TASK-04 §4.4 的验收命令用了 git diff --name-status，该形态不在 controlled-shell rules.json 的 diff 白名单内（仅 --cached --quiet / --stat / --name-only / --unified=N），故该条验收命令无法经受控入口原样执行；TASK 已自注由 cmd-05 兜底。事实已成立：docs 测试目录相对基线只出现 8 个既有文件的修改（无 A/D），且 manifest.files 未改且与磁盘集合恒等，可反过来证明该目录无新增/删除。建议后续把该条写成 --name-only + 集合等式，避免出现「写了但跑不了的验收命令」。"

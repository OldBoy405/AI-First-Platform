blockers:
  - "本轮新增：[sdd.md §12 既有实现依赖清单] 正文引用的既有实现事实漏列/错列，违反 review-tech-design Step 2.1「SDD 正文存在但未列入依赖清单的同类事实引用形成 blocker」——以下 8 项正文引用的事实设计结论均依赖之、但未出现在 §12 清单（已由本评审在 multica HEAD 78e14082845f7fb19f33a356169349b07042c04b 逐项核实存在，仅清单未列）：① §2.2 SweepChatIdempotency（server/internal/service/chat_idempotency_cleanup.go L17 + idempotency 清理查询；「24h 清理自动覆盖新 scope、无需新清理器」结论依赖，已核实按 created_at 全 scope 清理，行为属实）；② §4.3 步骤 4 / D-6 CheckIssueCreateCapacity 与 ResolveIssueCountPolicy（server/internal/service/issue_limit.go L67/L34；403 映射与 AC-6 可达性依赖，§12 #3 仅列 AllocateIssueNumber）；③ §4.3 步骤 8 / §13.4 GetMemberByUserAndWorkspace（server/pkg/db/queries/member.sql L15；事务内鉴权复核依赖）；④ §4.4 / §4.6 GetProjectInWorkspace（server/pkg/db/queries/project.sql L8）；⑤ §7.3 InsertProjectSharedSession（server/pkg/db/queries/chat.sql；agent_id=NULL 无 Coordinator 边界声明依赖）；⑥ §4.6 chatMessageAuthorDisplayName（server/internal/service/project_chat.go L739；默认描述摘要复用依赖）；⑦ §7.2 issue_properties_gin（迁移 192；507 模式一致性依赖）；⑧ §4.3 dbid.NewV7（server/pkg/dbid/dbid.go L51；runID 预生成依赖）。另 §12 #13 的 relative path 仅写 cr_bind.go+task.go，但 LockCrForCrBind/BindCrShellIssueIfNull 实际位于 server/pkg/db/queries/agent.sql（L1128/L1146），路径与符号不符。影响：依赖清单是实施期事实核验与 rebase 前对照的唯一固定锚点，漏列/错列使上述事实无 repo/path/symbol/结论 固定，AC 可达性依据（403 映射、事务内复核、无 Coordinator 边界）无法机械核验。修复方向：按正文首次出现顺序将 8 项补入 §12（每项含 repo/relative path/stable symbol/依赖结论，附 commit SHA 78e14082845f7fb19f33a356169349b07042c04b），并将 #13 的 path 修正为 agent.sql（或拆分为 handler/service 与 db queries 两条）。"

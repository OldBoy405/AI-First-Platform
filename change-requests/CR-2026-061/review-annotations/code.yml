blockers:
  - "本轮新增： [B-CODE-04] `packages/views/projects/components/discussion-pane.tsx:181-225,779-812` 与 `packages/views/projects/components/discussion-pane.test.tsx:350-430`：当前选择状态只保存 message ID；附件仅由 `AttachmentList` 展示，没有附件选择控件；`handlePromote` 只发送 `message_ids`，未发送 `attachment_ids`，并以 `selectedMessages.length === 0` 阻止只选附件的升级。事实与 PRD FR-11/AC-9、SDD §6.2 AC-9 及 TASK-04 明示的“可选择消息与附件”、只选附件/混合来源消费面不一致。影响：用户无法执行附件独立选择、附件-only 或消息+附件升级，目标 Issue 的来源引用会遗漏用户期望的附件，当前 AC-9 验收不可达。修复方向：为消息附件提供独立可选择状态/控件，把选中的 UUID 作为 `attachment_ids` 发送，允许 message-only、attachment-only 与 mixed 三种合法选择，保持失败选择与幂等重试语义，并补齐 DiscussionPane 三种选择形态及失败保留测试。"
  - "本轮新增： [B-CODE-05] `skills/requirement/requirement-register/SKILL.md` Step 2.5、`scripts/promotion-bind.mjs:45-86` 与 `scripts/test/promotion-bind.test.mjs`：Skill 将 `promotion_issue_id` 与 `promotion_run_id` 定义为成对定位上下文，但执行脚本只接收 `{cr_id} {run_id}`，完全不消费 `promotion_issue_id`；成功响应也只检查 `out.run_id` 非空而不校验它等于请求 run，并丢弃/不校验 `out.issue_id`。现有测试只验证 CLI 参数，没有覆盖上下文错配。影响：若 issue_id/run_id 组合错配或 CLI 返回了非请求 run，注册流程仍可能把 CR 绑定到错误 Issue 并报告成功，破坏 AC-13 的 `issue_id+pipeline_id` 定位契约与 CR/Issue 数据完整性。修复方向：把期望 `promotion_issue_id` 传入可执行绑定步骤，成功前 fail-closed 校验响应 `run_id` 与请求 run 全等、`issue_id` 与 promotion 上下文全等；错配按技术失败停止，并增加 issue/run/响应错配集成测试，同时保留普通注册不绑定与同键幂等重试语义。"

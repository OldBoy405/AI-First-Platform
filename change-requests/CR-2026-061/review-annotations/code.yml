  - "本轮新增： [B-CODE-01] `server/internal/service/promotion.go:249-257,660-689`：查重命中后补建 run 时，把整个 `issue.context_refs` 解码为仅含 promotion 字段的 `[]promotionContextRefEntry`，再整体 marshal 并 UPDATE；因此非 promotion 条目以及 promotion 条目的未知扩展字段都会被静默清空或删除。SDD v1.1 §2.1 明确要求追加语义、不覆盖既有条目且升级不删除任何历史条目；该路径会破坏当前 Issue 的来源历史与可扩展数据完整性。请只对命中 `dedupe_key` 的 JSONB 元素合并 `pipeline_run_id`（例如在 SQL 中使用 `jsonb_set`/对象 `||`），保留其他数组元素和所有未知字段，并补充真实 DB 回归测试，覆盖异构 `context_refs` 与未知 extra 字段原样保留。"

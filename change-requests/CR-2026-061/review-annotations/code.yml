  - "已解决： [B-CODE-05] `promotion-bind.mjs` 已接收第三位置参数 `promotion_issue_id`，成功前对响应 `run_id` 与请求 run、响应 `issue_id` 与 promotion 上下文执行全等校验；缺失或错配均以 `BIND_RESPONSE_MISMATCH` 非零停止并保留 registration_key 幂等重试指引，成功输出保留 `issue_id`/`changed`。SKILL Step 2.5 与测试已同步，覆盖 run/issue 错配、缺失 issue_id、幂等重放与普通注册条件分支；cmd-05 16 项全过且 skipped=false。上一轮 AC-13 数据完整性缺口已关闭。"

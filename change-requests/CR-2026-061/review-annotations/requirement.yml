blockers:
  - "本轮新增：B-API-01 [prd.md §Discussion promotion HTTP 契约“副作用”、FR-10、契约末段]：契约将副作用限定为新增 Issue/context_refs/幂等记录并明确“不得创建 comment / task”，但 FR-10 与契约末段又要求 upgrade_to_cr=true 创建 requirement-authoring pipeline task 并返回 pipeline_task_id。未定义 pipeline task 创建失败时的 HTTP 状态/错误码、Issue 与幂等记录是否同事务回滚，以及同源或同 key 重复升级是否只创建一个 pipeline task。该矛盾使 upgrade_to_cr 分支无法唯一实现，也无法验证 FR-10、FR-13、AC-8、AC-11。修复方向：拆分默认分支与 upgrade_to_cr=true 的条件副作用，明确 task 输入/响应、事务边界或补偿、失败零残留，以及重放/查重时唯一的 task 语义。"
  - "本轮新增：B-API-02 [prd.md FR-6/FR-7、HTTP 契约“幂等”、AC-5]：只写“相同请求指纹”，没有定义指纹的规范化算法、字段集合或幂等键作用域。未说明 projectId、规范化来源数组、title/description、upgrade_to_cr（及默认值）如何参与指纹，也未规定同一来源集合不同 key 但请求字段不同、同一 key 先普通升级后 upgrade_to_cr=true 时，FR-6 的查重命中与 FR-7 的 key 冲突谁优先。因而不同实现可能返回不同 Issue/状态或重复触发 CR pipeline，当前重放与并发验收不可唯一执行。修复方向：定义 canonical fingerprint、key 的 endpoint/project/调用者作用域与输入限制，并给出来源集合查重、key 重放/冲突和 upgrade_to_cr 状态组合的确定性规则，保证最多一个目标 Issue 与符合预期的 pipeline task。"
  - "本轮新增：B-API-03 [prd.md FR-8、HTTP 契约“权限”/“状态码”、AC-6]：权限响应互相矛盾。契约先规定非 workspace 成员或无 Issue 创建权限统一 403 forbidden_promotion，随后又把“非 workspace 成员/已被移出 workspace”列为 404 chat_session_not_found；AC-6 更写成“403 或 404”。同一输入无法得到唯一的客户端行为和验收结果，也无法判断应在哪个校验阶段零写入。修复方向：明确成员缺失、Issue 创建权限缺失、跨项目/归档/非 project_shared session 的固定判定顺序、唯一 HTTP 状态与 error code，并使 AC-6 与之完全一致。"
  - "本轮新增：B-API-04 [prd.md FR-3、FR-7、FR-13、HTTP 契约“request”/“校验”/“状态码”]：错误闭包不完整。虽然要求可区分错误和零残留，但契约未定义 projectId/UUID、数组元素形态、title 超限、Idempotency-Key 长度或非法值，以及锁/数据库/事务失败（尤其 upgrade_to_cr task 失败）的明确 HTTP 状态、code、error body 和重试/保留选择动作；“非法 JSON”也只给出非结构化的现有文案。缺少这些契约时 AC-2、AC-5、AC-11 无法覆盖所有失败路径，前端也无法按 FR-13 恢复。修复方向：补齐逐类错误的状态、固定 code/error 响应、零写入范围和客户端动作；至少覆盖输入解析、权限/来源、key 冲突、并发/事务及 pipeline task 失败。"

blockers:
  - "本轮新增：[plan.md §7 AC/业务闭环覆盖矩阵，AC-7 行组] 关键 AC-7 缺少唯一 TASK owner，违反 CR-2026-057 FR-8「每条关键 AC 或业务闭环一行」与 FR-9「关键 AC 必须有且仅有一个唯一 TASK owner」。事实：矩阵以三行覆盖 AC-7——「AC-7 前端来源入口（用户可观察面）」owner=CR-2026-061-TASK-04、「AC-7·API 响应解析面」owner=CR-2026-061-TASK-03、「AC-7·client schema 兼容面」owner=CR-2026-061-TASK-04，同一关键 AC 出现两个不同 owner，且无 AC-13 那样的唯一 owner 注记。影响：review-dev-plan 的 FR-9 门禁要求关键 AC 在矩阵内机械可判唯一 owner，approve-dev-start 的 passCondition（verdict=pass 且 blockers=[]）依赖本门禁；当前结构无法机械判定 AC-7 的唯一 owner，开发启动审批无法消费。修复方向：AC-7 合并为恰一行并写唯一 owner（用户可观察面责任层 = CR-2026-061-TASK-04，可在 SDD 落点列注明 API 面关联 CR-2026-061-TASK-03）；「API 响应解析面」「client schema 兼容面」两行改列「业务闭环」行（保留各自 cmd-01/cmd-04 证据），与表尾既有业务闭环行同一模式。"
  - "本轮新增：[plan.md §7 AC/业务闭环覆盖矩阵，AC-13 行组] 关键 AC-13 缺少机械可判的唯一 TASK owner，违反 CR-2026-057 FR-9。事实：三行覆盖 AC-13，owner 分别为 CR-2026-061-TASK-03（multica 面两行）与 CR-2026-061-TASK-04（「AC-13 tools 面」行）；表后说明称该 tools 行为「独立业务闭环行」，但矩阵 AC 列仍标「AC-13 tools 面」且 owner 列=CR-2026-061-TASK-04，说明与矩阵互相矛盾。影响：AC-13 是 PRD 明示的跨仓关键 AC（「以 tools 侧注册集成测试 + multica 侧 run 投影断言为准」），无机械唯一 owner 判定则 FR-9 门禁不可执行，开发启动审批无法消费。修复方向：把「AC-13 tools 面」行移出 AC-13 的 owner 行——与「业务闭环：promotion SKILL 改动不引入 crctl 命令面/prompt 漂移」行合并或并列为业务闭环行（owner=CR-2026-061-TASK-04、证据 cmd-05/cmd-06）；AC-13 保留唯一 owner=CR-2026-061-TASK-03（证据 cmd-01/cmd-02），使矩阵与表后说明一致。"

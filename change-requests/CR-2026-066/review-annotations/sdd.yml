  可测试性: "通过（B-1 闭合后重判）。AC-8④ 新判据本轮独立复算可满足——函数体抽取边界明确（L1487-1530）、调用点恰 7 个、归一去重后签名集合恰等于白名单 7 项、argv 元素零禁用 token，抽取失败或数目不符即硬失败；与 §9 的函数体零 diff 相容，不再存在恒假判据。其余 AC 的落点本轮抽检未受影响（AC-1 两条判据可由 JSON 自身求出、AC-4②③ 的断言分层、AC-6 登记即达成、AC-8②③⑤ 落在既有 archive-tx fixture 上）。"

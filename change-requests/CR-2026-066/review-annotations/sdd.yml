  - "已解决：B-1（AC-8④ 的文本级断言与本 CR 的 zero_diff 事实互斥 ⇒ AC-8 当前不可达）[§6.2 AC-8 行 ④ ＋ §6.4 archive-tx.test.mjs 行 ＋ §7.1 ＋ §9 zero_diff 的 reconcileLocalTrunks 函数体行] 回修采纳 argv 级命令面白名单并在四处同步。本轮独立复算（tools@5d5a4ada，workspace-transactions.mjs L1487-1530）：自 export function reconcileLocalTrunks 起至下一个顶层 } 的函数体 44 行中，gitRun／gitMust 调用点恰 7 个（L1493 rev-parse、L1498 symbolic-ref、L1501 status、L1505 fetch --prune、L1510 rev-parse --verify、L1516 merge-base --is-ancestor、L1521 merge --ff-only）；按判据归一化（取首 token，含 --prune／--verify／--is-ancestor／--ff-only 之一并入）去重后恰为设计所列 7 项、无多无少；全部 argv 元素零命中 reset／clean／stash／--force／push；函数体确含 rows.push(row)（L1491）且不含字面子串 merge --ff-only，故原文本级判据恒假、新 argv 级判据在零 diff 约束下可满足——AC-8 的验收可达性与实现唯一性恢复；「抽取失败或调用点数 ≠ 7 即硬失败」与工程纪律 #1 的无静默降级一致。"

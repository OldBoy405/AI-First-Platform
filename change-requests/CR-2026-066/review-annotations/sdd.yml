  - "部分解决：B-2（§6.3「既有实现依赖与事实」仍漏列 1 项正文同类既有实现事实；Step 2.1 明文规定 SDD 正文同类事实漏列即 blocker）[§6.3 清单（本轮 47 项）对照 §1.2、§3.2、§8 与 §9 zero_diff] 事实：上一轮点名的 3 项（第 20 项 mergeCr／第 32 项 ../multica/cr-prompts-revised/delivery-agent.md／第 36 项 archive-tx.test.mjs）与 S-10 的 assertion-sources.mjs（第 47 项）本轮逐条实读全部成立、已登记，插入位置、47 项连续编号与两处数值互引（SDD-CLOSE-02 改为「第 44~46 项」、显式对象名替代「（见 29）」）均正确；但同一口径下仍有 1 项同类既有实现事实未登记：cmdArchive —— skills/shared/crctl/scripts/crctl.mjs L3566 定义、L3640 的 ok({ op: 'archive', ...result }) 返回透传（dispatch 分支 L3526），它是本 SDD 三处声明成立的前提：① §3.2「crctl CLI 契约：archive 返回新增 localTrunkSync」；② §8「本 CR 不改该文件…新增字段随既有 spread 自动透传」的 N/A 判定；③ §9 zero_diff「crctl.mjs 全文件零 diff（不改 dispatch、不改 cmdArchive／cmdCheckpoint／advance／gate／review-record）」。第 16 项与第 45 项虽同属 crctl.mjs，但分别只覆盖 cmdCheckpoint（L2367-2393 的终态守卫）与 approveAndAdvance（L1095 定义），未覆盖该 CLI 层函数——与第 2 轮 mergeCr 的判定同型（同文件、同级、兄弟已登记、唯它缺席；第 1 轮的 gates.json 亦因「零改动声明的载体」入清单）。本轮实测：L3526 case 'archive': return cmdArchive(ws, positional, flags);、L3566 async function cmdArchive(ws, positional, flags) {、L3640 ok({ op: 'archive', ...result });，透传结论成立（故修复只需登记、不需改设计）。影响：该小节是本 SDD 唯一可核验的既有事实索引（Step 2.1 明定 reviewer 只按清单取证、不做全仓库无界扫描），该行缺席使「§3.2 的 CLI 契约透传」「§8 的 N/A 判定」「§9 的 crctl.mjs 全文件零 diff」失去按清单可核验的追溯面，也与本轮修订自称的「正文同类事实引用全部在册」不符，与上一轮 B-2 根因同类（清单完整性），故判部分解决而非已解决。修复方向：在 §6.3 按既有格式补 1 项（repo=tools／relative path=skills/shared/crctl/scripts/crctl.mjs／stable symbol 对象=cmdArchive（L3566 定义）与 crctl archive dispatch 分支（L3526）＋返回透传 ok({ op: 'archive', ...result })（L3640）／commit SHA=tools@5d5a4ada／依赖结论=§3.2、§8、§9 三项声明的前提），插入位置按该节节首分组与正文首现顺序、与第 16／45 项同组相邻，全表重编号与数值互引同步；同时把第 32 项的括注改准（见 S-11）。另：若作者认为另有同类候选不应登记，请在下一版明写不登记理由以保口径单一——本轮点出的候选为结构化 recovery 契约的构造与字段名（buildRecovery／executable／args／cwd／requiresTTY／promptFor，§9 zero_diff 引用其零 diff）与 gitRun／gitMust（同文件 L378／L383，AC-8④ 的抽取锚点）。"

blockers:
  - "本轮新增：B-1（AC-8④ 的文本级断言与本 CR 的 zero_diff 事实互斥 ⇒ AC-8 当前不可达；影响验收可达性与实现唯一性）[§6.2 AC-8 行 ④ ＋ §6.4 archive-tx.test.mjs 行 ＋ §9 zero_diff 的「reconcileLocalTrunks(ctx) 函数体」行] 事实：设计把 AC-8④ 定义为「从 workspace-transactions.mjs 抽取 `export function reconcileLocalTrunks` 起至下一个顶层 `}` 的函数体文本，断言不含 `reset`/`clean`/`stash`/`--force`/`push`，含 `merge --ff-only`」。本轮在 tools@5d5a4ada 对同一函数（L1487-1530）逐字复算：L1491 是 `rows.push(row);` —— 该行含子串 push，故「不含 push」在本 CR 明令零 diff 的函数体上恒假；L1521 是 `gitMust(repo.rootPath, ['merge', '--ff-only', row.remote]);` —— git 命令以 argv 数组形态书写，函数体文本中不存在字面子串 merge --ff-only，故「含 merge --ff-only」同样恒假。同批抽取的 reset／clean／stash／--force 四项本轮实测均未命中。影响：该断言在任何合规实现下都不可能变绿，实现者只能二选一地偏离设计——改函数体（违反 §9 zero_diff 与 PRD §7「不改 archive 业务算法」）或另写一套断言（使 §6.2／§6.4 的判据描述与实现脱节），AC-8 的验收可达性与实现唯一性同时受损。修复方向：把 ④ 重定义为 argv 级命令面断言——只从函数体内抽取 gitRun／gitMust 的首参 argv（或等价的 token 序列），断言命令白名单恰为 rev-parse／symbolic-ref／status／fetch --prune／rev-parse --verify／merge-base --is-ancestor／merge --ff-only，且 argv token 中不出现 reset／clean／stash／--force／push（子串级只用于引号内的 argv 元素，不用于整段文本）；若坚持文本级，则须把「不含 push」等判据改为带引号的 argv 字面量（如 'push'、'--force'），并把「含 merge --ff-only」写成 'merge' 与 '--ff-only' 两个 token 同时出现；两种写法都保留抽取失败硬失败（禁止静默降级为空串通过）。"
  - "本轮新增：B-2（§6.3「既有实现依赖与事实」漏列 4 项正文同类既有实现事实，审计索引不完整；Step 2.1 明文规定正文同类事实漏列即 blocker）[§6.3 全节（36 项）对照 §1.1／§1.3、§2.3、§4.5 与 §6.1 FR-6、§4.6.2 与 §6.1 FR-10、§9 zero_diff] 事实：下列既有实现事实是本设计成立所依赖、或本 CR 直接修改的对象，却不在 36 项清单内（本轮已在 tools@5d5a4ada 逐条实读，事实本身成立，缺的只是登记）：① `ARCHITECTURE.md` —— §1.1 声明「Pipeline → Skill → crctl 依赖只朝下」取自其 §4，§1.3 的三条硬约束取自 §4／§5（实读 L69-95，与声明一致）；② `skills/shared/crctl/gates.json` —— §2.3 与 §9 的「零改动」声明、SDD-CLOSE-02 第 7 项的「只读本地」结论的载体；③ `skills/writeback/merge-feature-branch/SKILL.md` —— FR-6 的落点文件，正文以其 L53 的 publication lag 与 error.recovery 语义为前提（实读 L53，与引用一致）；④ `skills/cr/cr-archive/SKILL.md` —— FR-10.8 的落点文件，正文要求其 Step 3 结果分类表与「输出」块新增 localTrunkSync（实读 L56-84，与声明一致）。同节 SDD-CLOSE-02 另引用了 `skills/sync/workspace-freshness/SKILL.md`（第 2 项）、`approveAndAdvance`（第 3 项，crctl.mjs L1095）、`applyWriteback`（第 5 项，workspace-transactions.mjs L3182），亦未登记。同类先例：本仓既有基线 SDD 的依赖清单把 ARCHITECTURE.md、skills/shared/crctl/gates.json 与当轮的改造对象一并登记为 dep 项（见 specs/ai-first-platform/SDD.md 的 dep 段），清单内的第 7~11 项也是同一做法。影响：该小节是 SDD 唯一可核验的既有事实索引（Step 2.1 明定 reviewer 只按清单取证、不做全仓库无界扫描），漏列使这四类事实无法按清单核验，并使「设计依赖／修改了哪些既有文本」在后续 rebase 与评审中失去追溯面。修复方向：在 §6.3 按正文首现顺序补 4 项（repo／relative path／stable symbol／commit SHA 取 tools@5d5a4ada／依赖结论）；SDD-CLOSE-02 引用的 3 项择一处理——补进清单，或改写该节表述为不依赖其行为。"
dimensions:
  批准范围固定章节: "通过。§9 承载 scope_in／scope_out／zero_diff／follow_up 四字段且均非空（无需写「无」的空字段）；scope_in 明列 29 个交付文件（tools 25 ＋ multica 4，本轮按 §1.2 树逐项点算一致）并列出交付说明必填块；zero_diff 覆盖 crctl.mjs、rules.json、gates.json、状态机、四个核心函数签名、archiveCr 既有返回字段、emit-registry.mjs／gate_nodes_gen.go／gate-registry.json、四个 review SKILL 的 payload 与评审维度、KB specs／delivery／docs 与冻结的 prd.md。四字段均按固定章节语义使用，未与 scope_out／follow_up 混用。"
  PRD↔SDD 对齐: "通过。FR-1~FR-11 逐条有技术落点（§6.1 表 ＋ §3／§4 正文），无遗漏、无重编号；AC-1~AC-10 逐项给出设计落点／可观测结果／可达性（§6.2）并附反查结论。与 PRD 字面不同之处均已在 SDD 内证成且同向：FR-3 的 KB 取证按 checkpoint 合同分解（D-4／§4.3.1，本轮实测成立）、FR-1 的发布前干净判据复用只读 workspace inspect（§4.1 步骤 4，不扩张评审者能力面）、FR-4／FR-5 的连带测试面扩到 4 个既有测试文件（§6.4，均属既有断言按新事实同步，不新增扫描面）。SDD-CLOSE-01~05 五条关闭项均有结论且与 PRD 契约一致（FR-10 不拆、8 项门禁逐条复核完成、S-7 排除、S-8 落地点名、部署时序登记）。设计结论与已审批 PRD 无冲突项。"
  架构合理性: "通过。分层与依赖方向与 ARCHITECTURE.md §4「依赖只朝下」一致（本轮实读 L69-82），不新增层级、命令面与账本文件；§1.3 的三条硬约束与 ARCHITECTURE.md §5 不变量 1／2／8 逐条相符，其中「评审者不写 status」有 cmdCheckpoint 只拒绝终态（crctl.mjs L2379-2382）与 reconcileLocalTrunks 零账本副作用（L1487-1530，仅 fetch --prune 与 merge --ff-only）双重事实支撑。D-1~D-6 六项决策同时满足三判据且替代方案真实（含被否方案、后果与回滚边界），未伪造替代；CLOSE-05 的部署时序以 owner 部署窗口承接，不引入平台耦合。"
  数据模型完整性: "通过（本 CR 无新增实体的定形面）。NFR-4 的零新增可核：§2.2 只逐字固定既有结构，本轮实测三处形状与代码一致 —— checkpoint 返回 repositories-{repo,sourceSha,remoteRef,confirmed} ＋ metadataCommit（workspace-transactions.mjs L2258-2260）、localTrunkSync 行 {repo,trunk,before,remote,after,status,reason}（L1490）与 4 状态／6 reason 分类（L1499-1526）、release-subjects 三件套（buildReleaseSubjects L1230 起、verifyReleaseSubjects L1287 起）。无新增账本字段、注解字段、落盘文件。"
  接口契约: "通过。Skill 契约（§3.1）参数／落盘／状态转换不变，只新增 Step 1 的只读前置与 PASS 分支内一次发布＋一次对账；crctl CLI 契约（§3.2）只新增 archive 返回体的 localTrunkSync，既有字段、phase 分类、退出码、错误码不变，且经 cmdArchive 的 ok({op:archive, ...result}) 自动透传（crctl.mjs L3640 实测）；HTTP 面无 diff，§3.5 的 N/A 与条件基线（FR-08.2）一致。"
  多仓架构约束: "通过。路径 authority 只用 resources 的 worktreePath（§4.3.1 的取证命令显式带 --cwd，无 .rayai-worktrees 拼接）；跨仓依赖方向为 tools 唯一事实源 → multica 部署副本；KB 与非 KB 的提交口径分解正确且本轮实测成立（本 CR 自身批次：KB source-sha f9dd6fc3 ＝ metadataCommit 3a553e3b 的父，git diff --name-only f9dd6fc3 3a553e3b 仅 change-requests/_backlog.yml；checkpoint 内部对 parent 与 metadata stage 集合的硬断言见 L2216-2230，二者与 D-4 描述逐字相符）。"
  性能与安全: "通过。评审者能力面只增不改（＋push-progress Skill、＋只读 workspace inspect；checkpoint 与全部写入型子命令仍在 forbidden，本轮实读 matrix L207-208 与 multica 副本 L46 一致）；rules.json 的 protectedPaths.deny 零 diff（本轮实读一致）；发布前置把全仓 git add -A 的输入面锁在已验证干净的工作区（I2）；归档尾部新增远端动作只 fetch --prune ＋ merge --ff-only、best-effort、不改退出码；§7.1 的行尾与硬失败纪律与 §5 不变量 4 同口径。无新增安全面与性能预算需求。"
  可测试性: "不通过 —— 见 B-1（AC-8④ 的命令面断言在零 diff 的 reconcileLocalTrunks 上不可满足）。AC-8 其余五项落点与既有 fixture 可执行（两分支含字段、4 状态×6 reason、dirty 跳过＋逐字节未变、幂等重放零新 commit、SKILL／delivery 汇报面文本）；其余 AC 的可测试性通过：AC-1 两条判据可由 JSON 自身求出，AC-2 的新断言从 JSON／_index.yml／SKILL 事实源推导（NFR-5），AC-4 的断言 A 落在 tools 侧三处载体且随 CI 执行（D-5），AC-5 的 CI 六步与 manifest 下界语义本轮核实一致（suite-gate.mjs 仅在用例数下降时报 SUITE_MANIFEST_CASE_DROP），AC-6 以「登记即达成」解除不可达，AC-7／AC-9／AC-10 均为仓库内文本或 crctl status 可查。"
  依赖识别与既有事实核验: "不通过 —— 见 B-2（正文同类既有实现事实漏列 4 项）。清单已列 36 项本轮复算与实况一致：三份 pipeline 7／5／16 节点与 push-progress 下标 3／9／12／15、replayNodes 5 项含 …0008、approvalPrompt …0010 含「评审后 checkpoint phase=complete」、_index.yml 计数 7／5／16、review SKILL 的行号锚（L10／L32／L37／L131、L38／L121、L9／L33、L10／L16／L142）、rules.json 的 rev-parse callers 通配与 show 仅 system-orchestrator 放行 review-annotations、matrix reviewer 块 L192-194 与 forbidden 含 push-progress／checkpoint、AGENT-SKILL-MATRIX.md L46／L52、multica 副本 L23／L41／L54 与 coordinator L19／L60、pipeline-structure 与 contract-scan 与 crctl.test 与 checkpoint-tx 的断言行、emit-registry digest 5454bfd9…c91cc、gate_nodes_gen.go 七组 NodeID／Seq（1-indexed，删除后的 Seq 位移可由节点序复算）、--check 守护与 runner.go 默认关闭、CUSTOM.md 条目 75 的 cr-prompts-revised 定性（内容相符，编号写法见 S-5）。四份 review SKILL 的 PASS 分支事实（tech-design／dev-plan 无 advance）与 §4.1 步骤 3 分派一致。"
  权限与委派合同面: "通过。FR-8 的四载体同步（矩阵注释／AGENT-SKILL-MATRIX.md 本 CR 行／tools 权限事实源节／multica 受限 crctl 权限块）与 AC-4②③ 的断言分层（tools 三处随 CI、multica 侧作交付证据）在 PRD 契约内收口，B-1 闭合所依据的事实本轮复读仍成立（multica 副本 L37 为「仅限评审所需的以下子命令」的穷尽式措辞，L39-42 四条允许项不含 workspace inspect，L46 禁止面枚举含 checkpoint；tools 侧只有「权限事实源」节 L35-38、无 crctl 子命令清单）。评审者不获得 status 写入口，权限只增不改；部署时序（部署前平台仍跑旧白名单）与平台绑定由 owner 承接，未混入本 CR 代码范围。"
  Skill契约闭包: "通过。四个 review SKILL 的必填参数、落盘路径、错误分流与 crctl 独占写入边界不变；发布只经 push-progress Skill（其内部 crctl checkpoint 由 crctl 独占），BLOCK 不发布、发布失败不改 verdict／不重评／不代提交／按 recovery 重试同一 checkpoint；FR-2 前置与 actor 允许面两侧同时存在（AC-3 ＋ AC-4 联合断言）；CONTRACT_DRIFT 作为评审侧技术中止的文本语义不新增 crctl 错误码（§3.4 的表述精度残留见 S-2）。"
  crctl_CLI契约闭包: "通过。不新增子命令／flag／错误码；archive 仅返回体新增 localTrunkSync，三个成功返回点经同一 result 包装（L3546 定义、L3597 幂等早退、L3757 complete、L3759 cleanup-pending 实测），既有字段与 phase 分类逐字不变；评审 PASS 发布复用的 checkpoint 在四个发布点状态均非终态（terminal＝archived／rejected／withdrawn 实测，cmdCheckpoint L2379-2382 只拒终态），故不需要新增状态或转移；FR-3 的取证只用受控只读 rev-parse（rules.json 白名单 callers 通配，含 --verify 形态）。"
  Prompt 采纳影响: "N/A。本 CR 的 diff 不触及 crctl.mjs 的 dispatch 分支与 rules.json 的 protectedPaths.deny —— §8 的判定与实测一致（archive 走既有 dispatch 与结果透传，rules.json 零改动），故不存在「crctl 新增能力而某 Skill 该采纳未采纳」的漂移面，第 8 节按条件规则省略为 N/A。"
suggestions:
  - "本轮新增：S-1（归 write-tech-design，落点 §4.7 首句）「硬规则文本（四份 tools Prompt 与四份 multica 副本同句）」与同表及 §6.4 的「tools 三份 Prompt（agents 下的 dev／quality-reviewer／delivery）」不一致 —— tools/agents/ 实测无 cr-coordinator-agent.md（该副本只在 multica，CUSTOM.md 条目 75 已定性），FR-7 的 tools 侧落点只有 3 份。建议改为「三份 tools Prompt 与四份 multica 副本」，避免实现期按「四份」去找并不存在的第四份 tools Prompt。"
  - "本轮新增：S-2（归 write-tech-design，落点 §3.4 的 CONTRACT_DRIFT 行）该行写「不写 annotation」，而 §4.1 的固定顺序是 ①review-record 落盘（写 annotation）在前、⑥对账（唯一触发 CONTRACT_DRIFT 的动作）在后，字面读法与本 CR 自己的顺序冲突。建议改写为「不追加／不改写 annotation、不改 verdict、不回退状态、不重评」，与 §7.2 的「技术中止而非裁决」表述对齐。"
  - "本轮新增：S-3（归 write-tech-design，落点 §6.3 第 2 项）该把冻结 PRD 记为「350 行」，而同 CR 的 canonical 评审记录（review-annotations/requirement.yml，verdict=pass）按另一口径记为 349 行（扣除末行空终止符）；sha256(LF) 与字节数两处一致，故不影响对账，但同一事实出现两个行数。建议统一行数口径，或该条只保留 sha256(LF) ＋ 字节数。"
  - "本轮新增：S-4（归 write-tech-design，落点 §9 scope_in 的交付说明必填清单）AC-4③ 的 multica 副本核对（D-5 的断言 B）目前只挂在「本 CR 的 TASK 完成标志」与 test-report 的 issue evidence 上，未列入交付说明必填项；建议把断言 B 的核对结论（被核文件与命中的 token）写进交付说明必填块，避免该侧证据在交付面缺位。"
  - "本轮新增：S-5（归 write-tech-design，落点 §6.3 第 28 项与 §6.4 的两处行号）三处索引精度：① crctl.test.mjs 的「…0017 是 …0009 的直接前驱」实测在 L5040（L5039 是 …0013 已删除断言）；② pipeline-structure.test.mjs 的 FR-12.3b 段实测起于 L365，§6.4 写的 L335-375 跨越 FR-12.3（L341-363）与 FR-12.3b（L365-375）两个 test 块；③ §6.3 第 28 项写「CUSTOM.md 第 75 行」，实测该定性在 multica CUSTOM.md 的条目 75（表行，物理行 387），「75」是台账编号而非行号。按 Skill「行号只作辅助、不作唯一证据」，三项都不影响本轮判断，但建议同步校正，避免实现期按行号改错块。"
  - "本轮新增：S-6（归 write-tech-design，落点 §4.2 的注释）§4.2 把「classification=healthy 等价 dirty=false」写成等价关系，而实测 classifyRepoWorkspace（workspace-transactions.mjs L660-687）的 healthy 还要求 worktree 已注册且 HEAD 在 CR 分支上，即 healthy 严格强于 !dirty。该更强前置不损害 FR-2 语义（§4.2 的报告已要求逐仓 classification 事实），但建议把注释写成「healthy ⇒ dirty=false（更强前置）」，以免实现期据「等价」写出反向断言。"

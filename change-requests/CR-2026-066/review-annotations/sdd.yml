  数据模型完整性: "通过（本 CR 无新增实体的定形面）。§2.2 只逐字固定既有结构；本轮回修未触碰 §2 任何字段形状，localTrunkSync 行结构与既有实现一致（本轮实测 L1490 的行形状与 §2.2 逐字相符）。"

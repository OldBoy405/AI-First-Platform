blockers:
  - "部分解决：B-2（§6.3「既有实现依赖与事实」仍漏列正文同类既有实现事实 3 项；Step 2.1 明文规定 SDD 正文同类事实漏列即 blocker）[§6.3 清单（本轮 43 项）对照 §1.2 变更面树、§4.5／§4.7 落点表、§6.4 测试面清单、SDD-CLOSE-01、SDD-CLOSE-02 第 8 项与 §9 zero_diff 表] 事实：上一轮点名的 4 项（ARCHITECTURE.md、skills/shared/crctl/gates.json、merge-feature-branch/SKILL.md、cr-archive/SKILL.md）与 CLOSE-02 引用的 3 项（workspace-freshness/SKILL.md、approveAndAdvance、applyWriteback）本轮逐条复读全部成立、已登记，且全表重编号与表内数字互引同步正确（清单 36→43 项）；但同一口径下仍有 3 项同类既有实现事实未登记：① skills/shared/crctl/scripts/test/archive-tx.test.mjs —— AC-8 六项新用例的唯一落点（§1.2 树、§6.2 AC-8 行、§6.4「文件与 fixture 既有」），且 SDD-CLOSE-01 的「不拆」判据③直接以「复用既有 fixture（makeWritebackFixture／makeNewModeArchiveFixture）不新建夹具」为前提；本轮实测该文件 783 行、两个 fixture 分别定义于 L17／L86（事实成立，缺的只是登记），而同类的其余四个测试面载体（pipeline-structure.test.mjs、contract-scan.test.mjs、crctl.test.mjs＋checkpoint-tx.test.mjs、gate-registry.json＋suite-gate.mjs）均已登记（第 33~36 项）。② ../multica/cr-prompts-revised/delivery-agent.md —— FR-7 四份 multica 副本之一（§1.2 树与 §4.7 表行均列为改动对象），而第 29／30／31 项只登记了 quality-reviewer-agent／dev-agent／cr-coordinator-agent 三份，交付集的第四份副本无依赖项。③ mergeCr —— FR-6 code 路径兜底所依赖的既有语义（§4.5「merge 的 publication preflight 语义不变」）与 SDD-CLOSE-02 第 8 项「唯一远端相等要求」的证据（本轮实测 mergeCr 定义 L1532、preflight 块 L1583-1606、MERGE_SOURCE_MISSING L1599、RELEASE_REMOTE_NOT_PUSHED L1602、checkpointRecovery L1586），同时被 §9 zero_diff 表点名为零 diff 对象；其兄弟事务 checkpointCr（第 17 项）、approveAndAdvance（第 42 项）、applyWriteback（第 43 项）均已登记，唯它缺席（第 21 项只覆盖 reconcileLocalTrunks 的调用点与返回行，未覆盖该 preflight 语义）。影响：该小节是本 SDD 唯一可核验的既有事实索引（Step 2.1 明定 reviewer 只按清单取证、不做全仓库无界扫描），三项缺席使「AC-8 落点文件与既有夹具」「FR-7 交付集完整性」「FR-6 兜底所依赖的既有 preflight 语义」失去按清单可核验的追溯面，与上一轮 B-2 的根因同类（清单完整性），故本轮判部分解决而非已解决。修复方向：在 §6.3 按既有格式补 3 项（repo／relative path／stable symbol 对象／commit SHA 取 tools@5d5a4ada 与 multica@43848770／依赖结论），插入位置按该节节首声明的分组与正文首现顺序；表内数字互引随编号顺延同步，其余 43 项内容不动。"
dimensions:
  批准范围固定章节: "通过。§9 仍承载 scope_in／scope_out／zero_diff／follow_up 四字段且均非空；本轮复读 §9 与 §6.2 的 29 个交付文件点算一致（tools 25 ＋ multica 4），zero_diff 在 B-1 回修后为 reconcileLocalTrunks 函数体增写了 argv 级说明，其余约束未变。"
  PRD↔SDD 对齐: "通过。FR-1~FR-11 逐条有技术落点，AC-1~AC-10 逐项给出设计落点／可观测结果／可达性；本轮修订只重写 AC-8④ 判据与其四处同步文本、补 §6.3 依赖项、采纳 S-1~S-6，未改变任何 FR 的技术方案，亦未与 PRD 明文冲突（FR-3 的 KB 取证分解仍按 D-4 同向处理）。"

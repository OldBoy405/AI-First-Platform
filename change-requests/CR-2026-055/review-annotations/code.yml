blockers:
  - "[P1] 规格未完整落地：`skills/develop/write-tech-design/SKILL.md:96-109` 只要求每个既有实现断言附 repo/commit/path/symbol/conclusion，并说无法绑定时按待核实依赖列出；没有要求生成名为“既有实现依赖与事实”的显式、有序依赖清单。PRD FR-2/SDD §3.1 明确要求该清单作为 `sdd.explicit_existing_dependencies` 的来源，review-tech-design 又要求只核验该清单并检查正文漏列引用。请补齐可定位的输出结构和 reviewer 消费规则，否则依赖集合仍可能被模型自行猜测。"
  - "[P2] 工程标准未满足：本提交修改 `agent-skill-matrix.yml:145` 的权限关系，但 tools `AGENTS.md` 的权限矩阵规则要求同步 `AGENT-SKILL-MATRIX.md`；该 Markdown 的主责矩阵仍未反映本次 reviewer 与 controlled-shell 的权限变更。请同步解释性权限文档，或明确补充其 can-call 展示规则。"
  - "[P1] 测试证据不满足 AC-9：`change-requests/CR-2026-055/test-report.md:88` 明确未执行 `lint-prompts.test.mjs`、`check-skill-matrix.test.mjs` 及相关 crctl/workspace-resolver 回归测试，却以“不适用”通过；PRD AC-9/SDD §8.3 要求相关 crctl 测试和 Pipeline JSON 解析全部通过。请按实际相关测试补充 `crctl test` 计划并重新生成 pass 报告，或提供可审计的理由证明每个被省略测试确实与本次变更无关。"

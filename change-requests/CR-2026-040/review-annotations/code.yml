verdict: block
blockers:
  - "P1 testCr 记录阶段没有获取 test scope 目录锁：workspace-transactions.mjs:2106-2179 直接读取 attempt/journal 并 applyWriteSet；两个并发调用可同时计算相同 nextAttempt、删除/创建 journal 或竞争同一 authority。按 SDD 4.4/4.6，在命令执行完成后、读取/恢复 journal 前调用 acquireLock({root: workspace, scope: `test-${cr}`, op: 'test', cr})，并在 finally 释放；运行阶段仍不得持锁。"
  - "P1 新 attempt 会先删除上一份 complete journal：workspace-transactions.mjs:2109-2115 在 marker/traceability 校验和新 journal 创建之前 rmSync(existing.txDir)。若后续技术失败或进程中断，已完成事务的幂等事实丢失，重试可能重复 attempt。保留 complete journal，或给 durable-tx 增加受控 force-new/按 inputDigest 创建能力，并仅在新事务 complete 后清理旧事实。"
  - "P1 inputDigest 无法识别代码已变化但退出元数据相同：workspace-transactions.mjs:2099-2112 只绑定 commandDigest、exit/signal/timedOut/started 和 owner；代码修改后测试仍 exit 0 时会返回 changed=false，继续引用旧日志并不新增 attempt，违反 PRD AC-13。将参与 repo HEAD/source subject 与每条日志内容 hash 纳入 test inputDigest，同时保持 commandDigest 只绑定命令语义。"
  - "P1 planPath 未限制在 workspace 非 authority 临时目录：workspace-transactions.mjs:2077-2080 接受任意绝对路径或 workspace 下任意相对路径，违反 SDD 4.1。对 planAbs 做 realpath containment，只允许 workspace/.crctl/tmp（或明确白名单的 non-authority temp root），并增加 escape/symlink/authority 文件黑盒测试。"
  - "P1 cwd 未拒绝 .. 段且报告/digest 未使用 canonical cwd：workspace-transactions.mjs:1896-1917 仅在 realpath 后检查最终 containment，foo/.. 会被接受并原样进入 digest/report，违反 PRD FR-02.4。解析前拒绝任何 .. 段，或用 realpath 相对 worktree 重新生成唯一 POSIX cwd；加入 lexical traversal 与 symlink escape 测试。"
  - "P1 traceability/review-loop/journal 形状校验会静默降级：workspace-transactions.mjs:1805-1825 在 Tools Root/pipeline 解析失败时退回 3；1837-1843 将非法 loops 形状当空映射；1847-1856 静默跳过坏 journal；2037-2055 只识别字面 tests:，对 tests: scalar/旧 report 路径不硬失败。按工程纪律和 SDD 2.5/4.4，现有文件或事实源存在但不可解析/形状冲突必须结构化硬失败，禁止覆盖历史或默认降级。"
  - "P1 测试证据不满足并误报 AC：test-report.md:90-96 明确承认 Ubuntu 与 timeout 路径未测试，却声称 FR-01~FR-08 AC 全覆盖；test-cr.test.mjs:69-76 名称写 CRLF 无关但未输入 CRLF，且没有 timeout、marker 重跑逐字保留、planPath containment、并发锁测试。补齐 PRD AC-03/04/08/13/16 的真实用例与 Ubuntu CI 证据后重新生成 test-report。"

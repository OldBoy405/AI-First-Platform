suggestions:
  - "实现时优先冻结 cr-test-plan/v1 的命令结果字段、digest canonicalization 和 TEST_* 错误码，再切入调用方迁移，避免半迁移状态。"
  - "Windows 实现验证需明确直接可 spawn 的 executable 形式（例如 node.exe 或对应 .cmd 入口），并把该约束纳入 plan 校验/测试，而不是恢复 shell:true。"

cr-id: CR-2026-052
review-type: code
reviewer: "quality-reviewer-agent"
reviewed-at: "2026-08-27T13:56:41+08:00"
verdict: block
blockers:
  - "CreateApprovalContinuationTask（server/pkg/db/queries/approval.sql）存在前向表引用：JOIN squad s 的 ON 子句含 s.leader_id = a.id，而 agent a 在其后才 JOIN，PostgreSQL parse_analysis 阶段报 `missing FROM-clause entry for table \"a\"`（SQLSTATE 42P01，已用 PREPARE 对照实证：同条件正确排序 agent 先 JOIN 则通过）。该查询是幂等阶梯 rung 0 的 guarded INSERT，运行期必然失败 → EnqueueApprovalContinuation 返回错误 → HandleGrantsAck 回滚并 5xx，任何审批 ACK 均失败，FR-1~FR-11 续跑功能整体不可用。修复：重排 JOIN 使 agent a 先于 squad s（对齐既有 CreatePipelineTask 的 agent.sql:651 正确写法），改 .sql 后重跑 make sqlc。"
  - "multica 集成测试证据不可信（cmd-03 实为静默跳过）：governance TestMain 默认连 postgres://multica:multica@localhost:5432/multica，而实库密码为哈希（multica/.env），默认口令 SASL 认证失败（已实证），TestMain 打印 Skipping 后 os.Exit(0)，go test 无 -v 时丢弃该输出、仍报 ok；且实库尚未应用迁移 470（approval_workspace_id 列不存在，已用 PREPARE 实证）。故 test-report status=pass 的 exit-0 不构成 AC-1~AC-9 路径的机器证据——正是因此前向引用 bug 未被测试捕获。需在已迁移的真库上真实执行集成测试并落盘证据。"
dimensions:
  代码与TASK与SDD对齐: "Go 侧（HandleGrantsAck 事务编排、resolveContinuationTarget FOR SHARE 锁链、EnqueueApprovalContinuation 四阶梯幂等、双钩 ValidateGrantAck/WakeGrant）与 SDD §4.1/4.2/4.3/§3.2 一致；但 approval.sql 的 CreateApprovalContinuationTask 存在前向引用导致 rung 0 不可达，对齐被 SQL 层阻断 → BLOCK"
  工程质量: "go build / go vet 通过（编译期不发现运行期 SQL 语义错误）；但 SQL 前向引用为运行期硬错误，工程不可交付 → BLOCK"
  关键路径可读性: "注释充分、锁链与阶梯语义清晰；HandleGrantsAck 的 reasons>0 分支缩进错位（rollbackTx 多缩进一 tab、writeJSON 对齐错位），纯格式问题不影响编译（gofmt 可修）"
  安全性: "租户隔离（全程 $ws 限定 + guarded INSERT 权威链复核）与 fail-closed 设计正确，无越权/回退任意 agent 路径"
  测试覆盖: "tools 侧 AC-11/12 node 测试真实运行（13 pass）；multica 侧 AC-1~AC-9 集成测试因真库不可达被静默跳过，实际未覆盖 SQL 路径"
  测试证据可信度: "test-report status=pass 但 cmd-03 集成测试为 no-op（跳过），证据不足以支撑评审（skill Step 1：证据不可信就 blocker）"
  前端质量: "N/A（未触及 *.tsx/*.vue/*.css/*.html）"
suggestions:
  - "dev-plan 门禁 freshness 漂移（gateBlockers.developing）：TASK-02/03 在 dev-plan 评审后按该评审建议做了措辞修正，导致 subject-sha256 由 d9f9be15… 漂移到 cecf861e…，需重新执行 review-dev-plan 刷新证据（本 blocker 的修复路径 repair-target=implement-code 之外，另需 review-dev-plan 重审；这是 review-code 之外的门禁问题，单独列出）。"
  - "HandleGrantsAck reasons>0 分支缩进错位（纯格式），建议 gofmt 规范化后随修复一起提交。"

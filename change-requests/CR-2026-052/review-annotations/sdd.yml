suggestions:
  - "非阻塞残留风险：§4.3 阶梯 2 合并保留首条后继的 agent_id（首 ACK 时解析的 leader）；若两次审批之间 squad leader 重指派，合并后继仍指向旧 leader。这是 FR-6「同 CR 最多一个后继」上限 + DD-11 合并语义的直接结果，运行时由被唤醒 Agent 依 crctl status/next 路由兜底，不构成 blocker；建议在 §7.5 残余风险补一句说明（或 AC-5 增一条跨 ACK leader 重指派用例）以固化该边界。"
  - "非阻塞可观测性补强：提交后 NotifyContinuationTaskEnqueued 广播失败未列入 §7.3 原因码全集——任务行已随事务持久化、由既有队列 claim 兜底，与 EnqueuePipelineTask 同模式（task.go:415-416），非新风险；如实施期方便，可补一行日志说明提交后广播失败的兜底路径。"

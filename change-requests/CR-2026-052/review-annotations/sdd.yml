verdict: block
blockers:
  - "TD-BL-8 — SDD §3.3/§4.2/DD-10 对 PostgreSQL 行锁矩阵的关键断言错误：FOR KEY SHARE 不与 FOR NO KEY UPDATE 冲突，只与 FOR UPDATE 冲突；而既有 UpdateIssue 对 assignee_id/assignee_type 的普通非键列更新（issue.sql:164-257）及 cr.shell_issue_id 的非键列更新通常取得 FOR NO KEY UPDATE。LockIssueForChannelMediaBind 的既有用途也仅是和删除方 FOR UPDATE 互斥（issue.sql:89-95,128-135），不能旁证重指派互斥。因此新增 cr/issue FOR KEY SHARE 仍不能稳定 shell_issue_id/assignee_id 到提交，AC-6b/6c 所声称的阻塞不会成立。需改用与普通 UPDATE 互斥的锁级（如 FOR SHARE/更强，参照 squad.sql:12-20）或给出等价串行化方案，并以真实并发测试验证两种提交顺序。"
  - "TD-BL-9 — SDD §4.3 的阶梯 2 仍有 SELECT→UPDATE 状态竞态：GetApprovalContinuationTaskByCr 只读选出 queued/deferred/dispatched/waiting_local_directory 后继但不锁行；在 AppendApprovalContinuationEvidence 前，ClaimAgentTask 可把该行推进到 running。随后 UPDATE 因四态谓词返回 0，方案却把所有 0 行都解释为‘该 record 已合并’并返回 200，未复核 approvals[]。若运行任务已在新 grant 落盘前读过 grants，此路径再次形成 delivered_at 已提交但无新后继/无 prompt 可达证据。需在选择与追加间锁定后继或收敛为单条原子 UPDATE，并区分‘已含 record’与‘状态离开谓词’；补 queued/dispatched→running 与合并并发竞态测试。"
dimensions:
  PRD↔SDD对齐: "BLOCK，FR-1/FR-6/FR-7/FR-9 的并发串行化仍存在静默丢失与陈旧 authority 窗口。"
  架构合理性: "BLOCK，DD-10 使用了错误的 PostgreSQL 锁冲突假设；DD-11 的重读后追加不是原子选择。"
  数据模型完整性: "PASS，双 partial index、approvals[] 与 deferred 载体足以表达目标状态；缺口在并发算法。"
  接口契约: "PASS，双钩将预提交纯校验与提交后副作用分离，HTTP 失败/成功边界已明确。"
  多仓架构约束: "PASS，三仓 authority、依赖方向、生成物与 checkpoint 口径清晰。"
  性能与安全: "BLOCK，FOR KEY SHARE 不拦截普通非键 UPDATE，仍可能向陈旧 issue/leader 派发。"
  可测试性: "BLOCK，现有 AC-6b/6c 建立在错误锁矩阵上，且缺少 successor claim-vs-append 竞态用例。"
  Prompt采纳影响: "PASS，tools 变更不触及 crctl dispatch 或 protectedPaths.deny。"

  - id: CODE-BLOCK-002
    severity: major
    file: "tools/skills/writeback/scripts/writeback-prd-sdd.mjs:42 / writeback-traceability.mjs:135"
    issue: "版本入参归一不一致：writeback-tasks 剥 v 前缀（verNoV），prd-sdd 与 traceability 不剥。真实惯例是裸版本号（_index current: \"0.20.1\"、traceability target-version: \"0.20.1\"），而 feature-writeback pipeline 的 target_version 输入占位符是 \"v0.16.0\"——照占位符调用 prd-sdd 会产出 'vv0.16.0' 里程碑标题（幂等探针同错）、_index current: \"v0.16.0\"，traceability 会写 target-version: \"v0.16.0\"，三处与既有基线数据约定冲突"
    suggestion: "prd-sdd 与 traceability 与 tasks 同样在入口归一（verNoV = version.replace(/^v/,'')），裸值用于 heading（v{verNoV}）/_index（current/since）/traceability（target-version），frontmatter version 用 v{verNoV}（对齐真实 PRD.md 的 version: v0.10.0 约定）"

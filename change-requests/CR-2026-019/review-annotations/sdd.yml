    issue: >-
      `nb.replace(/^(\s*status: done.*)$/m, `$1\n$1`.replace('status: done','done-at: ...'))`
      中内层 .replace 作用于字面量 "$1\n$1"（不含 'status: done'）为 no-op，
      实际效果是复制 status 行两遍且永不写入 done-at——照此实现 AC-1（done-at 时间戳断言）必挂。
      关键算法节的伪代码是实现蓝本，错误会直接传导进 implement-code。
    suggestion: "改为两步定向替换：先替换 status 行，再在该行后插入同缩进的 done-at 行；或单次替换直接产出两行结果"

review-type: tech-design
reviewer: "OldBoy405"
reviewed-at: "2026-08-10T17:56:39+08:00"
verdict: block
blockers:
  - "TD-B2 resolver 调用与缓存契约内部矛盾：SDD §1.3 调用 resolveToolsRoot(installRoot)，§3.1/§4.2 又定义 resolveToolsRoot(opWs) 并内部 deriveInstallRoot(opWs)，形成双重派生口径；应统一为所有 loader 调 resolveToolsRoot(ws/opWs)，由 resolver 内部唯一派生 InstWS。另，现有 fail() 直接 process.exit(1)，不存在失败后的第二次调用，SDD 的 null 失败缓存/‘后续重新 fail 同因’既不可观察又未保存原因；应收敛为 undefined|string 的成功值单缓存。_shellRules 保持自己独立的 undefined|null|object 缓存，不得描述为与 Tools Root 共用同一缓存。"
dimensions:
  PRD与SDD对齐: "通过：9/9 FR 映射完整，TD-B1 回修未改变需求范围。"
  架构合理性: "基本通过：显式 ws 参数链、单文件、零依赖、无隐藏 workspace 全局均正确；resolver 调用/缓存口径需最终收敛。"
  数据模型完整性: "通过：配置、四标志、错误 detail 与零持久化边界完整。"
  接口契约: "阻塞：resolveToolsRoot 的实际入参在流程图与签名不一致；失败缓存与 fail() 退出语义冲突。"
  性能与安全: "通过：改为成功值单缓存仍满足每进程只解析一次成功路径；失败硬退出，无安全回退。"
  可测试性: "通过：fixture/sentinel/linked-worktree 设计可执行；缓存验收应只断言同一成功命令内复用。"
  Prompt采纳影响: "通过：§8 白名单完整，无新增 dispatch 或 rules deny。"
suggestions:
  - "代码伪签名使用 JavaScript 语义时可写 let toolsRootCache;，避免在 .mjs 实现中照抄 TypeScript 类型标注。"

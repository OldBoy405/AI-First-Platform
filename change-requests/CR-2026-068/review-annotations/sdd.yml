  - "本轮新增：SDD §5「技术选型与替代方案」D-6（本 CR 自身 SDD 的依赖表形态）Context 行「`dep-5` 的 dep-N 合同自 CR-2026-067 合并起对后续 SDD 生效」事实归属错误且未由 dep-N 承载。取证（tools@49fa37748d9b2fc7fc58fd53f839e2ed293bde17 实读）：dep-5 = ARCHITECTURE.md，全文无「dep-N」/「既有实现依赖」字样（dep-5 登记的 stable symbol 清单亦不含该合同）；全 tools 仓含「dep-N」的文件仅 skills/develop/write-tech-design/SKILL.md（「既有实现依赖与事实」合同段）、skills/develop/review-tech-design/SKILL.md（Step 2.1 引用核验规则）与 test/pipeline-structure.test.mjs——前两者即 dep-N 合同真实载体（CR-2026-067 面），均未登记入 §6.3 依赖表。影响：该断言是 D-6 决策（本文档 §6.3 采用 dep-N 固定结构）的直接前提，按 review-tech-design Step 2.1「正文出现未通过 dep-N 引用承载的当前实现事实形成 blocker」、SDD §6.3 收录判据①/③（设计判据成立前提、§9 zero_diff 中设计所依赖的既有文本须入册）与工程纪律4（事实断言先核实），按 dep-5 追核该合同的后续读者必然落空，且与 PRD §7「CR-2026-067 面：write-tech-design / review-tech-design 的 dep-N 表达」的既有归属矛盾。修复方向：把真实载体登记为 §6.3 新 dep 条目（repo=tools、40 位 SHA=49fa37748d9b2fc7fc58fd53f839e2ed293bde17、relative path=skills/develop/write-tech-design/SKILL.md（及/或 skills/develop/review-tech-design/SKILL.md）、stable symbol=「既有实现依赖与事实」dep-N 合同段与 Step 2.1 引用核验规则），并把 D-6 Context 的「dep-5 的」改写为指向该条目的准确归属；「自 CR-2026-067 合并起生效」与「CR-2026-067 SDD 的 D-6 时序差」两半句经核实为真（change-requests/CR-2026-067/sdd.md D-6 实读），可保留。"

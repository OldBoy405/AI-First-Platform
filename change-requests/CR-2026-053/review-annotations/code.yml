cr-id: CR-2026-053
review-type: code
reviewer: "OldBoy405"
reviewed-at: "2026-08-29T02:42:24+08:00"
verdict: block
blockers:
  - "[critical] server/pkg/db/queries/agent.sql:684 — CreatePipelineTask now matches the source row only by s.id, while the executor agent and CR are scoped to $1 but the source task is not. A SourceTaskID from another workspace can therefore copy that tenant's issue_id/project_id and attribution into a reviewer task in the target workspace. This contradicts the existing source-task/executor/CR workspace guard and FR-B12's trusted-source contract. Join the source task's agent and require its workspace_id=$1 (without requiring source agent == executor agent), then add a cross-workspace negative test."
  - "[major] change-requests/CR-2026-053/test-evidence/cmd-08.log:4 and cmd-12.log:4 — the canonical report says all 13 commands passed with no skip and specifically claims cmd-08 ran 2 DB subtests and cmd-12 ran 11/11 DB tests, but both logs say the database was unreachable and the package-level TestMain skipped all tests while go test returned exit 0. Moreover cr_bind_test.go has no TASK_PROJECT_MISMATCH or CR_BIND_FAILED/transaction-audit-failure case although test-report.md claims all seven error codes and AC-B1~B11. The post-fix canonical evidence is therefore false-positive and TASK-10 cannot be considered done. Regenerate it through crctl test against a reachable test database and include the missing fail-closed/tenant-isolation cases."
dimensions:
  代码↔TASK↔SDD 对齐: "block — changed=false event suppression is implemented and TASK-11/AC-D1/D2/D5/D6 have platform-comment evidence, but CreatePipelineTask does not enforce same-workspace trusted source and TASK-10 is marked done despite skipped DB acceptance."
  工程质量: "block — the cross-workspace source-task gap weakens the enqueue invariant; otherwise the handler/service/CLI/frontend changes are readable and localized."
  关键路径可读性: "pass — binding transaction, event gating, reviewer routing, and approval-card rendering responsibilities are explicit and traceable."
  安全性: "block — source task tenant ownership is not checked after removing s.agent_id=$2, allowing cross-workspace attribution/context copying through CreatePipelineTask."
  测试覆盖: "block — DB suites were skipped; no test covers TASK_PROJECT_MISMATCH or CR_BIND_FAILED/rollback, and no cross-workspace SourceTaskID negative test exists."
  测试证据可信度: "block — cmd-08/cmd-12 logs contradict test-report status/analysis and the claimed no-skip 2-subtest/11-test results."
  前端质量: "pass — the small ApprovalCard reuse preserves loading/error/reject states, renders a single current card, and introduces no visible a11y or bundle-risk regression in the diff."

blockers:
  - "BL-1 标识契约漂移：prd.md frontmatter.title 为‘tools TCA-001～004 最小优化 - 注册、移交、审批驳回与开发计划评审契约收敛’，未按 write-requirement-prd 契约原样继承 cr.md.title。修复时将 PRD title 改为 cr.md 的完整 title，并同步正文主标题；不得改写 cr.md 受控 frontmatter。"
  - "BL-2 规划依赖不可复现：cr.md#source 与 PRD §1.4 均指向 docs/analysis/tools-tca-001-004-optimization-plan.md，但该文件不存在于 CR-2026-030 knowledge-base worktree，当前评审只能读取主工作区未跟踪副本。修复时把已确认 source 原文纳入该 CR 分支的同一路径，并验证从 worktree 可独立读取。"
  - "BL-3 验收范围自相矛盾：AC-29 要求‘Multica 代码 diff 为空’，AC-30 又要求在 Multica 现有 Go→crctl 测试设施增加 reject 向量；事实核验表明该设施位于 multica/server/internal/governance/approval_crosscheck_test.go，增加向量必然产生 Multica 测试代码 diff。请拍板并写成唯一可执行口径：允许且精确限定 test-only diff（同时遵守 multica CUSTOM.md 台账要求），或保持 Multica 零 diff 并给出无需修改该文件的替代跨接缝验收；不得同时保留两者。"
  - "BL-4 修改面不可判定：FR-10/AC-29 只称‘相关/四个 Pipeline 模板’，未列出四个文件，且 resume-cr 未在 FR-10 明确出现；source §8.3 的范围是 requirement-authoring.pipeline.json、architecture-design.pipeline.json、code-implementation.pipeline.json、resume-cr.pipeline.json。修复时在 PRD 增加精确修改白名单，并为四个文件分别给出可核查契约或统一的定向验收。"
  - "BL-5 FR/AC 覆盖不完整：FR-3 要求同一时间戳复用于 Owner 双投影、owner-history、backlog 通知、audit 和 outbox，但 AC-9 只覆盖 Owner/history/notify-log/notify-pending，AC-13 也只验证 SHA/payload。修复时增加 audit/outbox 时间戳一致性及失败路径不写成功 audit 的可执行验收，或从 FR 删除未要求验收的时间戳承诺。"
dimensions:

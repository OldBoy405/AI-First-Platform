  FR可测试性: "BLOCK：多数 FR 均有细粒度 AC，注册、移交、grant、三路评审与 R7 覆盖较强；但 FR-3 的 audit/outbox 单时间戳与失败 audit 顺序缺少对应 AC，且 Multica 零 diff/新增测试向量无法同时验收。"
  范围合理性: "BLOCK：总体坚持最小实现、无 Runner/WAL/grant v2/新依赖，边界合理；但四个 Pipeline 未精确列名，Multica test-only 变更是否在范围内没有唯一口径。"
  与规划对齐: "BLOCK：核心 TCA-001～004 方案与主工作区规划副本总体一致；但 source 在权威 worktree 缺失，且规划自身‘不改 Multica 源码’与‘增加 Multica reject 跨接缝向量’的歧义未由 PRD消解。"
  依赖识别: "BLOCK：已识别状态机、grant v1、CUSTOM-TODO-001～006、outbox/reconcile 和 Multica 待办；仍需把 source 文件纳入分支，并明确 Multica 测试设施与 CUSTOM.md 的依赖边界。"

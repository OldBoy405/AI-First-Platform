  - "本轮新增：B-01 新增规划/竞品公开 CLI 的成功输出契约未闭合。PRD FR-09～12 规定业务写入、幂等、错误 JSON 和正常 exit=0，但未规定成功时 stdout 是否为 JSON、调用方读取的最小结果及其语义，也未明确同意图已完成重放返回怎样的结果；AC-B15/B18 仅检查文件一致，无法验证 Skill 如何依据机器回执认定落盘与提交完成，而非凭 exit=0 或自然语言推断。请在 PRD 为两个操作补充最小成功/幂等回执合同（可引用既有 crctl 输出先例并说明差异），明确业务身份/实际产物、完成与改变或幂等语义、stdout 与诊断输出边界，以及事务未完成不得返回成功的消费规则，并给 AC-B15/B18 增加对应回执断言。具体命令命名、模块位置、序列化及事务算法仍由 SDD 决定，不要求需求期重写实现。"

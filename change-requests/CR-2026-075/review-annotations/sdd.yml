suggestions:
  - "已解决：B-09 §4.5.4 第 2.a～2.d 步把 Git 完成事实改为取得 ledger-<key> 锁后、对同一 latestLedger/payload 现场执行 sampleCommitState；原语持锁 await 回调，headSha 与 headBefore..headSha 消息集均由实际受锁对象取样，锁外预读只保留 expect.txId。故 R 预读后 W 完成 C 并在 finish 前中断、txId/摘要未变的交错，不再使用提交前快照误判并 rollback。取样失败固定 TX_GIT_FAILED 零写入/journal 保留/不回滚；B18-c/B18-d 明确交错、持锁、保留 C 与文件、恢复回执及失败后收敛的可观察要求；§4.3、§5.1～5.3、§6.2～6.3、§7、§9 与 dep-37 同步，scope_in/zero_diff 包含共享原语与既有 helper 接线。关闭的是设计缺口，实施期仍须以所列向量实证。"

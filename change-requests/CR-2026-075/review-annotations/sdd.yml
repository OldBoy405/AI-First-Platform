blockers:
  - "本轮新增：B-10（承接 dev-plan upstream 疑点，在 tech-design 阶段独立重判）FR-04/FR-16、AC-B1/B3 的真实调用方验收不可达。SDD §2.1/§4.1/§4.2 定义有效绑定缺参直接归一、无绑定才进入旧显式缺根纠正；§5.2 将 B1/B3 指定为 Pipeline 提示词行为的节点日志/回放，§6.2 又以无绑定声明作为 B1 可达条件，但 §9 未定义可信节点合法取得显式子进程环境的受控入口、调用契约、授权来源及审计保留边界。当前资源代码证明 Pipeline、带 execution_context 的普通委派，以及本项目无声明普通任务均可获得可信绑定：multica 9d1c10d267fe97a9a2232293796a0ef51d284eea，server/internal/daemon/pipeline_task.go#resolveTaskWorkspaceBinding（201-237）、daemon.go#injectTaskCRWorkspaceEnv（10731-10748）在 custom_env 后成对发布绑定；tools 27a4300a0aa1793a442b543ddb8328cb0d3ce562，skills/shared/crctl/scripts/crctl.mjs#bindTaskWorkspace（3407-3420）对真缺参直接归一。本 run task=01a1095e-56a1-7b8b-a3ea-8645aaf1aec4 的 op/audit 亦完整、同根，三仓初始 classification=healthy。仅有显式 CLI 的语义、旧环境快照、replay 标签或逐次 env 日志不产生执行授权；不能以清除可信绑定、切旧 CLI、伪造 WORKSPACE_REQUIRED 或以独立测试冒充真实节点来关闭 B1/B3。请在 SDD 层明确与已批准 PRD 一致的合法执行来源及安全边界，同步 §2/§3/§4/§5/§6/§8/§9 的验收可达性与批准范围，保留有效绑定首次归一、同 run 恰一次纠正、第二次失败停止与无新授权约束；不得留给 PLAN/TASK 盲补或 follow_up。此为设计授权边界缺口，不是缺 cmd/cwd/timeout 的任务粒度问题；不修改 SDD，不声称回放已通过。"
  - "本轮新增：B-11 本次重评的显式既有实现依赖未与当前资源事实闭合。SDD §1.2 仍声称 dep-1～37 是本次在 resources HEAD 核验的事实、待核实依赖无，全部 SHA 却指向起草快照：KB e125917b7d8a136cf665611dc30db7db1251fc97、tools 061a12ff0a40028b7aba979108c2977313e1fb11、multica 56bdc70db62f4fe2473b238f0ed36b05712af3a9；本 run 受控 rev-parse 实测为 KB 01396ba38f56b800f757637a1a18c83c234896fb、tools 27a4300a0aa1793a442b543ddb8328cb0d3ce562、multica 9d1c10d267fe97a9a2232293796a0ef51d284eea，且不仅提交号变化，依赖结论也已改变：dep-2 的全部命令要求显式根已被 crctl.mjs#bindTaskWorkspace/main 的前置归一改变；dep-28 的 launcher/Git 配置仅 Pipeline 已被可信普通委派接线改变；dep-35 的恢复原语不接收期望摘要/实例与 dep-37 的唯一既有调用点传锁外快照，已不符 durable-tx.mjs#recoverLedgerTransaction（480-512）的 expect 锁内比对/取样和 crctl.mjs#recoverLedgerCommand（731-737）的取样器接线。37 项定义及 40 位 SHA 形状齐备、引用无未定义 dep、显式路径存在，不等于本轮行为核验通过。起草前基线可明确保留为历史依据，但不能把已被本 CR 实施改变的旧结论继续作为本次 HEAD 事实，须在 write-tech-design 回修中区分历史基线与当前设计成立所依赖事实，按 resources 重核相关 stable symbol/行为并更新当前依赖 SHA、结论和正文引用，注明对设计结论的影响；不得只机械替换 SHA 或将本问题降为表达建议。"
dimensions:
  PRD↔SDD 对齐: "BLOCK（B-10）；PRD FR-01～16 均有文本技术落点（16/16），A1～A8/B1～B20 均有映射（28/28），但 AC-B1/B3 的真实节点合法显式环境来源缺失，不能宣称 28/28 闭环。已区分历史实现基线与 PRD 目标契约，不把实施完成作为设计通过的替代。"
  架构合理性: "BLOCK（B-10/B-11）；重读 tools 与 multica ARCHITECTURE 的分层/硬不变量/否决项，daemon 预检与任务环境、CLI 受控执行、纯转换模块、Git 无关事务原语的目标分层合理，DEC-1～6 有真实取舍；但当前真实节点的显式模式授权缺口不能靠第二执行器、清绑定或 PLAN/TASK 绕过，旧依赖结论也不能代替当前分层事实。"
  数据模型完整性: "快速复核通过（设计模型）；绑定三元组、唯一 execution_context、两类限定 payload、确认身份/推导路径、canonical intentDigest、workspace+身份 key、时间继承、现场分类、期望摘要/实例与回执字段完整；不新增 DB/共享可覆写 context。B-10 需补合法模式来源而非暗增模型授权。"
  接口契约: "BLOCK（B-10）；HTTP 条件基线 N/A（无新增/修改 HTTP API）。§3.1 两个业务 CLI 的输入范围/确认/错误/成功回执及 §4.5 的恢复分支清晰；绑定归一与显式模式语义清晰，但在可信真实调用方内取得旧显式环境的受控调用契约缺失，描述语义不等于合法可调用入口。"
  多仓架构约束: "快速复核通过（路径与责任）；首动作 workspace inspect 的 operationalWorkspace 与委派原样一致，KB/multica/tools 三资源均 classification=healthy、dirty=false、changed=false，均 requirement/CR-2026-075。过程文档取 operationalWorkspace、代码只取 resources.worktreePath；KB 不承载业务代码；HEAD 为 01396ba38f56b800f757637a1a18c83c234896fb / 9d1c10d267fe97a9a2232293796a0ef51d284eea / 27a4300a0aa1793a442b543ddb8328cb0d3ce562。依赖旧 SHA 与当前事实不符另由 B-11 登记。"
  性能与安全: "BLOCK（B-10）；真实路径/同安装根、custom_env 后成对发布、唯一触发评论、一次只读预检、固定两/三文件、审批与白名单不扩等设计仍明确；同 key 锁内期望比对/取样/恢复、CAS 第三值失败与取样失败保留现场仍有设计落点。不能为节点回放清除可信绑定或丢 audit 归因；合法显式子进程的权限来源与保留边界待 SDD 关闭。"
  可测试性: "BLOCK（B-10）；§5.2 A/B 全量向量、Windows 实跑、业务接口/节点回放、同 txId 交错与取样失败出口均明确，但 B1/B3 的真实节点前置被可信绑定归一过滤，测试场景有描述不等于可达。其余场景按相应算法/错误出口快速复核，无证据声称实施通过；本评审未运行 lint/build/test，未制造缺根回放。"
  Prompt 采纳影响: "适用并快速复核通过（清单与顺序）；dispatch 受触及，§8 列明两业务调用方、shared 合同、七 Skill/矩阵/Agent/索引/部署同步，§4.9 要求 A 全量证据后才收敛提示，保留 bootstrap/显式入口/execution_context/职责/检查/发布。B-10 回修后须同步合法调用边界，不能以旧现状表充当当前实施事实（B-11）。"
  批准范围: "BLOCK（B-10）；§9 scope_in/scope_out/zero_diff/follow_up 四字段齐备，durable 的可选锁内比对/取样及 recover helper、multica CUSTOM 登记已纳入，原 B-09 设计结论仍存在且未恢复旧误回滚方案。但当前 B1/B3 的必要合法显式入口未获设计范围和授权定义，不能以 scope_out 的不新增执行器/权限框架掩盖当前 AC 必需条件，不能移至 follow_up；须在 SDD 内给出与 PRD 一致的已有合法出口或按流程裁决范围。"
  AC闭环与SDD-CLOSE: "BLOCK（B-10）；逐项复读 28 条 AC 与 SDD-CLOSE-01～10，命令/模块/摘要/事务/错误/校验/索引/示例/日期/提示关闭项均有文字结论，未回退 B-01～09 已关闭的设计修订；B1/B3 仍缺真实节点合法环境来源，余 26 项具备文本落点/可观察结果/前置说明（设计判断，非测试通过）。关闭表不能替代当前 AC 可达性。"
  既有实现依赖与事实: "BLOCK（B-11）；37 项定义、40 位 SHA 形状、dep 引用关系和显式路径已核查，未扫描全仓另猜依赖。以当前三仓受控 HEAD 重读关键绑定/发布、CLI 归一、锁内期望/取样及既有 recover helper，发现起草 SHA 与本轮证据及部分依赖结论不符；历史基线与当前依赖须明确分层重核。未据裁剪 complete=false 输出作最终判断，相关正文另用有界切片补取。"

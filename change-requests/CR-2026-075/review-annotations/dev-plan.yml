blockers:
  - "本轮新增：B-C4-01 FR-04/FR-16、AC-B1/B3（并连带 B4）的批准验收被 plan 0.11 的 FU-1 非批准下沉。已批准 SDD §4.2.1:427-450 明确 S1 包含带 execution_context 的普通委派，纠正只以实际节点日志/回放验收；§5.2:662-665 要求 B1/B3/B4 的真实调用方行为证据，§9 未把这些验证列为 follow_up。plan.md:98-110、:148、:193-196 与 TASK-08.md:38-49、TASK-10.md:43-50 却禁止本 CR 生成回放并用 cmd-01/cmd-05 替代。FU-1 的关键依据也与本次 resources 的源码及运行环境冲突：multica HEAD 9d1c10d267fe97a9a2232293796a0ef51d284eea 的 pipeline_task.go:201-238 已在 PipelinePrompt 为空时解析 TriggerCommentContent 并预检 operational_workspace，daemon.go:8650 消费该绑定；本 reviewer task 01a10d1f-0e85-74bb-84df-c9402ab19a90 的 CRCTL_OPERATIONAL_WORKSPACE 实际就是传入 KB CR worktree，未改环境的同一 run 只读 status 探针显式空白根得到 WORKSPACE_REQUIRED/exit 1，仅替换为该可信根得到 exit 0，反证前者恒为主 checkout、与声明恒互斥的依据。本探针仅用于接口及现状反证，不冒充实现节点回放，也不证明全部 B1/B3 已验收。SDD 当前的 S1 设计无需因这一陈旧前提重开，repair-target=write-dev-plan：按当前可信绑定事实回修 FU-1、批准范围翻译、FR/AC 覆盖与 TASK-01/06/08/10，使实际调用方日志证明面重新对应已批准验收；不得清绑定、换 CLI、造无绑定环境、增执行器或把静态断言当回放。若回修仍发现真实且不可消除的 SDD 设计断裂，必须提交具体新证据，不能仅复用本轮已被反证的旧依据。"
  - "本轮新增：B-C4-02 FR-04、AC-B1/B3 的 cmd-01/cmd-05 观测面仍窄于 plan/TASK 的声称面。plan.md:116、:148 及 TASK-01.md:46-47、TASK-08.md:38-49、TASK-10.md:31-34 声称 cmd-01 固定有效绑定 M2 与补可信根成功、第二次失败停止，并声称 cmd-05 中 caller-contract.test.mjs 逐条断言本地纠正约定与六条不构成授权来源。tools HEAD 48ad150dd7019802d003e54d27a6ef7c751af12f 的 crctl.test.mjs:628-648 实际用 runCrctl(argv) 无绑定场景，fixed 只断言错误码不等 WORKSPACE_REQUIRED、没有 status=0 断言，空串/空白/裸旗标用例也未传 bind3，更未执行调用方第二次失败后的路由/调用计数；caller-contract.test.mjs:349-382 检查 complete=false、--detail 和显式 workspace，六个 cmd-05 文件未检索到 FR-04、本地纠正、六条负面清单或第二次失败的专项断言。故单测绿或合同扫描绿不能证明这些声称，已 done 的 TASK-01 及已落地的 TASK-08 文本不能静默被当作具备未实现断言。repair-target=write-dev-plan：逐条将声称映射到实际可观测断言/日志与唯一 TASK owner，明确仍需实现或补验的 in-scope 工作及 developing 内完成条件；补齐有效绑定 M2/补同根成功等真正缺失的边界断言，真实调用方次数/失败路由继续由批准的节点日志证明，不扩大 cmd-05 或 CLI 单测的证明范围、不以删 AC 或移入 FU-1 消除缺口。"

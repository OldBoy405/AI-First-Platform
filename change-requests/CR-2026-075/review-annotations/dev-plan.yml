  - "本轮新增：B-10 FR-04/FR-16、AC-B1/B3（cmd-05）：plan.md:132/147 与 TASK-08.md:40/45/49-50、TASK-10.md:34/49 要求真实平台调用方回放同时提供完整非空 task 绑定三元组、execution_context 与登记 tools worktree 内的当前受控入口，并断言首调 status CR-2026-075 完全不含 --workspace、非零且 stderrCode=WORKSPACE_REQUIRED，然后同 run 恰补参一次。该前置与已批准 SDD §4.2、TASK-01 的入口契约相冲突：有效绑定下真遗漏根必须首次归一，不能产生该首调错误；不完整/冲突绑定应为 WORKSPACE_CONTEXT_MISMATCH，也不能替代。当前任务 01a106ab-7a15-79b1-8097-f110ad6f4425 三元绑定完整；按声明的登记 tools 入口实际只读执行 node <tools-worktree>/skills/shared/crctl/scripts/crctl.mjs status CR-2026-075（没有 --workspace）exit=0，返回 status=task-breakdown，未出现 WORKSPACE_REQUIRED，与源代码 crctl.mjs:3407-3420 一致。故沿用记录的有效绑定环境时 A/B 回放首调不可达，TASK-08 的 cmd-05 全绿完成前置及下游 TASK-10 的 AC-B1/B3 覆盖无法合法满足；若调用时另用了无绑定子进程环境，现有计划未定义该既有执行入口，记录也不包含逐次实际进程环境，不能用节点 input.env 自报代替归因。这是本轮发现的场景可达性/证据翻译问题，不是上轮 B-04 已关闭的入口同名异源识别问题，不要求改 CLI、daemon 或 SDD。修订 plan §6.1 FR-04、§6.2 cmd-05、§7 与 TASK-01/08/10 的回放消费说明：按 SDD 区分有效绑定首次成功（A1）与旧显式入口缺根的一次纠正（B1/B3），明确后者真实可达且已存在的受控执行入口及逐次实际环境/原始调用记录，让验收算法按该真实场景核对，不得伪造 WORKSPACE_REQUIRED、关闭 task 绑定、切旧 CLI 或改实现来迎合断言；保留实际调用方同 run 恰一次纠正、第二次失败停止、受控入口来源和短提示原文交叉核对，不新增执行器/重试服务/框架。取证 HEAD：KB 7376daf9e4474e05991bec81258f556b69dfa3cd，tools 27a4300a0aa1793a442b543ddb8328cb0d3ce562，multica 9d1c10d267fe97a9a2232293796a0ef51d284eea；SDD LF sha256=86179d81c2c3a70c57ee1cfef178752429e20f80c45e5e82d59979d88973f9d6。repair-target=write-dev-plan。"

  - "部分解决：上轮原文【部分解决：上轮原文【本轮新增：B-05 FR-15/FR-16、AC-B14（cmd-09、cmd-10）：plan R8/§5 与 TASK-09/10 将实际同步和生效核对移到未落实的交付期，并以 pending-deploy 作为开发 TASK 完成出口；但已审批 SDD §4.8/§5.2 明确要求实际生效版本一致。cmd-10 仅校验 imported Skill 的 origin 路径/ref 并打印四个 CR Agent 的 instructions 摘要，不读取/比对实际 Skill 内容，也不比较线上 instructions 与目标正文，且遗漏规划/竞品两个调用方 Agent；部署后原样复跑仍不能证明版本一致。修订 plan FR-15 与 TASK-09/10，落实有权限者同步及实际内容/版本比对的步骤、责任和证据，覆盖两个业务调用方；必要人工授权须明确列为前置，不得越权写线上配置，不得把 pending-deploy 或路径一致当作 AC-B14 通过，也不得把 merge/writeback 设为开发 TASK done 前置。】本轮已落实人类 owner 同步前置、六个 Agent 正文比对与 cmd-11 的 Skill 内容读取，并删除 pending-deploy 通过出口；CLI 实查 agent list 含 instructions、skill get --with-content 含 content/files[].content，读取字段有效。但 plan §6.2 cmd-11 只遍历线上返回的 SKILL.md 与 g.files，再向仓库逐文件比对，未核对仓库应发布文件集到线上文件集的反向包含，缺失的新文件永不进入循环。只读执行该表行原样算法的隔离反例（模拟 CLI 返回，非线上部署实测）：14 个 Skill 全部只有与仓库匹配的 SKILL.md、files=[]，两个业务 Agent 正文匹配时，仍打印 cmd-11 ok；即 crctl 的 scripts/crctl.mjs、lib/planning-entry.mjs、lib/competitive-report.mjs 等执行文件均未发布也能假绿。修订 cmd-11 与 TASK-09/10：以本 CR 各 TASK 声明的完整发布文件集为期望，先断言每个必需根正文/附带文件在线上存在，再逐文件比对 LF 内容；明确新增两个 lib/测试/manifest 与所有本次改动文件的集合，缺文件必须非零退出。范围外既有漂移按 PRD/plan R8 单列，不用现存线上子集声称 AC-B14 生效版本一致。】本轮 cmd-11 已加入 EXPECT，两个新增 lib、两个 Node 测试与 manifest 缺失会非零退出（隔离负控删 planning-entry.mjs 得 exit=1），此前整个旧子集假绿缺口已收窄；但 TASK-07:26 声明本 CR 会修改 engineering-docs/scripts/src/__tests__/generators.test.ts 与 validators.test.ts，TASK-09:35 要求同步各 TASK 的本 CR 改动文件，cmd-11 的 engineering-docs EXPECT 却只含 SKILL.md、slug.ts、base.ts、index-sync.ts 四项，遗漏这两个 in-scope 测试文件。只读隔离反例原样执行 cmd-11 表行（内存 CLI/fs 替身、非线上部署实测、零平台写入）：28 个 EXPECT 文件和两个业务 Agent 全部匹配，但线上这两个测试仍为旧正文，算法把它们列为 out-of-scope-drift engineering-docs N=2 并 exit=0、打印本 CR 声明发布集全覆盖。删除这两文件同样不进入期望循环。此处把本 CR 明确改动误划为范围外，仍不能证明 FR-15/FR-16、AC-B14 所声称的完整发布集一致。修订 plan cmd-11 与 TASK-07/09/10：按本 CR 各 TASK 文件清单核对完整期望集，将这两个改动文件纳入存在性与 LF 内容必过比对；缺失/旧正文须非零退出，只有真正 scope_out 的既有漂移才可单列，不扩大部署权限、不新增发布服务。repair-target=write-dev-plan。"

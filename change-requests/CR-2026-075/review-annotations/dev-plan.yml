blockers:
  - "部分解决：上轮原文【本轮新增：B-04 FR-04/FR-16、AC-B1/B3（cmd-01）：SDD §5.2 要求以节点日志/回放证明同节点同 run 最多一次纠正及第二次失败进入异常路径。plan §6.1/§7 只映射 CLI 单文件测试 cmd-01，TASK-01 仅证明 CLI 缺参/补参边界，TASK-10 将调用方回放向量列入 uncovered-risks，十条命令均不执行该回放，缺少实际产出回放证据的 TASK owner。记录未覆盖不能替代关键 AC 验收。修订 plan 证据映射、TASK-01/08/10：落实既有节点回放的输入、执行步骤、同 run 调用计数/失败路由断言及归档责任，让稳定证据 ID 的观测面真正覆盖 AC-B1/B3；不新增重试服务或测试框架。】本轮 plan §6.1/§6.2、TASK-08 与 TASK-10 已加入 cmd-05 和归档责任，但回放被定义为测试 fixture 自己按既定顺序调用真实 CLI 两次并断言自己不发第三次调用；未执行实际 Pipeline/Issue 调用方节点，也未消费可归因的实际节点/run 调用记录。CLI 不负责决定调用方重试/异常委派，合同文本加测试自身计数不能证明 SDD §5.2 明定的 Pipeline 提示词行为、同节点同 run 一次纠正和第二次失败异常路由，观测面仍小于 AC-B1/B3 声称面。修订 plan FR-04/AC-B1/B3 的 cmd-05、TASK-08 与 TASK-10：明确实际受控调用方节点的输入、可归因 run/node 记录来源与回放执行入口，以该调用方产生的记录断言纠正次数、停止和异常路由；CLI fixture 仅保留为边界单测，不得充作调用方行为验收；不新增重试服务或框架。"
  - "部分解决：上轮原文【本轮新增：B-05 FR-15/FR-16、AC-B14（cmd-09、cmd-10）：plan R8/§5 与 TASK-09/10 将实际同步和生效核对移到未落实的交付期，并以 pending-deploy 作为开发 TASK 完成出口；但已审批 SDD §4.8/§5.2 明确要求实际生效版本一致。cmd-10 仅校验 imported Skill 的 origin 路径/ref 并打印四个 CR Agent 的 instructions 摘要，不读取/比对实际 Skill 内容，也不比较线上 instructions 与目标正文，且遗漏规划/竞品两个调用方 Agent；部署后原样复跑仍不能证明版本一致。修订 plan FR-15 与 TASK-09/10，落实有权限者同步及实际内容/版本比对的步骤、责任和证据，覆盖两个业务调用方；必要人工授权须明确列为前置，不得越权写线上配置，不得把 pending-deploy 或路径一致当作 AC-B14 通过，也不得把 merge/writeback 设为开发 TASK done 前置。】本轮已落实人类 owner 同步前置、六个 Agent 正文比对与 cmd-11 的 Skill 内容读取，并删除 pending-deploy 通过出口；CLI 实查 agent list 含 instructions、skill get --with-content 含 content/files[].content，读取字段有效。但 plan §6.2 cmd-11 只遍历线上返回的 SKILL.md 与 g.files，再向仓库逐文件比对，未核对仓库应发布文件集到线上文件集的反向包含，缺失的新文件永不进入循环。只读执行该表行原样算法的隔离反例（模拟 CLI 返回，非线上部署实测）：14 个 Skill 全部只有与仓库匹配的 SKILL.md、files=[]，两个业务 Agent 正文匹配时，仍打印 cmd-11 ok；即 crctl 的 scripts/crctl.mjs、lib/planning-entry.mjs、lib/competitive-report.mjs 等执行文件均未发布也能假绿。修订 cmd-11 与 TASK-09/10：以本 CR 各 TASK 声明的完整发布文件集为期望，先断言每个必需根正文/附带文件在线上存在，再逐文件比对 LF 内容；明确新增两个 lib/测试/manifest 与所有本次改动文件的集合，缺文件必须非零退出。范围外既有漂移按 PRD/plan R8 单列，不用现存线上子集声称 AC-B14 生效版本一致。"
  - "本轮新增：B-07 FR-12/FR-16、AC-B17/B18（cmd-04、cmd-02、cmd-03）：plan §2 与 TASK-03 任务描述明确要求消费者 TASK-04/05 未完成不得单独标记 TASK-03 done，而 TASK-04/05 的 depends-on 和 _index.yml 又以 TASK-03 为直接前置。目标 tools crctl.mjs:754 guardDependsOn 与 :1831 cmdTaskDone 要求直接前置全部 done，故 TASK-03 等待 04/05 完成、04/05 又无法合法 done，形成完成门隐性循环；只读运行权威 guard 对当前索引分别返回 DEPENDS_ON_NOT_DONE，不曾调用 task done 或写账本。修订 plan §2 与 TASK-03/04/05/10：生产者以原语及缺省兼容验收完成后即时登记 done，消费者按既有 DAG 实现并完成；要求真实业务入口的跨消费者联合向量由各消费者及 TASK-10 验证，不把下游完成作为上游 task done 的前置，不削减 SDD 验收范围、不绕过 guard、不改门禁。"

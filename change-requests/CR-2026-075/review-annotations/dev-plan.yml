blockers:
  - "本轮新增：B-01 FR-12/AC-B17～B18（cmd-04、cmd-01）：TASK-03 实现要点把既有 recoverLedgerCommand(ws,key) 改为 recoverLedgerCommand(ws,key,inputDigest) 并无条件传 expect.inputDigest，但目标 tools crctl.mjs:1201/1871/2093/2594/2852 的五个既有调用者全部仍只传两参，且 TASK-03 不允许改这些处理器；因此恢复既有 journal 时 inputDigest 来源未定义，会落入 TX_INPUT_CONFLICT 或迫使扩大既有算法修改。SDD §9 zero_diff 第④类仅批准该 helper 的 sampleCommitState 接线，业务意图比对属于新增 recoverBusinessLedgerCommand。修订 plan M3/R3 与 TASK-03：既有 helper 保持两参与无 expect 的兼容语义，业务摘要/txId 比对落到 TASK-04/05 的新增业务 helper，并用 cmd-04/cmd-01 验证既有调用的恢复兼容。"
  - "本轮新增：B-02 FR-09/FR-11（cmd-03、cmd-01）：TASK-05 明确消费 TASK-04 产出的 cmdBusinessEntry(wsRoot,flags,kind) 骨架，但其 depends-on 与 _index.yml 仅列 TASK-03，plan §2 又称两任务互不依赖；按当前 DAG，TASK-05 可在 TASK-04 前执行，唯一骨架尚不存在且禁止复制，任务不可独立执行。业务意图互不依赖不等于实现产出无依赖。修订 plan §2、TASK-05 及经 crctl task init 重建的索引，加入 TASK-04 的实现依赖并核对共享 crctl.mjs 的顺序编辑与验收先后。"
  - "本轮新增：B-03 FR-01/FR-15 的任务可执行性：TASK-02 验收条件3 与 TASK-09 验收条件4 将受控 git status 的 --workspace 设为 multica-worktree，而不是传入的 KB operational workspace；实测该 multica worktree 不含 change-requests/，目标 crctl.mjs:146 的 detectWorkspace 不向上探测，故现有入口必报 WORKSPACE_NOT_FOUND；绑定生效后显式异根又会先报 WORKSPACE_CONTEXT_MISMATCH。修订这两张卡的 argv：--cwd 仍取 multica resource，--workspace 原样使用本节点传入的 KB workspace；不得另设回退或修改 detectWorkspace。"
  - "本轮新增：B-04 FR-04/FR-16、AC-B1/B3（cmd-01）：SDD §5.2 要求以节点日志/回放证明同节点同 run 最多一次纠正及第二次失败进入异常路径。plan §6.1/§7 只映射 CLI 单文件测试 cmd-01，TASK-01 仅证明 CLI 缺参/补参边界，TASK-10 将调用方回放向量列入 uncovered-risks，十条命令均不执行该回放，缺少实际产出回放证据的 TASK owner。记录未覆盖不能替代关键 AC 验收。修订 plan 证据映射、TASK-01/08/10：落实既有节点回放的输入、执行步骤、同 run 调用计数/失败路由断言及归档责任，让稳定证据 ID 的观测面真正覆盖 AC-B1/B3；不新增重试服务或测试框架。"
  - "本轮新增：B-05 FR-15/FR-16、AC-B14（cmd-09、cmd-10）：plan R8/§5 与 TASK-09/10 将实际同步和生效核对移到未落实的交付期，并以 pending-deploy 作为开发 TASK 完成出口；但已审批 SDD §4.8/§5.2 明确要求实际生效版本一致。cmd-10 仅校验 imported Skill 的 origin 路径/ref 并打印四个 CR Agent 的 instructions 摘要，不读取/比对实际 Skill 内容，也不比较线上 instructions 与目标正文，且遗漏规划/竞品两个调用方 Agent；部署后原样复跑仍不能证明版本一致。修订 plan FR-15 与 TASK-09/10，落实有权限者同步及实际内容/版本比对的步骤、责任和证据，覆盖两个业务调用方；必要人工授权须明确列为前置，不得越权写线上配置，不得把 pending-deploy 或路径一致当作 AC-B14 通过，也不得把 merge/writeback 设为开发 TASK done 前置。"
  - "本轮新增：B-06 FR-16（cmd-01～cmd-10）：已审批 SDD §5.2 与 SDD-CLOSE-09 指定新增测试登记 manifest，且全量门禁执行口径为 node suite-gate.mjs --run；plan §6.2 与 TASK-10 完全没有该门禁，现有十条定向命令不执行 suite-gate 的逐文件加载/manifest 集合与 case 基线判定，因此不能证明新增文件已进入既有门禁。修订 plan 覆盖/证据命令表与 TASK-04/05/10，保留并绑定 SDD 已批准的 suite-gate 执行及结果，或以既有支持的 --report 形态闭合相同门禁判定；不以未经批准的其他全仓命令替代。"

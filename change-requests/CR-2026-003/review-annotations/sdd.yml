blockers:
  - id: SDD-BLOCK-001
    location: "§2 数据模型 + §4.1 占位符方案"
    issue: >-
      §2 的关键断言「commit_sha 列在业务逻辑中只被用作幂等键的一部分（从未被反查语义化）」
      与实际代码不符：multica crsync.go applyStatus() 的 INSERT 分支（L242）和 UPDATE 分支
      （L255 的 CASE WHEN $4 <> '' THEN $4）都会把非空 commit_sha 写入 cr.projected_commit。
      按 §4.1 的占位符方案，pending:{ms}:{pid}:{seq} 这类字符串会被当作真实 commit 指针
      污染投影表——看板会显示一个不存在的 commit，且在下一个 checkpoint/reconcile 覆盖前
      持续可见。修复方案缺服务端配套防护。
    suggestion: >-
      SDD 需补充服务端半边：applyStatus 的两处写入点把「pending: 前缀的 sha」按空串对待
      （仅用于幂等键，不写入 projected_commit）；§2 的错误断言改写为如实描述；
      占位符前缀 "pending:" 是 crctl(JS) 与 multica(Go) 的跨语言契约，需仿照
      digest-vectors 的做法在两侧测试中锁定（至少各有一条断言引用同一字面量）。

      风险依赖不存在的错误发射方，不阻塞
  - id: CODE-SUG-002
    severity: minor
    file: "tools skills/shared/crctl/scripts/crctl.mjs（emitOutboxEvent 文件名）"
    issue: >-
      占位符消毒后文件名片段恒为 pending1（pending:17…去符号取 8 位），同一 UTC 毫秒内
      两次 embedded advance 会同名互覆丢事件。属既有风险平移（旧代码空串 → 恒为 nosha，
      完全同型），且两次 advance 是独立进程 spawn（现实 ≥50ms），当前不可触发
    suggestion: "若未来出现程序化批量 embedded 推进，把 pending 事件的文件名片段延长（如取消毒后 16 位）即可；现在不动"

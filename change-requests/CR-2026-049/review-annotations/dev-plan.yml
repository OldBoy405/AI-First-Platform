blockers:
  - "DP-B1 计划估算不一致：plan.md 里程碑估算为 2+3+1.5+2+4+1=13.5 人天，但 tasks/_index.yml/crctl task init 的 TASK 总工时为 144h=18 人天，无法作为可执行排期。回修必须按 TASK 工时重算每个里程碑并让总和等于 144h/18 人天，或同步调整任务估算；plan 与 index 不得保留两个口径。"
  - "DP-B2 TASK-10 接口契约不可执行：验收要求每个 GitHub page 调用 heartbeat，但 ScanRepo(ctx,bound,prevCursor) 没有 heartbeat 输入；CommitPrefixScanJob(pool, bindings, gh) 也没有表达 per-workspace scope 内解析绑定的 resolver。回修必须固定签名，例如 ScanRepo(ctx context.Context, in ScanRepoInput{Bound BoundRepo, PrevCursor *string, Heartbeat func(context.Context) error}) (*ScanResult,error)，JobSpec handler 按 in.Scope.ID 调用 ResolveBindings，不能使用全局静态 bindings。"
  - "DP-B3 依赖拓扑与计划文字矛盾：plan.md 写明 TASK-04/TASK-05 都完成后才能 TASK-06，但 TASK-06 仅依赖 TASK-05；TASK-13 消费全部 TASK 产物/做全量集成，却仅依赖 TASK-03、TASK-12，task init 会在其余 TASK 未完成时允许 done。回修必须让 TASK-06 显式依赖 TASK-04/TASK-05，并让 TASK-13 依赖所有 TASK-01..TASK-12（或建立等价的完整收敛链），同时更新 plan 依赖图。"
  - "DP-B4 TASK-10 的扫描输入/输出契约不足以锁定 SDD 的不漏扫算法：BoundRepo 未明确承载 Prefixes []string，ScanResult 未明确区分固定 HEAD=B 与推进 Cursor，ListCommits/扫描接口也没有把精确 cursor-stop 语义写进 TASK。回修必须在 TASK-09/TASK-10 接口契约中补齐 BoundRepo{Prefixes []string}、ScanRepoInput{PrevCursor, Heartbeat}、ScanResult{HeadSHA, Cursor, Findings}，并明确分页从 HeadSHA=B 到精确 PrevCursor=A，未命中/截断/限流不得推进 cursor。"

blockers:
  - "SDD-B05 旧 commit-scan fallback 仍未闭合：SDD 只规定 crctl review outbox 扩充字段，但 daemon buildReviewPayload 当前按 stage+'.yml' 取文件（tech-design 实际 canonical 文件是 sdd.yml），且 reviewBlocker 结构不能可靠解析 canonical blockers 字符串；outbox 缺失/延迟时同一 review 不会产生与 outbox 相同的 attempt、blockers、reviewed_at、subject_sha256，Runner 的 fail-closed 证据链仍断裂。修复：daemon 使用显式 stage→annotation 文件映射，复用现有行尾规范化/安全 YAML 解析，兼容 canonical scalar blocker 与结构化 blocker，输出与 crctl outbox 完全相同的 review payload 字段；增加 commit-scan-only、outbox-vs-scan parity 和 tech-design sdd.yml 取证测试。"
dimensions:
  PRD↔SDD 对齐: "BLOCK：B-01～B-04 已有具体落点；FR-05/FR-08 要求事件乱序和 fallback 可恢复，当前 commit-scan 分支尚未覆盖。"
  架构合理性: "PASS：source attribution snapshot、detail.runner merge、LocalWorkDir 和 canonical outbox 扩展均复用现有边界；本 blocker 是同一 daemon 扫描器的兼容修复，不新增通道。"
  数据模型完整性: "PASS：run/node/task schema 与两条 partial unique index 已覆盖并发和归因；缺口在事件 payload 生成。"
  接口契约: "BLOCK：outbox payload 已定义，但 commit-scan 生成的 review payload 尚未与其字节/字段契约一致。"
  性能与安全: "PASS：仍是现有 heartbeat 扫描和 outbox 合并路径；解析失败硬失败/跳过，不降级成空 review 或 pass。"
  可测试性: "BLOCK：缺 commit-scan-only 与 outbox/scan parity 测试，无法证明 fallback 不改变 Runner 路由。"
  Prompt 采纳影响: "PASS：仍不新增 crctl 子命令、guard deny 或 Skill prompt 调用面。"
suggestions:
  - "修复后把 review payload 的字段集合固定为 stage/verdict/attempt/blockers/reviewer/reviewed_at/subject_sha256，旧缺字段事件仅供旧 UI 投影，不供 Core 调度。"

  - "CODE-B08 [server/internal/governance/runner.go: checkDigest] AC-13 要求 registry digest 漂移时明确阻断但保持同一 active run，部署回相同 digest 后可继续；当前 checkDigest 调 failRun，把 run 永久置 failed，恢复原 digest 后 findActiveRun 已找不到该 run。修复为非终态 fail-closed wait/error，并加 drift→阻断→restore→同 run 继续测试。"

  - "CODE-B10 [TASK-11 / PRD AC-04~10, AC-12, AC-15, AC-18 / test-report.md §5] canonical 测试报告明确未执行真实 daemon + Agent CLI + signed grant 五节点 E2E、feature-off 手动路线；TASK-11 明确要求 runner_e2e_test.go 真实 crctl 深原语和手动回归，但仓库不存在该产物，且 daemon 全包回归在本机失败。当前不能把 TASK-11/AC-15/AC-18 判为通过。补可复现 E2E/手动路线证据，或将无法在本环境执行的发布门禁保持为 blocker，不得仅凭表级模拟让代码评审 PASS。"

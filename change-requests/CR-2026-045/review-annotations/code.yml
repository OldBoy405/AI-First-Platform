blockers:
  - "CODE-B01 [server/internal/governance/runner.go: Reconcile/currentNode/authorityPostcondition] 五节点调度未实现批准的双重后置条件：review-tech-design 无条件返回 true，human_approval 会落入 enqueueNode 创建 Agent task，checkpointProjected 永远 false，且 review block 未按 replayNodes 回放 write→review。修复：以 canonical review detail、delivered approval_record、checkpoint event（晚于 push started_at）作为权威事实；human_approval 只 waiting，不入队；实现 block→write/review attempt+1 与 maxAttempts exhaustion。"
  - "CODE-B02 [server/internal/governance/runner.go: StartArchitecture/upsertRun/promptFor] Start 合同与幂等不完整：重放始终 changed=true，projector 预建 run 不补 execution_context，未校验 registry node kind/Skill binding，prompt 未替换 cr_id/tech_context 且无长度/残留 token 校验，UUID 解析错误被吞。修复：返回真实 created 标志、原子补齐/校验匹配 run、启动期验证 registry、校验 executor Skill refs、严格 UUID/CR ID/tech_context，并只渲染声明 token。"
  - "CODE-B03 [server/internal/governance/gate_projection.go + runner/task enqueue] 并发与多写者契约未闭合：projector findOrCreateRun 在 unique conflict 后不重读；CreatePipelineTask unique loser不重读；applyReview 整段覆盖 detail 会删除 detail.runner。修复：两个竞态 loser 均重读既有记录，review 投影使用 JSONB 顶层 merge 且禁止 payload.runner，终态节点不得被重开。"
  - "CODE-B04 [server/internal/daemon/* + handler/daemon.go] TASK-08 只透传 prompt，未实现 CR root 唯一解析、从 controlled-shell rules 派生 crctl、shell=false workspace inspect、healthy/realpath 校验、operationalWorkspace→LocalWorkDir、CRCTL_WORKSPACE、path lock/cleanup；PipelineLocalWorkDir 永远为空。按 SDD §3.5 补齐 daemon prepare 路径及 0/1/2 root、inspect/rules/path 测试，普通任务路径保持不变。"
  - "CODE-B05 [server/internal/governance/approval.go + router.go] TASK-09 未接 grant ACK→Reconcile，Runner 也未查询 delivered_at；同时无 feature-off 开关，server 总是实例化/扫描/接管，违反 AC-07/08/15。修复：ApprovalService ACK 返回受影响 CR 并直接唤醒同一 Runner；只有 matching tech-design delivered grant 才越过 human_approval；增加默认可控启停且关闭时不挂 Start/不订阅/不扫描。"
  - "CODE-B06 [daemon review fallback + gate_projection.go] commit-scan parity 不成立：canonical annotation 当前不含 review-loop.current-attempt，buildReviewPayload 因而把 attempt 读成 0；applyReview 又强制成 1，复审 attempt 会投错。修复 crctl canonical annotation 或 fallback 的权威 attempt 来源，并增加 attempt=2、subject digest、outbox/commit-scan 字段逐项 parity 测试。"
  - "CODE-B07 [tests/test-report] TASK-04/06/07/08/09/11 验收测试与 E2E 缺失却已标 done；test-report 明示真实 PG 并发、Runner table tests、grant/checkpoint、daemon workdir、feature-off、五节点 E2E 均未执行。修复生产缺口后补最小可运行单元/集成测试，重新通过 crctl test 生成 canonical 报告；无法取得真库/真机证据时不得把这些 TASK 标为完整覆盖或让代码评审 PASS。"

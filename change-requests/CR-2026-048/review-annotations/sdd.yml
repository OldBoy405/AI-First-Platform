review-type: tech-design
reviewer: "OldBoy405"
reviewed-at: "2026-08-20T14:22:43+08:00"
verdict: block
blockers:
  - "工作区隔离缺失（违反 ARCHITECTURE.md 硬不变式 1）：§2.1 的 skill_usage_event 无 workspace_id，而 §4.3 的 MarketSkillUsage 仅 join agent_task_queue —— 经核实该表只有 agent_id/issue_id/project_id（project_id 由迁移 368 加入），没有 workspace_id 列，因此聚合会跨工作区混算使用量；§3.3 的 GET /api/skills/market 也未定义返回哪些 skill。修复：迁移 381 增加 workspace_id UUID NOT NULL（claim 侧 buildClaimedTaskResponse already 持有 runtimeWorkspaceID 形参，零额外查询即可落列），索引 383 改为 (workspace_id, skill_ref, used_at)，§4.3 查询加 WHERE e.workspace_id = $1，§3.3 明确 market 只返回该 workspace 内 visibility='org' 的 workspace skill + builtin。"
  - "申诉查找打在热表且无可用索引：activity_log 现有索引全部以 issue_id 打头（001_init 的 idx_activity_log_issue → 068 的 idx_activity_log_issue_keyset、089 的 idx_activity_log_squad_no_action_task），而申诉行 issue_id 为 NULL，§2.2/§4.2 步骤 6 的 details->>'appeal_id' 查找会退化为 activity_log 全表扫描，与 §7 自称的性能口径矛盾。修复二选一并在 SDD 里定死：(a) 增加迁移 384，单文件单语句 CREATE INDEX CONCURRENTLY 建部分表达式索引 ON activity_log ((details->>'appeal_id')) WHERE action IN ('skill_appeal_submitted','skill_appeal_approved','skill_appeal_rejected')，并同步 concurrentIndexCleanups/concurrentDownIndexCleanups 双注册 + EXPLAIN 断言；或 (b) 放弃历史查找，改为发布响应内一次性回传放行票据。"
  - "发布后内容更新绕过敏感扫描：§4.2 门禁只在 private→org 转换时触发，org 可见 Skill 之后经 UpdateSkill（visibility 不变）或 runtime-local 覆盖导入（canOverwriteSkillByLocalImport 路径）更新 content/skill_file 时不重扫，密钥可在发布之后夹带进组织可见资产，与 US-2/NFR-4 的隐私红线冲突。修复：§4.2 增加触发条件——skill.visibility='org' 且本次请求改变 content 或 files 时，跑同一个 PublishGate（复用同一函数，不新增机制），并明确覆盖 runtime-local 覆盖导入路径；同步更新 §6 的 FR-17 行与 §7 安全节。"
dimensions:
  prd_sdd_alignment: "通过：23 条 FR 全部有实现锚点，§6 映射表逐条可核"
  architecture: "阻断：workspace 隔离硬不变式在遥测表与 market 查询上未落实"
  data_model: "阻断：skill_usage_event 缺租户键；申诉账本缺可用索引路径"
  interface_contract: "阻断：market 端点的可见性与工作区范围未定义；其余端点与错误码清晰"
  performance_security: "阻断：appeal 查找退化为热表全表扫描；发布后内容更新存在扫描绕过"
  testability: "通过：门禁为纯函数、EXPLAIN/diff/403 等验收均可执行"
  prompt_adoption: "跳过：本 CR 不触及 crctl.mjs dispatch 与 rules.json#protectedPaths.deny，§8 已说明"
suggestions:
  - "§4.1 的插入点在 claimResponseAgentIdentityMatches 之前，构建后被跳过/取消的任务也会留下遥测行；因 status='completed' 过滤而不影响计数，建议在 SDD 注明这层自愈关系，避免实施者误加补偿逻辑。"
  - "§7 只提了 sqlc 生成物提交，补一行 CUSTOM.md 台账登记（PRD AC-17 要求）。"

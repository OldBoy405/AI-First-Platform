dimensions:
  code_task_sdd_alignment: "通过：attempt 1 的 8 条 blocker 全部有代码与证据对应——FR-20/FR-21 由 SkillResponse.metadata + SkillMetadataCard 落地（TASK-09 验收 2）；FR-23 由 market 查询解析 source + 前端真过滤落地（验收 1）；AC-14 的 EXPLAIN 半边由 TestSkillMarketQueriesUseNewIndexes 覆盖（TASK-01 验收 4）；迁移 381 补 COMMENT ON。TASK-01~10 与 SDD 契约一致。遗留一处未记录偏离：新增 /skills/market 页面与路由 vs SDD §1「不新增页面/路由」，功能等价，转 suggestions 由回写期以 SDD revision 记录。"
  engineering_quality: "通过：门禁收敛为 runPublishGate 单入口（扫一次 + Release 逐条放行），skill.go/skill_create.go 的重复块与三处 BuildManifest 组装消除；死变量 skillAppealActions、自我对拍的 ProtectedPathPatternsPin、名不副实的 BlocksOrgPublishOnSecrets 用例已删；redact.Findings 规范化 CRLF。go vet 与 eslint 均 exit 0（eslint 首跑暴露的两处 i18next 报错已修）。net 效果：回修 diff 480+/199-，其中删除项覆盖上一轮全部精简建议。"
  key_path_readability: "通过：runPublishGate 的注释说明了 contentHash 与 appeal 失效的构造关系；GetAppealDecision 的 SQL 注释写明「最近一条决定，驳回可撤销放行」；submitSkillAppealRequest.AppealID 的注释解释了为何不在服务端重算哈希。"
  security: "通过：放行可撤销（真库回归覆盖 approve→publish 200→reject→publish 422）；申诉提交只是记账，实际放行仍只认 owner/admin 对门禁下发 id 的决定（非 owner 403 用例保留）；422 findings 仍全程 Text() 脱敏，新增断言确认掩码后的 home 路径不被 personal_path 二次改写。"
  test_coverage: "通过：新增三条真库回归（EXPLAIN 索引命中三例、放行撤销、未落库内容的申诉链路含账本 id 一致性断言）+ redact CRLF/掩码兼容断言 + parseRequirements 四组断言；前端组件渲染仍无自动化覆盖（vitest 本机无法启动，已降级说明）。"
  test_evidence_credibility: "通过：11 条命令 exit 0，command-digest 与 traceability.yml 一致，cmd-01..11 日志齐全且内容非空；覆盖矩阵按本轮实际证据重写，AC-14 不再挂在编译/cleanup 测试上；vitest 失败以原始输出 + 隔离探针落进 test-evidence/vitest-startup-failure.log，降级理由可核验；COMMENT ON 未在本地库重放一事在「未覆盖」显式声明，不再是隐藏高估。"
  frontend_quality: "通过：① loading（Skeleton）、empty（文案）、error（isError 分支 + load_failed 文案）三态齐全；② session-export 控件真过滤，builtin 在该筛选下清空；③ eslint 全绿，4 份 locale 键集合一致（cmd-11 断言），未新增依赖，体积影响限于两个组件与一个纯函数模块。a11y 沿用既有 Badge/Button 语义色，未见破 AA 写法。"
suggestions:
  - "SDD §1/§5 与 TASK-09 写的是「不新增页面/路由」，实现新增了 /skills/market 页面 + 桌面端路由 + web page.tsx，且 skills-page.tsx 未改；本 CR 不回退实现，回写期以 SDD revision 记录该偏离与理由（工程纪律第 4 条）。"
  - "ListOrgSkillSummariesByWorkspace 为解析 source 而 SELECT content，org Skill 很多时会把全部 SKILL.md 正文读进内存（单体 50–200KB 量级）。AC-13 禁止新增 source 列，当前取舍合理；若 org Skill 规模上量，改为 SQL 侧只截取 frontmatter 片段。"
  - "迁移 381 的 COMMENT ON 未在本地库重放（全量 down 撞既有 373 冲突），全新环境首次 migrate up 才生效；合入前在干净库上跑一次 up 确认。"
  - "claim 遥测插入失败路径仍无注入式测试（slog.Error + continue），维持上一轮的观察项结论：不值得为此加 fixture。"

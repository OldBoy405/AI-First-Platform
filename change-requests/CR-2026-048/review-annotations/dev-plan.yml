blockers:
  - "依赖拓扑错误：TASK-04 声明 depends-on 含 CR-2026-048-TASK-05，但同卡「接口契约·消费」只列 redact（TASK-02）、ParseSkillMetadata（TASK-03）与由 handler 传入的 contentHash 字符串——门禁是不碰 DB 的纯函数，approved map 由 TASK-07 解析后传入，对 sqlc 产物零消费。该假依赖把可与 05 并行的门禁开发串行化，也与 plan.md §2 的并行度描述自相矛盾。修复：TASK-04 的 depends-on 改为 [CR-2026-048-TASK-02, CR-2026-048-TASK-03]，plan.md §2 依赖图与其下并行度说明同步改为「04 依赖 02/03」，并重跑 crctl task init 刷新 _index.yml。"
  - "PRD 验收面未被 TASK 承接：PRD 共 AC-1～AC-16，但全部 TASK 卡只引用了 AC-4。逐条核对后有四条无任何 TASK 的验收条件覆盖——AC-2（改内容不改 version 仍判定内容已变、改 version 不改内容判定未变、版本在列表/详情可见）、AC-9（代码中不存在 builtin 可编辑性特判分支）、AC-15（迁移应用于含存量 Skill 的库后既有 Skill 全为 private 且 daemon 侧物化行为不变）、AC-16 的后半（新增 Go/SQL 文件注释为英文并带 AIFIRST: 标记）。修复：AC-2 与 AC-9 落进 TASK-07 验收条件（版本可见性部分可落 TASK-09），AC-15 落进 TASK-01 验收（含存量 skill 行的 fixture 断言 + daemon 物化回归），AC-16 注释/标记落进 TASK-10 验收；并在每条 TASK 验收后标注对应 AC 编号，使 plan→TASK→AC 可机械回指。"
  - "悬空验收引用：TASK-10 正文引用「PRD NFR-6/AC-17」，但 PRD 在需求评审回修后 AC 只到 AC-16，AC-17 不存在。实施者按该编号找不到验收依据。修复：TASK-10 的引用改为 AC-16，并核对其余 TASK 卡不存在同类越界编号。"
  - "索引形制在 PRD 与 SDD 之间漂移且 TASK 未留取代痕迹：PRD AC-14 写的是 `(task_id)` 与 `(skill_ref, used_at)` 两个索引，而 SDD 技术评审回修后改为 `(task_id)`、`(workspace_id, skill_ref, used_at)` 三索引（新增 384 申诉部分索引），TASK-01/05 直接按 SDD 实施但未标注这层取代关系。按 AC-14 字面实施会建出无工作区隔离的索引，正是技术评审 blocker 1 修掉的问题。修复：TASK-01 验收显式写明三条索引与 AC-1/AC-14 的映射，并注明「SDD §2.1（技术评审回修）取代 PRD AC-14 的索引形制表述，PRD 已审批不回改，取代关系在此留痕」；TASK-05 的 EXPLAIN 验收同步按 scope 索引表述。"
  - "迁移编号未做实施前 freshness 约束：TASK-01 把 380–384 当既定编号，但本仓 CUSTOM.md 记录了 159/160/161/162/163 等多次上游撞号并专列《迁移编号冲突》处置，CR-2026-047 的台账行也明写实施前需重新确认唯一编号。修复：TASK-01 实现要点或验收中加一条前置动作——开工前确认 380–384 未被上游新迁移占用，撞号则按《迁移编号冲突》整体顺延并同步 concurrentIndexCleanups/concurrentDownIndexCleanups 两个 map 的键名。"

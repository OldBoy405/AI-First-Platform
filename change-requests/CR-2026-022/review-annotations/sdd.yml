verdict: block
blockers:
  - "B1（§2.2 状态机变更自相矛盾，纪律 #4 事实断言未核实）：正文先插入一条 `review-requirement:block -> write-requirement-prd` 转换再划掉说『不加这条』——且该转换在 dir-graph.yaml 中本就不存在（需求阶段 block 语义是保持 drafting 不推进，与 tech-design 的显式回退不同），插入再划掉的写法会让实施者误读为需要删除一条不存在的转换。应改为：只声明新增 `approve-requirement:reject -> write-requirement-prd` 一条，并如实说明『review-requirement:block 在需求阶段无显式转换、语义为保持 drafting』"
  - "B2（§3.1/§4.3 与 §5 D-6 自相矛盾，纪律 #4）：§3.1 写 decline 回退成功时 stdout 输出结构化 JSON `{result:'declined-rolled-back',...}`，§4.3 伪代码却是 fail('APPROVAL_DECLINED_ROLLED_BACK')（错误通道输出），§5 D-6 又强调非零退出。三处对『成功回退的输出形态』表述不一致（stdout JSON vs stderr 错误 vs 仅非零退出），实施者无法确定契约。应统一为：非零退出 + fail() 的 extra 字段携带 {rolledBackTo, rerunHint}，删除 §3.1 的 stdout JSON 表述"
  - "B3（§4.3 REJECT_ROLLBACK 映射表 dev-start 回退目标与状态机不符）：dev-start 阶段当前状态是 task-breakdown，dir-graph.yaml 无 `task-breakdown -> tech-design-reviewed` 转换（只有 task-breakdown 自环与 -> developing）；且 gates.json approvalStages 中 dev-start 没有 reject 触发器声明，approve-tech-design/approve-code 有。映射表写 dev-start → tech-design-reviewed 属凭空发明转换，findTransition 必查不到、decline 必走 fail 兜底。应改为：dev-start 回退目标 = tech-design-reviewed 且需同步在 dir-graph.yaml 补声明 `task-breakdown -> tech-design-reviewed`（trigger `approve-dev-start:reject -> write-dev-plan`），或如实说明 dev-start 驳回维持现状不回退"
  - "B4（§4.6 cmdNext 的 spec_id 取值来源未坐实，纪律 #4）：写『spec_id 取 _backlog 条目 spec-id 字段』，但未核实 _backlog 条目是否真有 spec-id 字段（cr-init 生成的条目无此字段，merge-metadata 写的是 merge-commits）。若字段不存在，cmdNext 在 writing-back 态永远拿不到 spec_id。应核实字段真实名称（或改为从 change-requests/{cr}/ 目录扫描/从 specs/ 目录推断），并写明核实命令"
  - "B5（§2.4 迁移脚本落点与 §5 D-7 的理由链不成立）：§2.4 说脚本放 skills/planning/scripts/ 是因为 skills/shared/scripts/ 是『被否决的账本脚本库位置』——但 ARCHITECTURE.md §6 否决的是账本操作脚本库，market-insights 迁移是内容文件操作，按 §6 范围澄清（CR-2026-020）内容文件脚本落点先例是 skills/writeback/scripts/，planning 域并无 scripts/ 目录先例。凭空新建 skills/planning/scripts/ 目录属新增结构，应先核实 planning 域是否已有脚本落点先例，或改放与内容回写脚本同构的位置"
  - "B6（§3.3 onFail 告警方案与 D-4 循环引用、未给出可执行形态）：§3.3 表格说 onFail 保持 skip 但 prompt 内嵌『失败时必须写 CHECKPOINT_ALERT 段』，D-4 又说等未来 onFail 支持 warn 语义再升级——但 pipeline JSON 的 onFail 只有 skip/abort 二值是现状约束，prompt 内嵌输出要求对执行者无强制力（§10 自己也承认非机械强制）。该方案实质是『无方案』，应改为可执行形态：要么接受 skip 但由 FR-11 的 checkpoint-add 自身在失败时输出可见错误（工具层告警），要么明确记录为已知残余风险不在本 CR 解决"

suggestions:
  - "建议（不阻塞，归 write-tech-design）：S-1 [sdd §3.2 失败输出（回滚未完成）行、§3.5 四查错误闭包、§5.2 D-2 与 §4.2.1 步骤 13]：REVIEW_LOOP_RESET_COMMIT_ROLLBACK_FAILED 被三处声明为新增错误码（§3.2 已给足可观测契约：exit 1 + extra affected），但 §4.2.1 步骤 13 的伪代码只有 REVIEW_LOOP_RESET_COMMIT_FAILED 一个 fail 调用，abort 与 syncLedgerIndex 都直接经 runTxAsync 抛出（runTxAsync 会把 TxError 原样转成 fail(e.code) 即 TX_* 码），该码在实际代码路径中无产生点。建议二择一并写明：① 给步骤 13 的 abort + syncLedgerIndex 加 try/catch，镜像 rollbackOwnerWrite（crctl.mjs L2471–2484）与 rollbackVersionWrite（L2725–2738），命中时 fail(REVIEW_LOOP_RESET_COMMIT_ROLLBACK_FAILED, …, { affected: [rel] }) 并说明该分支是否写审计；② 或从 §3.2/§3.5/D-2 删除该码，使契约、决策与算法三方一致。盘上已核对两条既有先例以 try/catch + op-scoped 码收口，故 ① 与既有族口径同构、成本最低。"
  - "建议（不阻塞，归 write-tech-design）：S-2 [sdd §4.2.1 步骤 11–12、§3.2 成功副作用行、FR-9 第 4 条]：commit 只包含 review-loop.yml 的保证目前只落在 add 侧（add -A -- <relpath>），而 commit 不带 pathspec、提交的是整个 index——执行前若已有其它暂存变更会被一并带入该提交，与 FR-9 第 4 条、FR-11 与 AC-11 的零无关改动口径不符。既有先例两种做法并存：approve（L1135–1138）只 add 后直接 commit，owner-set（L2541–2543）与 version-set（L2832–2833）在 commit 前复核 unstaged 为空且 staged 恰等于 write-set。建议本 CR 显式择定后者（reset 的 write-set 只有一个路径，复核成本极低），并在 §4.2 步骤 12 补该前置断言，避免实现期随先例二选一。"
  - "建议（不阻塞，归 write-tech-design）：S-3 [sdd dep-14 依赖结论、§6.1 AC-9 可达性列、AC-12]：dep-14 写既有断言基线必须继续通过，但既有成功路径用例（crctl.test.mjs L3430–3452 耗尽态 cycle+1）用的是非 git 的 makeWorkspace()（L62–69 实测只写 dir-graph.yaml 与 change-requests/），改造后 reset 必做 add/commit，该用例会走 commit 失败分支并返回 exit 1，不再是 status 0。建议把该结论改写为显式迁移要求——该用例改用 makeGitWorkspace()（L3688）的 git 夹具、断言不变，并同步 AC-9⑤ 的夹具说明；否则 NFR-1 与 AC-12 的既有测试全绿在该文件上不可达。"
  - "建议（不阻塞，归 write-tech-design）：S-4 [sdd §0 阅读约定与 §10 清单]：正文有 2 处既有实现事实未列入第 10 节（两处事实经盘上核对均成立、不影响任何设计结论）：① §5.3 D-3 的与既有 archive 的 CR-ID 正则校验形态一致（实测 crctl.mjs:3513 的 ^CR-[0-9]{4}-[0-9]{3,}$ 与 workspace-transactions.mjs:3453 的 ARCHIVE_CR_INVALID）；② §3.5 四查与 §5.2 D-2 引用的 TX_GIT_FAILED（实测来自 syncLedgerIndex，crctl.mjs:688）。§0 声明正文对既有实现的引用一律以 dep-N 形式指向第 10 节，建议补条或在正文标注 dep-N，保持单一定义。"

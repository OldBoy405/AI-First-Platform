blockers:
  - "本轮新增：R-13 [sdd.md §6 FR-1① 目标段落原文 / §3.4-B / §6.1 AC-1① / §4.5；prd.md FR-1① 同句与 §1.5；plan.md §4.1 R-13、§8；tasks/TASK-04.md §3.1]：已审批 SDD 对 FR-1① 的落地文本自相矛盾——§6 FR-1① 的目标段落原文含「不得创建或读取 `_context.md` 等上下文副本」，而 §3.4-B 同一句要求「替换后两份文件均不出现 `_context.md`」、AC-1① 的可观测结果为「两份副本文件内 `_context.md` 命中 0」、§4.5 的 multica 计入集合（cr-prompts-revised/ 全文件）必须 0 命中，PRD §1.5 亦称「两份部署副本归零，无测试例外」。二者不可兼得：逐字复制该目标段落必然在这两份部署副本内留下该字面量，使 AC-1①/AC-2 及其机器判据（plan §6.2 cmd-04 断言文件内不含该字面量）不可达。本计划据此自选了「按可机械验收的一侧落地」（TASK-04 §3.1 规定的文本保留禁止语义但去掉文件名指称），未经任何授权，故 plan/TASK 的交付文本与 SDD §6 FR-1① 的目标段落原文不一致。影响：同一交付物存在两种互斥的已审批目标文本，实现唯一性不成立；若实施者按 FR-1① 逐字落地则 cmd-04 必红、AC-1①/AC-2 不成立（该段落经 owner 部署后即为生效的 Prompt 合同）。修复方向（上游，非 plan/TASK 可自决）：由 write-tech-design 在 SDD 内落地唯一口径——或把 §6 FR-1① 的目标段落原文改为不含文件名指称的禁用句（使其与 §3.4-B / AC-1① / §4.5 一致，本 plan/TASK 的文本即该口径的现成落地），或按 PRD §1.5 的语义口径重写 AC-1①/§4.5 的 multica 判定并同步 cmd-04 判据；无论哪条路都必须改 SDD 正文、重跑 review-tech-design 并重新人工审批，plan/TASK 侧不得自行改 SDD。"

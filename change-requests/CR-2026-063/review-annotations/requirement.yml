blockers:
  - "本轮新增：B-1 [prd.md §3 FR-9 第 3–4 条与 §1.4 事实 10；tools/skills/shared/crctl/scripts/lib/durable-tx.mjs:487]：FR-9 要求「复用既有 ledger 事务助手完成一次事务写」（明确点名 beginLedgerCommand）且「commit 只包含 review-loop.yml」，但既有 beginLedgerTransaction 对 ledger 事务有硬前置条件 writes.length >= 2，不足即抛 TX_WRITESET_INVALID（ledger transaction 至少需要两个文件）；reset 唯一要写的文件就是 review-loop.yml，单文件 write-set 必然被拒。基线核对：既有 4 个调用点全部是 ≥2 文件——approve=approval.yml+cr.md（crctl.mjs L1130）、owner-set=cr.md+_backlog.yml（L2535）、version-set=cr.md+_backlog.yml+derived（L2828）、review-record=annotation+traceability 且 bump 时再加 review-loop（L2177–L2195）；先例中没有单文件事务路径。§1.4 事实 10 只列助手清单与 review-record 先例，未记录该 ≥2 前置条件（同段引用的 readAttempts 也不返回原文与哈希，见 S-4）。影响：本 FR 的实现路径未定，三种可选实现的风险半径不同——(a) 放宽 durable-tx.mjs:487 的共享不变量（该行被 approve/owner-set/version-set/review-record 四个既有门禁写入共用，且当前无任何测试守卫该 ≥2 规则）、(b) 在 write-set 中塞入一个内容不变的第二个文件以维持 ≥2、或 (c) 绕开 beginLedgerCommand 自建写入路径（被 FR-9 第 7 条「不新写事务框架」禁止）；PRD 未择一，开发期必然先撞 TX_WRITESET_INVALID 再临场决定。修复方向：在 FR-9（并同步 §1.4 事实 10）显式写明择一结论与理由，例如「reset 的 write-set 仅 review-loop.yml；本 CR 将 durable-tx.mjs:487 的 writes.length < 2 前置条件原位放宽为 < 1，对既有 4 个调用点零行为差异」，或明确写出等价的 2 条 write-set 构成；同时补齐 index 回滚的既有机制口径（crctl.mjs approve L1141 的 syncLedgerIndex、version-set 的 rollbackVersionWrite 同族），因为 AC-9② 要求 review-loop.yml 与 index 都回滚到执行前状态，而 FR-9 第 5 条只写「回滚文件与 index」未给机制。"

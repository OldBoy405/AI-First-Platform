  范围合理性: "通过：§1.3.1 的 13 行「仓 + 文件」表与 FR-1~FR-10 逐条对应，multica 仓恰为 4 个文件（cr-prompts-revised/dev-agent.md、cr-prompts-revised/quality-reviewer-agent.md、cr-prompts-revised/cr-coordinator-agent.md、CUSTOM.md），与 AC-11「除 §1.3.1 列出的 4 个文件外无其它改动」自洽；FR-4 以零改动反向验收，§1.4 与 §7 写清零新增（SLO、M1–M8、P50/P90、连续 N 个 CR 统计、计数门禁、账本字段、R14 委派 lint、换 YAML 解析器、平台 DB 与 aifirst/agent-import.mjs）及 CR-R/CR-P1/CR-P2 各自独立开 CR。§1.3.1 引用的原文前缀句与 4 文件表存在表述落差，见 S-1（不影响唯一实现）。"
  与规划对齐: "通过：来源文档 §3.1–§3.7 七组原位修订逐条落到 FR-1~FR-10，来源 §3.8 验收清单在 §5 末尾给出 AC 反向映射；来源 §1.1/§1.2/§1.3/§1.4/§7 的零新增与不修改项进入 §7。§3.1.5 与 §3.1.4 的字面冲突按 §1.5 显式解释（活跃合同引用为 0、scripts/test/** 内负向断言字面量不计入），给出检索范围、计入/排除集合与判定方式，并在 §1.5/§1.6 标注为对来源的解释、须人工审批确认，未静默缩小 AC；盘上核对该解释成立——基线 tools 的 _context.md 命中恰 6 处、全部落在 §3.1.3 与 §3.1.4 两个待改文件内，退役测试必然保留该字面量。"
  依赖识别: "通过：§1.4 事实 16 明确 CR-R 先决约束（recoverCommand 到结构化 recovery 的原子迁移不在本 CR），FR-7/FR-9 的兼容字段据此限定为无用户输入的固定字符串；§1.3.2 与 NFR-7 明确平台 DB Prompt 投影与 aifirst/agent-import.mjs 由 owner 部署、本 CR 零部署副作用；FR-7/FR-9 对 crctl 既有先例的引用（事务助手、fault 机制、controlledGit）逐条在盘上可查，除 B-1 指出的 write-set 前置条件缺失外无未声明外部依赖。"
suggestions:
  - "建议（不阻塞，归 write-requirement-prd）：S-1 [prd.md §1.3.1]：该节引用的原文前缀句写 multica 仓只改 coordinator overlay 与 CUSTOM.md#75，而紧随其后的 13 行表与 FR-1 第 1–2 条又要求修改 multica 的 cr-prompts-revised/dev-agent.md 与 quality-reviewer-agent.md，实际是 4 个文件（与 AC-11 的四文件口径一致）。规范内容以表与 FR 为准，但该前缀句会被当作 scope_in 边界直接核对，建议在其后补一句限定：前缀句指公共 Prompt 事实源归位口径；加上 FR-1 的两份部署副本退役编辑，本 CR 对 multica 仓的改动共 4 个文件。"
  - "建议（不阻塞，归 write-requirement-prd）：S-2 [prd.md §1.3.3、§3 FR-7 第 4 条、§1.4 事实 16]：FR-7 把 recoverCommand 写成「兼容字段保留」，但 §1.4 事实 7 自述 gate 现有失败体 extra 为空（该字段在 gate 错误体上尚不存在，同名约定只出现在 register/checkpoint/merge/writeback/archive 的事务返回与 TxError extra）；同时 §1.3.3 写「本 CR 不新增任何 API、子命令、字段或账本条目」，与 FR-7 返回 contractDrift 及补入 recoverCommand 直接冲突。建议改为「沿用既有 crctl 事务错误体的 recoverCommand 命名，在本错误体上补入」，并把 §1.3.3 的不新增字段限定为不新增账本字段、子命令与 API。另建议在 SDD 说明 contractDrift 恒为 true 的定位（AC-7 固定要求 true，故该字段不携带区分信息，只是「须复核权威 Skill/Pipeline」的固定提示，调用方不得据此反推漂移类型）。"
  - "建议（不阻塞，归 write-requirement-prd）：S-3 [prd.md §1.3.3]：该节写「四查见 §3.9 与对应 AC」，但本 PRD 的 §3 只有 FR-1~FR-11，不存在 §3.9；「契约确定性四查」是 write-requirement-prd Skill 的术语。建议改为四查落点为 FR-7、FR-9 与 AC-7、AC-9。"
  - "建议（不阻塞，归 SDD）：S-4 [prd.md §3 FR-9 第 2 条]：以「复用既有 readAttempts/casWrite 口径」取 expected hash 与既有实现不符——readAttempts 只返回 current/max/attempts/cycle/cycleAttempts/exhausted/data，不返回原文或哈希；事务路径的 CAS 由 ledger 事务按 expectedHash 自行校验，不经过 casWrite。建议改为引用既有 review-record 口径（crctl.mjs L2183、L2193：readFileChecked 取原文 + sha256 作 expectedHash）。"
  - "范围外：S-5 [prd.md §1.5 与 §5 AC-2]：AC-2 的计入集合是语义分类（文本是否要求创建/读取/维护/放行 _context.md），当前只能人工逐条判定并交付命中清单证据（AC-2 已要求检索命令与命中清单）；若要把该判定机械化，属新 lint 或新规则范围，不在本 CR。"

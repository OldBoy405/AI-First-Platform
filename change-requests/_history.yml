    title: P2 三模式聊天 D1 — Team Agent 共享队列容量上限（容量校验 · owner/admin 插队 · 排队项撤回）
    summary: >-
      P2 三模式聊天交互设计 §11 唯一后端待建项 D1：agent_task_queue 表与 claim SQL 语义已有（P0），
      缺容量上限与插队规则这层业务逻辑。交付：① 队列达配置上限（默认 50）时非 owner/admin 入队被拒、
      前端满队禁用提示；② owner/admin 不受上限限制且 claim 时优先（priority=100）；③ 上限按 project
      可配置（project.settings JSONB）；④ 撤回自己的排队项（软删除留审计），深度经既有 WS 通道实时可见。

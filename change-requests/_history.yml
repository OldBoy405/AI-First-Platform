      缺陷修补附记）+ delivery/task 3 项；双仓 merge（docs@42bec5f / multica@28e562c21）；AC-3 真机收敛
      ——CR-2026-001（卡 12h）与 CR-2026-002（卡 1h）两条脏投影行在部署后首个对账周期（13:19:14 UTC）

blockers:
  - "本轮新增： [B-01] FR-2 / AC-2 未闭合 `_backlog.yml` 回灌前的冲突语义。现文只比较 authority `cr.md` 与业务输入，随后直接改写两本账；若 backlog 条目已是另一真实版本、缺失或重复，实现既可覆盖也可拒绝，会带来版本事实被静默覆盖的数据风险。请补充 backlog 允许的前置值、冲突/缺失/重复时的确定错误码与零写入观察点，并加入对应 AC。"
  - "本轮新增： [B-02] FR-2 与 AC-2 的失败原子性不可唯一验收：`后续 writeback 失败必须整组回滚`、`与既有 recoverable write-set 相同` 和 `既有 fault-point 或等价` 混用了回滚与断点续跑语义，未区分 apply 后 commit 前、commit 后 push 前、push 后 complete 前。请按既有事务边界列出各故障点预期（回滚还是保留 journal/commit 并同参恢复），并指定 AC 使用的故障点及重试后的最终不变量。"
  - "本轮新增： [B-03] 修改后的 `crctl writeback-apply` CLI 契约未闭合 JSON/stdout 观察面。FR-4 用 `phase=complete（或该 stage 既有成功口径）` 给出可替代结果，且未说明成功时 `status/files/changed/recoverCommand` 如何体现两账本回灌，也未明确失败时 exit、stdout/stderr 与 `error.code/details` 是否保持既有契约；调用方与测试无法据此形成唯一断言。请明确修改分支的结构化成功/失败输出（可声明其余字段保持既有契约，但须列出本次可观察字段），并同步 AC。"
dimensions:
  结构完整性: "BLOCK：概述、用户故事、FR、AC 与范围排除齐全，但 CLI 契约及账本冲突/恢复语义尚未闭合。"
  FR可测试性: "BLOCK：FR 与 AC 基本逐项对应；B-01 至 B-03 导致冲突、故障注入和结构化输出无法形成唯一断言。"
  范围合理性: "PASS：仅限 tools 守卫、事务写集、回归与说明，排除 version-set 放宽、冻结产物和 CR-2026-057 状态推进。"
  与规划对齐: "PASS：覆盖 AIFI-15 已拍板 A 方案的最小修复面，并保持 CR-2026-057 在 merging 等待。"
  依赖识别: "BLOCK：已识别 txws authority、release-subjects 与既有 recoverable write-set，但对 backlog 一致性和事务故障边界的依赖契约仍缺失。"

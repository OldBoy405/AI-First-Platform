blockers:
  - "部分解决： [B-SDD-01] `versionRefill.crMd` 已补齐持久化且 step 13 已改为只从 payload 重建，但恢复协议仍未闭合：§2.2/§4.4 规定 found journal 且 guard 仍 `refill=true` 时重算并覆写 `payload.versionRefill`，只把该情形等同于 journal-create 前文件未动；既有 recoverable write-set 在 rename 间进程中断时可能已把 backlog 写成 after、而 cr.md 仍为 `unassigned`，此时重算会把 backlog 条目降为 null，随后 `recoverWriteSet` 又按原 manifest 补齐 after，导致 commit entries/files 丢 backlog 或触发 staged-set 不一致。须以既有 write-set manifest/phase 区分“尚未 apply”与“部分 apply”，部分 apply 必须保留首次 payload 并向前恢复，不得覆写计划。另外，§6.2 所称 merged fixture 不跑 baseline 直接跑 tasks/traceability 不可达：现有 generator 明确要求 tasks/traceability 的 cr.md status=`writing-back`，merged fixture 为 `merging`；须构造 status=`writing-back` 且两账本仍 unassigned 的可达夹具并据此保留 direct after-apply 复跑断言。"
  - "部分解决： [B-SDD-03] 七项 commit SHA 已修正为受控 resource HEAD `2bb66294db30b116e0d53aea48990611017c75d6`，path/symbol/conclusion 复核也与代码一致；但 §1.5/§6.3 仍把该 resource 分支写成 `custom/main`。本轮 `workspace inspect` 与受控 `crctl git branch --show-current` 均显示 resources[repo=tools].worktreePath 的分支是 `requirement/CR-2026-058`。请改正或删除 branch 断言，避免把 trunk 视图冒充本轮取证 resource。"
  - "本轮新增： [B-SDD-04] SDD 未经已审批 PRD 扩大了公开错误码契约：PRD NFR-2/§7 只明确允许 FR-2.1 的两个新码，FR-6.2 的失败表也没有 `WRITEBACK_AUTHORITY_DRIFT`；SDD §3.2/§9 却把第三个新码加入 scope_in，并自行断言 PRD 列举非排他。该码会进入公共 CLI stderr 与测试观察面，属于接口/批准范围变化。请在不削弱 B-SDD-02 同源零写入硬失败的前提下复用已批准的既有码，或先走需求修订与重新审批，不能由 SDD 单方面扩 scope。"

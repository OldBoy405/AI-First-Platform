  可测试性: "BLOCK：AC 映射总体具体，但缺少能证明 direct tasks/traceability refill 在 after-apply 后从 journal 完整恢复 cr.md entry/files 的断言（B-SDD-01）。"
  Prompt采纳影响: "PASS：本 CR 不触及 crctl.mjs dispatch 或 controlled-shell/rules.json#protectedPaths.deny，§8 的 N/A 理由成立。"

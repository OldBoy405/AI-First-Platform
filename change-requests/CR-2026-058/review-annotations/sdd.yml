verdict: block
blockers:
  - "本轮新增： [B-SDD-01] `versionRefill` 的恢复载荷与 entries 重建互相矛盾：SDD §2.2 声称 tasks/traceability 的 `crMd` 条目会持久化，但给出的 payload schema 与 §4.4 step 11 只保存 `inputVersion`/`backlog`；step 13 却仍依赖瞬时 `refillPlan.crMd`。`writeback-after-apply` 后重试时 guard 已读到真实版本，`refillPlan=null`，因此 cr.md 条目无法从 journal 重建，可能留下未入同一 commit 的账本改动且 `payload.files` 缺 cr.md，违反 FR-2/FR-2.2/FR-6。须把 crMd 的 before/after 哈希与 afterText 一并持久化，并让恢复 entries 只依赖 payload，同时补 direct tasks/traceability 回灌的 after-apply 复跑断言。"
  - "本轮新增： [B-SDD-02] guard 读取的 authority 快照未与回灌计划绑定：§4.2 从 `auth.path` 读 cr.md 后只返回 value/source，§4.3 又从 `txws` 重新读取并无条件替换 target-version，既不证明 `auth.path===txws`，也不复核第二次读取仍为 `unassigned` 或匹配首次哈希。窄解析器回退或两次读取间漂移时可把 authority 上另一真实版本覆盖掉；`applyWriteSet` 的 beforeSha 从第二次读取生成，不能发现这类前置漂移。须携带并核验 authority path/source + 首次内容哈希（或在 plan 中重新规范化并要求仍为 unassigned，同时校验路径一致），不一致时零写入硬失败。"
  - "本轮新增： [B-SDD-03] ‘既有实现依赖与事实’的证据 SHA 与权威 resource 不符：SDD §1.5/§6.3 七项均声明 tools 分支 HEAD=`1ec6bad4518f030c6b98ce74e8eea17a92181849`，但按 `resources[repo=tools].worktreePath` 执行受控 `crctl git rev-parse HEAD` 得到 `2bb66294db30b116e0d53aea48990611017c75d6`。请在实际 resource HEAD 重新核验七项 path/symbol/conclusion 并修正证据锚点，禁止以主工作区或陈旧 SHA 代替。"

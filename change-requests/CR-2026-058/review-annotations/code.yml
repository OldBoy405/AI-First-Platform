blockers:
  - "本轮新增： B-CODE-01 `planVersionRefill` 对 cr.md 做了两次独立读取：先以 `beforeRaw` 生成 before hash/afterText，随后又由 `readCrMdTargetVersion(txws, cr)` 重开文件决定语义分支。若第一次读到另一真实版本、第二次读到 unassigned、apply 前文件又回到第一次内容，CAS 会把该真实版本覆盖为输入版本；这违反 FR-2.1/B-SDD-02 的‘另一真实版本零写入’与同一快照绑定。必须从同一份 `beforeRaw` 解析、规范化并生成锚点，不得二次采样，并补能锁定单样本语义的回归断言。"
  - "本轮新增： B-CODE-02 backlog `target-version` 缺失或非法时，`WRITEBACK_VERSION_INVALID` 只返回 `{cr, backlogReason}`；PRD FR-6.2 / SDD §3.2 要求保留 `cr`、`input`、`inputReason`、`crMdReason` 并新增 `backlogReason`。这是公共 CLI stderr 信封缺字段；请补齐两条 backlog INVALID 路径，并在公共 CLI 测试中断言扁平字段。"
  - "本轮新增： B-CODE-03 AC-2.1 的‘两账本 + baseline 业务文件同一 commit’测试只用 `git ls-tree` 检查 specs 路径存在；fixture 在初始 trunk 已创建这些路径，因此即使 writeback commit 未改业务文件也会通过，不能证明 PRD AC-2.1 / SDD §6.2 的原子提交条件。请对该 commit 的 changed-path/diff 断言同时包含 cr.md、_backlog.yml 与三项 baseline 业务文件（故障恢复断言同口径补齐）。"

review-type: tech-design
reviewer: "OldBoy405"
reviewed-at: "2026-08-18T20:42:32+08:00"
verdict: block
blockers:
  - "SDD §3.3/§7.3 声称 merge journal 已 complete 后可重跑 merge 再执行 local trunk helper，但现有 authority resolver 会在 finalize 后返回 transaction-workspace，且 crctl.mjs#cmdMerge 在入口要求 status=code-approved；因此该重入路径不可达。请按 PRD FR-10 修订为：save('complete') 后进程中断不做自动恢复、不承诺重跑 merge，用户仅可原生 git pull --ff-only；删除 wasComplete 重跑 helper 的接口承诺，并在测试设计中不要把它当可恢复场景。"
  - "SDD §4.1 对 fetch 后 branch-only 的处理自相矛盾：说明称 branch-only/remote-only 复用既有恢复，伪代码却只处理 remote-only，branch-only 会进入 WORKSPACE_ENSURE_BLOCKED。请显式加入 branch-only → create('from-local-branch')，并同步 FR-5 映射，保持首次分类 branch-only 的既有安全语义。"
  - "SDD 用普通 git fetch origin 作为“远端事实刷新”，但默认 fetch 不会清理远端已删除分支留下的 stale refs/remotes/origin/{trunk}，会使 trunk-unavailable 检测误判。请用最小原生修复 git fetch --prune origin（注册 missing 与 merge helper 两处），并把测试改为：远端 trunk 已删除、local stale tracking ref 仍存在，fetch 后必须清理并得到 WORKSPACE_TRUNK_UNAVAILABLE/trunk-unavailable。另请在 §4.2 明确 faultPoint('local-sync-ff-only-failed') 位于 ff-only try/catch 内，否则 §8.2 的失败注入测试没有设计落点。"
dimensions:
  prd-sdd-alignment: "block: complete 后恢复语义与 PRD 明确的不恢复合同冲突"
  architecture: "pass: 改动仍局限 workspace-transactions，未复制事务、状态机或上层算法"
  data-model: "pass: localTrunkSync 四态与 SHA/null 字段完整，无新增持久化"
  interface-contract: "block: branch-only 路由及 complete 后重入契约不一致"
  performance-security: "block: 普通 fetch 不能排除 stale remote-tracking trunk ref"
  testability: "block: ff-only faultPoint 无伪代码落点，trunk-unavailable fixture 不能验证 stale ref"
  prompt-adoption: "skip: 不触及 crctl.mjs dispatch 或 controlled-shell deny 面"
suggestions:
  - "§7.2 的 helper 最坏 git 调用数不是 ≤6：包含 before、branch、status、fetch、remote、ancestor、merge、after，成功路径最多 8 次；修正计数即可，不需优化。"
  - "§7.1 关于新增错误必然写 audit.log 的断言应删除或改为仅沿既有 TxError/fail 输出路径；cmdRegister 的失败审计并非本 CR 要新增的能力。"

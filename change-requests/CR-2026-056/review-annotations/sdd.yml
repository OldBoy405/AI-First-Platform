verdict: block
blockers:
  - "BLOCK-013：SDD §4.13/§9/§10 将既有 Discussion Coordinator→Team Agent 转投纳入本 CR 的实现范围：要求停止 comment.go 的 EnsureProjectChatIssue，改用 project_chat_session、catalog/readiness、Bind-in-tx 与 chat_config 快照，并把转投纳入 AC-24。该行为与已审批 PRD §1.3/§7 的明确排除（Coordinator、Discussion 共享会话/相关升级不在本 CR）以及 NFR-7 的“Discussion 发送路径不改变”冲突；SDD 不能自行扩展范围并宣称 FR 21/21 对齐。必须由需求修订/审批明确纳入该路径并补对应 FR/AC，或将其改为保持既有 Discussion Coordinator 路径的兼容性方案，同时说明新的 project_chat 容器模型如何避免旧 EnsureProjectChatIssue 回归。"
  - "BLOCK-014：§4.2.1 的 service-owned ValidateResolvedChatConfig 伪代码不可按现有领域 API 实现：它直接调用 `modelIDForCapabilityLookup`，但该函数在 `pkg/agent` 是未导出符号，service 无法引用；同时 `ValidateThinkingLevelWith` 的真实签名要求 `func() (Catalog, error)` loader，文档却以已加载的 `Catalog` 作为 `load` 参数。若由 service 自行复制 provider/别名归一化逻辑，会产生与 pkg/agent 不一致的第二套规则。必须明确导出/下沉一个领域归一化与校验接口，或明确 service 的等价算法及 loader 适配边界，并将空模型、Claude 变体和 Thinking 能力矩阵绑定到该单一实现。"
dimensions:
  prd-sdd-alignment: "BLOCK：上一轮 BLOCK-007～012 的修复方向已在 SDD 中出现，但新增的 Discussion 转投方案与已审批 PRD 的范围排除/NFR-7 冲突；且 validator API 仍不可执行。"
  architecture-soundness: "BLOCK：handler/service 依赖方向已调整为 port 注入，但 service validator 对 pkg/agent 私有 helper 的依赖和重复规则风险未消除；Discussion 路径的范围边界也未解决。"
  data-model-completeness: "PASS：project_chat_session、origin_id、升级收养窗口及附件锁/条件删除的字段与约束已覆盖上一轮缺口。"
  interface-contract: "BLOCK：ChatCatalogPort 的高层同步契约已补，但 §4.2.1 对 ValidateThinkingLevelWith 的参数形状和 model ID 归一化 API 不完整，无法形成可编译的唯一校验合同。"
  multi-repo-constraints: "PASS：目标仍限定 multica，knowledge-base 仅承载 SDD，tools 无实施改动；ARCHITECTURE.md 约束被引用。"
  performance-security: "PASS：项目 advisory、session FOR UPDATE、CAS 及 sweeper 持行锁覆盖对象删除/条件删行的主要竞态控制已补齐。"
  testability: "BLOCK：虽补列升级换绑、转投、sweeper 并发和空模型矩阵的测试入口，但转投是否属于本 CR 未有可验收的需求基线，且 validator 的领域 API 未定，测试无法锁定唯一行为。"
  prompt-adoption: "N/A：本 CR 不触及 crctl.mjs dispatch 或 controlled-shell/rules.json protectedPaths.deny。"
suggestions:
  - "SUG-001：人工架构审批前指定 target-version；当前仍为 tbd。"
  - "SUG-002：将 provider/model ID 归一化、Catalog loader 适配与 ValidateThinkingLevelWith 的单一实现写成 service/pkg 的明确接口，并为 cache/live 两路共用同一纯函数。"

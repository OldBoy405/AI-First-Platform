verdict: block
blockers:
  - "B-003 [FR-10/AC-13/Team Agent HTTP contract] B-002 已补齐 POST /api/projects/{projectId}/chat/container，但 POST /api/projects/{projectId}/chat/messages 仍只有请求体和‘先绑定再入队’描述，没有定义成功响应是否包含 issue_id（或明确 AC-13 应改为通过后续 GET 断言）。AC-13 直接要求两次成功响应的 issue_id 相同，因此当前无法唯一实现/验收 container 与 messages 的交叉并发场景。请补齐 messages 的 HTTP 200 响应 schema、issue_id/session_id 语义，或改写 AC-13 的可观测断言。"
  - "B-004 [FR-4/AC-24] AC-24 同时要求 runtime 离线（AgentWaitable）时 PATCH/发送成功，并要求 FR-4 的 model runtime catalog 与 Thinking Mode capability 校验；但未规定 runtime 离线时校验所使用的 catalog/capability 来源、缓存有效期/失效处理及无缓存时的结果。现有 AgentReadiness 只能判定可等待/阻断，不能回答模型是否属于 catalog；请明确离线时采用的已缓存目录及无可用目录时的接受/拒绝规则，并补充对应验收。"
  - "B-005 [NFR-8/AC-27] AC-27 要求缺失 session_id/source 字段时 parseWithFallback 给出‘防御默认’且不白屏，但没有定义这些默认值及控件/发送行为。尤其 session_id 是后续 PATCH/发送的路由和归属凭据，空字符串或伪造默认值都会让界面可渲染但不可安全操作。请明确 legacy 响应的安全降级状态（例如只读并重新获取 session，或禁用配置/发送）及 model/thinking/source 的具体 fallback，且在夹具中断言该行为。"
dimensions:
  structure-completeness: "PASS：PRD 已包含概述、用户故事、FR、NFR、HTTP 契约、验收标准、成功指标和范围排除；B-001/B-002 修复均有对应正文与 AC。"
  fr-testability: "BLOCK：B-001 已闭合，B-002 的创建入口已补齐，但 AC-13 依赖未定义的 messages 成功响应；AC-24 的离线 capability 校验和 AC-27 的 session_id 安全 fallback 仍无法形成唯一、可执行的验收。"
  scope-reasonableness: "PASS：仍限制在 CR-A；Discussion、Coordinator、升级和 composer 视觉重构明确排除，没有发现范围扩张。"
  source-alignment: "PASS：会话配置隔离、Team Agent 懒创建、容器幂等、任务快照和附件草稿均与 CR-A 来源一致；本轮 blocker 是 PRD 内部契约/兼容语义缺口。"
  dependencies: "PASS：已识别 AgentReadiness、runtime catalog/capability、parseWithFallback、现有 session/task/attachment 基础设施及后续 CR 依赖；需按 blocker 明确离线目录和 legacy API 行为。"
suggestions:

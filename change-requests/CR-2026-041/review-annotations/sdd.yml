cr-id: CR-2026-041
review-type: tech-design
reviewer: "OldBoy405"
reviewed-at: "2026-08-15T21:30:44+08:00"
verdict: block
blockers:
  - "SDD §3.2 第 3-5 步只要求 evidence.path 位于 change-requests/{cr}/ 前缀，却没有要求按 evidence key 精确匹配固定 canonical 路径（test→test-report.md、四类 review→各自 annotation、approval→approval.yml、merge→merge-commits.yml）。若 gate 只按 containment 加 digest 校验，证据 path 可被替换为同 CR 下的其他文件；若按 evidence.path 读取，则可把错误文件当作正式证据。请定义固定 path map，并要求 path 必须与 key 精确相等后再重算对应文件 digest。"
  - "SDD §1.2/§5 将‘同一确定性证据校验函数’改成 generator 与 archive gate 两份独立内联实现；测试交叉验证只能降低漂移，不能满足 PRD FR-04/AC-07 的同一函数要求。当前 ARCHITECTURE.md 又规定 writeback scripts 与 crctl 平行、互不依赖，因此不能悄悄新增跨层 import。请在 PRD/SDD 中先闭合该矛盾：要么明确批准‘同一契约、两侧实现’并同步修订 PRD，要么指定一个既有 helper 的合法共享归属；不得在实现阶段自行选择。"
dimensions:
  prd-sdd-alignment: "BLOCK：FR-01~FR-08 均有映射，但固定 evidence path 未落实 PRD 的 canonical 文件绑定；‘同一确定性校验函数’被实现为两份函数，未满足 PRD literal contract。"
  architecture-reasonableness: "BLOCK：archiveCr 复用 durable transaction、writeback 与退役边界合理；但跨平行 writeback/crctl 层的校验复用方案与 PRD 的单函数要求未形成可执行且一致的依赖方向。"
  data-model-completeness: "BLOCK：evidence 字段齐全，但 path 只有目录 containment，没有 key→canonical path 的不可变映射，数据模型允许证据文件互换。"
  interface-contract: "BLOCK：validateMilestoneEvidence 接口定义了 traceText/cr/specId/editRoot，却没有定义固定 path map 的输入/校验结果；同一函数的实现归属也未确定。"
  performance-security: "PASS：复用既有 lock/journal/write-set，LF digest、containment、无第三方依赖和常数次文件读取符合 ponytail；路径绑定缺口已在 blocker 中列出。"
  testability: "BLOCK：测试覆盖 digest 漂移与跨 CR 路径，但未覆盖同 CR 内错误 path 互换，也无法证明两份独立规则长期等价。"
  prompt-adoption-impact: "PASS：本 CR 不改 crctl.mjs dispatch 或 controlled-shell rules.json#protectedPaths.deny，条件性 Prompt 采纳章节可省略。"
suggestions:
  - "将 readEvidenceInputs/validateMilestoneEvidence 称为确定性读校验 helper，而不是纯函数；它们会读取文件。"
  - "补充回归测试：generator 产物的 evidence path map 与 archive gate 的固定 map 逐项一致；新 milestone 不含 status，旧 milestone 字节保持不变。"

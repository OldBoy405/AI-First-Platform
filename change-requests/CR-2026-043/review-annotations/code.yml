  test-coverage: "block: 缺单仓 crash-after-ff 外部漂移、ff-only 失败映射、status 非零退出用例"
  test-evidence-credibility: "pass: crctl-test 机器区/traceability digest/log 一致，382/382；Ubuntu 环境缺口已诚实记录"

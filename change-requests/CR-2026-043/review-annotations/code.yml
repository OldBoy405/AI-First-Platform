verdict: block
blockers:
  - "B1 [recovery correctness] skills/shared/crctl/scripts/lib/workspace-transactions.mjs:856-875 在途恢复直接跳过 action=fast-forwarded/confirmed/unchanged，未按 SDD §2.2/§4.2 重核当前 HEAD 与 targetTrunkSha；先前 ff 后若被外部改写，重跑仍会 save complete。修复：恢复时逐仓健康/clean/HEAD/trunk 重核；fast-forwarded/confirmed 必须 HEAD==target，unchanged 必须 HEAD==before==target 且 trunk 未漂移，第三值一律 WORKSPACE_FRESHNESS_CHANGED；增加单 pending 仓 ws-sync-after-repo 后外部改写的回归。"
  - "B2 [intent binding] skills/shared/crctl/scripts/lib/workspace-transactions.mjs:895 intentDigest 仅绑定 pending 仓，与 SDD §2.2 的排序后全仓 repo/beforeSha/targetTrunkSha 不一致；完整 preflight 中 unchanged 仓漂移未进入 intent。修复：digest 绑定 payload 全部 repos（稳定 repo id 顺序），并增加 unchanged 仓改变时旧 complete 不误复用/在途恢复阻断测试。"
  - "B3 [error contract] skills/shared/crctl/scripts/lib/workspace-transactions.mjs:831 ff-only 失败由 gitMust 直接抛 TX_GIT_FAILED，未兑现 SDD §3.2 的 WORKSPACE_SYNC_CONFLICT。修复：仅包裹 merge --ff-only 调用并将 TxError 映射为 WORKSPACE_SYNC_CONFLICT（保留 repo/target/cause），其他 Git 技术失败不误映射；增加确定性失败测试。"
  - "B4 [conservative Git status handling] skills/shared/crctl/scripts/lib/workspace-transactions.mjs:772 与 :819 使用 gitRun(status --porcelain) 只看 stdout，非零退出且空 stdout 会被误当 clean。修复：检查 status；非零退出抛 TX_GIT_FAILED（freshness）或 WORKSPACE_FRESHNESS_CHANGED/TX_GIT_FAILED（重核，按 SDD 失败语义），增加 git status 技术失败不得进入 fresh/ff-only 的回归。"

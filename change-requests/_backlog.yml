    title: P2 三模式聊天 CR-F — D7 门禁接合（B4 迁移 + 审批卡/blocker/CR 徽标）
    summary: >-
      门禁接合：B4 迁移（agent_task_queue 增 cr_id/pipeline_node_run_id 两列）+
      消息流内门禁状态条——human_approval 审批卡走 P1 服务端签名审批（Ed25519，

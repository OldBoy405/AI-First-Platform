  - id: CR-2026-011
    title: P2 三模式聊天 CR-F — D7 门禁接合（B4 迁移 + 审批卡/blocker/CR 徽标）
    summary: >-
      门禁接合：B4 迁移（agent_task_queue 增 cr_id/pipeline_node_run_id 两列）+
      消息流内门禁状态条——human_approval 审批卡走 P1 服务端签名审批（Ed25519，
      非 TTY），驳回 reject_reason 注入 review_feedback；review verdict=block 显示
      blocker 列表 + reviewLoop attempt N/3；chatHeader CR 16 态徽标消费 P1 cr
      投影表。核心验收：真实 pipeline 网页批准 → 签名 grant → crctl 验签推进，
      全链路不落 TTY。

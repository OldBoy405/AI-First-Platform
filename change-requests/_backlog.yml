  - id: CR-2026-010
    title: P2 三模式聊天 CR-E — D4 presenter 控制权（claim 串行化键 agent_id→project_id）
    summary: >-
      presenter 控制权：后端 claim SQL 串行化键 agent_id→project_id + presenter
      判定接入入队/claim 路径（单一写者：presenter 非空时其他成员消息不被执行；
      Admin 在 Agent 空闲时可直接接管）；前端 §3.1 状态机 6 个通知文案、
      chatControlPanel 权限面板、chatHeader 主持人实时显示。
      首要风险与独立成 CR 的主因：串行化键改造后既有并发语义（D1 容量守卫/插队/
      撤回与 CR-A 群聊入队）回归必须全绿。

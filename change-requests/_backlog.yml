    title: CR 执行闭环与门禁减负修订
    summary: "依据 AIFI-54 附件 tools-unified-cr-optimization-plan-v3.md，单个 CR 完成机器启动绑定、Git 身份保留、评审落盘与隔离提交恢复闭环；贯通合法本地信任、取消默认重复开发启动确认、合法人类继续一次一 cycle；G05/G06 同一工作项复用 Git tree 比较决定继续或最小重验，并收敛 CI 数量告警、既有红例、Windows chainCheck 与实际安装生效验证。复用现有状态、权限、事务、审计和发布流程，不新增执行器或影子账本；不关联其他 CR"

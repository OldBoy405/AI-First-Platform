    title: P2 三模式聊天 CR-B — D3 完整形态（队列条展开/逐项撤回/停止/过滤开关）
    summary: >-
      Team Agent 面的队列与控制完整形态（纯前端，D1 后端能力已全量交付不再动）：
      队列条常驻+展开列表逐项 fromUser；发起人撤回自己的排队项（D1 cancel 端点，
      403/409 结构化反馈）；停止双权限（发送者停自己、Owner 停任意，停止后内容保留、
      下一条自动开始）；「只看 Agent 请求」本地过滤开关；消息悬浮操作仅复制。
      队列条 WS 实时无手动刷新。

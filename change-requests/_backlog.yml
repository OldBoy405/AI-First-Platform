  - id: CR-2026-014
    title: P3 组织智能 CR-B — Org Admin Workspace 与交付效能板块（E3+E7）
    summary: >-
      P3 组织智能第二个 CR（依赖 CR-A 数据地基）：① E3 Org Admin Workspace 内置项目 +
      周报 Autopilot——内置 Agent 挂每周 Autopilot：读取最近 maturity_snapshot 序列 +
      治理板块异常 → 生成诊断报告落盘 docs/org-admin/maturity-review-{YYYY-Www}.md →
      经 inbox 通知 Owner；诊断模板按 AI 净价值四收益一成本框架组织（个人效率/团队交付/
      知识复利/风险收益 + 成本）；看板「建议」区直接渲染该目录最新文件，历史 = 目录里的
      历史文件；建议生成过程走 Team Agent 消息流，可追问可继续对话。② E7 交付效能板块 +
      SII 资产复用率 + AI 净价值叙事条——Lead Time（drafting 首事件 → archived 的时长
      P50/P90）/ Review 负担（reviewLoop 平均 attempt 数）/ 变更失败率（归档后 14 天内
      同 spec fix 类 CR 占比）三卡从既有表算出并可下钻；SII 资产复用率（成员发布的 org
      可见 Skill 被他人项目任务使用次数 / 该成员发布的 Skill 数）；AI 净价值叙事条
      （时间收益 ← Lead Time 趋势；质量收益 ← 门禁一次通过率 + 变更失败率趋势；知识收益
      ← 资产复用率；风险收益 ← EVIDENCE_DRIFT/越权尝试下降趋势；成本 ← token × 价目表估算）。

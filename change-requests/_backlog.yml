  - id: CR-2026-008
    title: P2 三模式聊天 CR-C — D5 Private Ask（chat_session 项目维度 + 项目内私聊面）
    summary: >-
      Private Ask 面：B2 后端（chat_session 加 nullable project_id +
      (project_id, creator_id) 会话查询，与全局 1:1 chat 并存）+ 前端第二 tab
      （绕开 use-chat-controller 全局单例，纯 props 组合，sessionId 自管）。
      语义四差异：个人独立队列、默认 Ask-only 只读、仅本人可见、与 Team Agent 并行。
      隐私红线：仅本人可见须由服务端 per-user 推送逻辑保证（单 socket 架构下前端
      过滤不算数），是首要验收对象；回归既有浮窗/全页 chat 不受影响。

suggestions:
  - id: SDD-SUG-001
    location: "§2.1 approval_record"
    note: "UNIQUE(cr_id, stage, evidence_digest) 会挡住'同一版证据先 reject 后 approve'——reject 也写记录，第二次 approve 同三元组直接撞唯一键报 500。建议改为部分唯一索引：UNIQUE ... WHERE decision='approve'（approve 幂等保留，reject 允许多条留痕）"
  - id: SDD-SUG-002
    location: "§2.1 cr 表 / §3.1"
    note: "事件只带 workspace_root_hash，cr 行的 workspace_id 从哪来未写明。建议明示：由 DaemonAuth 上下文解析（daemon 配对时已绑定 workspace），事件体不自带 workspace_id、不信任客户端自报"
  - id: SDD-SUG-003
    location: "§4.4 transitions_gen.go"
    note: "go:generate 运行时读 tools 的 dir-graph.yaml，意味着 multica CI 构建需要 tools 仓 checkout。建议生成文件直接入库（文件头注释记来源 tools commit SHA），CI 只校验'重新生成 == 已入库'，构建本身不跨仓依赖"

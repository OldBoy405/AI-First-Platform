blockers:
  - "TD-BL-4（首个新 stage 的 trace attempts 默认值错误）：§4.4a 步骤 2b 把 oldAttempts 定义为 `trace 存在 ? parseYaml(traceText)?.reviews?.[stage]?.['review-loop']?.attempts : []`，当 traceability.yml 已有 requirement 投影、而本次首次写入 tech-design 或 code（FR-16/AC-19 的正常三阶段路径）时，该表达式返回 undefined；下一步的“列表且每项含字段”shape 校验必然报 TRACE_SHAPE，导致无法按 §4.4c 的未命中分支新增目标 stage，违背 FR-18 的“定点新增或替换”。须区分“目标 stage 缺失”（合法，oldAttempts=[]）与“目标 stage 存在但 review-loop/attempts 形状错误”（TRACE_SHAPE）；不可用宽泛空值兜底掩盖后者。"
dimensions:
  PRD-SDD对齐: "block — 上轮 TD-BL-1/2/3 已分别补齐历史合并、CRLF/空结构硬失败和 SCHEMA_INVALID 复用；但 FR-16/FR-18 要求的已有其他 stage 时新增目标 stage，在 §4.4a 的 oldAttempts 分支上会必然失败。"
  架构合理性: "block — 总体仍遵循 crctl 单写者、casWriteMulti、零依赖和行级定点编辑；但新投影路径把合法的缺失 stage 误判为账本结构损坏，破坏共享三阶段映射的正常工作流。"
  数据模型完整性: "block — attempts 历史字段和合并规则已明确；仍缺失“stage 不存在时空历史”的合法模型分支，致使新增 stage 无法构造首条 attempt。"
  接口契约: "block — review-record 的三 stage 共用契约应支持 requirement、tech-design、code 依次投影；当前算法仅在 trace 缺失时有 [] 初值，不能支持 trace 已存在而当前 stage 缺失的接口情形。"
  性能与安全性: "pass — 单次解析、CAS 多写、无新增外部输入或审批旁路；修复只需补最小分支判定，不改变复杂度。"
  可测试性: "block — F-4 虽列三 stage 投影向量，但设计尚未规定“已有 requirement/tests/未知段，首次写入 tech-design/code”应成功的算法，测试无法据此锁定正确行为。"
  Prompt采纳影响: "pass — §8 已将 requirement、tech-design、code 三个 review Skill 的 trace 手写步骤统一改为由 review-record 落盘后核对，且 P-4 已改为已核实事实。"

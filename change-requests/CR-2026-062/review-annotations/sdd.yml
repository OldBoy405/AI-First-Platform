verdict: block
blockers:
  - "部分解决：B-003 [sdd.md §4.2 SubmitButton running 判定、§4.3.1 发送失败分支、§6 AC-5(h)/§6.9(iii)] 位置：连续发送时第二次发送失败后的 composer 动作状态。事实：SDD 明确 Team Agent 传 allowSubmitWhileRunning=true，且 SubmitButton 的 running 判定为 trackedActive && (!allowSubmitWhileRunning || isEmpty || pendingUploads > 0)；mutation reject 又保留非空草稿和旧 sentTaskId/sentIssueId。因此失败回流后即使旧 task A 仍活动，isEmpty=false 会令 running=false，右下角实际渲染发送/重试按钮，而不是 §6 AC-5(h) 与 §6.9(iii) 声称的 stop；对应“stop 仍渲染、点击仍调用 cancelTaskById(A)”测试没有可通过的实现落点。影响：失败分支的可观察行为内部矛盾，B-003 的目标保留虽已实现，但 FR-5/FR-7、AC-5 的 stop/retry 行为仍不能由当前设计唯一保证。修复方向：在不改变人工授权的“发送失败保留旧活动目标”前提下，明确选择一致且可达的交互——若保留现有 queue-send/retry 优先级，则把 AC-5/§6.9 修订为失败后发送按钮保留草稿供重试，并在草稿清空后 stop 重新出现且点击取消 A；若要求失败后立即可停止，则必须设计独立且可达的 stop 入口并同步 §4.2 判定。同步修订 §4.3.1、AC-5 与测试矩阵。"

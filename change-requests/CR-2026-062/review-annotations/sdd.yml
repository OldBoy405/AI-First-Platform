blockers:
  - "部分解决：B-001 [sdd.md §1.1 project-team-agent-chat.tsx 行、§3.2 Team Agent toolbar 片段、§6 AC-4、§9 scope_in/zero_diff 的 testid 保留/替换契约] 位置：Team Agent 外层定位锚点 `project-chat-model-row`。事实：§9 先规定“既有 testid 全部保留，唯一替换为 `private-ask-model-row` → `private-ask-model-picker`”，但同一条随后又规定 `project-chat-model-row` 独立行移除、只点名其内部四个 testid 随 `leftAdornment` 保留；§1.1 同样只保证内部 testid，§3.2 的唯一 Team Agent toolbar JSX 片段以 Fragment 为根且没有迁移/保留 `project-chat-model-row`。因此当前设计同时允许“保留该 testid 并迁到 toolbar 容器”和“随独立行删除”，与声称的唯一保留/替换契约不一致。影响：开发者与测试无法唯一判断 `project-chat-model-row` 是必须保留、迁移还是删除，原 B-001 的实施白名单/定位锚点冲突仍有一个 Team Agent 残留，AC-4/AC-8 及 testid 零差异断言不能由当前 SDD 唯一闭合。修复方向：在 §1.1、§3.2、§6 AC-4、§9 scope_in/zero_diff 统一二选一——若保留，则明确迁移后的承载 DOM 并在 toolbar 片段展示 `data-testid=\"project-chat-model-row\"`；若删除，则把它列为第二个明确移除项，并把“既有 testid 全部保留/唯一替换”改成准确的保留、移除、替换清单；同步测试/e2e 锚点文字。"

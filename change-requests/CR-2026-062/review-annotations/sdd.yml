blockers:
  - "部分解决：B-003 [sdd.md §4.3.1「硬降级」与 sentTaskId/sentIssueId 状态表、§6 AC-5/§6.9；既有实现依赖 #13/#15] 位置：连续发送后的硬降级状态转移。事实：双源判定已经覆盖 queued/dispatched/running/waiting_local_directory/terminal，但 SDD 规定发送成功返回 task_id=\"\" 或 issue_id=\"\" 时‘不写入’ sent 状态，并断言 trackedActive 恒 false；该结论只在初始 sent 状态为空时成立。若先前一次成功发送留下仍活动的 sentTaskId/sentIssueId，随后一次成功发送经 ProjectChatSendResult fallback 得到空 ID，‘不写入’会保留旧目标，trackedActive 仍可能为 true，右下角 stop 将取消旧 task，而不是回落到无可追踪目标的发送态。现有 task_id=\"\" 测试也只要求单次硬降级，无法证明该连续发送分支。影响：停止动作目标唯一性和 SDD 自己承诺的‘硬降级不渲染死按钮’仍不闭合，可能对错误任务执行取消，PRD FR-5/FR-7 与 AC-5 的 stop 行为保持不可由当前状态机唯一保证。修复方向：明确仅在发送成功且返回的 task_id/issue_id 任一无效时原子清空 sentTaskId 与 sentIssueId（发送失败仍保留旧活动目标），并增加‘有效活动 task A → 下一次发送成功但返回空 ID’的顺序测试，断言 stop 消失且不会调用 cancelTaskById(A)；同步修订硬降级、状态表和 AC-5 测试文字。"

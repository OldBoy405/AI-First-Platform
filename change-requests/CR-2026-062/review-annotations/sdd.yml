verdict: block
blockers:
  - "部分解决：B-003 [sdd.md §4.3.1、§4.3、§6 FR-5/AC-5、§7；既有实现依赖 #8/#13/#16] 位置：Team Agent composer 的 trackedActive/isRunning 生命周期。上一轮指出的无处理器 stop 已通过 sentTaskId、onStop 与 useCancelProjectQueueTask 补上动作目标、竞态和错误语义，但活动性仍未覆盖真正的 running 状态：SDD 一方面把 projectQueueItemsOptions 的 items 明确记为服务端只返回 queued/dispatched（依赖 #8/#13，project-queue-bar.tsx 的 statusLabel 也只处理这两态），另一方面却把‘task_id 仍存在于 items’解释为排队/派发/运行。任务从 dispatched 进入 running 后会离开该列表，trackedActive 随即为 false，ChatInputCore 右下角按钮回到发送态，运行中 stop 仍不可达；§6.9 仅把 task 放进 mock items 的测试也只能证明 queued/dispatched 取消，不能证明运行中停止。影响：PRD FR-5/AC-5、来源 CR-D 规则 5/8 与 AC-33 要求的 composer 运行中停止仍无法由当前设计产生。修复方向：改用或复用一个实际包含 running task 的既有事实源（例如由 Team Agent 已读取的任务时间线按 sentTaskId 派生并传入 composer），或组合 queued/dispatched items 与 running 任务事实，使 queued→dispatched→running 全生命周期内 isRunning/onStop 都可达；同步修订 §4.3.1、D-7、依赖清单、AC-5 与测试场景，且不得以改变 queue-items 服务端契约或新增 API 绕过本 CR 的 zero_diff。"

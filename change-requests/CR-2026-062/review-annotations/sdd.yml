blockers:
  - "本轮新增：B-001 [sdd.md §4.1 第 3/5 条、§1.2、§6 AC-1；既有实现依赖 #1/#6] 位置：TeamAgentStreamView 与 ProjectQueueBar 的拟议几何结构。事实：SDD 要求 gutter→column 两层嵌套，却分别把 CHAT_GUTTER 与 CHAT_COLUMN 合并到同一个元素（TeamAgentStreamView 为 cn(CHAT_GUTTER, CHAT_COLUMN, ...)；队列栏内部同样为 cn(CHAT_GUTTER, CHAT_COLUMN, ...)）。multica@117fc6be 的 packages/views/chat/components/chat-column.ts 明确说明单元素组合会让 max-w-4xl 把 padding 计入封顶宽度、使内容边缘比 composer surface 内缩；chat-message-list.tsx 的权威基线也是外层 CHAT_GUTTER、内层 CHAT_COLUMN。影响：Team Agent 消息列/队列栏与发送框边缘仍相差一个 gutter，AC-1 的宽面板对齐与‘单一几何事实源’不可达。修复方向：把 TeamAgentStreamView 和 ProjectQueueBar 都明确设计为外层 CHAT_GUTTER、内层 CHAT_COLUMN 的两个 DOM 层，并同步修订依赖图、§4.1、FR/AC 映射和测试断言。"
  - "本轮新增：B-002 [sdd.md §3.2、§6 FR-6/AC-7、§7；既有实现依赖 #3/#10/#11] 位置：ChatInputCore 与移入工具栏后的只读配置控件可访问性。事实：SDD 声称现有控件的 aria/tooltip 原样即可，但 multica@117fc6be 的 chat-input.tsx ChatInputCore 调用 SubmitButton 时只传 tooltip/stopTooltip，未传 ariaLabel/stopAriaLabel；submit-button.tsx 的 ArrowUp/Square 均 aria-hidden，因此图标按钮没有可访问名称。另 Team Agent canConfigure=false 时 ModelPicker/ThinkingPicker 返回的只读 span 只有值文本与 title，没有类别 aria-label；SDD 又移除现有可见的 Model/Thinking 标签。影响：AC-7 要求的发送/停止及只读配置语义可访问名称无法由当前设计产生，且承诺的 role/name 测试没有可通过的实现落点。修复方向：在不改 SubmitButton/Picker 本体和不新增文案 key 的前提下，明确让 ChatInputCore 传入既有 send/stop 本地化字符串作为 ariaLabel/stopAriaLabel，并为 Team Agent 只读 Model/Thinking 值保留可被辅助技术读取的类别标签（如现有文案的 sr-only 语义）；同步补齐组件级契约与 AC-7 测试落点。"
  - "本轮新增：B-003 [sdd.md §4.3、§6 FR-5/AC-5；既有实现依赖 #4/#8/#11] 位置：Team Agent 右下角运行中停止动作。事实：SDD 明确写 Team Agent 继续不给 ChatInputCore 传 onStop，仅依赖队列栏取消；但 multica@117fc6be 的 submit-button.tsx 在 running=true 时把右下角按钮 onClick 直接绑定 onStop，当前 TeamAgentComposer 只传 isRunning={isPending}，故该停止按钮是无处理器的图标控件。ProjectQueueBar 的展开后取消是另一入口，不能让 composer 右下角停止动作生效。影响：PRD FR-5/AC-5 与来源 CR-D 对‘右下角发送/停止动作、运行中停止行为’的当前验收不可达，测试即使断言图标存在也不能证明行为。修复方向：SDD 必须裁定并设计 Team Agent composer 的可执行停止路径（复用既有受权队列取消能力并明确目标 task/竞态/错误语义），或在需求授权下明确不渲染不可用的 stop；不得保留无处理器按钮并以队列栏替代右下角动作。"

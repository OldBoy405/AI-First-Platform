blockers:
  - "本轮新增：B-005 [sdd.md §4.3.1 的 taskEntry/taskActive/taskTerminal；TASK-02 §3 停止路径] SDD 与 TASK 把 `api.listTasksByIssue(sentIssueId)` 的 `useQuery` 结果直接定义为单个 `taskEntry`，随后读取 `taskEntry.status`，但 multica HEAD `117fc6be657f91d43df5892b52782a18329c7aed` 的 `ApiClient.listTasksByIssue` 明确返回 `Promise<AgentTask[]>`，既有 `ProjectTeamAgentChat` 也以 `const { data: tasks = [] }` 消费该数组；当前设计/TASK 未定义按 `sentTaskId` 从数组选择目标 task 的步骤，也未定义列表为空或未命中时的降级。影响：照文档实现会对数组读取 `status`、无法通过 TypeScript，且 running/terminal 判定无法唯一关联最近一次发送任务，AC-5 的 stop 可达性与终态覆盖不可实现。修复方向：回到 SDD 明确 `tasks` 数组到 `taskEntry = tasks.find(task => task.id === sentTaskId)`（或等价唯一选择）的契约、空列表/未命中行为及相应测试，再重新评审/审批 SDD 并同步重建 TASK-02。"
  - "本轮新增：B-006 [plan.md §5 验收门槛 5/6、§6.1 FR-7、§6.2 cmd-08；TASK-01 §5；TASK-04 §3/§4-5] `cmd-08` 只有 `crctl git diff --name-only 117fc6be…` 的文件名清单，却被用来证明同一文件内部的 `ChatInput` 函数体与 `ChatInputProps`/`ChatInputCoreProps` 签名 zero_diff；TASK-04 甚至要求这些符号“在 diff 清单中零出现”。但本 CR 必须修改同一个 `packages/views/chat/components/chat-input.tsx` 中的 `ChatInputCore`，所以该文件必然出现在 name-only 输出，而 name-only 根本不包含函数/签名级信息。影响：TASK-01/04 的完成标志按字面不可满足，或 cmd-08 全绿时仍无法证明批准范围内的普通聊天基线/签名未改，AC-8 会形成假绿。修复方向：重建 plan/TASK 时增加可执行的符号级/patch 级 zero_diff 证据（优先入库版本化检查器并登记稳定 cmd-NN，或明确受控 patch diff 的可审计判定），并删除“name-only 清单可证明符号零 diff/符号不出现”的错误完成条件；cmd-08 仅保留文件白名单职责。"

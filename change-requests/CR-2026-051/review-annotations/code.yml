  - "BL-C1 [P1][server/internal/integrations/lark/http_client.go:515, approval_reminder.go:456-462]：sendCardToOpenID 对飞书非零业务码返回普通 fmt.Errorf，但 errorClassOf 只会从 *APIError 读取 230020/99991400；当 msg 不含英文 rate limit/rate_limit 时，真实限流会被记为 error_class=other，违反 SDD §4.6 的 rate-limited 闭集语义。请保留结构化业务码（优先复用现有 APIError）并补真实 SendApprovalReminderCard 非零限流响应→rate-limited 的回归测试。"

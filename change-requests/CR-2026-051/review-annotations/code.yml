  - "BL-C3 [P1][server/cmd/server/approval_reminder_wiring_test.go:59-67,351-373]：AC-11 端到端测试的 fake 忽略 ctx、靠测试主动 close(sendCh) 解锁，最终断言 result=sent；它没有验证‘阻塞至 recipient timeout’或 timeout→result=failed/error_class=timeout。当前 test-report 将 AC-11 标 PASS 证据不足。请让 fake 等待 ctx.Done()（用短 RecipientTimeout），同时保留 HandleCREvents 时延/投影断言，并最终断言超时失败日志。"

dimensions:
  prd-sdd-alignment: "pass: FR-1 through FR-11 are mapped to concrete sections and implementation seams; the former payload omission is corrected with nullable shell_issue_id, and the FR-10 protocol-file delta is explicitly disclosed rather than silently changing the approved PRD."
  architecture-reasonableness: "pass: the trusted crsync branch publishes a dedicated event into the synchronous bus, while the subscriber performs zero-I/O parsing and bounded asynchronous delivery; the design preserves the architecture event-authority split and dependency direction. DD-2 raw pgx and DD-4 shared protocol choices include real alternatives and tradeoffs."
  data-model-completeness: "pass: the design covers the workspace-closed CR-to-project read chain, owner/admin membership, binding/install classification, workspace-scoped full installation hydration, credential decryption, and post-hydration workspace/status checks without adding DDL."
  interface-contract: "pass: governance and lark share a typed protocol event constant and payload, the APIClient addition and approval-card parameters are specified, the private transport helper boundary is clear, and no HTTP API is added."
  multi-repo-constraints: "pass: the operational knowledge-base worktree and declared multica worktree are the sources of review evidence; tools remains read-only/zero-diff, resource worktree authority is stated, and the required CUSTOM.md registration is planned for implementation."
  performance-security: "pass: the bus callback has zero database/HTTP I/O; delivery uses a background context, 60s event and 10s recipient bounds, bounded in-flight concurrency, panic recovery, and single-attempt semantics. All read paths are workspace-anchored and fail closed, and sensitive credentials/evidence are excluded from logs and cards."
  testability: "pass: the matrix covers each former blocker, typed event/JSON compatibility, credential hydration states, attempted-open_id dedup after failure, cross-workspace negatives, structured failed logs, disabled/stub behavior, helper regressions, non-blocking delivery, panic, and overload; database tests are required to run against PostgreSQL without skip-based false green."
  prompt-impact: "skip: this CR does not modify crctl dispatch or controlled-shell protectedPaths.deny, and the tools package remains unchanged."
suggestions:
  - "Human architecture approval should explicitly accept the disclosed FR-10 delta adding server/pkg/protocol/events.go (shared event constant and payload). If it is rejected, use the documented DD-4 map/JSON-envelope fallback and its two-sided contract tests before implementation."
  - "During implementation, preserve the exact nullable pgtype.UUID-to-shell_issue_id conversion and pass the DaemonAuth workspace UUID unchanged into GetInWorkspace; keep shell_issue_id correlation-only and never use it as a query input."
  - "Record the event-level failed-log recipient-field exception explicitly at approval or implementation review; it is a scoped observability refinement because those failures occur before a recipient exists, while recipient-level failures retain the required recipient fields."
  - "Keep the new lark raw-SQL column list, shared protocol contract, APIClient method, and four test doubles together in the new CUSTOM.md entry, then validate the implementation against the declared FR-10 file set."

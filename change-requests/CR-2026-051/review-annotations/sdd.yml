dimensions:
  prd-sdd-alignment: "pass: FR-1～FR-11 仍有完整技术映射；本轮把 AC-4 情形①明确收敛为事件级 no-approver + 混合 workspace 的 member 零发送负向断言，未新增 reason、未改 PRD，且与 FR-4 及 PRD §4.4 的事件级 partition 一致。"
  architecture-reasonableness: "pass: 专用门禁事件、同步回调零 I/O、异步 fail-closed 读链与 composition-root 判空的方案骨架未变；本轮只修正可观测语义与验证位置，没有引入第二状态机、通知队列或新抽象。"
  data-model-completeness: "pass: AC-4 全 member / admin+member 两类造数均可由既有 member role CHECK 与 workspace-scoped 绑定模型表达；无 DDL，既有两条 SQL、凭据水化与租户闭合保持完整。"
  interface-contract: "pass: shell_issue_id 已统一为键恒在、空值 null；typed-nil 的责任边界按实际类型区分，Credentials 的具体指针转接口陷阱由 router 条件赋值防护，Client 的 nil 接口不误作同型承重断言。"
  multi-repo-constraints: "pass: 代码改动仍限 multica；knowledge-base 只承载 CR 产物，tools 零改动；资源路径继续以 workspace inspect 的 resources[].worktreePath 为 authority。"
  performance-security: "pass: AC-4 回修不扩大全成员查询、不生成按 member 线性增长的跳过日志；非 owner/admin 仍不进入收件人集合，workspace 锚点、安装水化与日志敏感信息边界未退化。"
  testability: "pass: BL-2 已按真实执行路径拆分 liveness probe（publish / trace ledger-only / reconcile / gate projection，并覆盖两个不 publish 例外）；BL-3 的四个真 nil 分支逐依赖隔离，typed-nil 承重断言迁至 cmd/server wiring，均可执行且不会靠其他 nil 短路假绿。"
  prompt-impact: "skip: 本 CR 不修改 crctl dispatch 或 controlled-shell protectedPaths.deny，tools 包仍为零改动。"
suggestions:
  - "人工重新审批时请显式确认 AC-4 情形①采用场景级口径：无 owner/admin 的事件记 no-approver；混合 workspace 中普通 member 以不进入收件人集合证明零发送，不产生逐 member skip 日志。实施测试不得把后者描述成收件人级 reason。"
  - "TASK-05/TASK-07 的零 DB 断言面对具体类型 *pgxpool.Pool 时不要声称存在接口替身；可用 nil 前置分支，或以真实测试池的 pgxpool.Stat().AcquireCount 前后不变作为可执行证据，保持逐依赖隔离。"
  - "approvalGateStageLabels 若实现为包级 map，应保持不导出且不在运行期写入；若要严格兑现‘无包级可变全局状态’，可用单个 switch helper 同时返回 label 与 ok，仍只维护一份四门禁闭集。"

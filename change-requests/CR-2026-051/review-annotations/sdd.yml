cr-id: CR-2026-051
review-type: tech-design
reviewer: "OldBoy405"
reviewed-at: "2026-08-25T21:06:38+08:00"
verdict: block
blockers:
  - "BL-1 数据查询无法完成发送：sdd.md §4.4 第二条 SQL 只返回 binding id/open_id/installation_id 与 installation id/workspace/channel_type/status，没有 config 中的 app_id/app_secret_encrypted/tenant_key/region；但 §4.2 随后要求用 InstallationService.DecryptAppSecret 构造 InstallationCredentials。设计没有提供完整 Installation 的解码或后续 workspace-scoped lookup，当前方案无法实际发送。必须明确选中的安装如何取得完整凭据，并定义查询/解密失败的结构化 failed 日志。"
  - "BL-2 open_id 去重语义错误：sdd.md §4.2 只在发送成功后加入 sentOpenIDs；同一事件中第一个相同 open_id 的尝试失败时，后续用户仍会再次尝试该 open_id，违反 FR-5/AC-3 的‘同一 open_id 只发一次’和 FR-8.2 的单次尝试语义。应在调用发送前登记 attemptedOpenIDs，并增加首个尝试失败加重复 open_id 的回归测试。"
  - "BL-3 已审批 FR-1 的事件载荷被未授权收窄：sdd.md §3.2.1/§6 的 Payload 只有 cr_id/status/event_id（workspace 放在 envelope），明确不带 CR/issue 关联标识，而 PRD FR-1 明确列出该标识。不能由 SDD 自行裁决为‘有意收窄’；应携带可空 shell_issue_id，或先由需求负责人修订 PRD/追溯口径并在设计中引用该裁决。"
  - "BL-4 事件接口没有可编译的跨包契约：EventCRApprovalGateEntered 与 ApprovalGateEnteredPayload 被定义在 governance/crsync.go，但设计同时要求 lark 不依赖 governance；events.Event.Payload 是 any，Register/parsePayload 没有说明共享常量、共享类型或 canonical JSON 形状。按当前文字 lark 既不能类型断言该 payload，也没有稳定的事件名来源。应把事件名和载荷类型移到共享 protocol/events 包，或明确 map/JSON envelope 的生产与解析契约及回归测试。"
dimensions:
  prd-sdd-alignment: "block: FR-1 association identifier is omitted without an approved requirement revision; the remaining FR-to-section mapping is substantially complete."
  architecture-reasonableness: "block: the governance-to-lark event boundary has no shared, compilable contract; DD-2 raw pgx is acceptable in principle within FR-10 if its credential lookup and workspace fencing are made explicit."
  data-model-completeness: "block: the binding candidate query does not return or otherwise obtain the installation config fields required to decrypt credentials and send."
  interface-contract: "block: APIClient addition is typed, but the event constant/payload crossing governance and lark is not; the delivery path also lacks a precise Installation lookup contract."
  multi-repo-constraints: "pass: the review used the CR operational knowledge-base worktree and the declared multica ARCHITECTURE.md; tools is read-only and the design keeps tools at zero diff."
  performance-security: "block: failed first sends can cause a second attempt to the same open_id; workspace fail-closed intent and asynchronous boundary are otherwise well specified."
  testability: "block: the matrix must add credential hydration, shared event decoding, and failed-attempt open_id dedup regressions before the design is implementable."
  prompt-impact: "skip: this CR does not touch crctl.mjs dispatch or rules.json protectedPaths.deny, so the conditional §8 section is correctly omitted."
suggestions:
  - "DD-2 decision: accept the raw pgx seam rather than expanding FR-10 into channel.sql/sqlc, because the existing LIMIT 1 INNER JOIN cannot preserve missing/revoked/orphan reasons. Keep the LEFT JOIN classifier, add an explicit workspace-scoped full-installation read (or return/decode all required config in the query), and record the lark raw-SQL column dependency in CUSTOM.md; the current CUSTOM #5 precedent is governance-specific."
  - "DD-3 / §4.5 decision: accept the private sendCardToOpenID extraction. Keep all existing SendBindingPromptCard tests unchanged and add approval-card validation, happy path, token-error invalidation, JSON escaping, and stub tests so helper reuse is proven rather than inferred."
  - "Make event_id globally correlation-safe by including workspace_id or document that the lookup key is the pair (workspace_id,event_id); the current three-part projection can collide for same-named CRs across workspaces."
  - "Make NewApprovalReminder(nil Pool) safe at the router call site (or return a no-op object); the stated constructor contract returns nil but the unconditional .Register(bus) example would panic. Also map DB read errors to structured failed logs, not skip reasons."

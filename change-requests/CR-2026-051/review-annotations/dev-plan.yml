blockers:
  - "[PLAN][TASK-05] Error 日志契约仍然自相矛盾：实现要点 3 明确 Register(bus=nil) 时记 Error，但要点 9 又声明 phase=construct / phase=panic-recovered 是‘本 TASK 唯一的 Error 级输出’。实现者无法同时满足两条。请明确 Register(nil) 的级别与结构化字段，或把‘唯一’限定到构造/异步投递路径，并给 Register(nil) 保留一个不与四类 result / FR-8.2 reason 混淆的确定口径。"
  - "[TASK-06] 私有 schema 名 ac7_<sanitize(t.Name())>_<pid>_<unixnano> 未处理 PostgreSQL 标识符 63 字节上限；常见长测试名会把尾部 pid/unixnano 静默截断，使所谓唯一后缀丢失，强杀遗留后重跑可能 CREATE 冲突，正好破坏本回修声称的确定性与清理非必需性。请规定长度有界且保留唯一性的命名算法（例如短前缀 + 固定长度 hash/随机串，并断言字节长度 <=63），并让 CREATE / search_path / DROP 复用同一个安全标识符。"

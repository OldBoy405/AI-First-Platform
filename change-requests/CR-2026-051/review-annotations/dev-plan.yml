  - "[PLAN][TASK-05] 验收条件 1(d) 要求 Pool=nil 时以‘无 Error 日志’证明零查询，但实现要点 2 又明确 Pool/Client/Credentials 任一为 nil 时构造函数必须先记一条 Error；该验收按计划自身即不可满足。请把断言收敛为可区分的结构化信号（例如允许构造期 dependency-missing Error，但禁止 panic-recovered / result=failed），或改用不会与构造日志冲突的零查询证据。"
  - "[PLAN][TASK-06] AC-7 为制造 binding-query 失败而在 public schema 执行 ALTER TABLE channel_user_binding RENAME，并仅以 lark 包内四个触库测试无 t.Parallel() 论证安全；仓库 scripts/test-go.sh 会把全部 regular packages 交给同一个 go test、按默认包级并行运行且共享 DATABASE_URL，因此其他包可在重命名窗口访问该表，t.Cleanup 也无法覆盖测试进程被强杀/崩溃的场景。该取证会污染共享测试 schema，须改为隔离 schema/search_path、专用受限连接或其他不改 public schema 的确定性失败注入。"

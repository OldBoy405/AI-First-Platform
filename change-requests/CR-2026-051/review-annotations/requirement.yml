verdict: block
blockers:
  - "`prd.md:37,85,204` 将“有效飞书绑定”定义为 channel_user_binding 行存在且用户仍是 workspace member，但实际 channel_installation 仍有 active/revoked 状态，且撤销安装会保留安装行（multica server/internal/handler/lark.go:109-112）。FR-5 必须把 binding 关联的 installation_id 限定为同 workspace、channel_type=feishu 且 status=active，并明确 revoked/orphan 安装的跳过原因；补充对应 AC 与测试，否则撤销后的绑定仍可能被当作收件人。"
  - "FR-3/FR-5 与 AC-3/AC-7 没有把事件中的可信 workspace、cr.workspace_id、issue.workspace_id、project.workspace_id、binding/installation.workspace_id 的一致性写成硬约束。现有 cr.shell_issue_id 只提供 issue 外键，不能替代跨 workspace 校验；异常关联可能把 CR 标题发送到另一 workspace。必须要求解析查询在所有关联层校验同一 workspace，解析失败按跳过记录，并增加跨 workspace 负向验收测试。"
  - "PRD 只在 FR-8/4.1 声明通知不能阻塞 CR 消费，却没有规定实现边界或可验证的时限；现有 multica server/internal/events/bus.go:66-91 的 Bus.Publish 会同步调用订阅者，crsync.go:469-488 在状态消费路径发布事件。必须明确订阅者不得同步执行数据库/飞书 I/O，而要在状态投影和事件发布后交给脱离请求上下文的有界超时异步处理，并定义投递处理 panic/队列过载的日志行为；AC-7/AC-9 需增加 Lark 超时下状态消费不被延迟的测试。"
  - "FR-8/4.3/4.4 要求飞书 integration 未启用时也产生结构化跳过日志，但现有 router.go:468-639 仅在 MULTICA_LARK_SECRET_KEY 存在时构造并注册 Lark 组件，PRD 未定义未启用时仍由谁订阅专用事件并记录该结果。必须要求 notifier 在 disabled/stub 形态下仍可观测地消费事件（或明确等价的统一日志入口），并在 AC-7/AC-9 增加无配置场景验证，且不得发起真实请求。"

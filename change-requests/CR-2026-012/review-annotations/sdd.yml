verdict: block
blockers:
  - id: SDD-BLOCK-001
    location: "§4.1 触发过滤改造 / §4.2 DC 路由 re-target"
    issue: >-
      两节内部矛盾：§4.1 伪代码 filterToAgent(triggers, dcAgentID) 只保留"目标为 DC"
      的触发，而 §4.2 的 re-target 分支前提是"DC 作者的 @{team agent} 触发到达
      enqueueSingleCommentTrigger"——该触发在 §4.1 已被丢弃，永远进不了 §4.2 分支；
      §4.2 自述"DC @其他 agent 已被 4.1 过滤，不进本分支"与自身前提冲突。按两节
      各自实现会得到"DC 永远无法路由到 Team Agent"，FR-3/AC-3 不可达。
    suggestion: >-
      §4.1 过滤谓词改为两类并集：①目标为 DC 的触发（激活）；②作者为 DC 且目标为
      项目 team_agent_id 的显式提及触发（路由，交 §4.2 re-target 消费）。同步修正
      §4.2 的分支前提描述与 §4.1 的测试分支清单（补"DC 作者 @团队Agent 放行、
      DC 作者 @第三方 agent 拒"两个用例）。
repair-target: write-tech-design
repair-instructions:
  - "按 SDD-BLOCK-001 修正 §4.1 过滤谓词为两类并集（DC 目标触发 ∪ DC 作者×team_agent 目标触发），并同步 §4.2 前提描述与测试分支清单"

suggestions:
  - "TSUG-001: DD-5 断言『originator 经 trigger comment 链解析为激活 DC 的人类，容量守卫正常适用』未经代码证实——re-target 的 trigger comment（路由 comment）作者是 DC（agent），resolveOriginatorForIssueTask（task.go:863）能否穿透到激活 DC 的人类需任务期核实；若解析不到人类 originator，按 task_queue_capacity.go:49-57 注释该 enqueue 走 a2a 直通、不受容量守卫。两种结果都可接受，但 SDD 应改为二选一的显式定案（显式透传 originator，或声明路由 enqueue 为 a2a 直通并写进验收口径），不能留一个可能为假的断言"
  - "TSUG-002: CompleteTask 的 isTrivialDoneOutput 抑制（task.go:1951，TriggerCommentID 有效且输出 trivial 时不落 comment）会吞掉 DC 的简短协调输出，导致 AC-2『激活后必有可见输出』偶发不成立——DC 模板 instructions 需强制要求实质性总结输出，且测试计划补『DC 输出极简时仍有 comment 落地』的边界用例（或在该抑制处为 discussion 容器豁免）"
  - "TSUG-003: DD-8 的默认勾选态依赖 projectGates——该端点挂载受 approvalSvc 特性开关保护（签名密钥未配置则整组路由不存在，router.go:720-727），前端读取需容错端点缺失（404/网络错误 → 默认不勾选），§5.1 应写明该回落分支，避免治理未启用的环境合并转发预览报错"

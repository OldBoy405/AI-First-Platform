suggestions:
  - id: CODE-SUG-001
    severity: minor
    file: "server/internal/handler/discussion_coordinator_e2e_test.go:237-247"
    issue: >-
      e2e 链 AC-3 段手动调用 computeCommentAgentTriggers +
      enqueueSingleCommentTrigger 驱动路由，绕过了生产入口
      triggerTasksForComment（comment.go:1330，agent 经 mentioning skill 发
      comment 的实际路径）。该 shim 是既有薄层（isNote 过滤 + suppress 过滤），
      风险很低，但严格意义上"DC 发路由 comment → 触发"的 HTTP 入口未被 e2e 覆盖。
    suggestion: >-
      后续可将 AC-3 段改为经 POST comment handler 驱动（真机 E2E 清单 #3 部署前
      执行时也会覆盖该入口）；本轮不阻塞。
  - id: CODE-SUG-002
    severity: minor
    file: "server/internal/service/discussion_coordinator.go:120-146"
    issue: >-
      RouteDiscussionToTeamAgent 的 comment:created 广播 payload 为手写 map，
      与 SendProjectChatMessage 的广播组装存在重复；字段漂移时需要两处同步。
    suggestion: 后续与 sendProjectChatCore 的广播抽成共享 helper；本轮不阻塞。
  - id: CODE-SUG-003
    severity: minor
    file: "server/internal/handler/comment.go:1614-1621"
    issue: >-
      filterDiscussionContainerTriggers 的 class ①（激活）不限定 trigger source，
      thread_parent/conversation 触发指向 DC 时同样放行。这与 SDD DD-2/§6.1 的
      定案一致（"未来 reply-to 落地时父评论路由触发天然被同一过滤覆盖，零额外
      改动"，且 Discussion UI 无 reply 入口），但意味着经直连 API 构造 parent_id
      的回复评论即可激活 DC——行为面比 UI 面宽。
    suggestion: >-
      已确认为 SDD 设计定案而非偏离，留痕即可；若未来要求"严格仅 @提及"，在
      class ① 加 source == mention_agent 一行即可。

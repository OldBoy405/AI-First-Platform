meta:
  capability: node-execution-binding-contract
  change_id: 2026-10-19-aifi-45-runner-contracts
  created: '2026-10-19'
  confidence: high
requirements:
  - id: REQ-T-BIND-001
    description: Skill维护归属与每节点实际执行者分离，nodeId是绑定键。
    scenarios:
      - id: SC-T-BIND-001
        confidence: high
        evidence: canonical/proposals/2026-10-19-aifi-45-runner-contracts.yaml#what_changes.C2
        given: 阶段pipelineOwner已获授权，push-progress或workspace-freshness由逻辑system actor owns。
        when: emitter导出该共享节点的派发合同。
        then: SHALL 保留维护owner并将executor绑定到已授权的真实阶段Agent，不给system创建执行Agent。
        and:
          - 每个非human节点有且仅有一项nodePermissions并含nodeId、ref、owner、executor。
          - 来源task的调用者不参与临时选择executor。
      - id: SC-T-BIND-002
        confidence: high
        evidence: canonical/proposals/2026-10-19-aifi-45-runner-contracts.yaml#constraints
        given: 需求、设计或coding的独立评审节点，且作者具有review Skill的can-call。
        when: 从现有模板声明与matrix解析executor。
        then: SHALL 将review节点绑定到独立reviewer并拒绝作者同人自审。
        and:
          - active Skill、唯一owns、kind=agent、owns/can-call和forbidden校验均保留。
          - 无合法绑定时失败关闭，不按可用性/调用者/Skill owner临时回退。
      - id: SC-T-BIND-003
        confidence: high
        evidence: canonical/proposals/2026-10-19-aifi-45-runner-contracts.yaml#what_changes.C1
        given: coding中两个write-dev-tasks节点和两个workspace-freshness节点ref分别相同但UUID不同。
        when: 导出并由平台parser消费权限与执行绑定。
        then: SHALL 按nodeId保留所有独立绑定与节点顺序，不以ref唯一索引覆盖或拒绝合法重复节点。
        and:
          - 重复nodeId或缺失绑定硬失败，不能静默降级。
          - human_approval保留为等待节点而非可派发Agent任务。

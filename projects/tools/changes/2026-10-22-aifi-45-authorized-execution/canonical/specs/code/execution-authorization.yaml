meta:
  capability: execution-authorization
  change_id: 2026-10-22-aifi-45-authorized-execution
  created: '2026-10-22'
  confidence: high
requirements:
  - id: REQ-AUTH-001
    confidence: high
    description: 充分的可信原请求直接绑定授权，不重复阶段人工确认。
    scenarios:
      - id: SC-AUTH-001
        confidence: high
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,C4,AC-1
        given: 新合同CR具有有权者原始请求及完整目标、正向范围、交付位置、验收、禁止项和已接受执行上限。
        when: 正常阶段请求绑定及消费授权。
        then: SHALL 验签并在适用业务门禁通过后推进，不产生额外阶段人工确认。
        and:
          - 系统消费记录明确basis=execution-authorization，不伪造人类阶段批准。
          - 原始授权、消费receipt及当前subject可追溯。
          - 来源按wire-contract.md冻结完整原bytes；重复JSON键拒绝，独立核对14语义字段与原始目标仓/控制根选择。
          - 服务端从已认证scope核验资源UUID/身份版本并冻结到已签repository_bindings及coordinator_binding；不增加阶段批准。
      - id: SC-AUTH-002
        confidence: high
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,AC-2
        given: 原请求缺少决定性验收或交付边界，但环境中的仓库事实可查。
        when: 执行方判断授权充分性。
        then: >-
          SHALL 自查事实并仅请求必要业务取舍，未授权部分无状态变化或执行任务。
          授权包中 `acceptance` / `delivery_targets` 允许为空（D1）：空值是"授权不足"这一事实的
          如实记录，不是解码失败。充分性由只读前置判定（`crctl authorization-check`）给出，
          不足时返回 `EXECUTION_AUTHORIZATION_INSUFFICIENT` 并逐条列出缺口，缺口分两类——
          `business`（只能由需求方补的决定）与 `facts`（执行方须先自查的环境事实）；
          两类不可互相顶替，且判定本身不写任何状态、不创建执行任务。
  - id: REQ-AUTH-002
    confidence: high
    description: 可信来源、scope和敏感动作边界不能由作者、转述或参数豁免。
    scenarios:
      - id: SC-AUTH-003
        confidence: high
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,AC-8
        given: 请求来自task-token或cloud_pat、伪header/自报actor/comment ID、未知公钥、篡改payload或旧阶段grant。
        when: 尝试绑定execution授权。
        then: SHALL 拒绝且不产生授权消费、状态推进或修复准入。
      - id: SC-AUTH-004
        confidence: high
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,AC-2
        given: 已绑定授权仅允许指定仓库、路径、交付目标和验收版本。
        when: 候选变更扩大范围、放宽验收、跨仓或通过相对路径及符号链接逃逸。
        then: SHALL 阻断未授权部分并要求明确新授权，不能先改文档事后追认。
        and:
          - graph仅定位；目标仓库逐项匹配原授权冻结的资源UUID/身份及当前平台绑定，不按可变label猜测。
          - 控制根或目标资源删除、改绑、跨项目或graph换根不得扩大旧授权；复制旧账本不重置累计状态，迁移保留lineage/消耗/证据。
      - id: SC-AUTH-005
        confidence: high
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,AC-8
        given: 仅有普通实施授权，未明确生产发布、破坏性数据、权限扩大或对外承诺与支出。
        when: 逐项请求这些敏感动作。
        then: SHALL 分别拒绝，即使作者声称低风险或维护者具有运维权限。
      - id: SC-AUTH-006
        confidence: high
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,AC-8
        given: 原始可信授权已明确某敏感动作的对象、环境及次数或额度。
        when: 对该动作提交匹配operation_id，随后重试同一操作。
        then: SHALL 仅在明确边界内消费一次，不重复要求同一授权，也不允许换对象或扩大动作。
        and:
          - 不同operation_id共享同lineage与动作对象环境的授权额度，换ID或续签不重获满额。
          - 已授权动作的扩额必须显式签增量，操作幂等键与额度聚合键分开。
  - id: REQ-AUTH-003
    confidence: high
    description: 授权和消费必须适用于当前scope、版本及租户，ACK不等于消费。
    scenarios:
      - id: SC-AUTH-007
        confidence: high
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,C6,AC-7
        given: grant已送达并ACK，但crctl消费事务尚未提交。
        when: 查询授权状态或尝试推进。
        then: SHALL 保持未消费且不误推进，历史送达记录仍可查询。
      - id: SC-AUTH-008
        confidence: high
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,C6,AC-7
        given: grant签名有效但复制到其他安装根/worktree，属于其他workspace/project/同名CR或不同policy/template/tools/scope版本，或旧challenge/revision/撤销及陈旧资源投影。
        when: 在当前权威workspace消费或重新绑定旧包。
        then: SHALL 拒绝不适用复用且不回滚活动授权head，未启动任务遇撤销停止，累计消耗保留。
        and:
          - 失联无法证明当前head时无新准入或敏感动作；已运行只允许有界安全收尾。
          - 首版无时钟到期协议，不宣称即时回滚已发生不可逆副作用。
          - 当前控制证明绑定本进程随机challenge、实际进程/根和真实任务；可编辑sidecar/env不构成身份。
          - 平台仅向经现有daemon_token认证且与DB当前claim匹配的可信daemon控制子进程签发，不提供Agent任意nonce代签。
      - id: SC-AUTH-009
        confidence: medium
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1,C6,AC-6
        given: 相同阶段授权消费已提交，响应或发布丢失，当前subject未变。
        when: 重放同一消费请求。
        then: SHALL 返回同一已提交receipt且changed=false，不重复消费或生成伪审批。
        and:
          - 同键不同subject或语义必须报冲突，不能覆盖旧记录。
  - id: REQ-AUTH-004
    confidence: medium
    description: 跨语言签名必须处理同一原始字节而不是各自重序列化。
    scenarios:
      - id: SC-AUTH-010
        confidence: medium
        evidence: canonical/proposals/2026-10-22-aifi-45-authorized-execution.yaml#C1
        given: Go签出的授权包含中文、分隔符、换行及显式key_id，另有域/字节/key_id篡改样本。
        when: Node消费同一payload_b64并验签。
        then: SHALL 接受合法原始字节，拒绝全部篡改、旧签名域及未知版本，不暴露私钥。
        and:
          - key_id内外一致，字段类型、整数及路径均经边界校验。
          - 普通文件证据哈希仍先CRLF规范化，不因签名传输修改已签payload字节。

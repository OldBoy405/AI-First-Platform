meta:
  task_id: evidence-delivery-contract
  change_id: 2026-10-22-aifi-45-authorized-execution
  task_type: code
  system: tools公开gate/next/writeback及registry合同边界
  preconditions:
    - Gate2后实施；所有CP当前待实现。
    - 使用独立临时Git与新旧policy夹具，不向真实CR派发；确实选中TC且无skip。
    - MUST精确选中顶层完整TC；带后缀的组件子断言不得登记整TC完成。
    - MUST核真实子进程TAP成功行及fail/skip/todo为0；零测试、ctx代码回显或skip不得算通过。
    - 静态check或单元helper不代证真实gate/next/writeback链；当前完整TC与片均未完成。
steps:
  - id: CP-EVD-001
    description: SC-EVD-001 / 最小内容完整无固定套餐也能gate及累积回写。
    action: node --test --test-reporter=tap --test-name-pattern="^TC-EVD-001$" skills/shared/crctl/scripts/test/delivery-contract.test.mjs
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'ok 1 - TC-EVD-001'}, {type: stdout_contains, expected: '# fail 0'}, {type: stdout_contains, expected: '# skipped 0'}, {type: stdout_contains, expected: '# todo 0'}]
  - id: CP-EVD-002

meta:
  task_id: repair-governance
  change_id: 2026-10-22-aifi-45-authorized-execution
  task_type: code
  system: tools公开repair CLI与隔离Git事务恢复
  preconditions:
    - Gate2后实施；所有CP当前待实现。
    - 仅临时workspace、已提交夹具和平台测试身份；验证选中TC且无意外skip。
    - MUST精确选中顶层完整TC；带后缀的组件子断言不得登记整TC完成。
    - MUST核真实子进程TAP成功行及fail/skip/todo为0；零测试、ctx代码回显或skip不得算通过。
    - 静态check或单元helper不代证真实crctl CLI链；当前完整TC与片均未完成。
steps:

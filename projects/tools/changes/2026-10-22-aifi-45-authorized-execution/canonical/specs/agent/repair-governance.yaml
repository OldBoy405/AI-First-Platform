    description: SC-RPR-001 / 正常实施不扣额，阻断后新run不能冒充首次。
    action: node --test --test-reporter=tap --test-name-pattern="^TC-RPR-001$" skills/shared/crctl/scripts/test/repair-governance.test.mjs
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'ok 1 - TC-RPR-001'}, {type: stdout_contains, expected: '# fail 0'}, {type: stdout_contains, expected: '# skipped 0'}, {type: stdout_contains, expected: '# todo 0'}]

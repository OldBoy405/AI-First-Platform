meta:
  task_id: execution-authorization
  change_id: 2026-10-22-aifi-45-authorized-execution
  task_type: code
  system: tools公开CLI与Go/Node签名联合夹具
  preconditions:
    - Gate2后才创建对应测试与实现；当前所有CP为待实施而非已通过。
    - 从tools仓执行，测试只用临时Git/workspace及测试密钥。
    - MUST精确选中顶层完整TC；带后缀的组件子断言不得登记整TC完成。
    - MUST核真实子进程TAP成功行及fail/skip/todo为0；零测试、ctx代码回显或skip不得算通过。
    - 来源/资源/current-binding精确规则以wire-contract.md为源；静态check或fixture signer不代证真实daemon链。
steps:
  - id: CP-AUTH-001
    description: SC-AUTH-001 / 充分原请求授权推进，无伪造阶段人类批准。
    action: node --test --test-reporter=tap --test-name-pattern="^TC-AUTH-001$" skills/shared/crctl/scripts/test/execution-authorization.test.mjs
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'ok 1 - TC-AUTH-001'}, {type: stdout_contains, expected: '# fail 0'}, {type: stdout_contains, expected: '# skipped 0'}, {type: stdout_contains, expected: '# todo 0'}]
  - id: CP-AUTH-002
    description: >-
      SC-AUTH-002 / 不足授权仅补问关键取舍，未授权无副作用。空 `acceptance`/`delivery_targets`
      视为授权不足而非格式错误（D1）；只读前置返回 `EXECUTION_AUTHORIZATION_INSUFFICIENT`，
      缺口区分业务决定与环境事实，未授权部分无状态变化、无执行任务。
    action: node --test --test-reporter=tap --test-name-pattern="^TC-AUTH-002$" skills/shared/crctl/scripts/test/execution-authorization.test.mjs
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'ok 1 - TC-AUTH-002'}, {type: stdout_contains, expected: '# fail 0'}, {type: stdout_contains, expected: '# skipped 0'}, {type: stdout_contains, expected: '# todo 0'}]

  - id: ADJ-AIFI45-009
    original_design_ref: 'test-plan.md#TC-RPR-006；canonical/specs/code/repair-governance.yaml#SC-RPR-006；EXEC-20 旧 journal 恢复正例；specs/ai-first-platform/SDD.md 中 CR-2026-075 默认 ledger 恢复与非 Git 合同；validation/execution-terminal-state-contract-draft-20261103.md'
    actual_change: '用户就“继续需要允许登记已采纳的合同配对并批准独占测试夹具”明确回复“批准。继续完成所有未完成的项，中途非必要不要一直中断汇报。”授权范围内活动事务采用可信已提交、可信未提交和未知三态：可信已提交复用按适用协议核验的原 receipt；可信未提交须有可核实的发布前事实、原执行者不能迟到以及资源归属和排他；其余保留原事务现场和 journal 对账，不换键重执行。不将缺 receipt 或本地 complete 单独当作未提交或已提交证明。登记已获允许，原条款适用关系、配对修订生效、真实 producer、旧 writer 切换及验证仍分别待完成；不把登记或夹具许可冒充 Gate3、部署或协议已生效。'
    reason: 'EXEC-20 的旧 written 且无 candidate/receipt 可由从未发布与已发布后 ref 回拨两种历史产生；无 sampler 的 complete 还会直接返回 committed。默认 HEAD/消息判据无法提供共同提交事实。现有旧输入的自动回滚或已提交结果与未知保锚方向存在真实行为差异，不能称为等价兼容。'
    impact_scope: 'T 共享 durable、crctl 默认恢复与执行适配器、活动旧 journal 及实际 caller；须核定 CR-2026-075 后续适用和默认 API 配对，覆盖 complete 与消息判据。保留按协议可核实的非 Git 合法回滚、合法旧 receipt 与后继复用、受控发布前自动回滚、原测试及历史证据，不新增当前 HEAD 必须同树条件；不迁移、回填或改写历史 CR 实例。独占测试夹具许可不解除旧 DB、旧 runner、HOLD、提交推送及部署限制。'
    severity: major
    affected_capabilities: [execution-authorization, repair-governance]
    status_note_20261108: 'EVD-007 的「保留旧安全恢复路径」此前记为由 TC-EVD-006 的用例覆盖；该判断被推翻——EVD-006 断言的是恢复规则本身，EVD-007 断言的是「未就绪与恢复路径的关系」，属于两个事实，后者当时无人断言。2026-11-08 已在 TC-EVD-007 内补三条断言（readiness 未就绪使交付判 blocked；同场景下既有 release receipt 仍 allowed 且 digest 不变；blocked 结果不含 delivered/go_live 真值），并做了变异验证（强制 ready:true 后该断言变红）。顶层用例数未变，未改实现。本条仅为记录，不改变 resolved。'
    status_note_20261106: '合同配对已实施并验证（2026-11-06，用户批准"B4/C6 合同配对现在做"）：receipt 适用协议由 journal 绑定的 candidate.commitOid 是否等于 receipt sha 判定，而非 receipt 缺字段；旧协议允许真超集，绑定候选严格限于写集；candidate 存在但字段畸形时 TX_JOURNAL_INVALID，不降级。旧协议真超集由错误拒绝变为接受（修复前 5/6 → 修复后 6/6），绑定候选溢出与严格相等两侧行为均符合合同。证据：validation/e2-tap-receipt-pairing-20261106/README.md、test/receipt-protocol-pairing.test.mjs。仍未满足 resolved：真实 producer、旧 writer 切换、EXEC-20 旧 journal 真实样本、非 Git 回滚与部分暂存配对、Gate3 均未完成；本备注不是生效声明。'
    adjudication_20261108: '仍 open。receipt 适用协议已按 journal 绑定的 candidate.commitOid 配对；未完成项不变：真实 producer、旧 writer 切换、EXEC-20 真实旧 journal 样本、非 Git 回滚与部分暂存配对。本条不得因配对实施而被读作协议已生效。'
    resolved: false

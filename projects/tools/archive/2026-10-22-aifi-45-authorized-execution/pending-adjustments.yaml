    actual_change: '登记拟议 checkpoint 多批事实设计供人工评审：整体计划已选择逐批保留结果、N+1 不隐式 supersede N、老单槽冻结并仅按可核实规则导入其自身；结果与投递事实分开。用户对整体方案的原话为“请按照刚刚的方案实施，子代理委派使用LLM分层”，已授权按计划实施并先推进 WP0；事实落点、冻结和导入细则、显式处置权限与 CAS、ACK、跨端顺序及恢复合同仍待适用决定，资源使用或 Gate 未因此批准。候选未实施，登记不等于具体合同批准。用户对后续整体最小方案的原话为“采纳你的建议，实施”：采纳将业务幂等身份与投递生命周期分离、进程内拒收运维计数在重启后重新累计的方向；业务额度/stop/消费事实不得因此清零。T/M 合同、同投递重试身份、旧文件/旧 writer、未知和迟到 ACK、不可复用路径及最终操作归属须配对核定，不能仅凭随机文件名或记录方向证明安全。现行合同若冲突须先按适用 B4 程序处理；不解除 HOLD、不批准真实资源或 Gate。'
    reason: '当前 latest 快照整块替换，journal 及 outbox 可在完成后删除；服务端 accepted 文件名不等于已认证内容摘要，接收端 checkpoint 投影自身未验证因果顺序。当前机制尚未证明多批结果及投递、确认和崩溃恢复的完整性。'
    impact_scope: 'T checkpoint、outbox、发布恢复与每 CR 锁；M daemon ACK 和 CR checkpoint/status/snapshot 投影须配对审查。保留原 SC-EVD-008 分别授权的合法迁移及 SC-EVD-009，保留全部原 TC；真实 FS/Git/CLI/DB 与跨进程验证仍受资源授权限制；其他 HOLD 仍按 validation/root-cause-convergence-implementation-plan.md §1.3 执行。'

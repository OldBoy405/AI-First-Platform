meta:
  change_id: "2026-10-30-aifi-45-evidence-delivery-integrity"
  title: "AIFI-45 证据交付完整性与合同防降级"
  created: "2026-10-30T10:15:07.732188"
  status: draft
  version: "2.9"

why:
  problem: |
    AIFI-45 的交付检查需同时保护新合同不被删除字段降级，并避免追溯性阻断合法 legacy。现有 YAML 和报告解析、合同选择及证据身份绑定仍有未闭合问题；局部 guard 或纯函数测试不证明真实 CLI、两个 gate 与可信来源已贯通。
  motivation: |
    用户同意将证据交付完整性拆为独立 change，并采用新合同严格解析方向；拆分不改变 AIFI-45 已确认的 SC-EVD-006/007、P0/P1 和 Gate3 验收责任。

what_changes:
  - id: C1
    type: modify
    description: "先核查权威注册与迁移历史，设计新旧合同选择和防删除降级；异常不得静默回退 legacy。"
  - id: C2
    type: modify
    description: "评审新合同的严格解析范围：未知字段、重复键、非 mapping 头部、未消费输入及报告 fence 的处置，并盘点受支持语法与历史兼容性。"
  - id: C3
    type: modify
    description: "闭合授权、验证和评审的来源及 subject 绑定，并通过经安全审查的隔离 fixture 验证真实 CLI 与相关 gate。"
  - id: C4
    type: modify
    description: "评审机械例外中 env 等包装器、组件 not-applicable 的版本与来源证明、unknown 作者和 Cf 身份策略；未完成前保留在 AIFI-45 pending。"
  - id: C5
    type: modify
    description: "回传可追溯证据给 AIFI-45；现有任务和规格不因拆分自动完成或取消。"

capabilities:
  new: []
  modified:
    - name: "evidence-delivery-contract"
      description: "保障交付证据解析、合同选择和来源验证的完整性。"

constraints:
  - "本文件是 understand 草案，不是 Gate1、Gate2、实现或部署批准。"
  - "legacy 兼容不能以本地字段缺失为唯一依据，需由权威注册与迁移历史核实。"
  - "严格子集不等于完整 YAML；必须先决定折叠块、plain key、flow mapping 和合法历史文件的接受或拒绝策略。"
  - "静态字符串、签名原字节或纯组件 GREEN 不自行证明授权主体、评审独立性或真实生产入口。"
  - "fixture 可能通过 git 发现真实祖先仓库；隔离能力与调用边界经独立评审前不得运行。"
  - "不得以拆分为由移除 AIFI-45 的既有 P0/P1 或 Gate3 要求。"

non_goals:
  - "不追溯性阻断合法 legacy，不将历史资产未经审议强制迁移。"
  - "不预定使用新的解析依赖，不把新旧两个变更的测试次数叠加为验收数。"

success_criteria:
  - "批准的合同选择和解析策略具有可核验的权威来源、兼容盘点及明确失败行为。"
  - "新合同覆盖未知字段、重复键、非 mapping、字段删除、解析错误、报告 fence 和来源错配的正反例；合法 legacy 有兼容回归。"
  - "隔离的真实 CLI 和两个相关 gate 验证防降级与证据链；结果交由 AIFI-45 对原 SC/TC 独立验收。"

  - "新形状必须 `^…$` 锚定、完整 40 位小写 hex、CR-ID 片段与现有一致；不放行 rev 或分支名。"
  - "匹配语义以 multica 的 Go gitguard 为准（参数用空格拼接后整体匹配锚定正则）；tools 侧测试只镜像该语义，真实消费方的证明在 multica 的 M3。"
  - "tools 推送必须先于 multica M3；推送另行取得用户授权，本 change 不自行 push。"
  - "tools 文档与注释用中文。"

stakeholders:

  - "multica daemon 的 test-facts 与 settle 采集（规则的消费方）"

risk_areas:
  - capability: controlled-shell-git-show-shapes
    risk: "放宽安全白名单：新形状若书写过宽（例如漏锚定、允许简写 sha 或路径穿越），会让 system-orchestrator 读到不应读的对象。"
    mitigation: "对照表测试同时覆盖正例与 11 种近似拒绝形状；形状全部 ^…$ 锚定；只涉及只读的 git show，且写保护 protectedPaths 不动。"
  - capability: controlled-shell-git-show-shapes
    risk: "tools 侧测试对匹配语义的镜像与 Go 消费方不一致，导致 tools 测试通过而真实消费方拒绝。"
    mitigation: "提交前用 multica 的 6 个测试对真实 rules.json 做一次交叉验证并记入 test-report；之后 M3 再把该验证固化进 multica CI。"

non_goals:

# 2026-11-15-crctl-report-status-integrity.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-11-15-crctl-report-status-integrity"
  title: "crctl report 不再静默丢弃或污染状态计数，并让 spec-dashboard 引用 report 口径"
  created: "2026-11-15T18:10:00"
  status: draft
  version: "2.9"

why:
  problem: |
    上一个 change（2026-11-15-crctl-report-active-count，已交付 b2a743a）修好了 `crctl report` 的终态计数，并把 4 条邻近问题登记为未做：
    ADJ-009：`skills/spec/spec-dashboard/SKILL.md` 第 40、56、128 行仍按「cr.md frontmatter 分组、表内含终态行」描述在途 CR 口径，与 `crctl report` 的口径（终态排除、每个 CR 只计一次）冲突；两个看板技能对同一命令说法不一致。
    ADJ-011：`cmdReport`（crctl.mjs 约 5492–5565 行）遇到 cr.md 缺 `status` 的目录静默跳过（`if (!md || !md.status) continue`）；同一函数对「status 非字符串或带首尾空白」却硬失败，两处对「不可判的数据」的处理不一致。直方图 `statusHistogram` 用普通对象承载动态键，状态名为 `__proto__` 时会丢计数。
    ADJ-007：status 值不做枚举校验，非法状态原样成为直方图的键。
    ADJ-006：`report` 不读已发布归档 journal 兜底（`publishedArchiveStatus`），而 `crctl status` 读。现有 design.md 记录了已发布但本地未同步时 report 仍计 active 的复现；BUILD 须固化为已发布/未发布成对回归，不以文字记录代替执行证据。
    2026-11-15 记录的真实数据基线为 76 个 CR、缺可用 status 为 0；实施前重新取同一数据快照的基线，不能把历史核对视为当前完整性证明。
  motivation: |
    用户已于 2026-11-15 裁定做 T2。`report` 是看板和状态结论的数字来源，静默丢 CR 或让计数被污染，会让「总数」「在途」两个数字悄悄失真；
    两个看板技能口径冲突，则让使用者对同一个数字得到两种解释。两处都只需要在共同边界各改一次。

what_changes:
  - id: C1
    type: modified
    description: "spec-dashboard/SKILL.md 第 40、56、128 行改为引用 `crctl report` 的输出与口径，不再自己复写分组与终态行的统计规则；与 cr-dashboard 的口径描述保持一致。"
  - id: C2
    type: modified
    description: "cmdReport：每个 CR 目录要么计入 total 与直方图，要么使命令硬失败并指出目录；缺 `status` 与『非字符串、带空白』按同一条规则处理（默认选硬失败，与同函数内其余『不可判数据』一致；SPEC 阶段在 design 中给出理由与替代方案）。"
  - id: C3
    type: modified
    description: "cmdReport：目录与 history 的状态均须来自权威状态机声明；未声明值点名失败，声明内的动态状态键正确计数且不受对象原型影响。具体状态读取与直方图承载方案留在 design.md。"
  - id: C4
    type: new
    description: "ADJ-006 先复现：构造「本地主 checkout 未同步已发布归档、journal 里已有终态」的场景，对比 report 与 status 的结果。复现并确属缺陷则本 change 内按同一口径修复；复现不了则在 design-adjustments.md 写明结论，不改代码。"
  - id: C5
    type: modified
    description: "CUSTOM.md 登记本 change 对 tools 的修改。"

capabilities:
  new: []
  modified:
    - name: crctl-report-status-integrity
      description: "report 的 total、active、statusHistogram 对每个 CR 目录都有确定的归属：计入，或明确失败；不再静默跳过、不再被状态名污染。"
    - name: dashboard-wording-consistency
      description: "spec-dashboard 对在途 CR 口径的描述引用 crctl report，不独立复写。"

constraints:
  - "不改 report 的输出字段名与已有字段语义，不新增输出字段（失败走现有 fail() 错误通道）。"
  - "不改 crctl 其他命令的口径；status、archive 的行为不动。"
  - "『不可判数据一律硬失败，不静默降级』是 cmdReport 现有原则，本 change 只让缺 status 与非法 status 遵守它，不引入新原则。"
  - "保留 _history.yml 对重复 id、缺 final-status 的现有拒绝及其覆盖目录的优先级；新增声明集合校验不改变这些行为。"
  - "tools 文档与注释用中文。"
  - "controlled-shell-snapshot-read-shapes 已归档，业务提交为 7a0a2ab；本 change 不改其归档、规则或调用方边界。只修订本 change 的记录，不跨 project_id 写入。"

stakeholders:
  - "tools 维护者（crctl report、看板技能）"
  - "使用 crctl report 数字的看板与状态结论的读者"

risk_areas:
  - capability: crctl-report-status-integrity
    risk: "缺 status 由静默跳过改为硬失败，若存在合法的『尚未写 status 的新建目录』，report 会因它而整体失败。"
    mitigation: "已实测真实 change-requests/ 的 76 个目录中缺 status 的为 0；SPEC 阶段再查 crctl 的 CR 创建路径是否会产生无 status 的中间态，若有则改为精确报告而非失败，并写入 design。"
  - capability: crctl-report-status-integrity
    risk: "状态机声明集合的读取路径与 terminal 不同或不存在，导致 C3 把合法状态误判为非法。"
    mitigation: "只读已有声明；以现有 report 单元测试和真实数据做回归；声明缺失时沿用 REPORT_TERMINAL_UNAVAILABLE 同口径失败。"

non_goals:
  - "不改 cr-dashboard，不动 report 的 period/sla 逻辑。"
  - "不统一 crctl 各命令对 id 大小写的比较（ADJ 已决定不修）。"
  - "不处理 controlled-shell 的 rules.json（T1）。"
  - "不改 multica 代码或其 CI。"


    risk: "其他调用方若依赖旧的重复计数口径（`total`=目录数+history 数）会得到不同数字"
    mitigation: "实施前在仓内 grep 全部调用点和测试；已知消费者只有两份看板技能的文字说明，旧口径本身是缺陷"
  - capability: crctl-report
    risk: "无 tools 包终态定义的工作区原先能出报表，改后会失败"
    mitigation: "`report` 经 `loadGates` 之后已解析 Tools Root；失败信息写明缺哪一项，不静默给出错误数字"

non_goals:

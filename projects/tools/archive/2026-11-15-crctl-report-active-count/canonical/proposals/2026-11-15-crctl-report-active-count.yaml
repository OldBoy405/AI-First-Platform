  - "不改 `_history.yml`、`cr.md` 的格式，不回填、不迁移既有数据"
  - "不新增输出字段，不改 `--period` 的窗口语义"
  - "不处理 `tools/CLAUDE.md`：已核实 HEAD 的 `CLAUDE.MD` 自 72a4e61（2026-11-06）起就只要求先读 `AGENTS.md`、不含无条件读取 README 的要求，此前把它列为待办有误；其文件名大小写与工作区不一致另记为动作项"


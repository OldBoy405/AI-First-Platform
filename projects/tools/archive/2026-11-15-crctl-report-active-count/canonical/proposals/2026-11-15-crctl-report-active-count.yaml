# 2026-11-15-crctl-report-active-count.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-11-15-crctl-report-active-count"
  title: "crctl report 的在途数不含终态且不重复计数"
  created: "2026-11-15T11:29:51.193841"
  status: draft
  version: "2.9"

why:
  problem: |
    `crctl report --workspace .` 在知识库主 checkout 返回 `total: 152, active: 76, archived: 76`，
    `statusHistogram` 为 `archived: 136, withdrawn: 16`。实测该工作区 `change-requests/` 下 76 个 CR 目录
    全部同时登记在 `_history.yml`（重合 76/76），frontmatter 为 68 个 archived、8 个 withdrawn，
    即实际在途为 0。源码 `cmdReport` 把每个 CR 目录都计入 `active`，不看状态是否终态；又把同一 CR 的
    history 条目再计一次，导致 `total` 与直方图都是真实值的两倍。`cr-dashboard` 与 `spec-dashboard`
    都以该命令的输出作为看板数据源，「在途 CR」会显示 76。
  motivation: |
    看板数字被当作事实用于判断在途工作量，错误数字没有任何报错提示；`crctl status` 已按「history 优先」
    判定终态，`report` 与其不一致。

what_changes:
  - id: C1
    type: modified
    description: "`crctl report` 的 `active` 只统计非终态 CR；`total`、`statusHistogram` 按 CR 编号去重，每个 CR 只计一次"
  - id: C2
    type: modified
    description: "终态集合取自 tools 包 `dir-graph.yaml#change-request-track.state_machine.terminal`，不内建副本；无法取得时命令硬失败，不猜"
  - id: C3
    type: modified
    description: "`cr-dashboard` 技能中对 `crctl report` 输出口径的文字描述同步为新口径"

capabilities:
  new: []
  modified:
    - name: crctl-report
      description: "跨 CR 状态直方图/在途数/归档数聚合（只读）的统计口径"

constraints:
  - "同一 CR 编号同时出现在 CR 目录与 `_history.yml` 时只计一次，状态以 history 的 final-status 为准（与 `crctl status` 的终态判定一致）"
  - "`active` 等于去重后状态不在终态集合内的 CR 数；终态 CR 不进入 `active`"
  - "`archived` 字段、`periodActivity`、`period`、`sla` 的含义和取值保持不变；输出字段名不增不删"
  - "命令保持只读；不改任何 CR 目录、账本或 `_history.yml`"
  - "终态集合不可判定时以错误码硬失败，不退化为空集合或内建枚举"

stakeholders:
  - "使用 `cr-dashboard` / `spec-dashboard` 看板的人和 Agent"
  - "tools 包维护者（crctl 与技能文档）"

risk_areas:

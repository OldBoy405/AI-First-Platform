why_unbound: |
  v2 的 bind-commit 要求该 change 的 .stdd.yaml 里有 phases.build.selected_evidence，
  且 validation/runs/<run-id>/tc-evidence.json 存在。本 change 的 .stdd.yaml 是 v1 结构，
  两者都没有；命令原文拒绝：
    「未找到选定 run: phases.build.selected_evidence 为空，Gate 3 未绑定 run」
  不为它补造 v2 run 的理由：v2 回执的语义是「这些输入字节被实际执行并通过」。
  v1 没有冻结输入清单，事后对今天的树计算哈希，只会把数周前的人工评审绑到当前代码上，
  制造回执本应防止的虚假保证。该 change 涉及的控制面代码后来又被 2026-11-13 的
  aifi-45-node-trust-root 改写，重跑也不再是同一交付。


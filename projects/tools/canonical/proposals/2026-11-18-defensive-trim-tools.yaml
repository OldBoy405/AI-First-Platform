# 2026-11-18-defensive-trim-tools.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。
# 来源：docs/analysis/Multica与Tools防御性编程精简方案.md 第 3 节 OutputGuard 段、第 4 节、第 5 节（实施拆分第 2 项）。
# 项目级合并：C3 摘要口径按已批准 design.md C3 明确“原始字节”的简写；change 原件保留。

meta:
  change_id: "2026-11-18-defensive-trim-tools"
  title: "Tools 防御性编程精简：交付就绪不把读错当未配置，回写正文与摘要同源，续办只认冻结候选"
  created: "2026-11-18T15:30:00"
  status: draft
  version: "2.9"

why:
  problem: |
    2026-11-18 对 Tools 二开代码的只读审查（逐条核实，行号见来源方案）发现三类防御性编程问题，均落在会影响“签出、放行、覆盖”的入口：
    (1) 交付就绪：`readDeclaredComponents` 对 `dir-graph.yaml` 的读取错误一律返回 `[]`，`workspace.components` 不是列表时同样归为 `[]`，
        二者都被当作“未配置组件就绪要求”而放行；交付层又对 `ready` 做了一次与组件判定器重复的二次判定，且有测试只构造生产不可达的形状。
        （YAML 不可解析本身已硬失败，不属此问题。）
    (2) 回写与恢复：PRD/SDD、traceability、任务索引、规格索引各自用两次以上独立读取取得正文和 `beforeSha256`，期间文件可变，
        可能把 A 的正文配上 B 的摘要；多处读取把一切错误记为“不存在”（`null`），已存在的空索引也被记为 `null`；
        已有 journal 续办时还会比较“当前”生成脚本 SHA，仅升级生成脚本就阻断在途事务。
    (3) OutputGuard：Pre/Post 只认命令首行，但原因的换行检查在其输入已截首行、正则不跨行的前提下恒假，
        `escapeHatch.singleLine` 被读取却守卫一个恒假条件，是无效的配置与分支。
  motivation: |
    用户 2026-11-18 确认本方案：威胁模型限于自用环境，不防人为恶意，只防人或 Agent 选错对象、配置写错、并发覆盖及中断后重复执行；
    治理对象为 (a) 重复校验与不可达分支（删）、(b) 把错误当正常结果的静默兜底（改为直接报错）、(c) 只供测试调用的生产函数及只覆盖被删分支的测试（连同删除，测试改走真实入口）。
    本 change 取方案第 2 项，不依赖 Multica 侧 change，可先行；其中 (b) 类使行为变严，需要明确的保证、验收与契约同步。

what_changes:
  - id: C1
    type: modified
    description: |
      交付就绪的配置读取：对适用组件就绪要求的 CR，`dir-graph.yaml` 任何读取失败（含文件不存在）在文件边界报告原因，
      已声明的 `workspace.components` 不是列表时报错；只有成功读取有效配置且 `workspace.components` 缺省或为 `[]` 才视为未启用。
      宽松 YAML 解析不改，不扩到其他读取 `dir-graph.yaml` 的路径。
  - id: C2
    type: modified
    description: |
      就绪结论只算一次：组件判定器负责条目与观测值是否匹配；交付层只合并判定器 findings，需要展示 `ready` 时由同一组 findings 推导，
      删除交付层按 `ready` 的二次判定及只构造生产不可达形状的测试。保留旧合同适用范围与其他交付条件。
  - id: C3
    type: modified
    description: |
      回写生成与应用的读取：PRD/SDD、traceability、任务索引、规格索引各用一次文件读取；以 UTF-8 解码后、换行归一化前的文本计算 `beforeSha256`，并以同一文本归一换行后的正文生成候选；
      只有文件不存在才记 `null`，空文件有自己的摘要，其他读取错误向上报错；已存在的空索引不再记为 `null`。
      应用端仍独立读取目标并沿用既有 before/after 比对、路径限制和事务锁。
  - id: C4
    type: modified
    description: |
      回写恢复：新事务仍使用固定生成器并校验版本；已有 journal 续办时不运行生成器，也不再比较当前生成脚本 SHA。
      续办凭既有业务输入与 manifest 摘要绑定、blob 核对和目标冲突检查；manifest 中的生成器 SHA 继续记录生成来源。
      “journal 续办不比较当前生成器 SHA”写入本 change 的项目级规格；不修订 `specs/ai-first-platform/SDD.md`，不为此开 CR。
  - id: C5
    type: modified
    description: |
      OutputGuard 逃生口：Pre/Post 只认命令首行，保留标记及原因长度检查；移除无效的原因换行检查与 `escapeHatch.singleLine` 配置项，不引入多行模式。

capabilities:
  new:
    - name: writeback-source-consistency
      description: "回写候选的正文与 before 摘要同源于一次读取；读取错误不被当作文件不存在；中断事务只续办其冻结候选，不因生成脚本升级而阻断。"
    - name: output-guard-escape-hatch
      description: "OutputGuard 逃生标记只认命令首行，Pre/Post 判定一致；无多行模式和无效配置项。"
  modified:
    - name: evidence-delivery-contract
      description: "交付就绪：确实未配置才能跳过组件就绪要求；配置读取失败或声明形状非法时硬失败并给出原因；就绪结论由组件判定器的 findings 单点产生。"

constraints:
  - "保证 G1：声称“未配置”只能来自成功读取的有效配置；读取失败、文件缺失、声明形状非法都不能放行交付，诊断能定位原因；声明与观测不符时原始原因进入交付报告。"
  - "保证 G2：一份就绪结论只由组件判定器产生一次，交付层不再按 ready 二次判定；对所有生产可达输入，结果与删除前一致，删除是简化而非行为变更。"
  - "保证 G3：回写候选不会把 A 的正文配上 B 的摘要；生成后目标被改为 B，应用时必须报告冲突并保留 B。"
  - "保证 G4：已有事务只续办其冻结的候选：仅升级生成脚本仍可续办；冻结的 manifest 或 blob 改变则不能续办。"
  - "保证 G5：OutputGuard 的首行标记有效、仅出现在第二行无效，Pre 与 Post 判定一致，原因长度检查保留。"
  - "边界：保证限于现有事务边界，不承诺约束绕开事务锁的任意写入；不抵御操作者故意改库、改账本或重签凭证。"
  - "边界：保留应用端独立读取目标、既有 before/after 比对、路径限制与事务锁；保留旧合同适用范围及其他交付条件；保留现有鉴权、验签、并发与恢复约束。"
  - "边界：不引入统一校验框架、新的配置开关、额外账本、新依赖或缓存；不改历史记录、归档证据；不为测试数量增加防护。"
  - "边界：宽松 YAML 解析不改（例如重复键仍不检测）；`dir-graph.yaml` 的读取失败只在交付就绪的读取边界处理，不扩到其他读取路径。"
  - "测试只从真实入口（evidence-check 或同一采集器的 gate、writeback 生成与事务应用/恢复入口、OutputGuard Pre/Post 入口）观察结果；不在生产代码里为测试保留判定。"

stakeholders:
  - "Tools 维护者（本包 crctl、writeback、OutputGuard 的实现与使用者）"
  - "使用 Tools 跑 CR 的 Agent 与操作者（交付就绪、回写、OutputGuard 的直接使用者）"
  - "Multica 的 aifi45 实跑流程（读取 Tools 阶段产物；本 change 不改其取材逻辑，该部分在 Multica change）"

risk_areas:
  - capability: evidence-delivery-contract
    risk: "把读取失败改为硬失败后，缺少 `dir-graph.yaml` 或其格式不合规的既有环境，原来悄悄通过的交付会开始被阻断。"
    mitigation: "只对适用组件就绪要求的 CR 生效；缺省与 `[]` 保持放行；报错带文件与原因，使其可修复而不是静默。验收覆盖未配置不新增阻断。"
  - capability: writeback-source-consistency
    risk: "改变读取方式可能改变换行归一或摘要，使冻结摘要与既有 journal/manifest 对不上。"
    mitigation: "`beforeSha256` 仍取 UTF-8 解码后、换行归一化前文本的摘要，候选仍取归一换行后正文，与现状一致；用含 CRLF 底稿的用例核对；不触历史 journal。"
  - capability: writeback-source-consistency
    risk: "恢复不再比较生成器 SHA，若 blob 或 manifest 校验不够，可能续办被篡改的候选。"
    mitigation: "续办仍依赖 manifest 摘要绑定、blob 核对和目标冲突检查；验收明确 manifest 或 blob 改变时不能续办。"
  - capability: output-guard-escape-hatch
    risk: "删除 `singleLine` 配置项后，已有 policy 文件或文档里仍引用该键。"
    mitigation: "Phase 2 全仓核实引用；该键只被读取却不改变判定，删除不改变任何输入的结果。"

non_goals:
  - "不涉及 Multica 侧：授权签发/敏感动作/进度读面/实跑取材属另一个 STDD change（实施拆分第 3 项）。"
  - "不对 Tools 全仓或 Multica 台账代码做防御性编程普查（第二批，两个 change 交付后另起）。"
  - "不修订 `specs/ai-first-platform/SDD.md` 及其他 CR 基线，不开 CR；仅把续办不比较生成器 SHA 写入本 change 的项目级规格。"
  - "不改变宽松 YAML 解析的行为；不统一其他读取 `dir-graph.yaml` 的路径。"
  - "不引入多行 OutputGuard 逃生口、不新增 pin/开关/取材框架。"

critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false

anchoring:
  level: L2
  reference_changes: []
  anchor_implementations: []

success_criteria:
  - "对适用组件就绪要求的 CR：`dir-graph.yaml` 缺失或不可读时 evidence-check/gate 失败并报告文件与原因，不放行；`workspace.components` 不是列表时失败；缺省或 `[]` 时通过且不新增阻断。"
  - "声明与观测不符、组件错配时不能放行；原始原因进入交付报告，不被二次判定替换为统一文案。"
  - "交付层不再含对 `ready` 的二次判定；原来构造 `ready:true` 带 findings 等生产不可达形状的测试已删除，剩余用例均经同一采集器或真实 gate 入口。"
  - "含 CRLF 的底稿 A 生成候选后、应用前把目标改为 B，应用报告冲突且 B 原样保留。"
  - "不存在的目标 `beforeSha256` 为 `null`；空文件与已存在的空索引得到空内容摘要而非 `null`；非 ENOENT 的读取错误向上报错，不记为不存在。"
  - "中断的事务：仅升级生成脚本后仍可续办；冻结的 manifest 或 blob 改变后不能续办；新事务仍校验生成器版本。"
  - "OutputGuard 首行标记有效、仅第二行有标记无效，Pre 与 Post 判定一致；原因长度检查仍生效；`policy.json` 与 `core.mjs` 不再含 `singleLine`。"
  - "项目级规格中明确写出“journal 续办不比较当前生成器 SHA”，并核实 SDD.md:476 的描述仍然成立，不需为此开 CR。"
  - "既有受影响测试（evidence-check、writeback、workspace-transactions、OutputGuard）按新语义更新后全部通过；被改写用例对应的保证各至少保留一个；未新增删除即无法解释的跳过。"

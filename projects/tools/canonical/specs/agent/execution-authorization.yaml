        not_counted_as_cp_pass: true
  - id: CP-AUTH-007
    description: SC-AUTH-007 / 送达ACK不等于业务消费。
    action: node --test --test-reporter=tap --test-name-pattern="^TC-AUTH-007$" skills/shared/crctl/scripts/test/execution-authorization.test.mjs

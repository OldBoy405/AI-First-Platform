    actual_change: '用户 2026-10-30 对 A 方向回复“同意”（转述：以正式迁移从空库建立全新独立测试库，不读取历史事故库；不以证明与旧库完全等价为目标或前置，也不声称等价）。当时具体设计、资源身份/权限/清理与执行计划均未批准；当时未创建数据库、未运行任何 DB 或业务测试。其后用户确认第一阶段设计与实现范围作为 BUILD 具体变更，原话及限制见 validation/new-disposable-pg-first-stage-confirmation.md；不含引擎/镜像探针、数据库创建或连接、清理、旧资源访问或 Gate3，真实执行另审。原 runner 固定旧 HOLD 实例，不得运行或改向。原 Gate2 已确认设计，但未找到 STDD 3.0.7 在 BUILD 中途重开 Gate2 的入口，本次按 §B4 登记重大偏离而非重新确认 Gate2；批准时的逐文件快照尚未核定，现行 RUN-003 补充回归段不能直接称为 Gate2 原始批准内容。'

      (2) 生产侧不存在 command 签发者与 pinned control manifest（LoadControlTrustManifest 无生产调用方）；
      (3) settlement 只存 mapping/digest，不含签名 v2 verdict 字节，从 settlement 反推等于伪造 T 的授权。
    tried: >-

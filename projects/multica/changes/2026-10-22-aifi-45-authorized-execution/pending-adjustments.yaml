  - id: ADJ-AIFI45-M002
    original_design_ref: 'design.md：执行位置/隔离能力与 grant+公钥落地；authorized-runner'
    actual_change: '部分实现（本轮）：新增 `server/internal/daemon/execution_trust.go` daemon 自有安装根 `<home>/.multica/execution-trust/<workspace-uuid>`（0700目录/0600文件、临时文件+rename发布、同内容幂等、异内容 EXECUTION_TRUST_CONFLICT 拒写、拒工作区内或目录链接根/越界名称/未知kind/空内容）；T 同 change 新增 `--trust-root` 只从声明目录读 grant/公钥/来源sidecar/绑定证明，位于或包含工作区安装根时 EXECUTION_TRUST_ROOT_INVALID。历史：早期只读核查未发现现成OS隔离executor，legacy grant/公钥仍写可能被agent写入的 {root}/.crctl；Podman PoC 在 systemd 尝试不可用并完整回退后以无资源限额跑通（resourceLimitsEnforced:false），不接daemon任务/claim。第二轮：M 新增 daemon 拉取接口 `GET /api/daemon/crs/{crID}/execution-authorization`（DaemonAuth 组，仅返回该 workspace 冻结初始记录+服务公钥，不标 delivered、不含 current-head/撤销/claim）与 `Client.InstallExecutionAuthorization`→`ExecutionTrustStore.InstallAuthorizationRecord`（安装前以下发公钥验签，校验 workspace/CR/key_id/grant UUID，写 keys→source→grant，同记录幂等、异内容冲突；Link 发布不覆盖）。真实 RED：记录属另一 CR 时旧安装器返回 nil；修复后组件链 真实授权HTTP→隔离DB→daemon GET→安装→真实 crctl `--check --trust-root` digest 一致，legacy 路径看不到该 grant，跨 workspace 404、无绑定 403、缺记录 404 且不落文件。governance 扩大回归 598/598。执行授权记录不再有落入工作区的路径；legacy stage grant 仍写 {root}/.crctl（不追溯）。第三轮已接生产 handleTask→prepareClaimedPipelineTask→安装→真实 crctl --check --trust-root，新增真实 Auth/DB-backed mdt/DaemonAuth 投递测试。source/hash/HTTP 限额/根身份实际 RED 后修复；Windows Stat 惰性 ID 根因修复后换根20/20；governance606/606、daemon36=35P/1S，逐测试事件见 preflight-regression.json；缺显式否定事实真实 RED 后已修。POST/JSONB GET 重投误冲突与重复包装键联合3FAIL后修复为7PASS；仅固定运输包装、保持原签名/人类请求bytes，复用JSON scanner，未宣称新一轮独立代码审查。STDD 三路缺模型映射按规则默认回退，未猜档位。仍缺：可信 current-head/撤销/DB claim、隔离控制通道、不可删 activation、消费事务；静态成功仍 EXECUTION_CONSUMPTION_REQUIRED。'
    reason: '尚未取得已落地不可伪造隔离/安装根的证据，配置声明与同UID目录不能独立作为证明；公钥若可被被管进程替换，验签即失效。'
    impact_scope: '执行位置选择、grant/公钥trust root、daemon与agent凭据边界；RUN-001/002/009及AUTH-004/006需补公钥与授权文件不落agent可写集的正负向验证。不减少原TC。2026-10-27 用户决定：M002 接受为记录在案的残余风险（本机无独立 Linux 主机、无部署授权，隔离对 agent 不成立与 M003 的 ADJ-10 同源），resolved 仍 false，Gate3 材料须原样带上。'
    severity: major
    affected_capabilities: [authorized-runner]
    resolved: false

meta:
  task_id: authorized-runner
  change_id: 2026-10-22-aifi-45-authorized-execution
  task_type: code
  system: multica真实认证入口、统一wake、TaskService与隔离Postgres
  preconditions:
    - Gate2后新增集成测试，当前CP未实施未运行。
    - 从multica/server执行；DATABASE_URL必须指向显式创建的隔离测试库，禁止默认共享multica库。
    - CRCTL_PATH指向本轮tools，测试签名密钥和临时Git/workspace隔离；缺依赖或skip视为未验证。
    - 真路由、统一wake和真实TaskService，不以fake enqueuer或直接walker代证；检查目标测试确实选中。
    - MUST精确选中顶层完整TC；组件子断言或单包内子测试不得登记整TC完成。
    - 当前handler/Root组件的单元断言不代替真实Auth/router/wake/TaskService整链路TC。
    - MUST核真实子进程PASS行；零匹配、skip、ctx代码回显或组件测试包装成整TC均不得算通过；当前完整TC与片均未完成。
steps:

meta:
  change_id: "2026-10-30-aifi-45-ci-disposable-db-supervisor"
  title: "AIFI-45 隔离测试环境与资源监督"
  created: "2026-10-30T10:15:07.406938"
  status: draft
  version: "2.9"

why:
  problem: |
    AIFI-45 的数据库、进程和受控工具链验证需要可证明归属且可恢复的隔离环境。现有假引擎与纯内存测试不证明真实容器、进程树退出或资源清理；测试包装器还存在 TMPDIR 含冒号时 PATH 被拆分的静态风险。历史事故库仍为 HOLD，不能拿它作为可丢弃测试库。
  motivation: |
    用户同意将隔离测试基础设施拆为独立 change；拆分只改变工作归属，不移除 AIFI-45 已批准的测试与 Gate3 条件。

what_changes:
  - id: C1
    type: modify
    description: "评审并实现安全的隔离数据库执行及监督能力，覆盖资源身份、持久记录、lost-ack 恢复、进程退出和基于所有权证据的清理；AIFI-45 验收使用版本化入口，入口在同一资源信封内替换时只在 AIFI-45 test-plan 登记，不另走 Gate2 设计调整。"
  - id: C2
    type: modify
    description: "审查并修复 test-go 包装器及其测试的临时目录和 PATH 边界，保持已确认的调用和空 TMPDIR 行为兼容；先取得独立认可的安全复现条件。"
  - id: C3
    type: modify
    description: "将实际隔离、测试运行及资源处置证据交回 AIFI-45；未授权的数据库、真实 CR、外部服务及未知资源保持不操作。"

capabilities:
  new: []
  modified:
    - name: "isolated-test-supervision"
      description: "为测试环境与资源生命周期提供可核验的隔离、恢复和所有权边界。"

constraints:
  - "本文件是 understand 草案，不是 Gate1、Gate2 或运行真实环境的授权。"
  - "历史事故库及证据继续 HOLD，新实例拿不到其凭据与连接路径，不为验收主动扫描旧库。可弃用数据库按一个资源信封一次批准（镜像、仅 127.0.0.1 端口、本次凭据、本 change 标签、按实例 ID 清理），入口自动核验并拒绝越界；信封内的建库、连接、清理不再逐次审批，只有触及旧库、生产或扩大信封时重新审批。"
  - "只清理可证明属于本次执行的资源；未知或状态不确定时保留并停止。"
  - "PATH 输入校验不等于 OS 隔离，也不证明防御恶意 PATH、符号链接竞态或绝对路径调用。"
  - "独立 change 不能代替 AIFI-45 原有隔离 DB、真实入口和 Gate3 验收。"

non_goals:
  - "不恢复、修改或清理历史事故库；不访问真实 CR 或生产服务。"
  - "不把 fake engine、父测试 PASS 或全 skip 当成真实隔离和业务用例通过。"

success_criteria:
  - "资源信封一次获批，明确资源身份、权限、故障恢复、进程退出证据和未知资源处置，并完成独立安全评审。"
  - "在获准隔离环境中复现并验证 TMPDIR/PATH 的拒绝与正常路径兼容，不调用真实 agent CLI 或未经授权的 DB。"
  - "满足条件后，以同一源码快照取得可复核的真实隔离与资源清理证据，交由 AIFI-45 独立验收。"

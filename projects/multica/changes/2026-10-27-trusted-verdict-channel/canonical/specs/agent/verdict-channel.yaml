meta:
  task_id: verdict-channel
  change_id: 2026-10-27-trusted-verdict-channel
  created: '2026-10-27'
  task_type: code
  system: multica server（governance/daemon/service/cmd）与隔离 Postgres nonce 库
  preconditions:
    - Gate 2 之后才实现与运行；当前 CP 全部未实施、未运行，不构成测试证据。
    - 从 multica 仓根执行；`DATABASE_URL` 必须指向本轮独占 nonce 库（`scripts/aifi45-db/run.mjs`），禁止默认共享库。
    - governance 全包需 `AIFI45_TOOLS_ROOT=C:/Users/GOBAO/Downloads/AI/tools`，否则 TC-AUTH-010 按设计 Fatal。
    - 真实路由/daemon/worker 与真实 Tx primitives；不以 fake enqueuer、直接 walker 或纯函数替身代证。
    - MUST 精确选中顶层测试并核真实子用例 PASS 行；零匹配、skip、编译错、连接错均不算通过。
    - 每条 leaf 全名以 `validation/channel-test-expectations.json` 为唯一权威，本文件只引用不另立名单。
    - CP 断言只列 `validation/channel-test-expectations.json` 对应 label 的子集；验收以 `channel-evidence.mjs` 按该 label 全名单判定。`rungo`/`runnode` 为方案「未来验证命令模板」，cwd 为 multica 仓根，DB 只经 `scripts/aifi45-db/run.mjs`。
steps:
  - id: CP-VC-001
    description: SC-VC-001 / strict selection 不可降级、Unknown 拒绝、legacy 只由目录证明。
    action: rungo green foundation-selection ./internal/governance '^TestChannelFoundationSelection$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationSelection/strict_field_deleted_binding_mismatch'}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationSelection/unknown_selection_rejected'}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationSelection/legacy_requires_catalog_proof'}]
  - id: CP-VC-002
    description: SC-VC-002 / control reservation 不可执行、proposed task 固定、permit 后才 enqueue。
    action: rungo green foundation-reservation ./internal/governance '^TestChannelFoundationReservation$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationReservation/control_reservation_not_runnable'}]
  - id: CP-VC-003
    description: SC-VC-003 / root+task+settlement 同 Tx、rollback 零新增零通知、固定 ID 冲突须逐字段等同。
    action: rungo green foundation-reservation ./internal/governance '^TestChannelFoundationReservation$' ; rungo green task-tx ./internal/service '^TestChannelTaskTx$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationReservation/fixed_id_conflict_and_rollback'}, {type: stdout_contains, expected: '--- PASS: TestChannelTaskTx/commit_then_notify'}, {type: stdout_contains, expected: '--- PASS: TestChannelTaskTx/rollback_no_notify'}]
  - id: CP-VC-004
    description: SC-VC-004 / adoption 与终态并发只认 55P03，附无锁冲突正对照。
    action: rungo green foundation-reservation ./internal/governance '^TestChannelFoundationReservation$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationReservation/root_adoption_terminal_race'}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationReservation/root_terminal_not_adopted'}]
  - id: CP-VC-005
    description: SC-VC-005 / FreshWork 权威注册、同 origin 第二次注册拒、UNKNOWN 不出 selection。
    action: rungo green foundation-fresh-work ./internal/governance '^TestChannelFoundationFreshWork$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationFreshWork/new_origin_registered'}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationFreshWork/same_origin_second_cr_rejected'}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationFreshWork/unknown_history_blocks_selection'}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationFreshWork/proof_revision_appends'}]
  - id: CP-VC-006
    description: SC-VC-006 / purpose/domain/scope 任一错用或缺字段即拒。
    action: rungo green protocol ./internal/governance '^TestChannelProtocol$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelProtocol/purpose_domain_scope'}]
  - id: CP-VC-007
    description: SC-VC-007 / Go↔Node 原字节双向向量与一致 digest。
    action: rungo green protocol ./internal/governance '^TestChannelProtocol$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelProtocol/cross_language_vectors'}]
  - id: CP-VC-008
    description: SC-VC-008 / exact keys 与 key-purpose：attestation/human 越用、重复键、union 双分支均拒。
    action: rungo green protocol ./internal/governance '^TestChannelProtocol$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelProtocol/exact_keys'}]
  - id: CP-VC-009
    description: SC-VC-009 / request 与 store-epoch-seq 唯一、原字节重放返原记录、回滚无残留。
    action: rungo green store-state ./internal/governance '^TestChannelStoreState$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelStoreState/request_unique_replay'}]
  - id: CP-VC-010
    description: SC-VC-010 / 帧链 digest 断链、跳号、占位签名一律拒收。
    action: rungo green store-state ./internal/governance '^TestChannelStoreState$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelStoreState/frame_chain_digest'}]
  - id: CP-VC-011
    description: SC-VC-011 / cursor 行锁与 CAS、每 lineage 单 open、旧 fence 不写。
    action: rungo green store-state ./internal/governance '^TestChannelStoreState$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelStoreState/cursor_single_open'}]
  - id: CP-VC-012
    description: SC-VC-012 / 状态受限转换、uncertain 冻结、ACK 不释 slot、created 才可取消、verdict 不可篡改。
    action: rungo green store-state ./internal/governance '^TestChannelStoreState$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelStoreState/state_machine_and_ack'}, {type: stdout_contains, expected: '--- PASS: TestChannelStoreState/verdict_immutable'}]
  - id: CP-VC-013
    description: SC-VC-013 / 撤销先提交则 no_effect、effect 先提交不追溯、撤销不等待 slot。
    action: rungo green store-state ./internal/governance '^TestChannelStoreState$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelStoreState/revoke_ordering'}]
  - id: CP-VC-014
    description: SC-VC-014 / stop 按 T sequence 生效，前一 effect settled 后才发后续。
    action: rungo green store-state ./internal/governance '^TestChannelStoreState$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelStoreState/stop_ordering'}]
  - id: CP-VC-015
    description: SC-VC-015 / 恢复表五类观察映射到固定动作，freeze 不猜未消费。
    action: rungo green worker ./internal/daemon '^TestChannel(Worker|Recovery)$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelRecovery/tail_equal_resume'}, {type: stdout_contains, expected: '--- PASS: TestChannelRecovery/t_ahead_one_import'}, {type: stdout_contains, expected: '--- PASS: TestChannelRecovery/m_settled_return_mapping'}, {type: stdout_contains, expected: '--- PASS: TestChannelRecovery/journal_prepared_replay'}, {type: stdout_contains, expected: '--- PASS: TestChannelRecovery/divergent_freeze'}]
  - id: CP-VC-016
    description: SC-VC-016 / 普通 restart 保 epoch/seq、旧 fence 不接单、key rotation 不改历史。
    action: rungo green worker ./internal/daemon '^TestChannel(Worker|Recovery)$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelRecovery/restart_keeps_epoch'}]
  - id: CP-VC-017
    description: SC-VC-017 / repair admit 的 fact_refs 必须指向已验签 grant，额度不来自解码 payload。
    action: rungo green policy-facts ./internal/governance '^TestChannelPolicyFacts$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyFacts/repair_admit_fact_refs_verified'}]
  - id: CP-VC-018
    description: SC-VC-018 / repair 追加只扩额度、CAS 只接受一份、重放返回原结果。
    action: rungo green policy-resume ./internal/governance '^TestChannelPolicyResume$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyResume/repair_extension_append'}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyResume/repair_extension_double_append_race'}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyResume/repair_extension_replay'}]
  - id: CP-VC-019
    description: SC-VC-019 / signed resume 绑定 stop_ref/subject/epoch，只一次 epoch，不复活 revoked/terminal。
    action: rungo green policy-resume ./internal/governance '^TestChannelPolicyResume$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyResume/signed_resume'}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyResume/signed_resume_no_revive'}]
  - id: CP-VC-020
    description: SC-VC-020 / sensitive action：新 operation 必 EXHAUSTED、同 operation 重放原 receipt、撤销交错 no_effect、旧账本不可核实拒。
    action: rungo green policy-facts ./internal/governance '^TestChannelPolicyFacts$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyFacts/sensitive_copy_root_new_operation'}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyFacts/sensitive_same_operation_replay'}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyFacts/sensitive_revoke_interleaving'}, {type: stdout_contains, expected: '--- PASS: TestChannelPolicyFacts/sensitive_legacy_ledger_unverified'}]
  - id: CP-VC-021
    description: SC-VC-021 / T commit+M rollback 重送原 bytes；M commit 后丢响应只返原 mapping；不退款。
    action: rungo green settlement ./internal/governance '^TestChannelIngestSettlement$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestSettlement/t_commit_m_rollback_resend'}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestSettlement/lost_response_returns_mapping'}]
  - id: CP-VC-022
    description: SC-VC-022 / ACK 只持久化、不发 task、不释 slot；pending/deny/stopped 结算 no_effect。
    action: rungo green settlement ./internal/governance '^TestChannelIngestSettlement$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestSettlement/ack_no_slot_release'}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestSettlement/nonpermit_settles_no_effect'}]
  - id: CP-VC-023
    description: SC-VC-023 / 启动前 643–645 与 envelope/head/challenge 全匹配，失败不启动 agent、不二次消费。
    action: rungo green binding ./internal/governance '^TestChannelIngestBinding$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestBinding/start_preflight_643_645_match'}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestBinding/generation_bound_once'}]
  - id: CP-VC-024
    description: SC-VC-024 / 跨签发 challenge、旧 dispatched_at、同 nonce 异 proof、claim 后转终态全部拒。
    action: rungo green binding ./internal/governance '^TestChannelIngestBinding$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestBinding/cross_issuance_challenge'}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestBinding/same_task_redispatch_challenge'}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestBinding/same_nonce_different_proof'}, {type: stdout_contains, expected: '--- PASS: TestChannelIngestBinding/claim_terminated_before_consume'}]
  - id: CP-VC-025
    description: SC-VC-025 / 无 committed T 时零 root/task，重复 settle 只返原 mapping，未 settled 不接受换候选。
    action: rungo green reader ./internal/governance '^TestChannelReader$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/missing_t_zero_dispatch'}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/settle_replay_original_mapping'}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/unsettled_candidate_not_replaced'}]
  - id: CP-VC-026
    description: SC-VC-026 / strict fence 按持久 selection：删字段仍 strict、Unknown 不降 legacy、legacy 行为不变。
    action: rungo green reader ./internal/governance '^TestChannelReader$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/selected_strict_field_deleted'}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/unknown_selection_not_legacy'}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/never_selected_legacy_unchanged'}]
  - id: CP-VC-027
    description: SC-VC-027 / 终态 fence 并集规则：缺 claim 409、重领仍 409、读失败拒、收尾不被 STOP_NEW 阻断。
    action: rungo green reader ./internal/governance '^TestChannelReader$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/terminal_report_without_claim'}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/terminal_fence_survives_reclaim'}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/legacy_consumed_keeps_fence'}, {type: stdout_contains, expected: '--- PASS: TestChannelReader/terminal_fence_read_failure'}]
  - id: CP-VC-028
    description: SC-VC-028 / 648 up 建 14 表及触发器/索引/约束，down 全撤，reapply 无遗留业务行；每表至少一个 leaf。
    action: rungo green migration-up ./internal/governance '^TestChannelMigrationAfterUp$' ; rungo green migration-down ./internal/governance '^TestChannelMigrationAfterDown$' '-migration=server/migrations/648_cr_execution_control.down.sql' ; rungo green migration-reapply ./internal/governance '^TestChannelMigrationAfterReapply$' '-migration=server/migrations/648_cr_execution_control.down.sql' '-migration=server/migrations/648_cr_execution_control.up.sql'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelMigrationAfterUp/cr_execution_code_source_freeze'}, {type: stdout_contains, expected: '--- PASS: TestChannelMigrationAfterDown/cr_execution_code_source_freeze'}, {type: stdout_contains, expected: '--- PASS: TestChannelMigrationAfterReapply/cr_execution_code_source_freeze'}]
  - id: CP-VC-029
    description: SC-VC-029 / 643–647 夹具行与对象不变，无 648 孤儿对象。
    action: rungo green migration-protected ./internal/governance '^TestChannelMigrationProtectedData$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelMigrationProtectedData/fixtures_643_647_unchanged'}, {type: stdout_contains, expected: '--- PASS: TestChannelMigrationProtectedData/no_648_orphans'}]
  - id: CP-VC-030

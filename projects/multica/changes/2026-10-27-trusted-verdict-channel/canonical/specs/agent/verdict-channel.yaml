    action: rungo green merge-facts ./internal/governance '^TestChannelMergeFacts$'
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelMergeFacts/response_closed_set'}, {type: stdout_contains, expected: '--- PASS: TestChannelMergeFacts/current_binding_tristate'}]

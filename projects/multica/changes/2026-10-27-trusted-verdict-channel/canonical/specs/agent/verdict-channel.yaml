meta:
  task_id: verdict-channel
  change_id: 2026-10-27-trusted-verdict-channel
  created: '2026-10-27'
  task_type: code
  system: multica server（governance/daemon/service/cmd）与隔离 Postgres nonce 库
  preconditions:
    - Gate 2 之后才实现与运行；当前 CP 全部未实施、未运行，不构成测试证据。
    - 从 `multica/server` 执行；`DATABASE_URL` 必须指向本轮独占 nonce 库（`scripts/aifi45-db/run.mjs`），禁止默认共享库。
    - governance 全包需 `AIFI45_TOOLS_ROOT=C:/Users/GOBAO/Downloads/AI/tools`，否则 TC-AUTH-010 按设计 Fatal。
    - 真实路由/daemon/worker 与真实 Tx primitives；不以 fake enqueuer、直接 walker 或纯函数替身代证。
    - MUST 精确选中顶层测试并核真实子用例 PASS 行；零匹配、skip、编译错、连接错均不算通过。
    - 每条 leaf 全名以 `validation/channel-test-expectations.json` 为唯一权威，本文件只引用不另立名单。
steps:
  - id: CP-VC-001
    description: SC-VC-001 / strict selection 不可降级、Unknown 拒绝、legacy 只由目录证明。
    action: go test ./server/internal/governance -run '^TestChannelFoundationSelection$' -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: '--- PASS: TestChannelFoundationSelection'}]
  - id: CP-VC-002
    description: SC-VC-002 / control reservation 不可执行、proposed task 固定、permit 后才 enqueue。

meta:
  capability: kb-resource-adoption
  change_id: 2026-10-19-aifi-45-four-phase-runner
  created: '2026-10-19'
  confidence: medium
  status: 待实现/待验证
requirements:
  - id: M-REQ-KB-001
    description: HTTP/WS heartbeat 共享授权身份和目录资源读取/消费合同
    confidence: medium
    scenarios:
      - id: M-SC-KB-001
        confidence: medium
        evidence: 'canonical/proposals/2026-10-19-aifi-45-four-phase-runner.yaml#/what_changes/[id=C6]'
        given: 同一已授权 runtime 有 workspace、daemon_id 和项目 local_directory 资源，WS 正常时 HTTP 会被跳过
        when: 分别走 HTTP 手动 heartbeat 响应和 WS heartbeat/action 消费
        then: SHALL 两传输返回并消费同一可选目录快照，WS lease 使用鉴权查询读取的 runtime daemon_id
        and:
          - SHALL 不依赖 PAT 缺省 daemon ID 或客户端自报身份，不扩大撤销/机器认证承诺
        test_cases: [TC-MKB-001]
      - id: M-SC-KB-002
        confidence: high
        evidence: 'canonical/proposals/2026-10-19-aifi-45-four-phase-runner.yaml#/constraints'
        given: 多 workspace/daemon 的资源分属不同项目，某请求身份不匹配
        when: heartbeat 读取本 runtime 资源
        then: SHALL 按已授权 workspace/daemon 及所属项目限定查询，拒绝跨项目/跨 workspace 资源
        and:
          - SHALL 不列项目再逐项 N+1，不新增全量 endpoint，不因发现根扩大普通任务权限
        test_cases: [TC-MKB-002]
  - id: M-REQ-KB-002
    description: 快照替换投影，区分成功空、缺字段和失败
    confidence: high
    scenarios:
      - id: M-SC-KB-003
        confidence: high
        evidence: 'canonical/proposals/2026-10-19-aifi-45-four-phase-runner.yaml#/what_changes/[id=C6]'
        given: workspace/daemon 当前投影为旧路径，随后分别收到新路径快照和成功空快照
        when: 按顺序消费两个 heartbeat
        then: SHALL 先替换为新路径再清除该 workspace/daemon 投影，不追加旧路径、不影响其他身份投影
        and:
          - SHALL runtime/workspace 退出时按既有生命周期移除对应运行期投影
        test_cases: [TC-MKB-003]
      - id: M-SC-KB-004
        confidence: high
        evidence: 'canonical/proposals/2026-10-19-aifi-45-four-phase-runner.yaml#/what_changes/[id=C6]'
        given: 已有有效投影，本次快照字段缺失或资源查询失败，heartbeat 已领取 pending actions
        when: 处理失败响应并在后续收到成功快照
        then: SHALL 失败/缺字段时保留原投影并交付已领取 actions，后续成功快照使投影收敛
        and:
          - SHALL 不把读取失败伪装为空，不丢 action，也不回退环境变量根列表
        test_cases: [TC-MKB-004]
      - id: M-SC-KB-005
        confidence: high
        evidence: 'canonical/proposals/2026-10-19-aifi-45-four-phase-runner.yaml#/success_criteria/7'
        given: 无任务冷启动且无 MULTICA_CR_WORKSPACES，资源目录稍后出现、KB 账本稍后初始化或断网恢复
        when: daemon 启动采集/投递循环并按既有节拍收到有效 heartbeat
        then: SHALL 不依赖认领任务或重启即可识别资源指向的合法 KB 并恢复采集/投递
        and:
          - SHALL 首次快照失败只等待后续 heartbeat，保留既有 kb init，不递归发现未知嵌套 KB
        test_cases: [TC-MKB-005]
  - id: M-REQ-KB-003
    description: 采集、执行定位、settle、投递共用资源根和请求级 workspace
    confidence: high
    scenarios:
      - id: M-SC-KB-006
        confidence: high
        evidence: 'canonical/proposals/2026-10-19-aifi-45-four-phase-runner.yaml#/what_changes/[id=C6]'
        given: 两个 workspace 有不同 KB 根，并发执行采集、Pipeline 定位、terminal settle、pending 与 ack
        when: 使用资源投影定位根并发出请求
        then: SHALL 所有消费者共用同源带 workspace 的根，按请求 X-Workspace-ID 分组且 ack IDs 不串批
        and:
          - SHALL 不修改共享 client 的全局 workspace，不从任务历史/本地持久根缓存补源
        test_cases: [TC-MKB-006]
      - id: M-SC-KB-007
        confidence: high
        evidence: 'canonical/proposals/2026-10-19-aifi-45-four-phase-runner.yaml#/non_goals'
        given: 旧环境变量含残留根，资源快照为空或路径非法/非 KB，另有未知嵌套 KB
        when: 采集器和定位器处理候选根
        then: SHALL 移除 MULTICA_CR_WORKSPACES 根来源并复用路径验证/KB 识别，不恢复残留根、不递归猜未知 KB
        and:
          - SHALL 不新增根账本、配置同步或新旧双模式
        test_cases: [TC-MKB-007]
      - id: M-SC-KB-008
        confidence: medium
        evidence: 'canonical/proposals/2026-10-19-aifi-45-four-phase-runner.yaml#/what_changes/[id=C6]; docs/AIFI-45-CR流程减负方案.md §4/M6 目录来源'
        given: 采集与 Pipeline 定位两个既有入口分别遇到 CR not found
        when: 输出现有错误/诊断信息
        then: SHALL 两处均保留 workspace/CR、资源、daemon/runtime 和投影线索以区分定位失败，不以改报错代替资源接线
        and:
          - SHALL 不新增运行时报告、健康检查或机器级认证
        test_cases: [TC-MKB-008]

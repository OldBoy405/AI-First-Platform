# STDD 质量检查配置 — multica fork（Go server + pnpm monorepo）
#
# quality.test = make test：需 .env + docker postgres（REQUIRE_ENV →
# scripts/ensure-postgres.sh → migrate up → scripts/test-go.sh --race）。
# 切片期不要跑它，单切片用目标包命令（go test ./internal/<pkg>/...）。
# e2e 由 scripts/check.sh 承担（还会跑 typecheck + TS test + Playwright），
# 需 .env 且会拉起 backend/web，只在 Gate 3 前跑一次。

verify:
  max_iterations: 5
  auto_fix: true

review:
  enabled: true
  max_rounds: 3
  agents:
    - name: code
      scope: "代码质量：Bug风险、死代码、一致性、错误处理、安全"
    - name: test_config
      scope: "测试/配置：测试覆盖、Fixture质量、配置完整性、测试隔离"
    - name: docs_skills
      scope: "文档/Skills：版本一致性、引用正确性、模板完整性、Skill正确性"
  severity_thresholds:
    critical: 0
    high: 3
    medium: 10

test:
  framework: go-test
  unit_dir: server/
  integration_dir: e2e/
  coverage_target: 0

quality:
  test: "make test"
  lint: "pnpm lint"
  typecheck: "pnpm typecheck"
  e2e:
    enabled: true
    runner: playwright
    command: "bash scripts/check.sh"
    scope: critical_only
    critical_paths: []
  coverage:
    enabled: false
    tool: go-cover
    fail_under: 0
    scope: changed_files_only

tc_id:
  pattern: "TC-{CAPABILITY}-{NNN}"
  example: "TC-GOV-001"

# STDD 质量检查配置 — multica fork（Go server + pnpm monorepo）
#
# 正式后端检查消费本轮 CI 的已迁移一次性库、专用管理员环境和临时产物目录。
# 浏览器检查只连接本轮自建的 API/web 与独立一次性库；不读取开发 .env。
# 切片使用针对性检查，最终验收同时执行 pnpm test 与以下必跑项。

verify:
  max_iterations: 5
  auto_fix: true

review:
  enabled: true
  max_rounds: 3
  agents:
    - name: code
      scope: "代码质量：Bug风险、死代码、一致性、错误处理、安全"
    - name: test_config
      scope: "测试/配置：测试覆盖、Fixture质量、配置完整性、测试隔离"
    - name: docs_skills
      scope: "文档/Skills：版本一致性、引用正确性、模板完整性、Skill正确性"
  severity_thresholds:
    critical: 0
    high: 3
    medium: 10

test:
  framework: go-test
  unit_dir: server/
  integration_dir: e2e/
  coverage_target: 0

quality:
  test: "make ENV_FILE=/dev/null test-ci"
  lint: "pnpm lint"
  typecheck: "pnpm typecheck"
  e2e:
    enabled: true
    runner: playwright
    command: >-
      bash -ec 'DATABASE_URL="${MULTICA_E2E_DATABASE_URL:?}" pnpm exec playwright test --project=chromium --reporter=line e2e/issue-task-history.spec.ts'
    scope: critical_only
    critical_paths:
      - e2e/issue-task-history.spec.ts
  coverage:
    enabled: false
    tool: go-cover
    fail_under: 0
    scope: changed_files_only

tc_id:
  pattern: "TC-{CAPABILITY}-{NNN}"
  example: "TC-GOV-001"

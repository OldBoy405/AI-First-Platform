# 2026-11-15-multica-backend-tests-green.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-11-15-multica-backend-tests-green"
  title: "multica backend-tests 在 CI 变绿，并让「是否真的跑了」可核对"
  created: "2026-11-15T17:16:09.381802"
  status: draft
  version: "2.9"

why:
  problem: |
    multica 的 CI job backend-tests 自 2026-11-09 起每次真正执行都失败；近 60 次 run 从未通过，只有被路径过滤跳过的 run 是绿的。
    此前它被 CI 令牌失效（401）掩盖，根本没跑起来；令牌恢复后（2026-11-15）暴露出 8 个失败用例（run 43687569973，sha b726f5131）。
    2026-11-15 的取证（podman + 一次性库，复现过）显示它们是 3 个互相独立的根因，而不是 8 个孤立缺陷：
    A. 测试需要的权限超出一次性库角色（NOSUPERUSER NOCREATEDB）。bigm 用例读 pg_statistic，受限角色无权；改读 pg_stats 后受限角色实测通过。
       另 3 个用例（backfill_codex_usage_cache、taskusagebackfill 两例）用 CREATE DATABASE 建临时库，受限角色失败、管理员 DSN 实测通过。
       这 3 个用例在 DATABASE_URL 不可达时会 SKIP 而整包仍 ok，即「没跑」和「通过」在事件流里无法区分。
    B. governance 的 Runner 在四处用 pg_advisory_lock 阻塞等锁并一直占着一个池连接。同一 run 的 N 个并发唤醒占满连接池后，锁持有者拿不到第二个连接，永久挂起。
       TestMTick003 实测：池上限 16 通过、池上限 4 挂起（7 个 goroutine 全卡在 pgxpool Acquire）。生产池上限默认 25，CI runner 2–4 核即上限 4，故只在 CI 暴露。
    C. TestExecutionMigrationDownRoundTrip 执行 down 脚本删除 cr_execution_* 表并统计 agent_task_queue 行数，而 go test 的各包并行共用同一个库。
       并发跑它与 handler.DeleteWorkspace 用例，150 次里 31 次复现 CI 的原错误 relation "cr_execution_notice" does not exist；agent_task_queue 82→83 是反方向的同一类干扰。
    另有 1 个用例（claim deadline 的 http/recovery_0s）单跑通过、CI 报错被截断，无法归入以上三类，需先定性。
  motivation: |
    不修则 backend-tests 恒红，后端的回归没有可信的 CI 信号，也无法判断新改动是否引入失败。
    按根因在共用边界修复，比逐个用例打补丁更少、更不易回退；3 个管理员用例不加固「必须 PASS」的校验，会重新退化成静默 SKIP。

what_changes:
  - id: C1
    type: modified
    description: "bigm 用例（cmd/migrate）把 pg_statistic 查询改为 pg_stats，使受限角色可读；不给一次性库角色加 CREATEDB / pg_read_all_stats。"
  - id: C2
    type: new
    description: "3 个需要建库的用例在 test-ownership.json 登记 owner=ci-admin，从受限 run 排除；CI 新增一步用 AIFI45_CI_ADMIN_URL 单独跑它们，并由 ci-evidence.mjs 新增一个小模式断言每个都有一条 pass（不得 skip、不得缺失）。"
  - id: C3
    type: modified
    description: "governance 四处 pg_advisory_lock（runner.go、runner_code.go、runner_requirement.go、runner_requirement_entry.go）抽成共用 withRunLock：改用 pg_try_advisory_lock 加退避重试，等待期间释放连接，使同一 run 的并发唤醒最多占用 1 个池连接。TestMTick003 原样保留，用池上限 4 运行。"
  - id: C4
    type: modified
    description: "TestExecutionMigrationDownRoundTrip 登记为 independent，并在 selections.json 增加一条 selection（与 channel-migration-* 同口径），不再与其他包共库并行。"
  - id: C5
    type: new
    description: "claim deadline 用例（http/recovery_0s）先定性：C1–C4 落地后，在与 CI 同条件（2 核、-race）下重复运行至少 20 次；能复现则按根因修，复现不了则写入 design-adjustments.md，不修也不 skip。"
  - id: C6
    type: modified
    description: "CUSTOM.md 按台账行模板登记本 change 对 multica 的定制（含 server/internal/governance 的 withRunLock）。"

capabilities:
  new:
    - name: ci-admin-test-ownership
      description: "有权限需求的测试有显式的归属（ci-admin），并有「每个必须 PASS」的事件流核对，防止静默 SKIP。"
  modified:
    - name: governance-runner-run-lock
      description: "同一 run 的并发唤醒不再在持有池连接的状态下阻塞等锁；行为语义（同一 run 内串行化、重复唤醒只派发一次）不变。"
    - name: backend-tests-ownership
      description: "test-ownership.json / selections.json 对破坏性迁移测试与需要管理员的测试的归属口径。"

constraints:
  - "不给一次性库角色加 CREATEDB 或 pg_read_all_stats；该角色的最小权限设计不变。"
  - "不修改 MaxConns 默认值，不把 TestMTick003 加入 skip，不单独修 DeleteWorkspace 或 82→83（它们预期随 C4 消失，以 CI 实测为准）。"
  - "withRunLock 只保证同一 run 的并发唤醒最多占用 1 个连接；多个不同 run 同时持锁且各自再取连接的情形不在保证内，有证据再另立。"
  - "pg_try_advisory_lock 加退避相对阻塞等待，唤醒延迟增加一个退避周期（50ms 级），已由用户在 2026-11-15 接受（A11）。"
  - "3 个管理员用例使用 CI 服务容器的管理员 DSN，已由用户在 2026-11-15 接受（A10）；该库是一次性服务容器，与 AIFI-45 控制库无关。"
  - "依赖真实 CI 的结论只能由真实 CI 验证；本地证据（podman 一次性库）只作辅助，不得声称已证明 CI 变绿。"
  - "multica 代码注释用英文；CUSTOM.md 为 CRLF 文件，编辑须保留换行。"

stakeholders:
  - "multica 维护者（CI 信号的使用者）"
  - "AIFI-45 测试证据可信性链路（ci-evidence.mjs / test-ownership.json 的使用者）"

risk_areas:
  - capability: governance-runner-run-lock
    risk: "withRunLock 位于生产 Runner 路径；改成 try-lock 加重试后，若退避或重试边界有误，可能让某次唤醒丢失，或在高争用下饥饿。"
    mitigation: "保持 4 处原有语义（同 run 串行、重复唤醒只派发一次）；测试用池上限 4 覆盖并发唤醒；周期扫描本就是兜底，丢失的唤醒下一轮会被补上。"
  - capability: ci-admin-test-ownership
    risk: "管理员 step 的核对本身出错（漏判 SKIP、或把不相干的 pass 算进去），会重新引入静默 SKIP。"
    mitigation: "核对只做一件事：声明为 ci-admin 的每个用例必须在该 step 的事件流里有恰好一条 pass；用已知好样本与已知 skip 样本先自测。"
  - capability: backend-tests-ownership
    risk: "DownRoundTrip 改为 independent 后 CI 不再运行它，只剩人工经 run-selection.mjs 运行时才有证据。"
    mitigation: "与现有 channel-migration-* 同口径，是已有约定；在 test-report 中如实说明，不声称 CI 在跑。"

non_goals:
  - "不处理 sqlc、script-checks、transitions-contract-check（已于 2026-11-15 由 CI 修复提交 e2478f2e6 / 8ee08071c / 916f57318 / b726f5131 完成）。"
  - "不处理 tools 的 T1/T2（rules.json 形状、report 口径）及 multica 的 M3（pin 升级）、M4（CUSTOM 四数基线）。"
  - "不改产品数据库权限模型，不改 pgxpool 的默认配置。"
  - "不为其他 flaky 用例追加 skip 或重试。"


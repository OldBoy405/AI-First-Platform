meta:
  change_id: "2026-11-16-multica-execution-evidence-closure"
  title: "multica 执行恢复与证据闭环"
  created: "2026-11-16T00:36:19.878866"
  status: draft
  version: "2.9"

why:
  problem: |
    2026-11-16 核对基线：multica main 与 origin/main 均为 294d793a91c8f1dce2f97a549b41cf468e562b1a；tools 已发布含快照读取规则的 7a0a2ab57f3f5e2c583c3523bc69d67e7be115c1。
    sqlc 重新生成和 pg 的 CJS 导入已有提交，不重复纳入。当前残余在同一执行与证据链上：Runner 在锁住 run A 后按 CR 重读，可能继续执行 run B；selection 对账器的字段集合不接受本机 Go 1.27.1 官方 TestEvent 的 OutputType 等字段，部分 selection 因而撤回 expected，少跑一个测试仍可能 PASS。
    .github/aifirst-tools-pin 仍为 e52b8081f159d581bf62f82447c76f818fc52426，backend-tests 未设置 MULTICA_CONTROLLED_SHELL_RULES，已有六项本地权威规则通过记录不能证明 CI 接线成立。
    backend-tests-green 的最新实际 CI run 43727687773 因账单/额度未启动；原 change 经用户裁定 TC-BTO-005 为 N/A 后已归档，本 change 不重开它，也不把该裁定继承为新的 CI 通过证据。
    CUSTOM 已登记部分局部修复，但前三数基线和状态文字仍需与实际落点对齐；packages 第四数缺测量口径，用户明确确认本次暂不收口。
  motivation: |
    用户已确认本独立提案范围。保证只覆盖被锁对象、测试选择、权威 CI 接线和本次定制追溯；按共同边界修根因，不把每个旧失败都变成补丁或新机制。
    2026-11-16 用户进一步裁定：真实 CI（TC-MEC-003）因平台账单/额度阻塞本轮延期为接受风险，先收口其余已验证项；权威 CI 验证仍未完成，额度恢复后另行验证，不以本地/离线结果冒充。

what_changes:
  - id: C1
    type: modified
    description: "Runner 恢复时被执行的 run 必须与被锁 run 一致；目标切换不得借旧锁继续执行新 run，正常推进与取消语义仍成立。"
  - id: C2
    type: modified
    description: "精确选择对账接受已核实受支持 Go 版本的合法测试事件，所声明测试缺失、失败、跳过或流不完整时拒绝；为 governance-run-lock 恢复明确的 expected 名单。"
  - id: C3
    type: modified
    description: "multica CI 接线读取已发布的唯一 tools pin 与权威 controlled-shell 规则（pin、env、必需文件与离线接线测试本轮已交付并验证）；六项现有规则测试在真实 CI 实际读取该规则的权威验证本轮经用户裁定延期（接受风险），不以本地/fixture 回落冒充。"
  - id: C4
    type: modified
    description: "CUSTOM 登记本次改动、实际验证边界与交付状态，重算追加前三数基线；第四数口径保持明确未决，不猜测、不改写历史。"

capabilities:
  new: []
  modified:
    - name: governance-runner-run-lock
      description: "恢复执行的 run 身份与锁身份一致，保留既有串行、取消和有限连接池保证。"
    - name: selection-reconciliation
      description: "合法 Go 事件可对账，声明的测试选择完整且全通过才成功。"
    - name: ci-backend-environment
      description: "backend-tests 使用唯一已发布 tools pin 的权威规则，并以实际 runner 结果形成证据。"

impact:
  code:
    - "server/internal/governance 既有 Runner 锁调用及针对性测试。"
    - "scripts/aifi45-disposable/selection.mjs、相关测试与 selections.json。"
  config:
    - ".github/aifirst-tools-pin、.github/workflows/ci.yml 与已有 CI 接线测试。"
    - "CUSTOM.md 的本次登记及当前基线说明。"
  infrastructure:
    - "验证仅使用既有一次性库入口与 GitHub Actions；账单/凭据恢复由用户运维处理，不新增服务、表或部署机制。"

constraints:
  - "只修改 multica 业务仓及本 change 所属记录，不修改 tools 代码、两仓 binding 或已归档变更。"
  - "不改 query、migration、授权协议、状态机、生成合同及其 digest；不扩大权限、排除名单或接受风险以获得绿灯。"
  - "锁一致性用一组真实库并发回归，精确选择用一组事件流矩阵，权威接线用一次实际 CI，登记用一次人工核对；复用既有证据入口，不以检查数量为目标。"
  - "本地成功、fixture 成功、skipped 或自动 N/A 不等于最终提交的真实 CI 成功；本轮真实 CI 因账单/额度阻塞经用户明确裁定延期，如实保持未验证并记录为接受风险，不绕过、不冒充通过，额度恢复后另行验证。"
  - "规则文件 callers 字段未强制执行、40hex 不区分 Git 对象类型是现有已归档边界；本 change 不宣称只对 system-orchestrator 放行，不擅自收窄或扩展该权限合同。"
  - "CUSTOM 前三数是当前跟踪源码的度量，不作为完整能力验收或必须单调增长的保证；第四数暂不收口，旧值不得冒充新测量。"
  - "代码注释用英文，定制登记使用真实 STDD change 与任务标识，不编造 CR 身份。"
  - "Gate 不授权提交、push、部署、真实 agent 运行、令牌操作或遗留容器清理；这些仍须分别取得相应授权。"

stakeholders:
  - "multica 维护者与 CI 管理者。"
  - "依赖 Runner 恢复与测试证据进行验收的平台使用者。"

risk_areas:
  - capability: governance-runner-run-lock
    risk: "按 CR 重读可能在等待期间换成不同 run；修复若只覆盖一个调用方，兄弟恢复入口仍可能错用锁。"
    mitigation: "SPEC 核对全部 withRunLock 消费入口；用同一并发回归证明目标切换与正常推进，保留有限连接池和取消回归。"
  - capability: selection-reconciliation
    risk: "仅因新字段就拒绝合法流，或为兼容新字段改成无条件接受未知数据，均会削弱证据。"
    mitigation: "依据已核实 Go 版本的官方字段合同设计合法/非法成对矩阵，保留完整性和缺测试拒绝，不添加静默回落。"
  - capability: ci-backend-environment
    risk: "真实 CI 受账单、凭据与发布授权影响；本地通过不能证明 GitHub runner 的最终结果。"
    mitigation: "将真实 CI 列为权威目标合同，明确最终业务 SHA、实际执行 job 和六项权威规则结果；本轮因账单/额度阻塞经用户裁定延期（接受风险），外部阻塞与未验证状态单独如实报告，额度恢复后另行验证。"

non_goals:
  - "不重做 T1、sqlc 重新生成、pg 导入或已归档 backend-tests-green 的交付。"
  - "不建设新锁服务、通用重试框架、事件总线、动态规则覆盖或新校验框架。"
  - "不轮换令牌、修改账单、清理容器/缓存、批量并入历史基线或迁移 legacy 数据。"
  - "不修全部历史 CUSTOM TODO、未复现 flake、解锁超时、pg_bigm 镜像覆盖或平台隔离门禁。"
  - "不制定 packages 第四数口径，不把它或其他附录整理动作作为本次产品检查证据。"

critical:
  is_critical: true
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false

anchoring:
  level: L3
  reference_changes:
    - "2026-11-15-multica-backend-tests-green"
    - "2026-11-12-fork-ci-test-evidence-trust"
  anchor_implementations:
    - "server/internal/governance/runner_run_lock.go"
    - "scripts/aifi45-disposable/selection.mjs"

success_criteria:
  - "一组真实库并发回归证明：目标未变时正常执行；目标从 A 换成 B 时不能在 A 锁下执行 B；同一 run 不并发推进，取消仍释放等待。"
  - "一组事件流矩阵证明：支持版本的合法事件被接受；声明测试缺一个、失败、跳过或流不完整均拒绝；governance-run-lock 的两个既有测试均被 expected 明确列出。"
  - "权威目标合同：最终业务提交的实际 CI 中 pin 检出与完整性检查通过、backend-tests 实际执行成功，六项规则测试实际读取该 pin 的权威 rules.json，不能以 skipped、fixture 或本地结果替代。本轮因账单/额度阻塞（run 43752944966）经用户明确裁定延期，记为接受风险并保持未验证，额度恢复后另行验证；不以本地/离线结果冒充权威闭环。"
  - "一次 CUSTOM 人工核对可追溯本次改动与证据，前三数按明确口径追加，第四数明确保持未决；不改写历史或把测量数当产品通过保证。"

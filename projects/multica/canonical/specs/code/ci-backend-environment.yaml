# spec.yaml — 行为规格（Canonical YAML）；MODIFIED 能力的完整规格。

meta:
  capability: ci-backend-environment
  change_id: 2026-11-12-fork-ci-test-evidence-trust
  created: '2026-11-12'
  confidence: medium
requirements:
- id: REQ-CBE-001
  confidence: high
  description: fork CI 的 backend-tests 为 nonce 门禁包提供真实的一次性库，且门禁每个拒绝条件都被独立测试；不放宽 nonce 门禁。
  scenarios:
  - id: SC-CBE-001
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: 给定一个可连接的 Postgres 管理员 URL（本地用注入的假连接），
    when: 执行 ci-provision up 再 down，以及 up 未完成时执行 down。
    then: SHALL 由 up 用既有 createDisposableDatabase 建出符合 TestMain 全部身份检查的库与角色（库名 aifi45_tmp_<nonce>、角色 aifi45_role_<nonce>、库与角色 marker、非超级用户），并把 DATABASE_URL、AIFI45_DISPOSABLE_NONCE 写入环境文件且先对口令发出 ::add-mask::；SHALL 由 down 在
      marker 匹配时删除库与角色；marker 不符 SHALL 拒绝删除并非 0 退出。
    and:
    - handle 缺失（up 在写出前失败）时 down SHALL 以 0 退出并说明无资源可清理。
    - 任何日志、stdout/stderr 与 handle 文件 SHALL NOT 含明文口令；GITHUB_ENV 中的 DATABASE_URL 承载 job 级一次性角色口令，写入前 SHALL 先对该口令发出 ::add-mask::，且该口令 SHALL NOT 被复用于任何非一次性资源。
  - id: SC-CBE-002
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: cmd/server 与 governance 各自的 verifyDisposableTestDatabase，
    when: 对 nonce 格式、库名、角色名、session_user 不等于 current_user、库非所有者、库 marker、角色 marker、superuser、createdb、createrole、bypassrls 逐条单独构造失败。
    then: SHALL 每一条单独退化都被拒绝，且该条件由独立命名的子测试逐条归因；合法的 nonce 库 SHALL 通过。
    and:
    - 该测试 SHALL 在 runner 自建一次性库内真实执行，skip 为 0 且至少一个叶子 PASS。
    - 门禁本身 SHALL NOT 被放宽。
- id: REQ-CBE-002
  confidence: high
  description: tools 依赖只有一个 pin 来源；CI 与本地不依赖开发机路径；缺依赖是失败而不是 skip。
  scenarios:
  - id: SC-CBE-003
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: 仓库存在 .github/aifirst-tools-pin（单行 40 位 hex），ci.yml 的两个消费者从它读取 ref，
    when: 运行 tools-pin 的 read 与 check：pin 文件合法或非法，检出目录缺少 execution-control-protocol.mjs、control-vectors.json 或 crctl.mjs 之一。
    then: SHALL read 对非 40 位 hex 或多行文件硬失败；SHALL check 在任一必需文件缺失时非 0 退出并打印 pin 与缺失文件名；全部存在时 SHALL 退出 0；ci.yml 中 SHALL 不再出现 tools 的字面 commit。
    and:
    - 对 ci.yml 字面 ref 的检查 SHALL 逐行解析（split(/\r?\n/)），解析失败硬失败。
  - id: SC-CBE-004
    confidence: medium
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: server/internal/governance 与 crosslang_test 下的 *_test.go，
    when: 静态契约检查：搜索 C:/Users/ 开发机绝对路径，以及依赖 AIFI45_TOOLS_ROOT 或 CRCTL_MJS 的测试在环境变量缺失时的处理。
    then: SHALL 源码中不含开发机绝对路径默认值；SHALL 缺失 CRCTL_MJS 或 AIFI45_TOOLS_ROOT 的测试以 Fatal 结束而不是 Skip；契约检查本身 SHALL 能对注入了旧默认路径或 t.Skip 的样例变红。
    and: []
  - id: SC-CBE-005
    confidence: low
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: CI 的 backend-tests 在修复后的 ci.yml 下运行（需推送授权与 tools pin 可用，见 design U1），
    when: 查看该 run 的 Test 步骤与 ci-evidence 步骤。
    then: SHALL cmd/server、governance、crosslang_test、handler 各自有通过的测试且无名单外 skip；若走 U1 路径 β（tools 未推送），SHALL 如实记录 tools 相关测试未验证并使 pin 完整性检查失败，不得 skip 或报绿。
    and:
    - 验收报告 SHALL 记录 run id、commit、各 job 结论。
# --- merged from 2026-11-16-multica-execution-evidence-closure (2026-11-16): 追加 REQ-MEC-005/006/007，保留上方原条款 ---
- id: REQ-MEC-005
  confidence: high
  description: backend-tests 从唯一已发布 pin 加载权威 rules.json；缺规则文件在既有 pin 完整性入口失败，不能落回 fixture。
  scenarios:
  - id: SC-MEC-005
    confidence: high
    evidence: proposal C3、success_criteria[2]；design 决策 5
    given: pin 为 7a0a2ab57f3f5e2c583c3523bc69d67e7be115c1，两个消费者仍读取该 pin；tools-pin 的必需文件增加 skills/shared/controlled-shell/rules.json
    when: 运行既有 tools-pin 和 ci-scope 离线测试，分别检查完整/缺文件夹具、两个 checkout 与 backend job env/step 顺序
    then: SHALL 完整四文件夹具通过，缺任一文件非零并点名 pin/路径；backend env 的规则路径为同一 pinned checkout，pin-check 在 Test 前；两个消费者不含 main/字面 SHA 旁路
    and:
    - 保留凭据诊断早于 checkout、受限一次性 DATABASE_URL、既有事件流/admin 对账及 always teardown；不新增 job、依赖或 overlay
    - 规则 env 使用 github.workspace 的明确路径，不使用不能在 YAML env 中自动展开的 $AIFI45_TOOLS_ROOT 字面串
    - 两个生成器只执行 --check，合同漂移即停止报告，不修改生成物/digest；callers 和 Git 对象类型既有边界不变
- id: REQ-MEC-006
  confidence: medium
  description: 最终业务提交的实际 CI 执行成功并证明六个既有快照测试实际读取权威规则，是权威目标合同；本地/fixture/skipped/自动 N/A 不能替代。本轮因平台账单/额度阻塞经用户明确裁定延期（TC-MEC-003 记 not_applicable，接受风险），权威 CI 验证仍未完成，额度恢复后另行验证。
  scenarios:
  - id: SC-MEC-006
    confidence: medium
    evidence: proposal C3、success_criteria[2]；tools archive controlled-shell-snapshot-read-shapes SC-004；design 决策 5
    given: 取得独立提交/push 和 CI 执行授权，实际 run 的 headSha 对应最终交付业务提交，pin 已发布且账单/凭据可用
    when: 人工核对同一实际 CI 的 metadata、backend-tests 及原始测试/对账流，不为每条断言重跑
    then: SHALL backend-tests、pin 完整性及其 Test/共享与管理员证据对账实际执行成功；六个指定快照测试均有 pass，TestProposedSnapshotReadShapes 的真实 rules.json 加载日志出现；记录 run id/headSha/pin/job/结论
    and:
    - 六个名称精确为 TestM26B2TestFactsPayload、TestM26B2TestFactsPreserveFailures、TestM26B4CollectorKeepsBothReviewStages、TestM26B4ScanEmitsIndependentTestEvent、TestM26B4ScanTestOnlyAndReviewOnly、TestProposedSnapshotReadShapes
    - transitions-contract-check 的两生成器 --check 实际通过；不能用它的成功替代 backend-tests 或规则加载事实
    - 本轮经用户明确裁定延期：实际 CI 因账单/额度阻塞（run 43752944966 runner_id=0、六测试 skipped，未启动有效执行），TC-MEC-003 记为 not_applicable（接受风险）并如实保留未验证与阻塞原因，不冒充通过、不继承旧 change 豁免；非用户裁定的自动 N/A 仍禁止，额度恢复后另行验证以满足本场景全部 SHALL
- id: REQ-MEC-007
  confidence: high
  description: 本次定制与当前前三数可追溯，第四数明确未决；计数和历史记录不是产品验收结果。
  scenarios:
  - id: SC-MEC-007
    confidence: high
    evidence: proposal C4、constraints、success_criteria[3]；design 决策 6
    given: 本次业务 diff、对应 STDD change/任务与验证事实，以及 CUSTOM 当前表结构
    when: 一次人工核对模块索引/CR索引/明细，并按明确的 git 跟踪文件与匹配行口径追加当前基线
    then: SHALL 登记准确覆盖本次定制、真实流程标识、上游挂钩与 fork 文件边界；前三数带实际 tree/HEAD、时间及差值说明；第四数明确未决/本次未测，不沿用 314 冒充测量
    and:
    - 统计范围仅 server/packages 的 .go/.ts/.tsx/.sql/.mjs，文件数及匹配行用 AIFIRST|CR-2026-[0-9]{3}，第三数用 AIFIRST；一行多次命中只计一次
    - 保持 CUSTOM 的 CRLF、稳定明细 ID 与历史记录；计数下降按实际变动解释，不以单调增长作为正确性保证
    - 未提交新增文件只说明为未计入，交付后按真实跟踪树核对；不擅自 stage 来改变测量范围，不修改归档
# merged from 2026-11-19-delivery-quality-baseline (2026-11-19): appended DQB requirements
- id: REQ-DQB-CBE-001
  confidence: high
  description: 交付检查入口消费本次已配置的隔离环境，缺失前置条件或子步骤失败不能报告成功。
  scenarios:
  - id: SC-DQB-CBE-001
    confidence: high
    evidence: 'canonical/proposals/2026-11-19-delivery-quality-baseline.yaml §what_changes C1/C3、constraints'
    given: 已有 Go wrapper、一次性库和 CI 接线夹具可记录参数、环境、生命周期及退出状态，不连接真实服务。
    when: 验证完整输入、缺失 nonce 或必需夹具、注入 Go 非零、夹具准备失败，以及记录写入或创建结果不明。
    then: SHALL 成功时 regular、admin、agent 各调用一次；缺必需输入时不启动测试；Go 非零时入口返回非零。
    and:
    - 管理员 URL SHALL 仅由外层供给回收或既有 admin 命令使用，regular 只继承受限常规与夹具库连接，agent 不继承数据库、nonce 或 Redis 测试环境。
    - 夹具供给 SHALL 按固定案例提供独立库和非 CREATEDB 角色，缺失或重复绑定不能回落到共享库；夹具文件 SHALL 含测试名→DSN 映射和无密码的主库及夹具身份，在对应资源创建前记录预留、确认创建后记录已确认。首次记录写入未成功时不得创建资源；后续记录更新失败时 SHALL 保留上次完整记录。
    - 验收入口 SHALL 不读取普通 .env 或降级到默认数据库。
    - 指定夹具文件的外层回收 SHALL 只以文件内身份为准，不消费环境变量句柄；文件缺失、无效或必需身份缺失时硬失败。已确认身份中仍存在的库和角色须分别重读 marker、全部匹配后才可删除任一对象；创建未确认的预留身份不得自动删除，须保留记录并报错，即使 marker 相同或暂未发现对象也不例外。全部身份确认无残留后才移除记录；连接错误或归属不明时保留记录，可能须人工核实。未指定夹具文件的现有回收路径不变。
- id: REQ-DQB-CBE-002
  confidence: high
  description: 全量后端检查必须复用现有 CI 分组和对账，使用本次专用库执行，不把跳过或未执行当成通过。
  scenarios:
  - id: SC-DQB-CBE-002
    confidence: high
    evidence: 'canonical/proposals/2026-11-19-delivery-quality-baseline.yaml §what_changes C1–C3、success_criteria'
    given: 代表性非 root Linux 干净候选、同一经批准 pin 的 Tools、本次新建并迁移的常规库及每案独立夹具库、既有独立管理员环境就绪。
    when: 运行配置所列的后端全量检查命令。
    then: SHALL regular、admin、agent 均成功并产生实际结果；regular 与 admin 的事件流均由现有对账器确认。
    and:
    - 现有必需包、所有权和许可跳过约束 SHALL 保持；任何名单外跳过、未运行的必需测试或异常退出不得计作通过。allowed-skips SHALL 由 11 补全至 20，新增 9 条为平台/helper 合法 skip（systemctl/pwsh 缺件、macOS layout、subprocess helper），附源码行号与触发条件；该补全不把任何功能失败计作通过。
    - 同次质量验收 SHALL 确认隔离夹具实际执行、不污染共享库，且记录本轮受管库和角色的迁移与回收；未回收不得计为完整通过。
    - 已有托管 CI 与独立测试归属 SHALL 保留；现有 hosted 后端 job 仅为同一夹具合同补供给、凭据隔离、回收与 regular 包级串行，不以本地成功替代 hosted 实际结论。
    - 如更换 Tools pin，SHALL 在正式 run 前取得单独采用授权及真实规则 allow/deny、crctl 兼容结果；正式运行 SHALL 使用同一不可变提交的规则和 crctl，不得混用。
    - 迁移测试 SHALL 使用现行真实 SQL 保留上／下迁移与不合法数据断言；Pi SHALL 对每个已绑定路径只追加一次技能参数，OMP 原发现行为不变。

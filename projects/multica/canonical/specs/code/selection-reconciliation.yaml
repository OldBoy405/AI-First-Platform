# spec.yaml — 行为规格（Canonical YAML）；MODIFIED 能力的完整规格。

meta:
  capability: selection-reconciliation
  change_id: 2026-11-12-fork-ci-test-evidence-trust
  created: '2026-11-12'
  confidence: medium
requirements:
- id: REQ-SEL-001
  confidence: high
  description: run-selection 的对账失败使 selection 失败；未配置 expected 的既有行为保持不变；node 单测进入 CI。
  scenarios:
  - id: SC-SEL-001
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: 一个配置了非空 expected 数组的 selection，go test -json 流缺少某个预期测试或含多余、重复事件，
    when: decideSelection 以 verifyGoTestSelection 的真实返回值判定。
    then: SHALL status 不是 matched 时 ok 为 false，reasons 含该 reason 原文并输出 blocked=<reason>；status 为 matched 且其余判定通过时 SHALL ok 为 true。
    and:
    - 单测 SHALL 使用 verifyGoTestSelection 的真实输出而不是手写 {matched, blocked} 形状；把决策函数改回读取 .matched 与 .blocked 的旧写法 SHALL 使该单测变红（变异验证记入证据）。
  - id: SC-SEL-002
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: selections.json 中未设置 expected 的 selection（当前全部条目），
    when: decideSelection 与 run-selection 运行。
    then: SHALL 沿用旧判定：test.code 为 0 且 fail 为 0 且 skip 为 0 且 pass 大于 0；PASS 与 FAIL 输出行 SHALL 逐字不变。
    and:
    - run-selection.test.mjs 既有断言 SHALL 全部保持通过且不被改弱。
  - id: SC-SEL-003
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: selection 的 expected 字段已存在但为空数组、非数组或元素非法，
    when: decideSelection 判定。
    then: SHALL ok 为 false 且 reasons 含 EXPECTED_INVALID；SHALL NOT 静默当作未配置。
    and: []
  - id: SC-SEL-004
    confidence: medium
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: scripts/aifi45-disposable 下的 node 单测与 ci-paths.json 的 scope 映射，
    when: ci-scope 对「仅改 scripts/aifi45-disposable/**」的变更判定；检查 ci.yml 的 script-checks。
    then: SHALL 该变更命中 scripts 与 backend scope；script-checks SHALL 含 node --test scripts/aifi45-disposable 的步骤，且 pg 依赖获取失败时步骤失败。
    and:
    - 改 run-selection 不触发任何 CI job 的现状 SHALL 不再成立。
# --- merged from 2026-11-16-multica-execution-evidence-closure (2026-11-16): 追加 REQ-MEC-003/004，保留上方原条款 ---
- id: REQ-MEC-003
  confidence: high
  description: 接受已核实 Go 1.26.9 系列旧六字段流及 Go 1.27.1 的合法可选元数据，不放宽未知键、状态机或失败拒绝。
  scenarios:
  - id: SC-MEC-003
    confidence: high
    evidence: proposal C2、success_criteria[1]；go doc cmd/test2json @go1.27.1；design 决策 3
    given: 既有 selection.test.mjs 合法 fixture，以及按官方八字段合同添加或退化元数据的表驱动样本
    when: 以真实 verifyGoTestSelection 及 decideSelection 对账，不手写旧 matched/blocked 返回形状
    then: SHALL 原六字段合法流及合法 output 元数据流 matched；非法类型、值域、事件位置或未知键为 blocked/EVENT_INVALID；含合法 FailedBuild 的失败事件仍被拒绝，不能 matched
    and:
    - OutputType 可省略；存在时为 output 事件的字符串，值仅为空串/frame/error/error-continue；它不替代最终测试结论
    - FailedBuild 可省略；存在时仅允许 fail 事件的非空合法字符串；进程非零的既有 PROCESS_UNCONFIRMED 拒绝优先级不改
    - 缺失/额外测试、重复键/事件、skip/fail、截断、signal、未知退出及错序继续拒绝；旧 expected 未配置时的 totals 规则及输出行不变
    - 返回值不包含原始 Output、异常消息或秘密形态 fixture 内容；不新增版本协商、解析框架或静默 fallback
- id: REQ-MEC-004
  confidence: high
  description: governance-run-lock 使用明确 expected 名单，所列测试缺一个也不能因其余通过及 exit0 而成功。
  scenarios:
  - id: SC-MEC-004
    confidence: high
    evidence: proposal C2、success_criteria[1]；design 决策 3、4
    given: selections.json 的 governance-run-lock 声明四个完整测试名：TestWithRunLockSerialisesSameRun、TestWithRunLockCancelReleasesWaiter、TestReconcileRunIdentity、TestMTick003；package 为 github.com/multica-ai/multica/server/internal/governance、leaf 均为 true
    when: 在离线矩阵中对完整合法流与删除任一测试全部事件的流执行真实对账和 selection 决策
    then: SHALL 完整流 matched 且 ok=true；每个缺测流即使 exit0、其余测试 pass 仍 blocked/SELECTION_MISMATCH 且 ok=false
    and:
    - run 为这四个测试的完整锚定 alternation，expected 集合精确相等，不从观测流反向生成期望
    - 保留原 governance-mtick003 入口及其它 selection 的无 expected 行为，不扩围迁移所有名单

# spec.yaml — 行为规格（Canonical YAML）；MODIFIED 能力的完整规格。

meta:
  capability: ci-credential-and-frontend-typecheck
  change_id: 2026-11-12-fork-ci-test-evidence-trust
  created: '2026-11-12'
  confidence: medium
requirements:
- id: REQ-CCF-001
  confidence: high
  description: transitions 的 tools 凭据失败原因可区分且不泄漏凭据；packages/views 的 typecheck 恢复。
  scenarios:
  - id: SC-CCF-001
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: tools-access 可注入 fetch，
    when: 分别返回：凭据为空、401、403、404、200、网络异常、其他状态。
    then: SHALL 映射为 missing、rejected、no-access-or-pin-not-found、ok、inconclusive，非 ok 时非 0 退出；SHALL 任何输出与错误信息不含 token 值；请求头 SHALL 仅在 fetch 调用内使用。
    and: []
  - id: SC-CCF-002
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: packages/views 的 use-logout.test.ts 改用 @multica/core 包导入，
    when: 运行 @multica/views 的 typecheck 与该测试文件。
    then: SHALL typecheck 0 条 TS6059；use-logout.test.ts SHALL 全部通过；其断言 SHALL 与改前等价（不删除、不放宽）。
    and:
    - 若修好 typecheck 后暴露其他前端失败，SHALL 先报告再裁定范围（design U4）。
  - id: SC-CCF-003
    confidence: low
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: 管理员已按最小权限更新 AIFIRST_TOOLS_READ_TOKEN，
    when: 重跑 transitions-contract-check。
    then: SHALL 该 job 通过；管理员未完成更新时 SHALL 如实列为未闭合。
    and:
    - 本 change SHALL NOT 读取、创建或轮换凭据。

# Merged from the 2026-11-19 delivery-quality-baseline change.
- id: REQ-DQB-CCF-001
  confidence: high
  description: 不放宽现有规则，恢复正式前端 lint、类型检查和单元测试；原有 UI 状态和交互保持不变。
  scenarios:
    - id: SC-DQB-CCF-001
      confidence: high
      evidence: 'canonical/proposals/2026-11-19-delivery-quality-baseline.yaml §what_changes C1/C2、constraints、success_criteria'
      given: 干净候选按锁文件安装依赖，并启用现有视图 lint 及无障碍规则。
      when: 运行 pnpm lint、pnpm typecheck 及 pnpm test。
      then: SHALL lint 与 typecheck 退出 0 并实际执行 views 的三个任务；现有规则下 lint 无错误；pnpm test 的失败用例全部落在声明的上游已知红文件集内，无集外新失败。
      and:
        - 相关组件 SHALL 使用现有安全的 UI 图标接口，保持状态含义；presenter 图标按钮 SHALL 有可访问名称且点击仍执行原动作。
        - 上游已知红 SHALL 以 6 个 Views 文件的文件级清单声明；不修改上游测试或产品、不放宽 lint 规则、不调测试超时。清单外任何新失败 SHALL 使门禁红；文件级例外不证明清单内无新回归。
        - 测试任务 SHALL 完整执行；其他任务失败、进程异常、Vitest 未处理异常或结果不完整 SHALL 使门禁红，不因同时存在清单内失败而放行。
- id: REQ-DQB-CCF-002
  confidence: high
  description: 项目质量配置须明确且实际通过必跑浏览器路径，不依赖既存服务或未设置的 E2E 范围。
  scenarios:
    - id: SC-DQB-CCF-002
      confidence: high
      evidence: 'canonical/proposals/2026-11-19-delivery-quality-baseline.yaml §what_changes C1/C3、constraints、success_criteria'
      given: 已创建本次的独立一次性库、Go API 与 web 进程，有明确测试地址，不读取主工作树环境文件。
      when: 按正式命令仅执行 Chromium 的 e2e/issue-task-history.spec.ts。
      then: SHALL 执行且通过这一个命名用例，无失败或跳过；真实响应须验证 compact、own、subtree 的请求范围和内容。
      and:
        - 用例与 quality.e2e.critical_paths 的范围 SHALL 一致，并记录本次自建测试栈的回收结果。

# governance-runner-run-lock 的行为规格（Canonical YAML）。
# Change: 2026-11-15-multica-backend-tests-green
meta:
  capability: governance-runner-run-lock
  change_id: "2026-11-15-multica-backend-tests-green"
  created: "2026-11-15T19:00:00+08:00"
  confidence: medium

requirements:
  - id: REQ-RRL-001
    description: >-
      同一个 run 的并发唤醒（周期扫描、启动扫描、事件唤醒）在连接池上限为 4 时全部完成，
      并且只派发 1 个任务；等待锁的唤醒不占用池连接。
    scenarios:
      - id: SC-RRL-001
        confidence: high
        evidence: "proposal.yaml success_criteria[2]；2026-11-15 实测：池 16 通过、池 4 挂起"
        given: >-
          一次性迁移库；governance 测试包的连接池上限为 4；一个活动 run；
          6 个 `ResumeActiveRuns`、1 个 `Reconcile`、1 个事件唤醒并发发起（既有 `TestMTick003`）
        when: "运行 `TestMTick003`"
        then: "SHALL 在超时内完成（不挂起）"
        and:
          - "派发的任务数恰好为 1，run 持有的任务数为 1"
          - "第一个节点仍在第 1 次尝试"

  - id: REQ-RRL-002
    description: >-
      `withRunLock` 保持原先的锁语义：同一 run 的 `fn` 严格串行，锁在 `fn` 结束后释放，等待中被取消的调用返回取消错误
      且不留下锁或连接。
    scenarios:
      - id: SC-RRL-002
        confidence: medium
        evidence: "design.md 决策 3；原 `pg_advisory_lock` 语义；ctx 取消语义"
        given: >-
          一次性迁移库；同一个 run id；两个 goroutine 调用 `withRunLock`，`fn` 内用计数器检测并发进入；
          另有一个持锁且未返回的 `fn`，以及一个在等锁、随后 ctx 被取消的调用
        when: "两个调用并发执行并随后同一 run id 再调用一次；以及在持锁期间取消等锁调用的 ctx"
        then: "SHALL 任意时刻最多 1 个 `fn` 在执行，第一次调用返回后锁被释放使第三次调用无需等待即可进入；被取消的等锁调用返回 `ctx.Err()`"
        and:
          - "取消返回后，池里已获取的连接数不超过持锁者占用的那 1 条"
          - "持锁者返回后，同一 run id 的下一次调用可立即获得锁"

  - id: REQ-RRL-003
    description: >-
      三处同类的等锁点（`Reconcile`、`reconcileCode`、`reconcileRequirement`）都使用 `withRunLock`；
      `upsertRequirementRun` 的等锁点保持不变（其临界区已在锁连接上）。
    scenarios:
      - id: SC-RRL-003
        confidence: high
        evidence: "design.md 决策 3、4"
        given: "改后的 `runner.go`、`runner_code.go`、`runner_requirement.go`、`runner_requirement_entry.go`"
        when: "人工评审 diff 与全文搜索 `pg_advisory_lock(`"
        then: "SHALL 前三个文件不再包含阻塞式 `pg_advisory_lock(`，三处都调用 `withRunLock`；`runner_requirement_entry.go` 仍使用原等锁点且无改动"

  # --- merged from 2026-11-16-multica-execution-evidence-closure (2026-11-16): 追加 REQ-MEC-001/002，保留上方原条款 ---
  - id: REQ-MEC-001
    description: "三个恢复入口仅在锁后活动 run 的 ID 等于已取锁 ID 时推进；对象消失或切换时本次无效果返回。"
    scenarios:
      - id: SC-MEC-001
        confidence: medium
        evidence: "proposal C1、success_criteria[0]；design 决策 1、2"
        given: "一次性迁移库；architecture/requirement/code 三个入口各有合法 A；独占 Runner 池上限 4；控制连接持 A 锁，恢复调用已完成锁前查询并进入取锁路径"
        when: "分别保持 A 不变、使 A 终态且创建同归属合法 B、使 A 终态且无后继；changed 情形另持 B 锁再释放 A，随后另一次恢复并释放 B"
        then: "SHALL unchanged 推进 A；changed 的第一次恢复返回且 B 的节点/任务/状态不变，第二次恢复等待 B 锁后推进 B 恰好一次；no-active 无效果返回"
        and:
          - "三种入口均走原生产恢复函数、原 digest/admission 与假 enqueuer；不加生产 hook，不以替身身份判定函数代替"
          - "B created_at 使用明确顺序；architecture 至少三次、requirement/code 至少两次 Runner 独占池新增获取证明交错已达取锁边界，全部等待有 deadline"
          - "换目标不增加业务 attempt、不将 B 标为 failed；下一次既有唤醒负责恢复，不承诺同次立即推进"
          - "非 ErrNoRows 的查询错误与 digest 错误继续传播；writeback 和 requirement 创建锁不被扩大修改"
  - id: REQ-MEC-002
    description: "保持现有同 run 串行、释放、取消、等待不占连接，以及池 4 并发唤醒只派发一次的保证。"
    scenarios:
      - id: SC-MEC-002
        confidence: high
        evidence: "proposal C1；既有 governance-runner-run-lock 基线；design 决策 2、4"
        given: "同一次 governance-run-lock selection 包含两个原锁测试、TestReconcileRunIdentity 与 TestMTick003，带 race，governance TestMain 的池上限为 4"
        when: "经既有 run-selection 执行与精确对账"
        then: "SHALL 四个顶层测试完整通过，pass=4/fail=0/skip=0；同 run 回调最多一个并发进入、取消返回 ctx.Err、等待不占用持锁者需要的连接、释放后可再次进入"
        and:
          - "TestMTick003 派发任务数和 run 任务数恰好为 1，首节点 attempt 为 1；不改既有断言"
          - "新身份测试内部用普通表循环，不产生名单外子测试事件；runner 本轮只执行这一个 selection，不重复运行原 governance-mtick003 入口"

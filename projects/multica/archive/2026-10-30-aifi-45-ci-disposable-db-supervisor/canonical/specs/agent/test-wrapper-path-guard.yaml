    description: SC-TWG-001 / guard 拒绝含 ':' 的 TMPDIR，假命令不被执行。
    action: bash scripts/test-go.test.sh
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: 'TC-TWG-001: PASS'
  - id: CP-TWG-002
    description: SC-TWG-002 / test-go.test.sh 在 mktemp 之前拒绝含 ':' 的 TMPDIR。
    action: bash scripts/test-go.test.sh
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: 'TC-TWG-002: PASS'
  - id: CP-TWG-003
    description: SC-TWG-003 / 空 TMPDIR 回退 /tmp，命令被执行且退出码透传。
    action: bash scripts/test-go.test.sh
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: 'TC-TWG-003: PASS'

# 2026-11-10-aifi-45-m005-consumption-effect.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-11-10-aifi-45-m005-consumption-effect"
  title: "AIFI-45 M005：平台在 consumption 提交时签发可信 effect，使生产准入可达 ADMITTED"
  created: "2026-11-10T22:03:05"
  status: draft
  version: "2.9"

why:
  problem: |
    准入决策器 DecideAdmission 只认「该 consumption 的 task 有一条 effect 结算，且结算指向一条已入链、
    签名通过、command_digest 与冻结命令一致的 v2 verdict」。这条链的写入口
    （ApplyControlCommandTx / AppendVerdictFrameTx / SettleControlCommandTx）已建成并有测试，
    但生产里没有任何调用方，所以生产准入永远停在 WAIT_TRUSTED_T_COMMIT。
    AIFI-45 的信任模型（2026-11-10 已批准）规定：T（含 crctl）是非可信客户端，签发者在服务端，
    服务端只对自己能核实的事实签发。服务端现在唯一已经在核实并提交的事实，是
    HandleDaemonExecutionConsumption 里的 consumption 回执：认领行、授权头、已签发的绑定证明
    都在同一事务里重验过。
  motivation: |
    ADJ-AIFI45-M005 / M003(RUN-006) / M008 的关闭都卡在「生产链路没有 effect 生产者」。
    先让这一个事实能走通现有写入口，生产准入才有可观察的 ADMITTED，其余（T 裁决、恢复入口）
    才有可挂接的载体。不做则授权内自治执行在生产里无法推进。

what_changes:
  - id: C1
    description: "新增服务端签发函数：在 consumption 回执首次落库的同一事务内，按既有写入口冻结 command、入链 v2 verdict（effect）、结算为 effect；request_id 取 consumption.task_id。"
    type: new
  - id: C2
    description: "HandleDaemonExecutionConsumption 在回执 INSERT 成功路径（首次写入）调用该函数；签发失败则整笔事务回滚，不留下「有回执无 effect」。"
    type: modified
  - id: C3
    description: "用平台已有的 execution Ed25519 密钥签名，信任清单在进程内由该密钥按链作用域现生成；不引入清单文件、pin 仪式或第二把密钥。"
    type: new
  - id: C4
    description: "校正 execution_admission.go 中「写入口无生产调用方」的陈旧注释；登记 CUSTOM；selections.json 增加一个一次性库选择。"
    type: modified

capabilities:
  new:
    - name: "consumption-effect"
      description: "平台提交 consumption 回执时同事务签发该 task 的可信 effect，并保证链连续、重放与新 generation 不重复、失败整体回滚。"
  modified:
    - name: "authorized-runner"
      description: "SC-RUN-003 中「可信 T 事务已提交」在 execution-consume 上由「平台已提交的 consumption effect」满足；其余场景不变。"

constraints:
  - "不改 schema、不加路由、不改 T(crctl) 与 daemon；准入决策器 DecideAdmission 的判定逻辑不变。"
  - "沿用既有写入口与其全部校验，不绕过验签、不直接写信任表。"
  - "effect 只表示「平台已核实并提交该 task 的 consumption」；不表示 T 的业务工作已提交，也不表示额度判断。"
  - "历史 consumption 行不回填；没有 effect 的旧行继续失败关闭。"
  - "multica 代码注释用英文；按 CUSTOM.md 现行结构登记；追溯用 STDD change id，不编造 CR 编号。"

stakeholders:
  - "multica 服务端维护者"
  - "AIFI-45 授权执行链的使用者与审批人"

risk_areas:
  - capability: "consumption-effect"
    risk: "语义风险：准入在首个 consumption 后即可 ADMITTED，容易被误读为「T 的工作已被核实」。"
    mitigation: "proposal、design、spec 与代码注释都写明 effect 的含义；T 的裁决仍只是候选，不被签为 effect；RUN-006 / M008 的 T 侧事实仍待后继载体。"
  - capability: "consumption-effect"
    risk: "签名链在单进程内自签自验，不是安全边界；真正的边界是私钥与数据库凭据不被 agent 取得。"
    mitigation: "保留链是因为写入口、准入与既有用例都依赖它，单一写路径可审计；部署检查两项（agent 身份读不到私钥；可用 DB 登录对四张信任表无写权限）归上线就绪清单。是否简化链留给后续清理 change，不在本期。"
  - capability: "consumption-effect"
    risk: "热路径多写若干行；同一 CR 的并发 consumption 在链上串行；同一 task 新 generation 会撞 request_id 主键。"
    mitigation: "沿用既有 lineage 级 advisory lock；该 task 已有结算则跳过签发（一个守卫，不是异常特判）。"

non_goals:
  - "不接 T 的 verdict、不接线 ControlWorker、不建 selection/reservation 生产者、不做预算或 remaining 计数。"
  - "不做密钥轮换、双 key、清单文件与 pin、人员分离。"
  - "不回填历史 consumption，不迁移任何历史 CR 实例。"
  - "不清理 T 侧签名死代码与 daemon 侧休眠客户端（另开清理 change）。"
  - "不改 wake / periodic 恢复；准入重评沿用既有唤醒。"

critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false

anchoring:
  level: L1
  reference_changes: []
  anchor_implementations: []

success_criteria:
  - "一次经真实路由的 consumption 请求成功（201）后，该 task 恰有 1 条 command(settled_effect)、1 条 verdict、1 条 effect 结算，三者 request_id 均等于 consumption.task_id，command_digest 等于冻结 command 字节的 sha256；DecideAdmission 由 WAIT_CONSUMPTION 变为 ADMITTED。"
  - "同一 CR 的第二个 task 的 consumption 使链连续（seq=2，prev_digest 等于第一条 verdict 的 digest）；同一 task 的重放（200，changed=false）与新 generation 的 consumption 不新增 command/verdict/settlement。"
  - "签发失败时（预置同 request_id 的冲突 command）consumption 请求失败且 cr_execution_consumption 无该行。"
  - "既有 consumption、准入、TC-RUN-002/003/010 与 NTF 用例在一次性库上结果不变（0 FAIL、0 skip）。"
  - "diff 内无迁移文件、无新路由、无 T 或 daemon 文件改动。"

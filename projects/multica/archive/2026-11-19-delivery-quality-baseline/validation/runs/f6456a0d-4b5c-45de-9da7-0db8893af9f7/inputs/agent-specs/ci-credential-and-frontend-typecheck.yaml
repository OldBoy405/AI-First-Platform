meta:
  task_id: ci-credential-and-frontend-typecheck
  change_id: '2026-11-19-delivery-quality-baseline'
  task_type: code
  system: Multica 前端交付质量检查
  preconditions:
    - 同一 Linux 干净候选按锁文件安装，前端检查实际执行，不使用旧任务缓存。
    - 本次自建 API、web、浏览器测试库已就绪；明确设置 PLAYWRIGHT_BASE_URL、API base 和 MULTICA_E2E_DATABASE_URL。

steps:
  - id: CP-DQB-003
    description: 确认项目 lint、类型检查退出 0，单元测试真实运行且失败全部落在声明的上游已知红文件集内（无集外新回归），包含 views 任务与 presenter 行为回归。
    action: node scripts/aifi45-disposable/frontend-quality.mjs
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: '@multica/views:lint:'
      - type: stdout_contains
        expected: '@multica/views:typecheck:'
      - type: stdout_contains
        expected: '@multica/views:test:'
      - type: stdout_contains
        expected: 'project-chat-panel.test.tsx'
      - type: stdout_contains
        expected: 'frontend quality OK'
  - id: CP-DQB-004
    description: 在本次拥有的真实测试栈运行唯一必跑运行历史用例，验证三个请求范围及对应内容。
    action: >-
      bash -ec 'DATABASE_URL="${MULTICA_E2E_DATABASE_URL:?}" pnpm exec playwright test --project=chromium --reporter=line e2e/issue-task-history.spec.ts'
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: 'issue loads compact runs until Runs requests full own or subtree history'
      - type: stdout_contains
        expected: '1 passed'

rollback:
  steps:
    - 失败保留报告，仅停止、回收本次运行创建的进程和测试库。

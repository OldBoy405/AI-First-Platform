meta:
  task_id: authorized-runner
  change_id: 2026-10-22-aifi-45-authorized-execution
  task_type: code
  system: multica真实认证入口、统一wake、TaskService与隔离Postgres
  preconditions:
    - 各CP实施与验收状态以对应TC台账为准；补充回归通过不等于完整TC通过。
    - 每个action是子进程测试的声明，不得直接执行；从multica仓根调用版本化 scripts/aifi45-disposable/run-selection.mjs，为该选择单独创建并销毁一次性数据库（库名/角色含 nonce，带 AIFI45_DISPOSABLE 标记）。禁止默认或手动指定共享数据库；旧 scripts/aifi45-db/run.mjs 不得运行或改向。
    - assertions的stdout指harness所保存 .stdout.jsonl 中子进程 output 事件的 Output 文本；必须同时核harness退出0、skip为0、original_unchanged和owned_resources_cleaned均为true。
    - CRCTL_PATH指向本轮tools，测试签名密钥和临时Git/workspace隔离；缺依赖或skip视为未验证。
    - 真路由、统一wake和真实TaskService，不以fake enqueuer或直接walker代证；检查目标测试确实选中。
    - MUST精确选中顶层完整TC；组件子断言或单包内子测试不得登记整TC完成。
    - 当前handler/Root组件的单元断言不代替真实Auth/router/wake/TaskService整链路TC。
    - MUST核真实子进程PASS行；零匹配、skip、ctx代码回显或组件测试包装成整TC均不得算通过。
steps:
  - id: CP-RUN-001
    description: SC-RUN-001 / 原始充分授权真实入口无重复阶段确认。
    action: go test ./cmd/server -run ^TestTC_RUN_001$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_001'}]
  - id: CP-RUN-002
    description: SC-RUN-002 / 不可信或越权主体不签授权不创建任务。
    action: go test ./cmd/server -run ^TestTC_RUN_002$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_002'}]
  - id: CP-RUN-003
    description: SC-RUN-003 / pending落盘ACK仅wake，消费后才推进。
    action: go test ./cmd/server -run ^TestTC_RUN_003$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_003'}]
  - id: CP-RUN-003-A
    description: SC-RUN-003 / 等待哨兵不得将活动run记为失败（补充回归，不替代完整TC）。
    action: go test ./internal/governance -run ^TestAdmissionWaitingIsNotPersistedAsRunFailure$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestAdmissionWaitingIsNotPersistedAsRunFailure'}]
  - id: CP-RUN-003-B
    description: SC-RUN-003 / human approval门控的拒绝、正控及终态边界（补充回归）。
    action: go test ./internal/governance -run ^TestPassHumanApprovalNodeIsGated$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestPassHumanApprovalNodeIsGated'}]
  - id: CP-RUN-003-C
    description: SC-RUN-003 / verdict写入者验签、绑定与前驱链正反例（补充回归）。
    action: go test ./internal/governance -run ^TestVerdictWriterVerifiesAttestation$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestVerdictWriterVerifiesAttestation'}]
  - id: CP-RUN-003-D
    description: SC-RUN-003 / requirement独立入队门控及真实任务身份（补充回归）。
    action: go test ./internal/governance -run ^TestRequirementEnqueueIsGated$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestRequirementEnqueueIsGated'}]
  - id: CP-RUN-003-E
    description: SC-RUN-003 / 用数据库夹具验证verdict seq大于cursor last_seq时不放行；不证明真实链包含关系。
    action: go test ./internal/governance -run ^TestAdmissionDeciderWaitsForCommittedConsumption$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestAdmissionDeciderWaitsForCommittedConsumption'}]
  - id: CP-RUN-003-F
    description: SC-RUN-003上游控制通道 / command验签和重放部分绑定回归，不能替代完整可信B验证。
    action: go test ./internal/governance -run ^TestControlCommandWriterVerifiesAttestation$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestControlCommandWriterVerifiesAttestation'}]
  - id: CP-RUN-003-G
    description: SC-RUN-003上游控制通道 / 已提交撤销不得被普通no_effect遮蔽。
    action: go test ./internal/governance -run ^TestControlCommandEarlierRevokeCannotBeHidden$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestControlCommandEarlierRevokeCannotBeHidden'}]
  - id: CP-RUN-003-H
    description: SC-RUN-003上游控制通道 / command与policy在同一lineage上的事务锁及UUID别名。
    action: go test ./internal/governance -run ^TestControlCommandSerializesWithRevoke$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestControlCommandSerializesWithRevoke'}]
  - id: CP-RUN-003-I
    description: SC-RUN-003上游控制通道 / command入口拒绝REPEATABLE READ；不证明verdict对该隔离级别的行为。
    action: go test ./internal/governance -run ^TestControlCommandRejectsRepeatableRead$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestControlCommandRejectsRepeatableRead'}]
  - id: CP-RUN-003-J
    description: SC-RUN-003上游控制通道 / 两个真实事务中重复command等待提交后返回同一记录。
    action: go test ./internal/governance -run ^TestControlCommandExactConcurrentReplay$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestControlCommandExactConcurrentReplay'}]
  - id: CP-RUN-003-K
    description: SC-RUN-003 / verdict同request的精确重放返回原记录，载荷或不可变字段变化拒绝。
    action: go test ./internal/governance -run ^TestVerdictExactReplayRejectsConflict$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestVerdictExactReplayRejectsConflict'}]
  - id: CP-RUN-003-L
    description: SC-RUN-003 / verdict真实并发重放等待后返回原帧且cursor只推进一次。
    action: go test ./internal/governance -run ^TestVerdictConcurrentExactReplay$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestVerdictConcurrentExactReplay'}]
  - id: CP-RUN-003-M
    description: SC-RUN-003上游控制通道 / 同request跨lineage并发冲突映射，不重复写入。
    action: go test ./internal/governance -run ^TestControlRequestConflictsAcrossLineages$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestControlRequestConflictsAcrossLineages'}]
  - id: CP-RUN-003-N
    description: SC-RUN-003上游控制通道 / 新command与verdict等待锁后须再次检查密钥时效。
    action: go test ./internal/governance -run ^TestControlWriterRejectsExpiryAfterLockWait$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestControlWriterRejectsExpiryAfterLockWait'}]
  - id: CP-RUN-004
    description: SC-RUN-004 / 并发跨run及终态后的根派发永久幂等（部分覆盖：主项使用 fake enqueuer，未证真实 TaskService 跨 run 入队，按 meta 前置不得计为整 TC 通过）。
    action: go test ./internal/governance -run ^TestTC_RUN_004$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_004'}]
  - id: CP-RUN-005
    description: SC-RUN-005 / Git与DB窗口故障恢复原任务与技术子链（部分覆盖：故障 hook 不证明真实 Git 与真实 T 扣额）。
    action: go test ./internal/governance -run ^TestTC_RUN_005$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_005'}]
  - id: CP-RUN-006
    description: SC-RUN-006 / T拒绝或不可达不能派发或重算额度。
    action: go test ./cmd/server -run ^TestTC_RUN_006$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_006'}]
  - id: CP-RUN-007
    description: SC-RUN-007 / 四阶段真实入口wake扫描恢复完整闭环（部分覆盖：现有派发用例使用 fake enqueuer；启动扫描与事件唤醒收敛由 TestRunnerStartupAndEventWakeSourcesConvergeOnReconcile 另行断言，不另立 CP）。
    action: go test ./internal/governance -run ^TestMDispatch001$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_007'}]
  - id: CP-RUN-008
    description: SC-RUN-008 / 旧run及未就绪切换恢复边界不双派不清历史（部分覆盖：只证 legacy/unsupported/ambiguous 三类判定，缺切换、回退与历史保护联合矩阵；digest 漂移恢复见 TestRunnerDigestMismatchIsRecoverableOnSameRun）。
    action: go test ./internal/daemon -run ^TestStrictExecutionContract -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_008'}]
  - id: CP-RUN-009
    description: SC-RUN-009 / 联合身份任一漂移或作者自评不推进当前（部分覆盖：三条必要条件合证，逐字段漂移未逐项覆盖）。
    action: go test ./internal/governance -run '^(TestRequirementReviewRunsOnASeparateAgent|TestRequirementSameAgentForBothRolesIsRefused|TestRequirementDigestDriftKeepsRunResumable)$' -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_009'}]
  - id: CP-RUN-010
    description: SC-RUN-010 / 精确专项授权正反例及操作幂等。
    action: go test ./cmd/server -run ^TestTC_RUN_010$ -count=1 -v
    assertions: [{type: exit_code, expected: 0}, {type: stdout_contains, expected: 'PASS: TestTC_RUN_010'}]
rollback:
  steps:
    - 只销毁本轮明确创建的隔离DB和临时workspace；不执行共享库cleanup或真实CR reset。

# spec.yaml — 行为规格（Canonical YAML）；MODIFIED 增量：SC-WSD-005 被修改，SC-WSD-006 为新增。

meta:
  capability: "workspace-delete-execution-tables"
  change_id: "2026-11-13-aifi-45-real-execution-closure"
  created: "2026-11-13"
  confidence: medium

requirements:
  - id: "REQ-WSD-001"
    confidence: medium
    description: "（MODIFIED SC-WSD-005，ADDED SC-WSD-006）workspace 删除后不得新建 reservation 或 command，且删除与新写入并发时不留下删除后的新行；已保留的历史行不变。采用方案 D4-A（G2-2 已确认）；写入侧 workspace 行锁为 FOR KEY SHARE。"
    scenarios:
      - id: "SC-WSD-005"
        confidence: medium
        evidence: "canonical/proposals/2026-11-13-aifi-45-real-execution-closure.yaml#success_criteria[4]; design.md#D4; 归档 ADJ-017"
        given: "workspace A 已删除，其 contract_selection 行按保留策略仍存在；生产消费路径使用的是由 workspace 与 CR 派生、没有 selection 行的 lineage。"
        when: "经现有创建路径为该 workspace 新建 reservation，或经 ApplyControlCommandTx（包含生产消费入口）新建 command。"
        then: "SHALL 两半句都被拒绝；command 半句由已声明的红灯转为满足，TestWorkspaceDeletionRefusesNewCommand 的断言 SHALL NOT 放宽、改名或删除。"
        and:
          - "ApplyControlCommandTx 的 workspace 归属 SHALL 由调用方的已认证 workspace 提供，SHALL NOT 由 ReservationID 反推（生产中它是消费回执 id）；不改命令签名与 schema。"
          - "SHALL NOT 实现 command 与 cursor 的收敛转移，不删除保留的历史行。"
          - "reservation 半句与 command 半句仍各自独立成测试函数。"
          - "ApplyControlCommandTx 收到已删除或不存在的 workspace id SHALL 以 ErrReservationWorkspaceGone 拒绝；未提供 WorkspaceID SHALL 以 ErrControlStoreInvalid 拒绝。"
          - "本场景取代原 SC-WSD-005 中「command 半句保持红灯、登记为已知失败」的条款；红灯登记的取回点保留在归档中，不改写。"
      - id: "SC-WSD-006"
        confidence: medium
        evidence: "design.md#D4 并发正确性; 经验库「ReadCommitted 下先读后写守卫放在序列化锁之前」"
        given: "reservation 或 command 的写入与同一 workspace 的删除并发。"
        when: "分别取两种交错：写入先取得 workspace 锁，删除先取得 workspace 锁。"
        then: "SHALL 删除之后不留下新的 reservation、command、cursor、verdict、settlement 行：写入先到则删除等待写入提交，删除先到则写入得到 no-row 并回滚。"
        and:
          - "加锁顺序固定为 workspace → claim → head → lineage → cursor，不出现反序死锁。"
          - "探针不用固定 sleep 决定先后，等待 DB 锁状态须有 deadline；重复 reservation 的既有幂等行为不变。"
          - "保留证据与消费回执契约不变；不新增外键、级联或后台补偿。"
          - "写入侧对 workspace 行只取 FOR KEY SHARE：对该行的 FOR UPDATE（删除）SHALL 被阻塞，普通 UPDATE（如 issue_counter 递增）SHALL NOT 被阻塞。"
          - "生产消费入口 SHALL 在 claim 与 head 加锁之前持有该锁；该顺序由生产 handler 保证并被独立测试，不只由 store 函数保证。"

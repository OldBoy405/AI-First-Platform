      - type: stdout_contains
        expected: 'PASS real-run stop-on-stage-failure '
      - type: stdout_contains
        expected: 'PASS real-run reject-unknown-argument '
  - id: CP-REC-008
    description: SC-REC-007 / 既有 selections 全组回归（含已转绿的 command 探针与 33 处迁移后的 fixture）。
    action: node scripts/aifi45-disposable/run-selection.mjs --selections scripts/aifi45-disposable/selections.json
    assertions:

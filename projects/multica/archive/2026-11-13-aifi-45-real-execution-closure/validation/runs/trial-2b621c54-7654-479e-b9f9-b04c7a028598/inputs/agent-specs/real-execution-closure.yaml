    description: SC-REC-008 / authorized 节点的 agent 环境含 CRCTL_EXECUTION_TRUST_ROOT（值为该任务 grant 所在信任库根），legacy 节点不含，custom_env 无法覆盖；daemon 进程环境不变。
    action: node scripts/aifi45-disposable/run-selection.mjs --selections scripts/aifi45-disposable/selections.json --only rec-009

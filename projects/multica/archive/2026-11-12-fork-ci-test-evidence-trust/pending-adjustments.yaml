    impact_scope: '属 B4 小偏离：不改接口与行为语义，只让同一份断言在 Linux CI 与 Windows 本地给出同一结论。基线由 44/45 回到 45/45，随后 13.1 RED 47/45/2、13.3 RED 49/47/2 的失败全部落在本切片新写的断言上。合并注意已写入 CUSTOM.md #330：该归一化不要回退，否则 Windows 本地跑该文件会假红。顺带记录一条工具事实：ripgrep 的 $ 不匹配 \r 之前，核对 CRLF 文件须用 \r?$ 锚定（本切片据此发现 id: go 在 backend-tests 与 backend-agent-tests 各一处，从而把 Edit 锚在唯一的 CRCTL_MJS 行）。'

    actual_change: '登记时：未改任何生产代码、未放宽或改写任何断言、未改任何触发器、未改 canonical。按锁定规格原样实现探针（新增 server/internal/handler/workspace_delete_no_recreate_test.go，4 子测试 + 父测试），selections.json 追加 handler-wsd-no-recreate（./internal/handler，^TestWorkspaceDeletionRefusesNewReservationAndCommand$）。实测红灯，等待用户裁定。裁定后（R5）：探针拆成两个独立测试函数 TestWorkspaceDeletionRefusesNewReservation 与 TestWorkspaceDeletionRefusesNewCommand；selections.json 改为两条对应 selection（32 条）；execution_control_reservation.go 新增哨兵 ErrReservationWorkspaceGone 与一次独立的 workspace 存在性检查（13 插入 0 删除，纯追加）；execution_contract_selection_test.go 的 insertSelectionWithMode 补一行真实 workspace（10 插入 0 删除，事务内、随探针回滚、ON CONFLICT DO NOTHING），因为该夹具的 selectionWorkspace 常量在库里从来没有对应行；test-ownership.json 的 entries 追加第 5 条 owner=known-finding 承载 command 半句；test-ownership.test.mjs 新增 2 项用例并把真实表 skip-regex 期望值追加第 5 个名字。test-ownership.mjs 与 ci-evidence.mjs 一行未改。'
    reason: 'D2 保留 contract_selection 行，而两条创建路径都不检查 workspace 是否仍存在：execution_control_reservation.go:70 的 CreateReservationTx 全函数不查 workspace 表，唯一的 workspace 相关语句是 :89-91 对保留下来的 selection 行做 `WHERE id=$1 AND workspace_id=$2 AND project_id=$3 AND cr_id=$4` 过滤（teardown 后依然命中）；execution_control_store_state.go:148 的 ApplyControlCommandTx 全文件 workspace 零引用。探针先用生产入口 TransitionControlCommandTx 把 A/B 各自 lineage 的 open 槽结算掉（append-only，不用 DELETE 绕守卫），真实删除 A（204），核对 workspace 行已消失且 A 的 selection 行逐字节保留，再分别对 A 发起 reservation 与 command 创建；B 上同样构造的请求作为正向对照必须成功。两个对照都通过，故 A 与 B 的唯一差别就是 workspace 是否存在，拒绝不能归因于请求构造或槽位冲突。'

  - id: ADJ-009
    original_design_ref: 'design.md 修订记录 R1 修订后条款「任何日志、stdout/stderr 与 handle 文件 SHALL NOT 含明文口令；GITHUB_ENV 中的 DATABASE_URL 承载 job 级一次性角色口令，写入前 SHALL 先对该口令发出 ::add-mask::」'
    actual_change: '实现按 R1 先发 ::add-mask::<角色口令> 再写三行 GITHUB_ENV；用例断言的是「除这一条 mask 命令外，没有任何日志行携带角色口令或管理员口令」，而不是「stdout 从头到尾不含口令」。'
    reason: '::add-mask:: 是 GitHub Actions 规定的遮蔽协议，runner 只遮蔽它已经见过的值，因此该命令本身必然把口令送到原始 stdout，这与「stdout 不含明文口令」在字面上不可同时成立。R1 已把边界收敛到「mask 生效后的 runner 日志 + handle 文件」，本条只是把这一不可回避的事实显式登记，避免最终报告把「stdout 全程无口令」当作已验证结论。'
    impact_scope: 'TC-CBE-001 的安全边界断言口径；最终验收报告须一并呈报。口令本身仍是 randomBytes(18) 生成、job 级、随服务容器销毁，不复用于任何非一次性资源；handle 与本 change 写出的其他文件均不含口令。若要求 stdout 全程无口令，则须改用 runner 外部遮蔽机制（超出本 change 范围，需用户裁定）。'

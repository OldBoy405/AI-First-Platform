    reason: '迁移 643（cr_execution_binding_issue）与 644（cr_execution_consumption）各只有一个触发器 `BEFORE UPDATE OR DELETE … FOR EACH ROW`，**没有 BEFORE TRUNCATE 语句级守卫**；645（activation）与 648（其余 12 张）都有。TRUNCATE 不触发行级触发器，故这两张审计证据表可被整表清空。648 自己的头注释（第 11–12 行「TRUNCATE does not fire row triggers, so a row-only guard would …」、第 406 行「every retained table needs this statement guard」）明文声明了这条不变量——即 schema 自述的规则被两张早于 648 的表违反。grep 全部迁移确认没有后续迁移补过这两个守卫（只有 643/644 各自的 up/down 提到这两张表）。这是**既有缺陷，与本 change 无因果关系**：本切片未新增或修改任何迁移。锁定 canonical 比 design 多要求了 TRUNCATE 半句，按 canonical-first 以 canonical 为准，因此断言保留原样、如实报红。'

  - id: ADJ-049
    original_design_ref: 'stdd/cli/commit_binding.py:338-368 `_commit_input_problems`：对 `record["inputs"]` 的每个 project 输入取 `git cat-file blob <commit>:<path>`，与 run 快照 sha256 逐字节比较，**不做行尾规范化**；`evidence.py:_snapshot` 对工作区文件 `read_bytes()` 直接哈希；multica 为 `core.autocrlf=true` 且 `.gitattributes` 含 `* text=auto`。'
    actual_change: '2026-11-13 归档后执行 `stdd bind-commit 2026-11-12-fork-ci-test-evidence-trust`（HEAD `8eac1460e`）→ **`BIND_EXIT=1`**，报「业务提交未完整承载 run 声明的 project 输入 / 与 run 摘要不一致（不做行尾规范化）」，实测 **656** 个输入文件不一致：工作区 CRLF、提交 blob LF。样例：`server/internal/handler/workspace_mcp.go`（wt CRLF=193 / blob 0）、`server/cmd/server/activity_listeners.go`（452/0）、`scripts/ci-scope.mjs`（70/0）；对照 LF 文件 `server/internal/handler/workspace.go` 工作区/blob/run 快照三方同为 `61006566…`。原始输出 `validation/gate3-followup/bind-commit.txt`。'
    reason: 'run 的 `inputs` 快照取自工作区原始字节（CRLF），git 按 `* text=auto` 把提交内容规范化为 LF；绑定端刻意不做规范化 → 该 Windows 检出上，任何修改既有 CRLF 文件的 change 都无法完成绑定。项目此前 4 次归档的记录提交均无 `delivery-receipts/` 回执（实测该目录不存在），说明本步骤在本项目从未真正执行过。'
    impact_scope: '已完成：归档、specs 合并、业务提交 `371e53167`（代码 49 文件）+ `8eac1460e`（台账状态）。**未完成：绑定回执、记录仓提交、推送。** 两条路径：**A** 将 11 个输入目录按 LF 检出（`git -c core.autocrlf=false checkout -- <paths>`，内容不变、`git status` 保持干净）→ `stdd rollback` → 以新 run 重跑 18 条 CP → 重新 confirm → Gate 3 `--reapprove` → 重新归档 → bind，代价是再跑一轮证据（约数分钟）；**B** 认定该工具/环境不兼容，记录仓提交仍写 `business=8eac1460e`（与既往 4 次一致）但不产回执，并在台账保留缺口。不得伪造回执。'
    severity: major
    affected_capabilities: [ci-backend-environment, ci-credential-and-frontend-typecheck, selection-reconciliation, test-ownership-and-ci-reconciliation, workspace-delete-execution-tables]
    exp_id: ''
    resolved: true
    resolution: '用户已在 stdd 侧修好比对端（2026-11-13）：`_commit_input_problems` 现在先比 `git cat-file blob` 的存储字节，不等时再比 `git cat-file --filters` 的检出字节，任一与 run 快照 sha256 相等即视为承载（代码注释写明两种形态都由 git 自身定义）。随后执行 `stdd bind-commit 2026-11-12-fork-ci-test-evidence-trust --commit 8eac1460e2f0870eab6e3e19c7332322e57ce1cf` → **`BIND_EXIT=0`**，生成 `projects/multica/delivery-receipts/2026-11-12-fork-ci-test-evidence-trust.yaml`（schema 1、823 个 project 输入、run `add97e96-1676-4191-ae65-2ebd6524d585`）。`stdd status` 交付状态变为「已绑定业务提交 8eac1460e…」。**无需重跑 18 条 CP、无需重新 confirm、无需重签 Gate 3、无需重新归档**，Gate 1/2/3 仍为当前批准。显式指定原提交是必要的：后续 CI 修复会前移 HEAD，而 `ci.yml`/`scripts/*` 属冻结输入。'

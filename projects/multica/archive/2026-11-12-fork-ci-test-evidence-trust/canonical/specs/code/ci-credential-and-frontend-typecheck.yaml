  - id: SC-CCF-002
    confidence: high
    evidence: canonical/proposals/2026-11-12-fork-ci-test-evidence-trust.yaml#capabilities.modified
    given: packages/views 的 use-logout.test.ts 改用 @multica/core 包导入，
    when: 运行 @multica/views 的 typecheck 与该测试文件。
    then: SHALL typecheck 0 条 TS6059；use-logout.test.ts SHALL 全部通过；其断言 SHALL 与改前等价（不删除、不放宽）。
    and:
    - 若修好 typecheck 后暴露其他前端失败，SHALL 先报告再裁定范围（design U4）。
  - id: SC-CCF-003
    confidence: low

    type: modified
  - id: C9
    description: "frontend-build：把 packages/views/auth/use-logout.test.ts 的相对导入改回包导入，恢复 views typecheck；在本地跑 views 的 typecheck 与该测试，并核实 frontend-build 其余任务无同类问题。"
    type: modified
  - id: C10
    description: "验收报告：列出实际执行的 CI run 与本地检查（命令、退出码、通过/失败/跳过数）、测试范围与未覆盖项；失败与跳过如实记录。"

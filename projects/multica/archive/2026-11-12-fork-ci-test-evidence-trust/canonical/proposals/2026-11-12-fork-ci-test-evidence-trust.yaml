  - id: C6
    description: "scripts/aifi45-disposable 的 node 单测纳入 CI（script-checks 或等价 job），使 C5 的修复受 CI 保护。"
    type: modified
  - id: C7
    description: "workspace 删除：在 runner 自建的一次性库内复现 19 张 cr_execution_* 表漂移；确认每表保留/删除策略（见 Gate 1 待裁定 D2）后，实现删除路径（如需）、更新清单、补 workspace 删除的行为测试（创建带这些数据的 workspace → 删除 → 断言每类数据按策略处置）。不仅改清单。"
    type: modified
  - id: C8

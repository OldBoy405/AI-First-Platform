    - name: "一次性库 selection 对账（run-selection）"
      description: "对账失败与预期缺失使 selection 失败；未配置 expected 的行为不变。"
    - name: "workspace 删除清单与删除路径"
      description: "AIFI-45 执行控制表的保留/删除策略落地为清单与行为测试。"

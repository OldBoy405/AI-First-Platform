constraints:
  - "只经 runner 自建的一次性库（scripts/aifi45-disposable，pgvector pg17 容器、生存期 ≤ 3600 秒、nonce 标记与所有权校验）复现和验证数据库相关问题；不连接、不清理、不依赖 localhost:5432 的旧库、共享库或本机 multica-postgres 容器；运行前后核对容器与库清单。"
  - "不读取、不打印、不创建任何凭据值；凭据只由仓库管理员处理。可只读核对 secret 名称与更新时间。"
  - "不放宽一次性库 nonce 门禁；不改变 AIFI-45 的信任模型、签名与准入语义。"
  - "multica 规则：自研逻辑放新文件或 scripts/aifi45-disposable 下；改上游文件（.github/workflows/ci.yml、scripts/test-go.sh、handler 清单测试、packages/views 测试等）只做挂钩点并标 // AIFIRST: 或 YAML 同等标记，改动收敛到最少行；代码注释用英文；在 CUSTOM.md 登记，追溯标识用本 STDD change id（格式不接受时停止并确认，不编造 CR 身份）。"
  - "不得为让测试通过而仅修改清单、放宽断言、跳过用例或以 build tag/-skip 隐藏失败；任何排除必须显式、可见、有归属。"
  - "不混入上一 change（2026-11-11-aifi-45-admission-task-binding）与知识库工作区中其他未提交改动；提交只含本 change 的文件。"
  - "提交、推送、部署、修改仓库 secret 各自单独授权；CI 真实验证需要推送并消耗私有库 Actions 额度，推送前单独征得同意。"
  - "遇到需要额外业务裁定或范围明显扩大的情况先向用户说明。"
  - "Gate 1 裁定 D1（用户采纳推荐）：nonce 库与 tools 依赖的测试在 CI 真跑；需 root + uid/gid profile 的 TestChannelIsolation 归独立入口，CI 显式排除并输出名单；备选方案（全部专项走独立入口、暂时接受红）未采用。"
  - "Gate 1 裁定 D2（用户采纳推荐）：19 张 cr_execution_* 表沿用 2026-10-27-trusted-verdict-channel 的方向——audit/selection/settlement/binding/fact 类保留并在清单中新增显式“保留”分类；notice、dispatch_root 随 workspace 删除；command、cursor 收敛；deployment 与 policy 类全局表保持 KEEP。逐表映射与“保留”分类的断言由 SPEC 阶段给出；若需对 append-only 触发器开删除例外，则不属本裁定，须另行向用户说明。"
  - "未在 Gate 1 单独答复的事项：创建一次性 podman 实例前、推送触发 CI 前、凭据由管理员更新，均在需要时再向用户确认或请示。"

stakeholders:
  - "仓库与 CI 管理员（OldBoy405）：secret、推送、Actions 额度"
  - "AIFI-45 执行控制的维护者：专项测试体制与删除策略"
  - "上游同步（双周 rebase）：上游文件改动面"

risk_areas:
  - capability: "workspace 删除清单与删除路径"
    risk: "这些表是 append-only 的审计证据；若策略选择删除，需要对触发器开例外，可能削弱防篡改保证；若选择保留，则 workspace 删除后留下无主行，且与清单规则（KEEP 不得带 workspace_id）冲突，需改上游测试文件。"
    mitigation: "策略先由用户裁定；删除例外只限 workspace 删除路径且有行为测试，一般 DELETE 仍被拒；上游文件改动最小并登记。"
  - capability: "fork CI 后端测试环境"
    risk: "governance 整包在 CI 上有过 10 分钟超时（TestMTick003 9m7s），挂住原因未查；接入 nonce 库后可能重现，CI 耗时与额度上升。"
    mitigation: "先在一次性库本地完整跑 governance 并定位；若是环境因素则修，若需拆分或调整超时则作为显式决定写入设计。"
  - capability: "fork CI 后端测试环境"
    risk: "tools 的 pinned 修订与测试所需修订可能不是同一个：transitions 检查固定在 9e41ad74，而当前测试针对本地 tools 工作树（该工作树本身也有未提交改动）。"
    mitigation: "设计阶段以实际跑通的 tools 提交确定唯一 pin，并核对 transitions 的 --check 仍然通过。"
  - capability: "专项测试验收归属与 CI 对账"
    risk: "TestChannelIsolation 需要 Linux root 与 uid/gid profile，托管 runner 上提供特权 profile 代价大；独立入口在本机（Windows + podman）能否真实执行未验证。"
    mitigation: "归属独立入口并显式排除；独立入口须真实执行一次并留证据，做不到则在报告里列为未覆盖，不报绿。"
  - capability: "fork CI 后端测试环境"
    risk: "CI 验证需要推送触发真实 run，消耗额度，且推送本身需单独授权。"
    mitigation: "未获授权时只做本地等价验证，并在报告里标注“CI 工作流改动未经真实 CI 验证”。"

non_goals:
  - "不重新设计 AIFI-45 信任模型、nonce 门禁或 selection 清单内容。"
  - "不为 transitions 检查创建或轮换凭据，不改 tools 仓库。"
  - "不处理与本次失败无关的上游同步、依赖升级或其他 CI job 的优化。"
  - "不承诺让 CI 一次变绿以外的更多目标：凡因范围或授权做不到的项，如实列为未覆盖。"


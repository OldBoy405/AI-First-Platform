# agent_spec.yaml — Agent 验证规格（Canonical YAML）；CI 真实 run 与人工项见 test-plan 的 manual 检查。

meta:
  task_id: test-ownership-and-ci-reconciliation
  change_id: 2026-11-12-fork-ci-test-evidence-trust
  created: '2026-11-12'
  task_type: code
  system: multica fork CI、scripts/aifi45-disposable 与一次性 Postgres
  preconditions:
  - Go 与 Node 可用；数据库类检查只经 run-selection 自建的一次性实例，不连 localhost:5432 与旧容器；skip 为 0 且至少一个叶子 PASS。
rollback:
  steps:
  - 只释放本轮 run-selection 创建的一次性实例；本地提交可 revert，未授权不推送。
steps:
- id: CP-TOR-001
  description: SC-TOR-001 SHALL check 对不存在、缺 reason、重复的条目非 0 退出并指名；通过时 SHALL
  action: node --test --test-reporter=tap scripts/aifi45-disposable/test-ownership.test.mjs
  assertions:
  - type: exit_code
    expected: 0
  - type: stdout_contains
    expected: '# fail 0'
- id: CP-TOR-002
  description: SC-TOR-002 SHALL --skip-regex 原样传给 go test -skip；SHALL --json
  action: bash scripts/test-go.test.sh
  assertions:
  - type: exit_code
    expected: 0
  - type: stdout_contains
    expected: PASS
- id: CP-TOR-003
  description: SC-TOR-003 SHALL 前五种每一种单独非 0 退出并指明包或测试；合规流 SHALL 退出 0；SHALL 逐
  action: node --test --test-reporter=tap scripts/aifi45-disposable/ci-evidence.test.mjs
  assertions:
  - type: exit_code
    expected: 0
  - type: stdout_contains
    expected: '# fail 0'

# agent_spec.yaml — Agent 验证规格（Canonical YAML）；CI 真实 run 与人工项见 test-plan 的 manual 检查。

meta:
  task_id: selection-reconciliation
  change_id: 2026-11-12-fork-ci-test-evidence-trust
  created: '2026-11-12'
  task_type: code
  system: multica fork CI、scripts/aifi45-disposable 与一次性 Postgres
  preconditions:
  - Go 与 Node 可用；数据库类检查只经 run-selection 自建的一次性实例，不连 localhost:5432 与旧容器；skip 为 0 且至少一个叶子 PASS。
rollback:
  steps:
  - 只释放本轮 run-selection 创建的一次性实例；本地提交可 revert，未授权不推送。
steps:
- id: CP-SEL-001
  description: SC-SEL-001 SHALL status 不是 matched 时 ok 为 false，reasons 含该 re
  action: node --test --test-reporter=tap scripts/aifi45-disposable/selection-decision.test.mjs
  assertions:
  - type: exit_code
    expected: 0
  - type: stdout_contains
    expected: '# fail 0'
- id: CP-SEL-002
  description: 'SC-SEL-002 SHALL 沿用旧判定：test.code 为 0 且 fail 为 0 且 skip 为 0 且 '
  action: node --test --test-reporter=tap scripts/aifi45-disposable/run-selection.test.mjs
  assertions:
  - type: exit_code
    expected: 0
  - type: stdout_contains
    expected: '# fail 0'
- id: CP-SEL-003
  description: SC-SEL-003 SHALL ok 为 false 且 reasons 含 EXPECTED_INVALID；SHAL
  action: node --test --test-reporter=tap --test-name-pattern=EXPECTED_INVALID scripts/aifi45-disposable/selection-decision.test.mjs
  assertions:
  - type: exit_code
    expected: 0
  - type: stdout_contains
    expected: '# fail 0'
  - type: stdout_contains
    expected: EXPECTED_INVALID
- id: CP-SEL-004
  description: 'SC-SEL-004 SHALL 该变更命中 scripts 与 backend scope；script-checks '
  action: node --test --test-reporter=tap scripts/ci-scope.test.mjs
  assertions:
  - type: exit_code
    expected: 0
  - type: stdout_contains
    expected: '# fail 0'

    resolved: true
    resolution: '已修订并经 Gate 2 重新确认（2026-11-11T16:20:19，用户原话「确认 Gate 2」）：删除原 SC/TC-ATB-009（锁交错）；撤销互斥沿用既有 TestAdmissionGateLockBlocksRevocation 与 TestAdmissionDeciderPanicReleasesHeadLock，二者已加入 run-admission-support 回归选择；本 change 不改锁序。原 SC-ATB-008（retry）并入 SC-ATB-005，原 010～012 顺延为 008～010。'

# execution-wait-visibility 的 Agent 验证规格（Canonical YAML）
# M1 折中（Gate 2 重审）：run-selection 命令型 CP 的断言携带 exit_code + PASS 标签 + fail=0 + skip=0 计数观测；
# 具体业务正确性由该 selection 的 expected 名单对账的 Go 测试承载（精确测试身份、全部通过、零 fail/skip）。
# Change: 2026-11-17-execution-admission-simplification
meta:
  task_id: execution-wait-visibility
  change_id: "2026-11-17-execution-admission-simplification"
  created: "2026-11-17T23:20:00+08:00"
  task_type: code
  system: "流水线运行进展的推导（progressOf）、resume/start 回执、只读 GET 路由与 multica cr pipeline status"
  preconditions:
    - "cwd 为 multica 业务根；action 经平台默认 shell 执行（Windows=cmd.exe），Go 命令用 `go -C server`，含 | 的正则用双引号。"
    - "DB 检查经 run-selection.mjs --only 运行 selections.json 中同名选择，使用自建一次性 podman 实例；要求退出 0、skip 为 0、fail 为 0；零匹配、skip、expected 缺项都不算通过。运行前须已取得用户对一次性实例的授权，禁止触碰现网库。"
    - "命令型无 SKIP 检测：Go 直跑检查必须断言 `--- PASS: <TestName>` 的正向输出，go test -run 无匹配也返回 0。selection 名称为计划值，Phase 3 若有调整须经设计调整记录同步本规格。"
steps:
  - id: CP-EWV-001
    description: >-
      REQ-EWV-001 / SC-EWV-001～005 / TC-EWV-001；confidence=high。GIVEN 各状态的 run、节点、任务与残留的 runner 标记；WHEN 经 run-selection 运行 ewv-progress；THEN SHALL completed/failed/cancelled 同名、有活动任务为 in_flight（即便残留 wait_reason）、无活动任务且 wait_reason=admission 为 waiting 并原样透传历史原因字符串、waiting_approval 为 waiting_human、无前沿或无记录为 idle，且无任务的 passed 或人工节点不被判为 waiting。
    action: >-
      node scripts/aifi45-disposable/run-selection.mjs --selections scripts/aifi45-disposable/selections.json --only ewv-progress
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASS ewv-progress "
      - type: stdout_contains
        expected: "skip=0"
      - type: stdout_contains
        expected: "fail=0"
  - id: CP-EWV-002
    description: >-
      REQ-EWV-002 / SC-EWV-006、007 / TC-EWV-002；confidence=high。GIVEN 因准入等待的 requirement run、已入队的 run、以及进展读取失败的 run；WHEN 经 run-selection 运行 ewv-receipt；THEN SHALL 回执保留 run_id 与 changed 且语义不变，等待准入的 progress.state=waiting 带 admission，已入队的 progress.state=in_flight 带 task_id，读取失败时仍成功并省略 progress。
    action: >-
      node scripts/aifi45-disposable/run-selection.mjs --selections scripts/aifi45-disposable/selections.json --only ewv-receipt
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASS ewv-receipt "
      - type: stdout_contains
        expected: "skip=0"
      - type: stdout_contains
        expected: "fail=0"
  - id: CP-EWV-003
    description: >-
      REQ-EWV-003 / SC-EWV-008 / TC-EWV-003；confidence=high。GIVEN 成员、非成员与绑定其他 workspace 的任务令牌；WHEN 经 run-selection 运行 ewv-route 读取 GET pipeline-runs/{runID}；THEN SHALL 成员 200 带 run_id、pipeline_id、cr_id、status、progress，非成员 404，跨 workspace 令牌 403，run 不属该 workspace 404。
    action: >-
      node scripts/aifi45-disposable/run-selection.mjs --selections scripts/aifi45-disposable/selections.json --only ewv-route
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASS ewv-route "
      - type: stdout_contains
        expected: "skip=0"
      - type: stdout_contains
        expected: "fail=0"
  - id: CP-EWV-004
    description: >-
      REQ-EWV-003 / SC-EWV-009 / TC-EWV-004；confidence=medium。GIVEN CLI 对 GET 与 POST 回执的响应；WHEN 直接运行 cmd/multica 的 status 与 table 输出测试；THEN SHALL status 用普通客户端认证读取并输出 STATE 与 REASON，start、resume 的 table 含这两列，JSON 输出透传完整 map，start、resume 的请求体与令牌前缀检查不变。
    action: >-
      go -C server test ./cmd/multica -run "^(TestRunCrPipelineStatusReadsRunProgress|TestRunCrPipelineTableShowsStateAndReason|TestRunCrPipelineStartRelaysToRunnerEntry|TestRunCrPipelineResumeTargetsTheRequirementRoute|TestRunCrPipelineResumeCarriesTemplateSupersedeOnlyWhenNamed|TestRunCrPipelineResumeRefusesNonTaskToken)$" -count=1 -v
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "--- PASS: TestRunCrPipelineStatusReadsRunProgress"
      - type: stdout_contains
        expected: "--- PASS: TestRunCrPipelineTableShowsStateAndReason"
      - type: stdout_contains
        expected: "--- PASS: TestRunCrPipelineStartRelaysToRunnerEntry"
      - type: stdout_contains
        expected: "--- PASS: TestRunCrPipelineResumeTargetsTheRequirementRoute"
      - type: stdout_contains
        expected: "--- PASS: TestRunCrPipelineResumeCarriesTemplateSupersedeOnlyWhenNamed"
      - type: stdout_contains
        expected: "--- PASS: TestRunCrPipelineResumeRefusesNonTaskToken"
rollback:
  steps:
    - "检查失败时只报告；run-selection 自行按 nonce 与完整 ID 释放它创建的实例，不执行共享库清理，不按名称模式清理。"
    - "需要撤销代码修改时，先取得授权，再依据实际差异定点逆向；禁止 reset／checkout／stash，且不得影响 multica 工作树中与本变更无关的未提交改动。"
